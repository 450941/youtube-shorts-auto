<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Short Video Creator</title>
</head>
<body>

  <h1>Short Video Creator</h1>

  <p>TikTokへショート動画を投稿できます。</p>

  <button id="login">Login with TikTok</button>

  <script>
    const CLIENT_KEY = "sbawbs7cmjqpneet8e";
    const REDIRECT_URI = "https://450941.github.io/youtube-shorts-auto/";
    const SCOPE = "user.info.basic,video.publish";

    document.getElementById("login").addEventListener("click", () => {
      const state = crypto.randomUUID();

      sessionStorage.setItem("tiktok_state", state);

      const params = new URLSearchParams({
        client_key: CLIENT_KEY,
        response_type: "code",
        scope: SCOPE,
        redirect_uri: REDIRECT_URI,
        state: state
      });

      window.location.href =
        "https://www.tiktok.com/v2/auth/authorize/?" +
        params.toString();
    });
  </script>

</body>
</html>
