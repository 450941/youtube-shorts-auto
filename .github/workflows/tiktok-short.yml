name: Generate TikTok Shorts

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =========================================
      # 1. Checkout
      # =========================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================
      # 2. Install packages
      # =========================================

      - name: Install packages
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            jq

          python -m pip install --upgrade pip

          pip install edge-tts


      # =========================================
      # 3. Create seed
      # =========================================

      - name: Create seed
        run: |
          DAY=$(date -u +%j)
          HOUR=$(date -u +%H)

          if [ "$HOUR" -lt 8 ]; then
            SLOT=0
          elif [ "$HOUR" -lt 12 ]; then
            SLOT=1
          else
            SLOT=2
          fi

          SEED=$((10#$DAY * 3 + SLOT))

          echo "SEED=$SEED" >> "$GITHUB_ENV"

          echo "DAY=$DAY"
          echo "HOUR=$HOUR"
          echo "SLOT=$SLOT"
          echo "SEED=$SEED"


      # =========================================
      # 4. Generate 300000+ patterns
      # =========================================

      - name: Generate 300000+ content patterns
        run: |
          python - <<'PY'
          import os

          seed = int(os.environ["SEED"])

          contents = [
              {"type":"2択クイズ","query":"person thinking","text":"AとB、直感で選んで。考える時間は3秒。Aだと思った？それともB？"},
              {"type":"3択クイズ","query":"friends talking","text":"3択から直感で1つ選んで。1、2、3。最初に浮かんだ数字を信じて。"},
              {"type":"心理ゲーム","query":"person thinking","text":"今から心理ゲーム。最初に思い浮かんだ色を覚えて。赤、青、黄色のどれ？"},
              {"type":"予想ゲーム","query":"ball game","text":"このあと何が起きるか予想して。A、B、Cのどれだと思う？"},
              {"type":"視覚チャレンジ","query":"optical illusion","text":"この映像を3秒だけ見て。何か変だと思ったら、もう一度見てみて。"},
              {"type":"反射チャレンジ","query":"reaction challenge","text":"反射神経チャレンジ。画面が変わった瞬間に気づける？まだ。まだ。今！"},
              {"type":"ミニ謎解き","query":"puzzle thinking","text":"これを5秒で考えて。答えは簡単そうで、意外と引っかかる。"},
              {"type":"記憶チャレンジ","query":"memory game","text":"今から3つの言葉を覚えて。りんご、時計、猫。覚えた？"},
              {"type":"直感チャレンジ","query":"person choosing","text":"深く考えずに選んで。左か右。最初に目が行った方を選んで。"},
              {"type":"コメント参加","query":"friends talking","text":"あなたならどっち？朝型ならA、夜型ならB。直感で決めて。"},
              {"type":"小さな挑戦","query":"person walking","text":"今日の小さな挑戦。スマホを10秒だけ置いて、ゆっくり深呼吸してみて。"},
              {"type":"夜メッセージ","query":"night city person","text":"夜になると色々考えすぎるよね。でも今すぐ答えを出さなくても大丈夫。"},
              {"type":"応援","query":"sunrise person","text":"今日は何もできなかったと思っているなら、明日は一つだけやってみよう。"},
              {"type":"集中チャレンジ","query":"focused person","text":"画面の中央を3秒だけ見て。周りを見ないで、中央だけに集中して。"},
              {"type":"観察チャレンジ","query":"city walking","text":"この映像の中で、最初に目に入ったものを覚えて。あなたは何を見つけた？"},
              {"type":"選択ゲーム","query":"person choosing","text":"今の気分で選んで。静かな場所とにぎやかな場所、どっちに行きたい？"},
              {"type":"タイミングゲーム","query":"running person","text":"ちょうどいいタイミングで画面を見られるか挑戦。まだ。まだ。今。"},
              {"type":"予測チャレンジ","query":"sports prediction","text":"次に動く方向を予想して。左、右、それとも中央？決めた？"},
              {"type":"数字ゲーム","query":"number game","text":"1から9までで、最初に浮かんだ数字を覚えて。あとで確認してみて。"},
              {"type":"色ゲーム","query":"color background","text":"今一番気になる色を一つ選んで。赤、青、緑、黄色。直感で。"},
              {"type":"気分チェック","query":"person relaxing","text":"今の気分を一言で表すなら、元気、普通、それとも疲れた？"},
              {"type":"10秒チャレンジ","query":"person relaxing","text":"10秒だけ何も考えない時間を作ってみよう。画面を見ながらゆっくり呼吸して。"},
              {"type":"勇気チャレンジ","query":"person mountain","text":"今日一つだけ先延ばししていることをやってみない？本当に小さなことでいい。"},
              {"type":"リセット","query":"sunrise person","text":"ちょっと疲れたら一回リセット。深呼吸して、肩の力を抜いてみよう。"},
              {"type":"自分時間","query":"person nature","text":"今日は誰かと比べなくていい。昨日の自分より少し楽なら、それで十分。"},
              {"type":"再スタート","query":"person walking sunrise","text":"何回止まっても、また始めればいい。今日できる一番小さな一歩を選ぼう。"},
              {"type":"夜の安心","query":"night person","text":"眠る前に今日のことを全部解決しなくていい。続きは明日の自分に任せよう。"},
              {"type":"朝チャレンジ","query":"morning person","text":"朝起きたら、最初の10秒だけゆっくり動いてみよう。今日を急がなくていい。"},
              {"type":"一歩チャレンジ","query":"person walking road","text":"大きな目標じゃなくていい。今日は一歩だけ進む。これを今日のミッションにしよう。"},
              {"type":"自己肯定","query":"person peaceful","text":"うまくできなかった日も、自分を全部否定しなくていい。今日を終えたことも一つの結果。"}
          ]

          hook_bases = [
              "ちょっと待って。",
              "これ、直感で答えて。",
              "3秒だけ考えて。",
              "最初に思った方を選んで。",
              "深く考えないで。",
              "今の直感を信じて。",
              "一瞬で決めて。",
              "考える前に選んで。",
              "これは意外と難しい。",
              "あなたならどうする？",
              "今から勝負。",
              "ここで一回止めて。",
              "最後まで見て。",
              "答えを見る前に決めて。",
              "先に予想して。",
              "今の自分ならどっち？",
              "5秒だけ集中して。",
              "一発で当てられる？",
              "これ分かる人いる？",
              "あなたの答えは？"
          ]

          hook_suffixes = [
              "直感だけでいこう。",
              "最初の答えを覚えて。",
              "まだ答えは見ないで。",
              "迷ったら最初の方。",
              "答えを変えないで。"
          ]

          hooks = [
              base + "\n" + suffix
              for base in hook_bases
              for suffix in hook_suffixes
          ][:100]

          ending_bases = [
              "どうだった？",
              "当たった？",
              "できた？",
              "気づいた？",
              "分かった？",
              "あなたはどっち？",
              "コメントで教えて。",
              "もう一回やってみて。",
              "友達にも試してみて。",
              "最初の答えを覚えてた？",
              "直感は当たった？",
              "最後まで分かった？",
              "今の答えを忘れないで。",
              "意外だった？",
              "もう一度見ると違って見えるかも。",
              "答えは人それぞれ。",
              "あなたの結果はどうだった？",
              "次はもっと難しいかも。",
              "明日もう一回挑戦してみて。",
              "今日の小さなミッションでした。"
          ]

          ending_suffixes = [
              "ぜひコメントで。",
              "直感って面白いよね。",
              "もう一度挑戦してみて。",
              "友達にも聞いてみて。",
              "あなたの答えも知りたい。"
          ]

          endings = [
              base + "\n" + suffix
              for base in ending_bases
              for suffix in ending_suffixes
          ][:100]

          content_index = seed % len(contents)
          remaining = seed // len(contents)

          hook_index = remaining % len(hooks)
          remaining //= len(hooks)

          ending_index = remaining % len(endings)

          item = contents[content_index]
          hook = hooks[hook_index]
          ending = endings[ending_index]

          script = hook + "\n" + item["text"] + "\n" + ending

          total_patterns = len(contents) * len(hooks) * len(endings)

          print("TOTAL PATTERNS:", total_patterns)
          print("CONTENT:", item["type"])
          print("HOOK:", hook_index)
          print("ENDING:", ending_index)

          open("script.txt","w",encoding="utf-8").write(script)
          open("pexels_query.txt","w",encoding="utf-8").write(item["query"])
          open("video_type.txt","w",encoding="utf-8").write(item["type"])
          open("video_title.txt","w",encoding="utf-8").write(
              item["type"] + "｜15秒チャレンジ"
          )
          PY

          echo "================================="
          echo "GENERATED CONTENT"
          echo "================================="

          cat video_type.txt
          echo
          cat script.txt


      # =========================================
      # 5. Search Pexels
      # =========================================

      - name: Search Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          QUERY=$(cat pexels_query.txt)

          ENCODED_QUERY=$(python - "$QUERY" <<'PY'
          import sys
          import urllib.parse
          print(urllib.parse.quote(sys.argv[1]))
          PY
          )

          curl -fL \
            -H "Authorization: $PEXELS_API_KEY" \
            -H "Accept: application/json" \
            "https://api.pexels.com/v1/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=20" \
            -o pexels.json

          VIDEO_URL=$(jq -r '
            if (.videos and (.videos | length > 0)) then
              .videos
              | map(.video_files[])
              | map(select(.file_type == "video/mp4"))
              | map(select(.height > .width))
              | sort_by(.width)
              | reverse
              | .[0].link
            else empty end
          ' pexels.json)

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then

            curl -fL \
              -H "Authorization: $PEXELS_API_KEY" \
              -H "Accept: application/json" \
              "https://api.pexels.com/v1/videos/search?query=people&orientation=portrait&size=medium&per_page=20" \
              -o pexels.json

            VIDEO_URL=$(jq -r '
              if (.videos and (.videos | length > 0)) then
                .videos
                | map(.video_files[])
                | map(select(.file_type == "video/mp4"))
                | map(select(.height > .width))
                | sort_by(.width)
                | reverse
                | .[0].link
              else empty end
            ' pexels.json)

          fi

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "ERROR: No portrait Pexels video found."
            exit 1
          fi

          curl -fL "$VIDEO_URL" -o source.mp4

          test -s source.mp4


      # =========================================
      # 6. Generate narration
      # =========================================

      - name: Generate narration
        run: |
          set -e

          edge-tts \
            --voice "ja-JP-NanamiNeural" \
            --rate "+10%" \
            --text "$(cat script.txt)" \
            --write-media narration.mp3

          test -s narration.mp3


      # =========================================
      # 7. Fit narration to 15 seconds
      # =========================================

      - name: Fit narration
        run: |
          set -e

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Original narration: $DURATION seconds"

          SPEED=$(python - "$DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])

          if duration <= 14.5:
              print("1.0")
          else:
              speed = min(duration / 14.5, 1.95)
              print(f"{speed:.3f}")
          PY
          )

          echo "Audio speed: $SPEED"

          if [ "$SPEED" = "1.0" ]; then
            cp narration.mp3 narration_fit.mp3
          else
            ffmpeg -y \
              -i narration.mp3 \
              -filter:a "atempo=$SPEED" \
              narration_fit.mp3
          fi

          test -s narration_fit.mp3


      # =========================================
      # 8. Create synchronized subtitles
      # =========================================

      - name: Create synchronized subtitles
        run: |
          set -e

          python - <<'PY'
          import re
          import subprocess

          script = open(
              "script.txt",
              encoding="utf-8"
          ).read().strip()

          duration = float(
              subprocess.check_output([
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "narration_fit.mp3"
              ]).decode().strip()
          )

          duration = min(duration, 14.7)

          chunks = re.split(
              r'[\n。！？!?]+',
              script
          )

          chunks = [
              x.strip()
              for x in chunks
              if x.strip()
          ]

          parts = []

          for text in chunks:

              while len(text) > 16:

                  cut = 16

                  for i in range(16, 8, -1):
                      if i < len(text) and text[i] in "、，, ":
                          cut = i + 1
                          break

                  parts.append(text[:cut].strip())
                  text = text[cut:].strip()

              if text:
                  parts.append(text)

          if not parts:
              parts = [script]

          total_chars = sum(len(x) for x in parts)

          def timestamp(seconds):
              total_ms = int(seconds * 1000)

              h = total_ms // 3600000
              total_ms %= 3600000

              m = total_ms // 60000
              total_ms %= 60000

              s = total_ms // 1000
              ms = total_ms % 1000

              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          with open(
              "captions.srt",
              "w",
              encoding="utf-8"
          ) as f:

              current = 0.0

              for index, text in enumerate(parts):

                  segment = duration * len(text) / total_chars

                  start = current
                  end = min(
                      duration,
                      current + segment
                  )

                  f.write(
                      f"{index + 1}\n"
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                      f"{text}\n\n"
                  )

                  current = end

          print("=================================")
          print("SYNCHRONIZED SRT")
          print("=================================")

          print(
              open(
                  "captions.srt",
                  encoding="utf-8"
              ).read()
          )


      # =========================================
      # 9. Render 15 second video
      # =========================================

      - name: Render 15 second video
        run: |
          set -e

          FONT="/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"

          if [ ! -f "$FONT" ]; then
            echo "Noto font not found."

            find /usr/share/fonts \
              -iname "*NotoSansCJK*" \
              | head -20

            exit 1
          fi

          echo "Rendering synchronized subtitles..."

          ffmpeg \
            -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i narration_fit.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=captions.srt:fontsdir=/usr/share/fonts/opentype/noto:force_style='FontName=Noto Sans CJK JP,FontSize=18,PrimaryColour=&H00FFFFFF&,OutlineColour=&H00000000&,BorderStyle=1,Outline=3,Shadow=0,Alignment=2,MarginV=180'" \
            -t 15 \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            output.mp4

          test -s output.mp4

          echo "================================="
          echo "VIDEO CREATED"
          echo "SYNCED SUBTITLES INCLUDED"
          echo "================================="

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4


      # =========================================
      # 10. Get TikTok access token
      # =========================================

      - name: Get TikTok access token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUTH_CODE_TEMP: ${{ secrets.TIKTOK_AUTH_CODE_TEMP }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -e

          if [ -n "$TIKTOK_REFRESH_TOKEN" ]; then

            echo "Using TikTok refresh token."

            RESPONSE=$(curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Cache-Control: no-cache" \
              --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" \
              --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=$TIKTOK_REFRESH_TOKEN")

          elif [ -n "$TIKTOK_AUTH_CODE_TEMP" ]; then

            echo "Using initial authorization code."

            RESPONSE=$(curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Cache-Control: no-cache" \
              --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" \
              --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "code=$TIKTOK_AUTH_CODE_TEMP" \
              --data-urlencode "redirect_uri=$TIKTOK_REDIRECT_URI")

          else
            echo "ERROR: No TikTok refresh token or authorization code."
            exit 1
          fi

          echo "$RESPONSE" > token_response.json

          ERROR_CODE=$(jq -r '.error // empty' token_response.json)

          if [ -n "$ERROR_CODE" ]; then
            echo "TikTok OAuth returned an error."
            jq 'del(.access_token, .refresh_token)' token_response.json
            exit 1
          fi

          ACCESS_TOKEN=$(jq -r '.access_token // empty' token_response.json)
          NEW_REFRESH_TOKEN=$(jq -r '.refresh_token // empty' token_response.json)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: TikTok access token was not returned."
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "TIKTOK_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          # TikTok may rotate the refresh token.
          # Save the newest token automatically.
          if [ -n "$NEW_REFRESH_TOKEN" ] && [ "$NEW_REFRESH_TOKEN" != "$TIKTOK_REFRESH_TOKEN" ]; then

            echo "TikTok returned a new refresh token."

            echo "$NEW_REFRESH_TOKEN" | gh secret set TIKTOK_REFRESH_TOKEN \
              --repo "${{ github.repository }}" \
              --app actions

            echo "TIKTOK_REFRESH_TOKEN updated."

          fi


      # =========================================
      # 11. Get creator information
      # =========================================

      - name: Get TikTok creator info
        run: |
          set -e

          curl -sS \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/creator_info/query/" \
            -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d '{}' \
            -o creator.json

          echo "================================="
          echo "TIKTOK CREATOR INFO"
          echo "================================="

          jq . creator.json

          ERROR_CODE=$(jq -r '.error.code // empty' creator.json)

          if [ -n "$ERROR_CODE" ] && [ "$ERROR_CODE" != "ok" ]; then
            echo "TikTok creator_info error: $ERROR_CODE"
            exit 1
          fi

          PUBLIC_ALLOWED=$(jq -r '
            .data.privacy_level_options
            | if index("PUBLIC_TO_EVERYONE") then "yes" else "no" end
          ' creator.json)

          if [ "$PUBLIC_ALLOWED" != "yes" ]; then
            echo "================================="
            echo "PUBLIC_TO_EVERYONE is NOT available."
            echo "================================="
            echo "Available privacy levels:"
            jq -r '.data.privacy_level_options[]' creator.json
            exit 1
          fi

          MAX_DURATION=$(jq -r '.data.max_video_post_duration_sec // 0' creator.json)

          echo "Maximum TikTok video duration: ${MAX_DURATION}s"

          if [ "$MAX_DURATION" -lt 15 ]; then
            echo "ERROR: TikTok account does not allow 15-second videos."
            exit 1
          fi


      # =========================================
      # 12. Initialize TikTok Direct Post
      # =========================================

      - name: Initialize TikTok Direct Post
        run: |
          set -e

          VIDEO_SIZE=$(stat -c%s output.mp4)

          # TikTok requires a valid chunk size.
          # For videos smaller than 5 MB,
          # use the entire video as one chunk.
          # For videos 5 MB or larger,
          # use 10 MB chunks.

          if [ "$VIDEO_SIZE" -lt 5000000 ]; then
            CHUNK_SIZE="$VIDEO_SIZE"
            TOTAL_CHUNKS=1
          else
            CHUNK_SIZE=10000000
            TOTAL_CHUNKS=$(( (VIDEO_SIZE + CHUNK_SIZE - 1) / CHUNK_SIZE ))
          fi

          echo "VIDEO_SIZE=$VIDEO_SIZE"
          echo "CHUNK_SIZE=$CHUNK_SIZE"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS"

          TITLE=$(cat video_title.txt)

          python - "$VIDEO_SIZE" "$CHUNK_SIZE" "$TOTAL_CHUNKS" "$TITLE" > init_body.json <<'PY'
          import json
          import sys

          video_size = int(sys.argv[1])
          chunk_size = int(sys.argv[2])
          total_chunks = int(sys.argv[3])
          title = sys.argv[4]

          body = {
              "post_info": {
                  "title": title,
                  "privacy_level": "PUBLIC_TO_EVERYONE",
                  "disable_duet": False,
                  "disable_comment": False,
                  "disable_stitch": False,
                  "video_cover_timestamp_ms": 1000,
                  "is_aigc": True
              },
              "source_info": {
                  "source": "FILE_UPLOAD",
                  "video_size": video_size,
                  "chunk_size": chunk_size,
                  "total_chunk_count": total_chunks
              }
          }

          print(json.dumps(body, ensure_ascii=False))
          PY

          echo "================================="
          echo "TIKTOK POST SETTINGS"
          echo "================================="

          cat init_body.json

          curl -sS \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/video/init/" \
            -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            --data-binary @init_body.json \
            -o init_response.json

          echo "================================="
          echo "TIKTOK INIT RESPONSE"
          echo "================================="

          jq . init_response.json

          INIT_ERROR=$(jq -r '.error.code // empty' init_response.json)

          if [ -n "$INIT_ERROR" ] && [ "$INIT_ERROR" != "ok" ]; then

            echo "================================="
            echo "TIKTOK INIT FAILED"
            echo "ERROR: $INIT_ERROR"
            echo "================================="

            jq '.error' init_response.json

            exit 1
          fi

          PUBLISH_ID=$(jq -r '.data.publish_id // empty' init_response.json)
          UPLOAD_URL=$(jq -r '.data.upload_url // empty' init_response.json)

          if [ -z "$PUBLISH_ID" ]; then
            echo "ERROR: publish_id was not returned."
            exit 1
          fi

          if [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: upload_url was not returned."
            exit 1
          fi

          echo "::add-mask::$UPLOAD_URL"

          echo "TIKTOK_PUBLISH_ID=$PUBLISH_ID" >> "$GITHUB_ENV"
          echo "TIKTOK_UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"
          echo "TIKTOK_VIDEO_SIZE=$VIDEO_SIZE" >> "$GITHUB_ENV"
          echo "TIKTOK_CHUNK_SIZE=$CHUNK_SIZE" >> "$GITHUB_ENV"
          echo "TIKTOK_TOTAL_CHUNKS=$TOTAL_CHUNKS" >> "$GITHUB_ENV"


      # =========================================
      # 13. Upload video to TikTok
      # =========================================

      - name: Upload video to TikTok
        run: |
          set -e

          VIDEO_SIZE="$TIKTOK_VIDEO_SIZE"
          CHUNK_SIZE="$TIKTOK_CHUNK_SIZE"
          TOTAL_CHUNKS="$TIKTOK_TOTAL_CHUNKS"

          echo "Uploading video..."
          echo "Size: $VIDEO_SIZE bytes"
          echo "Chunks: $TOTAL_CHUNKS"

          if [ "$TOTAL_CHUNKS" -eq 1 ]; then

            LAST_BYTE=$((VIDEO_SIZE - 1))

            curl -fL \
              -X PUT \
              "$TIKTOK_UPLOAD_URL" \
              -H "Content-Type: video/mp4" \
              -H "Content-Length: $VIDEO_SIZE" \
              -H "Content-Range: bytes 0-${LAST_BYTE}/${VIDEO_SIZE}" \
              --data-binary "@output.mp4"

          else

            CHUNK_INDEX=0
            START=0

            while [ "$START" -lt "$VIDEO_SIZE" ]; do

              END=$((START + CHUNK_SIZE - 1))

              if [ "$END" -ge "$VIDEO_SIZE" ]; then
                END=$((VIDEO_SIZE - 1))
              fi

              CURRENT_SIZE=$((END - START + 1))

              echo "Uploading chunk $((CHUNK_INDEX + 1))/$TOTAL_CHUNKS"
              echo "Bytes: $START-$END"
              echo "Chunk size: $CURRENT_SIZE"

              dd \
                if=output.mp4 \
                of="chunk_${CHUNK_INDEX}.bin" \
                bs=1 \
                skip="$START" \
                count="$CURRENT_SIZE" \
                status=none

              curl -fL \
                -X PUT \
                "$TIKTOK_UPLOAD_URL" \
                -H "Content-Type: video/mp4" \
                -H "Content-Length: $CURRENT_SIZE" \
                -H "Content-Range: bytes ${START}-${END}/${VIDEO_SIZE}" \
                --data-binary "@chunk_${CHUNK_INDEX}.bin"

              rm -f "chunk_${CHUNK_INDEX}.bin"

              START=$((END + 1))
              CHUNK_INDEX=$((CHUNK_INDEX + 1))

            done

          fi

          echo "================================="
          echo "VIDEO UPLOAD COMPLETE"
          echo "================================="


      # =========================================
      # 14. Check TikTok publish status
      # =========================================

      - name: Check TikTok publish status
        run: |
          set -e

          echo "================================="
          echo "WAITING FOR TIKTOK"
          echo "================================="

          for i in $(seq 1 20); do

            sleep 10

            curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/post/publish/status/fetch/" \
              -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -d "{\"publish_id\":\"$TIKTOK_PUBLISH_ID\"}" \
              -o status.json

            STATUS=$(jq -r '.data.status // empty' status.json)
            FAIL_REASON=$(jq -r '.data.fail_reason // empty' status.json)

            echo "---------------------------------"
            echo "Check $i / 20"
            echo "STATUS: $STATUS"

            if [ -n "$FAIL_REASON" ]; then
              echo "FAIL_REASON: $FAIL_REASON"
            fi

            if [ "$STATUS" = "PUBLISH_COMPLETE" ]; then

              echo "================================="
              echo "TIKTOK PUBLISH COMPLETE"
              echo "================================="

              jq . status.json

              exit 0

            elif [ "$STATUS" = "FAILED" ]; then

              echo "================================="
              echo "TIKTOK PUBLISH FAILED"
              echo "================================="

              jq . status.json

              exit 1

            fi

          done

          echo "================================="
          echo "TikTok is still processing."
          echo "================================="

          jq . status.json || true


      # =========================================
      # 15. Save generated files
      # =========================================

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-short-${{ github.run_number }}
          path: |
            output.mp4
            script.txt
            captions.srt
            video_title.txt
            video_type.txt
          if-no-files-found: warn
          retention-days: 3
