name: Generate TikTok Shorts

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL SYSTEM PACKAGES
      # ============================================================
      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            curl \
            wget \
            python3 \
            python3-pip \
            fonts-noto-cjk

          python3 -m pip install --break-system-packages edge-tts

          ffmpeg -version
          jq --version
          python3 --version

      # ============================================================
      # 3. GENERATE RANDOM CONTENT
      #
      # 30 categories
      # 100 hooks
      # 100 endings
      #
      # 30 × 100 × 100
      # = 300,000 patterns
      # ============================================================
      - name: Generate TikTok content
        run: |
          python3 <<'PY'
          import random
          import datetime
          import hashlib

          categories = [
              "2択クイズ",
              "3択クイズ",
              "心理ゲーム",
              "予想ゲーム",
              "視覚チャレンジ",
              "反射チャレンジ",
              "ミニ謎解き",
              "記憶チャレンジ",
              "直感チャレンジ",
              "コメント参加",
              "小さな挑戦",
              "夜メッセージ",
              "応援",
              "集中チャレンジ",
              "観察チャレンジ",
              "選択ゲーム",
              "タイミングゲーム",
              "予測チャレンジ",
              "数字ゲーム",
              "色ゲーム",
              "気分チェック",
              "10秒チャレンジ",
              "勇気チャレンジ",
              "リセット",
              "自分時間",
              "再スタート",
              "夜の安心",
              "朝チャレンジ",
              "一歩チャレンジ",
              "自己肯定"
