name: Generate TikTok Shorts

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            jq \
            curl

          python -m pip install --upgrade pip

          pip install \
            edge-tts \
            requests

      # ============================================================
      # GENERATE CONTENT
      # ============================================================
      - name: Generate randomized TikTok content
        run: |
          set -e

          python <<'PY'
          import json
          import random
          import hashlib
          import time

          random.seed(
              int(
                  hashlib.sha256(
                      f"{time.time_ns()}-{random.random()}".encode()
                  ).hexdigest(),
                  16
              )
          )

          categories = [
              "2択クイズ",
              "3択クイズ",
              "心理ゲーム",
              "予想ゲーム",
              "視覚チャレンジ",
              "反射チャレンジ",
              "ミニ謎解き",
              "記憶チャレンジ",
              "直感チャレンジ",
              "コメント参加",
              "小さな挑戦",
              "夜メッセージ",
              "応援",
              "集中チャレンジ",
              "観察チャレンジ",
              "選択ゲーム",
              "タイミングゲーム",
              "予測チャレンジ",
              "数字ゲーム",
              "色ゲーム",
              "気分チェック",
              "10秒チャレンジ",
              "勇気チャレンジ",
              "リセット",
              "自分時間",
              "再スタート",
              "夜の安心",
              "朝チャレンジ",
              "一歩チャレンジ",
              "自己肯定"
          ]

          hooks = [
              "3秒だけ考えてみて",
              "直感で答えて",
              "最初に浮かんだ方でOK",
              "あなたならどっち？",
              "ここで選んでみて",
              "考えすぎないで",
              "今の気分で選んで",
              "答えを見る前に決めて",
              "一瞬で決めてみて",
              "あなたの直感を信じて",
              "これは意外と難しい",
              "最後まで見て",
              "10秒だけ付き合って",
              "今すぐ選んで",
              "コメントで教えて",
              "あなたの答えは？",
              "本当に分かる？",
              "どちらを選ぶ？",
              "今のあなたに当てはまる？",
              "一緒にやってみよう",
              "今日だけ挑戦",
              "ちょっとしたゲームです",
              "脳を一瞬だけ使ってみよう",
              "これは感覚でOK",
              "迷ったら最初の答え",
              "正解より直感が大事",
              "あなたならどうする？",
              "一回だけ考えて",
              "最後に答えを出すよ",
              "それではスタート"
          ]

          endings = [
              "どうだった？",
              "当たった？",
              "コメントで教えてね",
              "もう一回やってみる？",
              "あなたの答えも聞かせて",
              "意外だった人いる？",
              "直感って面白いよね",
              "次も挑戦してみて",
              "今日もお疲れさま",
              "ここまで見たあなたはえらい",
              "無理しなくて大丈夫",
              "今日はここまででOK",
              "少し休んでいこう",
              "また次の動画で",
              "明日も一歩ずつ",
              "自分のペースでいこう",
              "焦らなくて大丈夫",
              "あなたはそのままで大丈夫",
              "今日もよく頑張った",
              "ゆっくりいこう"
          ]

          quiz_templates = [
              [
                  "今から2択。",
                  "AとB、直感で選んで。",
                  "Aを選んだ？それともB？"
              ],
              [
                  "3秒で答えて。",
                  "赤、青、黄色。",
                  "今の直感ならどれ？"
              ],
              [
                  "あなたならどっち？",
                  "すぐ答えるか、少し考えるか。",
                  "直感で決めてみて。"
              ],
              [
                  "小さな心理ゲーム。",
                  "最初に浮かんだ数字を覚えて。",
                  "その数字は何だった？"
              ],
              [
                  "予想してみて。",
                  "次に出てくるのはAかBか。",
                  "決めた？"
              ],
              [
                  "一瞬だけ集中。",
                  "画面の中央を見て。",
                  "何か変化に気づいた？"
              ],
              [
                  "記憶チャレンジ。",
                  "この瞬間だけ覚えて。",
                  "あとで思い出せる？"
              ],
              [
                  "10秒チャレンジ。",
                  "今から10秒だけ集中。",
                  "できたら成功。"
              ],
              [
                  "直感テスト。",
                  "最初に思った答えを信じて。",
                  "考え直さなくてOK。"
              ],
              [
                  "コメント参加型。",
                  "あなたならどれを選ぶ？",
                  "理由も書いてみて。"
              ]
          ]

          encouragement = [
              "疲れているなら、今日は頑張りすぎなくていい。",
              "何もできない日があっても大丈夫。",
              "少し休むことも前に進むこと。",
              "昨日より少しだけ進めば十分。",
              "焦らなくていい。あなたのペースでいい。",
              "うまくいかない日も、ちゃんと一日だよ。",
              "今日ここまで来た。それだけでも十分。",
              "誰かと比べなくていい。",
              "今できる小さなことだけでいい。",
              "休んでからまた始めればいい。",
              "全部完璧じゃなくていい。",
              "今日は自分に優しくしてあげて。",
              "立ち止まっても、後退ではないよ。",
              "少しずつで大丈夫。",
              "明日の自分に任せてもいいことがある。",
              "無理して笑わなくてもいい。",
              "疲れたら一度深呼吸。",
              "あなたの時間はあなたのもの。",
              "一歩進めたら、それで十分。",
              "今日もよく頑張ったね。"
          ]

          category = random.choice(categories)
          hook = random.choice(hooks)
          ending = random.choice(endings)

          if category in [
              "2択クイズ",
              "3択クイズ",
              "心理ゲーム",
              "予想ゲーム",
              "視覚チャレンジ",
              "反射チャレンジ",
              "ミニ謎解き",
              "記憶チャレンジ",
              "直感チャレンジ",
              "コメント参加",
              "集中チャレンジ",
              "観察チャレンジ",
              "選択ゲーム",
              "タイミングゲーム",
              "予測チャレンジ",
              "数字ゲーム",
              "色ゲーム"
          ]:
              template = random.choice(quiz_templates)

              text = "\n".join([
                  hook,
                  *template,
                  ending
              ])

          elif category in [
              "夜メッセージ",
              "応援",
              "小さな挑戦",
              "リセット",
              "自分時間",
              "再スタート",
              "夜の安心",
              "朝チャレンジ",
              "一歩チャレンジ",
              "自己肯定",
              "気分チェック",
              "10秒チャレンジ",
              "勇気チャレンジ"
          ]:
              message = random.choice(encouragement)

              text = "\n".join([
                  hook,
                  message,
                  ending
              ])

          else:
              text = "\n".join([
                  hook,
                  random.choice(encouragement),
                  ending
              ])

          data = {
              "category": category,
              "hook": hook,
              "ending": ending,
              "text": text
          }

          with open("content.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("CONTENT GENERATED")
          print("================================")
          print(text)
          print("================================")
          PY

      # ============================================================
      # SEARCH PEXELS PORTRAIT VIDEO
      # ============================================================
      - name: Search Pexels portrait video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "SEARCHING PEXELS VIDEO"
          echo "================================"

          mkdir -p media

          if [ -z "${PEXELS_API_KEY:-}" ]; then
            echo "ERROR: PEXELS_API_KEY is empty."
            echo "Please check GitHub Secrets."
            exit 1
          fi

          echo "PEXELS_API_KEY detected."

          search_pexels() {
            local QUERY="$1"
            local OUTPUT="$2"

            echo ""
            echo "--------------------------------"
            echo "PEXELS SEARCH"
            echo "QUERY: ${QUERY}"
            echo "--------------------------------"

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 60 \
              -H "Authorization: ${PEXELS_API_KEY}" \
              -H "Accept: application/json" \
              --get \
              --data-urlencode "query=${QUERY}" \
              --data-urlencode "orientation=portrait" \
              --data-urlencode "size=medium" \
              --data-urlencode "per_page=20" \
              "https://api.pexels.com/videos/search" \
              -o "${OUTPUT}"
          }

          SEARCH_OK=0

          if search_pexels "people" "pexels.json"; then
            SEARCH_OK=1
          else
            echo "First Pexels search failed."
            echo "Trying fallback search..."
          fi

          if [ "$SEARCH_OK" -eq 0 ]; then
            if search_pexels "lifestyle" "pexels.json"; then
              SEARCH_OK=1
            else
              echo "Second Pexels search failed."
              echo "Trying nature fallback..."
            fi
          fi

          if [ "$SEARCH_OK" -eq 0 ]; then
            if search_pexels "nature" "pexels.json"; then
              SEARCH_OK=1
            else
              echo "All Pexels API requests failed."

              if [ -f pexels.json ]; then
                cat pexels.json || true
              fi

              exit 1
            fi
          fi

          if ! jq empty pexels.json >/dev/null 2>&1; then
            echo "ERROR: Pexels returned invalid JSON."
            cat pexels.json || true
            exit 1
          fi

          API_ERROR=$(jq -r '.error // empty' pexels.json)

          if [ -n "$API_ERROR" ]; then
            echo "PEXELS API ERROR"
            jq '.' pexels.json || cat pexels.json
            exit 1
          fi

          VIDEO_COUNT=$(jq -r '.videos | length' pexels.json 2>/dev/null || echo "0")

          echo "PEXELS VIDEO COUNT: ${VIDEO_COUNT}"

          if [ "$VIDEO_COUNT" = "0" ]; then
            echo "No videos were returned by Pexels."
            jq '.' pexels.json || cat pexels.json
            exit 1
          fi

          VIDEO_URL=$(jq -r '
            [
              .videos[]
              | .video_files[]
              | select(.link != null)
              | select(.width != null)
              | select(.height != null)
              | select(.height > .width)
              | {
                  link: .link,
                  width: .width,
                  height: .height
                }
            ]
            | sort_by(.width)
            | reverse
            | .[0].link // empty
          ' pexels.json)

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "Portrait video was not found."
            echo "Trying any available Pexels video."

            VIDEO_URL=$(jq -r '
              [
                .videos[]
                | .video_files[]
                | select(.link != null)
                | {
                    link: .link,
                    width: .width,
                    height: .height
                  }
              ]
              | sort_by(.width)
              | reverse
              | .[0].link // empty
            ' pexels.json)
          fi

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "ERROR: VIDEO URL NOT FOUND"
            jq '.' pexels.json || cat pexels.json
            exit 1
          fi

          echo "VIDEO URL FOUND."

          rm -f media/background.mp4

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 180 \
            "$VIDEO_URL" \
            -o media/background.mp4

          if [ ! -f media/background.mp4 ]; then
            echo "ERROR: background.mp4 was not created."
            exit 1
          fi

          VIDEO_FILE_SIZE=$(stat -c%s media/background.mp4)

          echo "DOWNLOADED VIDEO SIZE: ${VIDEO_FILE_SIZE} bytes"

          if [ "$VIDEO_FILE_SIZE" -le 10000 ]; then
            echo "ERROR: Downloaded video is too small."
            file media/background.mp4 || true
            exit 1
          fi

          if ! ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            media/background.mp4
          then
            echo "ERROR: Downloaded file is not a valid video."
            file media/background.mp4 || true
            exit 1
          fi

          echo "PEXELS VIDEO READY"

          ls -lh media/background.mp4

      # ============================================================
      # GENERATE TTS
      # ============================================================
      - name: Generate Japanese narration
        run: |
          set -e

          TEXT=$(jq -r '.text' content.json)

          echo "================================"
          echo "GENERATING NARRATION"
          echo "================================"

          echo "$TEXT"

          rm -f media/narration.mp3

          edge-tts \
            --voice "ja-JP-NanamiNeural" \
            --rate "+10%" \
            --text "$TEXT" \
            --write-media media/narration.mp3

          if [ ! -f media/narration.mp3 ]; then
            echo "ERROR: narration.mp3 was not created."
            exit 1
          fi

          ls -lh media/narration.mp3

      # ============================================================
      # FIT NARRATION TO 15 SECONDS
      # ============================================================
      - name: Fit narration to 15 seconds
        run: |
          set -e

          echo "================================"
          echo "FITTING NARRATION TO 15 SECONDS"
          echo "================================"

          DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              media/narration.mp3
          )

          echo "ORIGINAL AUDIO DURATION=${DURATION}"

          python <<PY
          duration = float("${DURATION}")
          target = 15.0

          if duration <= target:
              speed = 1.0
          else:
              speed = duration / target

          speed = max(0.5, min(speed, 2.0))

          print(f"SPEED={speed}")
          with open("speed.txt", "w") as f:
              f.write(str(speed))
          PY

          SPEED=$(cat speed.txt)

          echo "FINAL SPEED=${SPEED}"

          rm -f media/narration_fit.mp3

          if [ "$SPEED" = "1.0" ]; then
            cp media/narration.mp3 media/narration_fit.mp3
          else
            ffmpeg \
              -y \
              -i media/narration.mp3 \
              -filter:a "atempo=${SPEED}" \
              -vn \
              media/narration_fit.mp3
          fi

          if [ ! -f media/narration_fit.mp3 ]; then
            echo "ERROR: narration_fit.mp3 was not created."
            exit 1
          fi

          FIT_DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              media/narration_fit.mp3
          )

          echo "FITTED AUDIO DURATION=${FIT_DURATION}"

          ls -lh media/narration_fit.mp3

      # ============================================================
      # CREATE SUBTITLES
      # ============================================================
      - name: Create subtitles
        run: |
          set -e

          echo "================================"
          echo "CREATING SUBTITLES"
          echo "================================"

          python <<'PY'
          import json
          import subprocess

          with open("content.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data["text"].strip()

          duration = float(
              subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      "media/narration_fit.mp3"
                  ],
                  text=True
              ).strip()
          )

          lines = [
              line.strip()
              for line in text.splitlines()
              if line.strip()
          ]

          if not lines:
              lines = [text]

          total_chars = sum(len(line) for line in lines)

          if total_chars <= 0:
              total_chars = 1

          def timestamp(seconds):
              ms = int(round(seconds * 1000))
              h = ms // 3600000
              ms %= 3600000
              m = ms // 60000
              ms %= 60000
              s = ms // 1000
              ms %= 1000
              return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"

          current = 0.0
          subtitles = []

          for index, line in enumerate(lines, start=1):
              portion = len(line) / total_chars
              end = duration if index == len(lines) else current + duration * portion

              subtitles.append(
                  f"{index}\n"
                  f"{timestamp(current)} --> {timestamp(end)}\n"
                  f"{line}\n"
              )

              current = end

          with open(
              "media/subtitles.srt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(subtitles))

          print("SUBTITLE DURATION:", duration)
          print("SUBTITLE COUNT:", len(subtitles))
          print("================================")
          print(open("media/subtitles.srt", encoding="utf-8").read())
          PY

          if [ ! -f media/subtitles.srt ]; then
            echo "ERROR: subtitles.srt was not created."
            exit 1
          fi

      # ============================================================
      # RENDER 15 SECOND VIDEO
      # ============================================================
      - name: Render 15 second TikTok video
        run: |
          set -e

          echo "================================"
          echo "RENDERING 15 SECOND VIDEO"
          echo "================================"

          rm -f output.mp4

          ffmpeg \
            -y \
            -stream_loop -1 \
            -i media/background.mp4 \
            -i media/narration_fit.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,subtitles=media/subtitles.srt:force_style='FontName=Noto Sans CJK JP,FontSize=20,PrimaryColour=&HFFFFFF&,OutlineColour=&H000000&,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=260'" \
            -t 15 \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            output.mp4

          if [ ! -f output.mp4 ]; then
            echo "ERROR: output.mp4 was not created."
            exit 1
          fi

          VIDEO_SIZE=$(stat -c%s output.mp4)

          echo "================================"
          echo "VIDEO CREATED"
          echo "VIDEO_SIZE=${VIDEO_SIZE}"
          echo "================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output.mp4

          ls -lh output.mp4

      # ============================================================
      # GET TIKTOK ACCESS TOKEN
      # ============================================================
      - name: Get TikTok access token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUTH_CODE_TEMP: ${{ secrets.TIKTOK_AUTH_CODE_TEMP }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
        run: |
          set -e

          echo "================================"
          echo "GETTING TIKTOK ACCESS TOKEN"
          echo "================================"

          rm -f token.json

          if [ -n "${TIKTOK_REFRESH_TOKEN:-}" ]; then

            echo "Using refresh token."

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=${TIKTOK_CLIENT_KEY}" \
              --data-urlencode "client_secret=${TIKTOK_CLIENT_SECRET}" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=${TIKTOK_REFRESH_TOKEN}" \
              > token.json

          elif [ -n "${TIKTOK_AUTH_CODE_TEMP:-}" ]; then

            echo "Using temporary authorization code."

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=${TIKTOK_CLIENT_KEY}" \
              --data-urlencode "client_secret=${TIKTOK_CLIENT_SECRET}" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "code=${TIKTOK_AUTH_CODE_TEMP}" \
              --data-urlencode "redirect_uri=${TIKTOK_REDIRECT_URI}" \
              > token.json

          else
            echo "ERROR: No TikTok refresh token or temporary auth code."
            exit 1
          fi

          echo "TOKEN RESPONSE RECEIVED"

          if ! jq empty token.json >/dev/null 2>&1; then
            echo "ERROR: Invalid TikTok token JSON."
            cat token.json
            exit 1
          fi

          if jq -e '.error' token.json >/dev/null 2>&1; then
            echo "ERROR: TikTok OAuth returned an error."
            jq '.' token.json
            exit 1
          fi

          ACCESS_TOKEN=$(jq -r '.access_token // empty' token.json)

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "ERROR: access_token was not returned."
            jq '.' token.json
            exit 1
          fi

          echo "TIKTOK_ACCESS_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"

          echo "TikTok access token acquired."

      # ============================================================
      # GET CREATOR INFO
      # ============================================================
      - name: Get TikTok creator info
        run: |
          set -e

          echo "================================"
          echo "GETTING TIKTOK CREATOR INFO"
          echo "================================"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/creator_info/query/" \
            -H "Authorization: Bearer ${TIKTOK_ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            --data '{}' \
            -o creator.json

          if ! jq empty creator.json >/dev/null 2>&1; then
            echo "ERROR: creator.json is invalid."
            cat creator.json
            exit 1
          fi

          echo "CREATOR INFO RESPONSE"
          jq '.' creator.json

          CREATOR_ERROR=$(jq -r '.error.code // empty' creator.json)

          if [ -n "$CREATOR_ERROR" ] && [ "$CREATOR_ERROR" != "ok" ]; then
            echo "TikTok creator info failed."
            jq '.' creator.json
            exit 1
          fi

          MAX_DURATION=$(jq -r '.data.max_video_post_duration_sec // empty' creator.json)

          if [ -n "$MAX_DURATION" ]; then
            echo "MAX_VIDEO_POST_DURATION=${MAX_DURATION}"

            python <<PY
          max_duration = float("${MAX_DURATION}")
          if max_duration < 15:
              raise SystemExit(
                  f"ERROR: TikTok creator max duration is {max_duration}s"
              )
          print("15 second video is allowed.")
          PY
          fi

          echo "CREATOR INFO OK"

      # ============================================================
      # PREPARE VIDEO CHUNKS
      # ============================================================
      - name: Prepare TikTok upload chunks
        run: |
          set -e

          echo "================================"
          echo "PREPARING TIKTOK CHUNKS"
          echo "================================"

          VIDEO_SIZE=$(stat -c%s output.mp4)

          # For the current short video size, use one chunk.
          # TikTok accepts FILE_UPLOAD with the whole file as one chunk
          # when the file fits the allowed single-chunk upload size.
          CHUNK_SIZE="$VIDEO_SIZE"
          TOTAL_CHUNKS=1

          rm -rf chunks
          mkdir -p chunks

          cp output.mp4 chunks/part_0000

          FIRST_CHUNK="chunks/part_0000"
          FIRST_CHUNK_SIZE=$(stat -c%s "$FIRST_CHUNK")

          if [ "$FIRST_CHUNK_SIZE" -ne "$VIDEO_SIZE" ]; then
            echo "ERROR: Chunk size does not match video size."
            exit 1
          fi

          echo "VIDEO_SIZE=${VIDEO_SIZE}"
          echo "CHUNK_SIZE=${CHUNK_SIZE}"
          echo "TOTAL_CHUNKS=${TOTAL_CHUNKS}"
          echo "FIRST_CHUNK=${FIRST_CHUNK}"
          echo "FIRST_CHUNK_SIZE=${FIRST_CHUNK_SIZE}"

          echo "VIDEO_SIZE=${VIDEO_SIZE}" >> "$GITHUB_ENV"
          echo "CHUNK_SIZE=${CHUNK_SIZE}" >> "$GITHUB_ENV"
          echo "TOTAL_CHUNKS=${TOTAL_CHUNKS}" >> "$GITHUB_ENV"
          echo "FIRST_CHUNK=${FIRST_CHUNK}" >> "$GITHUB_ENV"
          echo "FIRST_CHUNK_SIZE=${FIRST_CHUNK_SIZE}" >> "$GITHUB_ENV"

          ls -lh chunks/

      # ============================================================
      # INITIALIZE TIKTOK DIRECT POST
      # ============================================================
      - name: Initialize TikTok Direct Post
        env:
          TIKTOK_ACCESS_TOKEN: ${{ env.TIKTOK_ACCESS_TOKEN }}
          VIDEO_SIZE: ${{ env.VIDEO_SIZE }}
          CHUNK_SIZE: ${{ env.CHUNK_SIZE }}
          TOTAL_CHUNKS: ${{ env.TOTAL_CHUNKS }}
        run: |
          set -e

          echo "================================"
          echo "INITIALIZING TIKTOK DIRECT POST"
          echo "================================"

          echo "VIDEO_SIZE=${VIDEO_SIZE}"
          echo "CHUNK_SIZE=${CHUNK_SIZE}"
          echo "TOTAL_CHUNKS=${TOTAL_CHUNKS}"

          python <<'PY'
          import json
          import os

          video_size = int(os.environ["VIDEO_SIZE"])
          chunk_size = int(os.environ["CHUNK_SIZE"])
          total_chunks = int(os.environ["TOTAL_CHUNKS"])

          payload = {
              "post_info": {
                  "title": "毎日ショート",
                  "privacy_level": "SELF_ONLY",
                  "disable_duet": False,
                  "disable_comment": False,
                  "disable_stitch": False,
                  "is_aigc": True
              },
              "source_info": {
                  "source": "FILE_UPLOAD",
                  "video_size": video_size,
                  "chunk_size": chunk_size,
                  "total_chunk_count": total_chunks
              }
          }

          with open("init_request.json", "w", encoding="utf-8") as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(json.dumps(
              payload,
              ensure_ascii=False,
              indent=2
          ))
          PY

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/video/init/" \
            -H "Authorization: Bearer ${TIKTOK_ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            --data @init_request.json \
            -o init_response.json

          echo "================================"
          echo "TIKTOK INIT RESPONSE"
          echo "================================"

          cat init_response.json

          cp init_response.json init.json

      # ============================================================
      # CHECK INIT RESPONSE
      # ============================================================
      - name: Check TikTok init response
        run: |
          set -e

          echo "================================"
          echo "CHECKING TIKTOK INIT RESPONSE"
          echo "================================"

          if ! jq empty init_response.json >/dev/null 2>&1; then
            echo "ERROR: TikTok init returned invalid JSON."
            cat init_response.json
            exit 1
          fi

          ERROR_CODE=$(jq -r '.error.code // empty' init_response.json)
          ERROR_MESSAGE=$(jq -r '.error.message // empty' init_response.json)

          echo "CODE: ${ERROR_CODE}"
          echo "MESSAGE: ${ERROR_MESSAGE}"

          # IMPORTANT:
          # TikTok returns:
          # "error": {
          #   "code": "ok",
          #   "message": ""
          # }
          #
          # "ok" is SUCCESS, not an error.
          if [ "$ERROR_CODE" != "ok" ]; then
            echo "================================"
            echo "TIKTOK INIT ERROR"
            echo "================================"
            echo "CODE: ${ERROR_CODE}"
            echo "MESSAGE: ${ERROR_MESSAGE}"
            jq '.' init_response.json
            exit 1
          fi

          UPLOAD_URL=$(jq -r '.data.upload_url // empty' init_response.json)
          PUBLISH_ID=$(jq -r '.data.publish_id // empty' init_response.json)

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "ERROR: upload_url was not returned."
            jq '.' init_response.json
            exit 1
          fi

          if [ -z "$PUBLISH_ID" ] || [ "$PUBLISH_ID" = "null" ]; then
            echo "ERROR: publish_id was not returned."
            jq '.' init_response.json
            exit 1
          fi

          echo "TikTok initialization SUCCESS."
          echo "UPLOAD_URL received."
          echo "PUBLISH_ID=${PUBLISH_ID}"

          echo "UPLOAD_URL=${UPLOAD_URL}" >> "$GITHUB_ENV"
          echo "PUBLISH_ID=${PUBLISH_ID}" >> "$GITHUB_ENV"

      # ============================================================
      # UPLOAD VIDEO CHUNKS
      # ============================================================
      - name: Upload TikTok video chunks
        env:
          UPLOAD_URL: ${{ env.UPLOAD_URL }}
          VIDEO_SIZE: ${{ env.VIDEO_SIZE }}
        run: |
          set -e

          echo "================================"
          echo "UPLOADING VIDEO TO TIKTOK"
          echo "================================"

          if [ -z "${UPLOAD_URL:-}" ]; then
            echo "ERROR: UPLOAD_URL is empty."
            exit 1
          fi

          if [ -z "${VIDEO_SIZE:-}" ]; then
            echo "ERROR: VIDEO_SIZE is empty."
            exit 1
          fi

          OFFSET=0
          INDEX=0

          for FILE in $(find chunks -maxdepth 1 -type f -name 'part_*' | sort); do

            CHUNK_FILE_SIZE=$(stat -c%s "$FILE")

            START="$OFFSET"
            END=$((OFFSET + CHUNK_FILE_SIZE - 1))

            echo "--------------------------------"
            echo "CHUNK INDEX=${INDEX}"
            echo "FILE=${FILE}"
            echo "SIZE=${CHUNK_FILE_SIZE}"
            echo "START=${START}"
            echo "END=${END}"
            echo "TOTAL=${VIDEO_SIZE}"
            echo "--------------------------------"

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              -X PUT \
              "${UPLOAD_URL}" \
              -H "Content-Type: video/mp4" \
              -H "Content-Length: ${CHUNK_FILE_SIZE}" \
              -H "Content-Range: bytes ${START}-${END}/${VIDEO_SIZE}" \
              --data-binary @"${FILE}"

            OFFSET=$((END + 1))
            INDEX=$((INDEX + 1))

            echo "CHUNK ${INDEX} UPLOADED"
          done

          echo "FINAL OFFSET=${OFFSET}"
          echo "VIDEO SIZE=${VIDEO_SIZE}"

          if [ "$OFFSET" -ne "$VIDEO_SIZE" ]; then
            echo "ERROR: Uploaded byte count does not match video size."
            exit 1
          fi

          echo "================================"
          echo "TIKTOK VIDEO UPLOAD COMPLETE"
          echo "================================"

      # ============================================================
      # CHECK PUBLISH STATUS
      # ============================================================
      - name: Check TikTok publish status
        env:
          TIKTOK_ACCESS_TOKEN: ${{ env.TIKTOK_ACCESS_TOKEN }}
          PUBLISH_ID: ${{ env.PUBLISH_ID }}
        run: |
          set -e

          echo "================================"
          echo "CHECKING TIKTOK PUBLISH STATUS"
          echo "================================"

          if [ -z "${PUBLISH_ID:-}" ]; then
            echo "ERROR: PUBLISH_ID is empty."
            exit 1
          fi

          SUCCESS=0

          for ATTEMPT in $(seq 1 18); do

            echo ""
            echo "--------------------------------"
            echo "STATUS CHECK ${ATTEMPT}/18"
            echo "--------------------------------"

            cat > status_request.json <<EOF
          {
            "publish_id": "${PUBLISH_ID}"
          }
          EOF

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              -X POST \
              "https://open.tiktokapis.com/v2/post/publish/status/fetch/" \
              -H "Authorization: Bearer ${TIKTOK_ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              --data @status_request.json \
              -o status.json

            cat status.json

            if ! jq empty status.json >/dev/null 2>&1; then
              echo "ERROR: Invalid status response."
              exit 1
            fi

            STATUS=$(jq -r '.data.status // empty' status.json)
            ERROR_CODE=$(jq -r '.error.code // empty' status.json)
            ERROR_MESSAGE=$(jq -r '.error.message // empty' status.json)

            echo "STATUS=${STATUS}"
            echo "ERROR_CODE=${ERROR_CODE}"
            echo "ERROR_MESSAGE=${ERROR_MESSAGE}"

            if [ "$ERROR_CODE" != "" ] && [ "$ERROR_CODE" != "ok" ]; then
              echo "TikTok status API returned an error."
              jq '.' status.json
              exit 1
            fi

            if [ "$STATUS" = "PUBLISH_COMPLETE" ]; then
              echo "================================"
              echo "TIKTOK PUBLISH COMPLETE"
              echo "================================"
              SUCCESS=1
              break
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "================================"
              echo "TIKTOK PUBLISH FAILED"
              echo "================================"
              jq '.' status.json
              exit 1
            fi

            echo "Publishing is still processing."
            echo "Waiting 10 seconds..."

            sleep 10
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "================================"
            echo "TIKTOK STATUS CHECK TIMEOUT"
            echo "================================"
            cat status.json || true
            exit 1
          fi

      # ============================================================
      # SAVE RESULT
      # ============================================================
      - name: Save TikTok result
        if: always()
        run: |
          set +e

          echo "================================"
          echo "SAVING TIKTOK RESULT"
          echo "================================"

          echo "PUBLISH_ID=${PUBLISH_ID:-unknown}"

          if [ -f status.json ]; then
            echo "FINAL STATUS:"
            jq '.' status.json || cat status.json
          fi

          if [ -f creator.json ]; then
            echo "CREATOR INFO:"
            jq '.' creator.json || cat creator.json
          fi

          echo "RESULT SAVED"

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-short-${{ github.run_number }}
          path: |
            output.mp4
            content.json
            pexels.json
            creator.json
            token.json
            init.json
            init_request.json
            init_response.json
            status.json
            media/subtitles.srt
            media/narration.mp3
            media/narration_fit.mp3
          if-no-files-found: ignore
          retention-days: 7
