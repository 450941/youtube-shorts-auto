name: Generate TikTok Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk jq curl
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Create 1 million pattern script
        run: |
          set -e

          DAY=$(($(date -u +%s) / 86400))
          HOUR=$(date -u +%H)
          HOUR=$((10#$HOUR))

          case "$HOUR" in
            3) SLOT=0 ;;
            9) SLOT=1 ;;
            12) SLOT=2 ;;
            *) SLOT=0 ;;
          esac

          SEED=$((DAY * 3 + SLOT))

          python - "$SEED" <<'PY'
          import sys
          import random

          seed = int(sys.argv[1])
          random.seed(seed)

          # ============================================================
          # 25ネタ × 4パターン = 100ネタ
          # ============================================================

          content_bases = [
              "人は朝起きてすぐより、少し時間が経ってから集中しやすいことがあります",
              "人間の脳は何もしていないように見える時間にも情報を整理しています",
              "笑うことはストレスに関係する心身の反応に影響することがあります",
              "好きな音楽を聴くと気分や集中状態が変わることがあります",
              "短時間で何度も復習するより、時間を空けて復習する方法が記憶に役立つことがあります",
              "スマホを少しだけ見るつもりが長時間になってしまうことがあります",
              "睡眠中も脳は記憶の整理などを続けています",
              "水分不足によってだるさや集中しづらさを感じることがあります",
              "同じ言葉でも言われるタイミングによって印象が変わることがあります",
              "小さな達成感を積み重ねると次の行動を始めやすくなることがあります",
              "新しい環境では普段より多くの情報を処理するため疲れを感じることがあります",
              "散歩のような軽い運動が気分転換になることがあります",
              "人は一度に多くのことをしようとすると注意が分散しやすくなります",
              "作業を始める前にやることを一つに絞ると取り掛かりやすくなることがあります",
              "同じ場所で同じ作業を続けるより、少し環境を変えることで気分が変わることがあります",
              "目標を大きくしすぎると最初の一歩が重く感じられることがあります",
              "人は失敗した経験を強く覚えているように感じることがあります",
              "誰かに感謝を伝えることは人間関係を良くするきっかけになります",
              "好きなことをしている時間は時間の流れを短く感じることがあります",
              "新しいことを始めると最初はうまくできなくても自然なことです",
              "部屋を少し片付けるだけでも作業を始めるきっかけになることがあります",
              "朝に一つ小さな予定を決めると一日の行動を始めやすくなることがあります",
              "大きな目標も小さな行動に分けることで取り組みやすくなります",
              "休憩を入れることで長い作業を続けやすくなることがあります",
              "人は自分が思っているより他人から細かく見られていないことがあります",
          ]

          content_variations = [
              "。知っておくと面白い話です。",
              "。意外ですが、こうした特徴があります。",
              "。身近なことですが、意識すると面白いポイントです。",
              "。毎日の生活にも関係している話です。",
          ]

          contents = [
              base + variation
              for base in content_bases
              for variation in content_variations
          ]

          # ============================================================
          # 20フック × 5パターン = 100フック
          # ============================================================

          hook_bases = [
              "これ、意外と知られてません",
              "実はかなり面白い話です",
              "知っておくとちょっと得する話",
              "たった15秒だけ聞いてください",
              "これを知ると少し見方が変わるかもしれません",
              "意外すぎる話なんですが",
              "知らないままだともったいないかもしれません",
              "実は多くの人が見落としています",
              "これ、今日から意識できます",
              "最後まで聞いてみてください",
              "知ってるようで知らない話です",
              "意外と身近なところにあります",
              "一度だけ考えてみてください",
              "これを知っていましたか",
              "15秒後には誰かに話したくなるかもしれません",
              "意外な事実を一つ紹介します",
              "毎日の生活に関係する話です",
              "知らないと気づきにくいポイントです",
              "実はここが重要なんです",
              "最後の一言まで聞いてください",
          ]

          hook_variations = [
              "。",
              "。まずこれだけ聞いてください。",
              "。ちょっと意外ですよね。",
              "。知っていましたか？",
              "。ここからが面白いところです。",
          ]

          hooks = [
              base + variation
              for base in hook_bases
              for variation in hook_variations
          ]

          # ============================================================
          # 20締め × 5パターン = 100締め
          # ============================================================

          ending_bases = [
              "覚えておいてください",
              "今日から少し意識してみてください",
              "知らなかったら保存しておいてください",
              "あなたはどう思いますか",
              "明日の自分のために覚えておいてください",
              "こういう小さな知識も面白いですよ",
              "意外だったら保存しておきましょう",
              "誰かに話してみるのも面白いかもしれません",
              "忘れそうなら保存しておいてください",
              "また一つ知識が増えましたね",
              "今日の雑学として覚えておきましょう",
              "知っているだけでも少し見方が変わります",
              "こういう話が好きならまた見てください",
              "次に誰かと話すときに使えるかもしれません",
              "15秒で一つ賢くなりました",
              "小さな知識を積み重ねていきましょう",
              "また次の動画で紹介します",
              "次も面白い話を持ってきます",
              "気になったらもう一度見返してください",
              "最後まで見てくれてありがとうございました",
          ]

          ending_variations = [
              "。",
              "。ぜひ覚えておいてください。",
              "。これだけでも覚えておくと便利です。",
              "。意外だったら保存しておきましょう。",
              "。また次の動画で。",
          ]

          endings = [
              base + variation
              for base in ending_bases
              for variation in ending_variations
          ]

          # ============================================================
          # 1,000,000通り
          # ============================================================

          total_patterns = len(contents) * len(hooks) * len(endings)

          print("Contents:", len(contents))
          print("Hooks:", len(hooks))
          print("Endings:", len(endings))
          print("TOTAL PATTERNS:", total_patterns)

          content_index = seed % len(contents)
          hook_index = (seed // len(contents)) % len(hooks)
          ending_index = (
              seed // (len(contents) * len(hooks))
          ) % len(endings)

          category_names = [
              "雑学",
              "人生",
              "やる気",
          ]

          category = category_names[seed % len(category_names)]

          script = (
              hooks[hook_index]
              + " "
              + contents[content_index]
              + " "
              + endings[ending_index]
          )

          queries = [
              "nature",
              "city",
              "people",
              "technology",
              "ocean",
              "sunrise",
              "walking",
              "forest",
              "mountains",
              "ocean",
              "street",
              "night city",
              "coffee",
              "working",
              "running",
              "travel",
              "sky",
              "beach",
              "lifestyle",
              "modern city",
          ]

          query = queries[seed % len(queries)]

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          with open("category.txt", "w", encoding="utf-8") as f:
              f.write(category)

          with open("pexels_query.txt", "w", encoding="utf-8") as f:
              f.write(query)

          title = f"{category}｜{hooks[hook_index]}"

          with open("video_title.txt", "w", encoding="utf-8") as f:
              f.write(title)

          print("--------------------------------")
          print("SEED:", seed)
          print("CATEGORY:", category)
          print("PATTERN:", content_index, hook_index, ending_index)
          print("QUERY:", query)
          print("SCRIPT:", script)
          print("TOTAL:", total_patterns)
          print("--------------------------------")
          PY

      - name: Download Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          QUERY=$(cat pexels_query.txt)

          ENCODED_QUERY=$(python -c \
            "import urllib.parse; print(urllib.parse.quote('''$QUERY'''))")

          curl -L \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=20" \
            -o pexels.json

          VIDEO_URL=$(jq -r '
            .videos
            | map(.video_files[])
            | map(select(.width >= 720 and .height > .width))
            | sort_by(.width)
            | reverse
            | .[0].link
          ' pexels.json)

          if [ "$VIDEO_URL" = "null" ] || [ -z "$VIDEO_URL" ]; then
            echo "Fallback: sunrise"

            curl -L \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=sunrise&orientation=portrait&size=medium&per_page=20" \
              -o pexels.json

            VIDEO_URL=$(jq -r '
              .videos
              | map(.video_files[])
              | map(select(.width >= 720 and .height > .width))
              | sort_by(.width)
              | reverse
              | .[0].link
            ' pexels.json)
          fi

          if [ "$VIDEO_URL" = "null" ] || [ -z "$VIDEO_URL" ]; then
            echo "No video found"
            exit 1
          fi

          curl -L "$VIDEO_URL" -o source.mp4

          test -s source.mp4

      - name: Generate Japanese narration
        run: |
          set -e

          edge-tts \
            --voice ja-JP-NanamiNeural \
            --rate="+8%" \
            --text "$(cat script.txt)" \
            --write-media voice.mp3

          test -s voice.mp3

      - name: Fit narration to video
        run: |
          set -e

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          SPEED=$(python - "$DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])
          target = 14.2

          speed = duration / target

          speed = max(1.0, min(1.95, speed))

          print(speed)
          PY
          )

          echo "Original duration: $DURATION"
          echo "Speed: $SPEED"

          ffmpeg -y \
            -i voice.mp3 \
            -filter:a "atempo=${SPEED}" \
            voice_fit.mp3

          mv voice_fit.mp3 voice.mp3

      - name: Create ASS subtitles
        run: |
          python - <<'PY'
          import re
          import subprocess

          text = open(
              "script.txt",
              encoding="utf-8"
          ).read().strip()

          parts = re.split(
              r'(?<=[。！？!?])',
              text
          )

          parts = [
              x.strip()
              for x in parts
              if x.strip()
          ]

          chunks = []

          for part in parts:
              while len(part) > 18:
                  chunks.append(part[:18])
                  part = part[18:]

              if part:
                  chunks.append(part)

          duration = float(
              subprocess.check_output([
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "voice.mp3"
              ]).decode().strip()
          )

          total_chars = sum(
              len(x)
              for x in chunks
          )

          def ass_time(sec):
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = int(sec % 60)
              cs = int((sec - int(sec)) * 100)

              return (
                  f"{h}:{m:02d}:{s:02d}.{cs:02d}"
              )

          with open(
              "captions.ass",
              "w",
              encoding="utf-8"
          ) as f:

              f.write("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans CJK JP,72,&H00FFFFFF,&H00FFFFFF,&H00000000,&H00000000,1,0,0,0,100,100,0,0,1,6,3,5,60,60,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """)

              current = 0

              for chunk in chunks:

                  share = (
                      len(chunk)
                      / max(total_chars, 1)
                  )

                  length = duration * share

                  start = current
                  end = min(
                      duration,
                      current + length
                  )

                  safe = (
                      chunk
                      .replace("{", "\\{")
                      .replace("}", "\\}")
                  )

                  f.write(
                      "Dialogue: 0,"
                      + ass_time(start)
                      + ","
                      + ass_time(end)
                      + ",Default,,0,0,0,,"
                      + safe
                      + "\n"
                  )

                  current = end
          PY

      - name: Render 15 second TikTok video
        run: |
          set -e

          ffmpeg -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i voice.mp3 \
            -t 15 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,ass=captions.ass" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -af "apad=pad_dur=15,atrim=0:15" \
            -t 15 \
            -movflags +faststart \
            tiktok-short.mp4

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            tiktok-short.mp4)

          echo "Final duration: $DURATION"

          python - "$DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])

          if not 14.5 <= duration <= 15.5:
              raise SystemExit(
                  "Video duration is outside 15-second range"
              )
          PY

      - name: Create metadata
        run: |
          echo "1,000,000 pattern generator" > pattern_count.txt
          echo "100 contents × 100 hooks × 100 endings" >> pattern_count.txt
          echo "Generated at $(date -u)" >> pattern_count.txt

      - name: Upload TikTok video artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-short-${{ github.run_number }}
          path: |
            tiktok-short.mp4
            script.txt
            captions.ass
            category.txt
            video_title.txt
            pexels_query.txt
            pattern_count.txt
          retention-days: 7
