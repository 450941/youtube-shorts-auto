          hooks = [
              "3秒で決めて",
              "直感だけで選んで",
              "考えすぎないで",
              "あなたならどっち",
              "最後まで見て",
              "今の気分で選んで",
              "迷ったら最初の答え",
              "これは意外と難しい",
              "答えを予想して",
              "一瞬で選んで",
              "今すぐ選んで",
              "最初に目についた方",
              "深く考えたら負け",
              "あなたの直感を試します",
              "これは10秒でできます",
              "今の気分のままでOK",
              "スクロールする前に",
              "一回だけ挑戦して",
              "本当に直感で選んで",
              "あなたはどっち派",
              "迷ったら左",
              "迷ったら右",
              "今だけ集中",
              "頭の中で答えて",
              "コメントする前に考えて",
              "答えは最後",
              "意外と当たります",
              "あなたの選択は？",
              "一瞬だけ集中して",
              "これは簡単そうで難しい",
              "今の数字を覚えて",
              "色だけ見て選んで",
              "一番最初に思った答え",
              "10秒だけ本気で",
              "最後まで残れたら成功",
              "友達にも聞いてみて",
              "あなたならどうする",
              "今の自分で選んで",
              "感覚だけで答えて",
              "理屈は禁止",
              "これは直感ゲーム",
              "一発勝負",
              "やり直しなし",
              "今すぐ答えを決めて",
              "答えを変えないで",
              "最初の3秒が勝負",
              "集中して見て",
              "見逃さないで",
              "ここからが本番",
              "最後に意外な結果",
              "あなたのタイプが分かる",
              "今の気持ちで選んで",
              "今日はどっち",
              "どちらを選ぶ？",
              "一つだけ選んで",
              "絶対に悩まないで",
              "頭より感覚",
              "感覚を信じて",
              "あなたの答えを予想します",
              "本当にそれでいい？",
              "もう決めた？",
              "まだ変えないで",
              "最後の瞬間まで考えて",
              "ここで決断",
              "今だけゲーム",
              "小さな挑戦です",
              "できるか試して",
              "10秒耐えて",
              "一緒にやってみよう",
              "できたらコメント",
              "成功した？",
              "あなたは何秒？",
              "これは分かる？",
              "すぐ答えられる？",
              "一度だけ見て",
              "記憶して",
              "覚えておいて",
              "目を離さないで",
              "よく見て",
              "注意して見て",
              "一瞬の違いです",
              "違いを探して",
              "何が変わった？",
              "どこがおかしい？",
              "答えを探して",
              "あなたの観察力を試します",
              "記憶力チェック",
              "集中力チェック",
              "反応速度チェック",
              "直感力チェック",
              "今日はこれだけ",
              "疲れていたら無理しないで",
              "少しだけ休もう",
              "今のあなたへ",
              "大丈夫、ゆっくりでいい",
              "焦らなくていい",
              "今日も一歩だけ",
              "ここまで来たあなたへ",
              "最後に一つだけ"
          ]

          endings = [
              "答えはコメントで",
              "当たった人はすごい",
              "あなたの答えを教えて",
              "もう一回やってみて",
              "友達にも試してみて",
              "直感を信じて",
              "最後までできたら成功",
              "今日はこれだけでOK",
              "少し休んでいこう",
              "明日もまた挑戦しよう",
              "答えは自分だけのもの",
              "コメントで教えて",
              "あなたはどうだった？",
              "もう一度挑戦してみて",
              "結果を比べてみて",
              "誰かにも出してみて",
              "意外だった？",
              "当たった？",
              "最初の答えを覚えてる？",
              "答えを変えた人も教えて",
              "ここまで見たら成功",
              "できたならすごい",
              "今日の小さな成功",
              "無理しなくて大丈夫",
              "自分のペースでいこう",
              "明日またやろう",
              "今日はここで休もう",
              "少しだけ前に進もう",
              "あなたなら大丈夫",
              "焦らなくていい",
              "一歩ずつでいい",
              "ここまで頑張ったね",
              "今日もお疲れさま",
              "自分を大切にしてね",
              "10秒だけ休もう",
              "深呼吸してみて",
              "画面から少し離れてみて",
              "また次の動画で",
              "次はもっと難しいよ",
              "次も挑戦してね",
              "答えは秘密",
              "結果はあなた次第",
              "直感が答え",
              "最初の答えを信じて",
              "考えすぎなくてOK",
              "楽しめたら成功",
              "正解より楽しむこと",
              "間違えても大丈夫",
              "挑戦した時点で成功",
              "今日も一歩進めた",
              "自分の答えを信じて",
              "あなたの感覚を大切に",
              "またやってみよう",
              "誰かと比べなくていい",
              "自分のペースでOK",
              "今日は休んでもいい",
              "明日でも大丈夫",
              "ゆっくりでいいよ",
              "ここまで見てくれてありがとう",
              "最後までありがとう",
              "次のチャレンジへ",
              "まだまだ続きます",
              "次はあなたの番",
              "あなたの選択は？",
              "コメント待ってるよ",
              "結果を教えてね",
              "もう答えは決めた？",
              "そのままの答えでOK",
              "あなたはどっちだった？",
              "友達と比べてみて",
              "家族にも出してみて",
              "もう一度見てもOK",
              "保存して後で挑戦",
              "忘れたらもう一回",
              "難しかった？",
              "簡単だった？",
              "何秒で分かった？",
              "正解できた？",
              "あなたの記録は？",
              "次は記録更新",
              "今日も楽しもう",
              "少し笑えたら成功",
              "気分転換になった？",
              "10秒だけ楽しもう",
              "一緒に挑戦してくれてありがとう",
              "また会おう",
              "次も見てね",
              "次はもっと難しくする",
              "次の問題も挑戦して",
              "最後まで見たあなたへ",
              "今日は十分頑張った",
              "無理しないでね",
              "ゆっくり休んでね",
              "明日はまた明日",
              "今日を乗り越えた",
              "それだけで十分",
              "また一歩ずつ"
          ]

          questions = [
              ("赤と青、今どっちを選ぶ？", "赤"),
              ("右と左、直感で選ぶなら？", "右"),
              ("1と2、最初に浮かんだ数字は？", "1"),
              ("朝と夜、今の気分はどっち？", "夜"),
              ("海と山、行くならどっち？", "海"),
              ("猫と犬、直感で選ぶなら？", "猫"),
              ("甘いものとしょっぱいもの、どっち？", "甘いもの"),
              ("休むか続けるか、今必要なのは？", "休む"),
              ("青と緑、今見たい色は？", "青"),
              ("10秒だけ目を閉じられる？", "できる"),
              ("右手と左手、先に動かすなら？", "右手"),
              ("昼と夜、好きなのは？", "夜"),
              ("夏と冬、今選ぶなら？", "夏"),
              ("静かな場所と賑やかな場所、どっち？", "静かな場所"),
              ("一人時間と誰かといる時間、今欲しいのは？", "一人時間")
          ]

          now = datetime.datetime.now(datetime.timezone.utc)

          seed_text = (
              str(now.timestamp())
              + str(now.timetuple().tm_yday)
              + str(now.hour)
              + str(now.minute)
          )

          seed = int(
              hashlib.sha256(seed_text.encode()).hexdigest()[:16],
              16
          )

          random.seed(seed)

          category = random.choice(categories)
          hook = random.choice(hooks)
          ending = random.choice(endings)
          question, answer = random.choice(questions)

          templates = [
              f"{hook}。{question}",
              f"{category}。{question}",
              f"{hook}。{question}。{ending}",
              f"{question}。答えは直感で決めて。",
              f"今から10秒チャレンジ。{question}",
              f"{category}。{hook}。{question}",
              f"一瞬で決めて。{question}",
              f"あなたならどうする？{question}",
              f"{hook}。最後に答えを確認して。",
              f"{category}です。{question}。{ending}",
              f"{hook}。迷ったら最初に思った方。{question}",
              f"今の気分で選んで。{question}",
              f"考えすぎ禁止。{question}",
              f"一発勝負。{question}",
              f"最後まで見て。{question}。{ending}"
          ]

          text = random.choice(templates)

          # 長すぎる場合は15秒用に調整
          if len(text) > 85:
              text = f"{hook}。{question}。{ending}"

          with open("content.txt", "w", encoding="utf-8") as f:
              f.write(text)

          with open("answer.txt", "w", encoding="utf-8") as f:
              f.write(answer)

          print("================================")
          print("GENERATED CONTENT")
          print("================================")
          print("CATEGORY:", category)
          print("TEXT:", text)
          print("ANSWER:", answer)
          print("CHARACTERS:", len(text))
          print("================================")
          PY

      # ============================================================
      # 4. PEXELS SEARCH
      # ============================================================
      - name: Search Pexels portrait video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p media

          echo "Searching Pexels..."

          RESPONSE=$(curl -s \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/videos/search?query=people&orientation=portrait&size=medium&per_page=30")

          VIDEO_URL=$(echo "$RESPONSE" | jq -r '
            .videos[]
            | .video_files[]
            | select(.width < .height)
            | select(.file_type == "video/mp4")
            | .link
          ' | head -n 1)

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then

            echo "First search failed."
            echo "Trying lifestyle."

            RESPONSE=$(curl -s \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=lifestyle&orientation=portrait&size=medium&per_page=30")

            VIDEO_URL=$(echo "$RESPONSE" | jq -r '
              .videos[]
              | .video_files[]
              | select(.width < .height)
              | select(.file_type == "video/mp4")
              | .link
            ' | head -n 1)
          fi

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then

            echo "Second search failed."
            echo "Trying nature."

            RESPONSE=$(curl -s \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=nature&orientation=portrait&size=medium&per_page=30")

            VIDEO_URL=$(echo "$RESPONSE" | jq -r '
              .videos[]
              | .video_files[]
              | select(.width < .height)
              | select(.file_type == "video/mp4")
              | .link
            ' | head -n 1)
          fi

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "ERROR: Could not find portrait video."
            exit 1
          fi

          echo "VIDEO URL FOUND"

          curl -L \
            --fail \
            "$VIDEO_URL" \
            -o media/background.mp4

          echo "Pexels video downloaded."

          ls -lh media/background.mp4

      # ============================================================
      # 5. CREATE TTS
      # ============================================================
      - name: Generate Japanese narration
        run: |
          TEXT=$(cat content.txt)

          echo "Generating Japanese narration..."

          edge-tts \
            --voice "ja-JP-NanamiNeural" \
            --rate="+10%" \
            --volume="+0%" \
            --pitch="+0Hz" \
            --text "$TEXT" \
            --write-media narration.mp3

          echo "Narration created."

          ls -lh narration.mp3

      # ============================================================
      # 6. FIT AUDIO TO EXACTLY 15 SECONDS
      # ============================================================
      - name: Fit narration to 15 seconds
        run: |
          ffmpeg -y \
            -i narration.mp3 \
            -af "apad=pad_dur=15,atrim=duration=15" \
            -c:a aac \
            -b:a 128k \
            narration_15.mp3

          echo "Narration duration:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration_15.mp3

      # ============================================================
      # 7. CREATE SUBTITLES
      # ============================================================
      - name: Create SRT subtitles
        run: |
          python3 <<'PY'
          import subprocess
          import re

          text = open(
              "content.txt",
              encoding="utf-8"
          ).read().strip()

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "narration_15.mp3"
              ],
              capture_output=True,
              text=True
          )

          try:
              duration = float(result.stdout.strip())
          except:
              duration = 15.0

          duration = min(duration, 15.0)

          parts = re.split(
              r'(?<=[。！？!?])',
              text
          )

          parts = [
              x.strip()
              for x in parts
              if x.strip()
          ]

          if not parts:
              parts = [text]

          total_chars = sum(
              len(x)
              for x in parts
          )

          current = 0.0

          def fmt(sec):
              total_ms = int(round(sec * 1000))

              h = total_ms // 3600000
              total_ms %= 3600000

              m = total_ms // 60000
              total_ms %= 60000

              s = total_ms // 1000
              ms = total_ms % 1000

              return (
                  f"{h:02d}:"
                  f"{m:02d}:"
                  f"{s:02d},"
                  f"{ms:03d}"
              )

          with open(
              "subtitles.srt",
              "w",
              encoding="utf-8"
          ) as f:

              for i, part in enumerate(parts, 1):

                  if total_chars > 0:
                      segment = (
                          duration
                          * len(part)
                          / total_chars
                      )
                  else:
                      segment = (
                          duration
                          / len(parts)
                      )

                  start = current
                  end = min(
                      current + segment,
                      duration
                  )

                  f.write(
                      f"{i}\n"
                      f"{fmt(start)} --> {fmt(end)}\n"
                      f"{part}\n\n"
                  )

                  current = end

          print("================================")
          print("SUBTITLES")
          print("================================")

          print(
              open(
                  "subtitles.srt",
                  encoding="utf-8"
              ).read()
          )
          PY

      # ============================================================
      # 8. RENDER 1080x1920 / 15 SEC
      # ============================================================
      - name: Render 15 second TikTok video
        run: |
          echo "Rendering 1080x1920 video..."

          ffmpeg -y \
            -stream_loop -1 \
            -i media/background.mp4 \
            -i narration_15.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=subtitles.srt:fontsdir=/usr/share/fonts/opentype/noto" \
            -map 0:v:0 \
            -map 1:a:0 \
            -t 15 \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 24 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            output.mp4

          echo "================================"
          echo "VIDEO CREATED"
          echo "================================"

          ls -lh output.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4

      # ============================================================
      # 9. GET TIKTOK ACCESS TOKEN
      # ============================================================
      - name: Get TikTok access token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUTH_CODE_TEMP: ${{ secrets.TIKTOK_AUTH_CODE_TEMP }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
        run: |
          echo "Obtaining TikTok access token..."

          if [ -n "$TIKTOK_REFRESH_TOKEN" ]; then

            echo "Using refresh token."

            RESPONSE=$(curl -s \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" \
              --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=$TIKTOK_REFRESH_TOKEN")

          else

            echo "Using temporary authorization code."

            RESPONSE=$(curl -s \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" \
              --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "code=$TIKTOK_AUTH_CODE_TEMP" \
              --data-urlencode "redirect_uri=$TIKTOK_REDIRECT_URI")

          fi

          echo "TikTok token response received."

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then

            echo "ERROR: Could not obtain TikTok access token."

            echo "$RESPONSE" | jq \
              'del(.access_token,.refresh_token)'

            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          NEW_REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token')

          if [ -n "$NEW_REFRESH_TOKEN" ] && \
             [ "$NEW_REFRESH_TOKEN" != "null" ]; then

            echo "A refresh token was returned."

            echo "$NEW_REFRESH_TOKEN" > new_refresh_token.txt
          fi

      # ============================================================
      # 10. CREATOR INFO
      # ============================================================
      - name: Get TikTok creator information
        run: |
          echo "Querying creator information..."

          RESPONSE=$(curl -s \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/creator_info/query/" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8")

          echo "================================"
          echo "CREATOR INFO RESPONSE"
          echo "================================"

          echo "$RESPONSE" | jq .

          ERROR_CODE=$(echo "$RESPONSE" | jq -r '.error.code')

          if [ "$ERROR_CODE" != "ok" ]; then
            echo "CREATOR INFO FAILED."
            exit 1
          fi

          echo "Creator information received."

      # ============================================================
      # 11. PREPARE FILE UPLOAD
      #
      # IMPORTANT:
      #
      # For a 21,631,966 byte video:
      #
      # 21,631,966 / 5,000,000
      # = 4 remainder 1,631,966
      #
      # total_chunk_count = 4
      #
      # NOT 5.
      # ============================================================
      - name: Prepare TikTok file upload
        run: |
          VIDEO_SIZE=$(stat -c%s output.mp4)

          MIN_CHUNK_SIZE=5000000
          MAX_CHUNK_SIZE=64000000

          echo "================================"
          echo "FILE UPLOAD PREPARATION"
          echo "================================"

          echo "VIDEO_SIZE=$VIDEO_SIZE"

          if [ "$VIDEO_SIZE" -lt "$MIN_CHUNK_SIZE" ]; then

            CHUNK_SIZE="$VIDEO_SIZE"
            TOTAL_CHUNKS=1

          else

            CHUNK_SIZE="$MIN_CHUNK_SIZE"

            # IMPORTANT:
            # TikTok uses floor division here.
            TOTAL_CHUNKS=$(( VIDEO_SIZE / CHUNK_SIZE ))

          fi

          if [ "$CHUNK_SIZE" -gt "$MAX_CHUNK_SIZE" ]; then
            echo "ERROR: CHUNK_SIZE exceeds maximum."
            exit 1
          fi

          if [ "$TOTAL_CHUNKS" -lt 1 ]; then
            TOTAL_CHUNKS=1
          fi

          echo "VIDEO_SIZE=$VIDEO_SIZE"
          echo "CHUNK_SIZE=$CHUNK_SIZE"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS"

          echo "VIDEO_SIZE=$VIDEO_SIZE" >> "$GITHUB_ENV"
          echo "CHUNK_SIZE=$CHUNK_SIZE" >> "$GITHUB_ENV"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS" >> "$GITHUB_ENV"

      # ============================================================
      # 12. TIKTOK DIRECT POST INITIALIZE
      # ============================================================
      - name: Initialize TikTok Direct Post
        run: |
          echo "Initializing TikTok Direct Post..."

          INIT_JSON=$(jq -n \
            --arg title "15秒チャレンジ #TikTok" \
            --arg privacy "PUBLIC_TO_EVERYONE" \
            --argjson video_size "$VIDEO_SIZE" \
            --argjson chunk_size "$CHUNK_SIZE" \
            --argjson total_chunks "$TOTAL_CHUNKS" \
            '{
              post_info: {
                title: $title,
                privacy_level: $privacy,
                disable_duet: false,
                disable_comment: false,
                disable_stitch: false,
                video_cover_timestamp_ms: 1000,
                is_aigc: true
              },
              source_info: {
                source: "FILE_UPLOAD",
                video_size: $video_size,
                chunk_size: $chunk_size,
                total_chunk_count: $total_chunks
              }
            }')

          echo "=============================="
          echo "TIKTOK INIT REQUEST"
          echo "=============================="

          echo "$INIT_JSON" | jq .

          RESPONSE=$(curl -s \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/video/init/" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$INIT_JSON")

          echo "=============================="
          echo "TIKTOK INIT RESPONSE"
          echo "=============================="

          echo "$RESPONSE" | jq .

          ERROR_CODE=$(echo "$RESPONSE" | jq -r '.error.code')

          if [ "$ERROR_CODE" != "ok" ]; then

            echo "TIKTOK INIT FAILED"

            ERROR_MESSAGE=$(echo "$RESPONSE" | jq -r '.error.message')

            echo "Error: $ERROR_MESSAGE"

            exit 1
          fi

          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.data.upload_url')
          PUBLISH_ID=$(echo "$RESPONSE" | jq -r '.data.publish_id')

          if [ -z "$UPLOAD_URL" ] || \
             [ "$UPLOAD_URL" = "null" ]; then

            echo "ERROR: upload_url is missing."
            exit 1
          fi

          if [ -z "$PUBLISH_ID" ] || \
             [ "$PUBLISH_ID" = "null" ]; then

            echo "ERROR: publish_id is missing."
            exit 1
          fi

          echo "UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"
          echo "PUBLISH_ID=$PUBLISH_ID" >> "$GITHUB_ENV"

          echo "TikTok Direct Post initialized."

          echo "PUBLISH_ID=$PUBLISH_ID"

      # ============================================================
      # 13. UPLOAD VIDEO CHUNKS
      # ============================================================
      - name: Upload video to TikTok
        run: |
          echo "================================"
          echo "START TIKTOK VIDEO UPLOAD"
          echo "================================"

          START=0

          for ((CHUNK_INDEX=0; CHUNK_INDEX<TOTAL_CHUNKS; CHUNK_INDEX++)); do

            echo ""
            echo "--------------------------------"
            echo "CHUNK $((CHUNK_INDEX + 1)) / $TOTAL_CHUNKS"
            echo "--------------------------------"

            if [ "$CHUNK_INDEX" -eq "$((TOTAL_CHUNKS - 1))" ]; then

              CURRENT_SIZE=$((VIDEO_SIZE - START))

            else

              CURRENT_SIZE="$CHUNK_SIZE"

            fi

            END=$((START + CURRENT_SIZE - 1))

            echo "START=$START"
            echo "END=$END"
            echo "CURRENT_SIZE=$CURRENT_SIZE"
            echo "VIDEO_SIZE=$VIDEO_SIZE"

            CHUNK_FILE="chunk_${CHUNK_INDEX}.bin"

            dd \
              if=output.mp4 \
              of="$CHUNK_FILE" \
              bs=1 \
              skip="$START" \
              count="$CURRENT_SIZE" \
              status=none

            ACTUAL_SIZE=$(stat -c%s "$CHUNK_FILE")

            echo "ACTUAL_SIZE=$ACTUAL_SIZE"

            if [ "$ACTUAL_SIZE" -ne "$CURRENT_SIZE" ]; then

              echo "ERROR: Chunk size mismatch."
              echo "Expected: $CURRENT_SIZE"
              echo "Actual: $ACTUAL_SIZE"

              exit 1
            fi

            RESPONSE_CODE=$(curl -s \
              -o "upload_response_${CHUNK_INDEX}.txt" \
              -w "%{http_code}" \
              -X PUT \
              "$UPLOAD_URL" \
              -H "Content-Type: video/mp4" \
              -H "Content-Length: $CURRENT_SIZE" \
              -H "Content-Range: bytes $START-$END/$VIDEO_SIZE" \
              --data-binary "@$CHUNK_FILE")

            echo "HTTP STATUS: $RESPONSE_CODE"

            if [ -f "upload_response_${CHUNK_INDEX}.txt" ]; then
              cat "upload_response_${CHUNK_INDEX}.txt"
            fi

            if [ "$RESPONSE_CODE" != "206" ] && \
               [ "$RESPONSE_CODE" != "201" ] && \
               [ "$RESPONSE_CODE" != "200" ]; then

              echo "TIKTOK UPLOAD FAILED."

              exit 1
            fi

            START=$((END + 1))

            rm -f "$CHUNK_FILE"
            rm -f "upload_response_${CHUNK_INDEX}.txt"

          done

          echo ""
          echo "================================"
          echo "TIKTOK VIDEO UPLOAD COMPLETE"
          echo "================================"

      # ============================================================
      # 14. CHECK PUBLISH STATUS
      # ============================================================
      - name: Check TikTok publish status
        run: |
          echo "================================"
          echo "CHECKING TIKTOK PUBLISH STATUS"
          echo "================================"

          for i in {1..18}; do

            echo ""
            echo "STATUS CHECK: $i / 18"

            sleep 10

            RESPONSE=$(curl -s \
              -X POST \
              "https://open.tiktokapis.com/v2/post/publish/status/fetch/" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -d "{\"publish_id\":\"$PUBLISH_ID\"}")

            echo "$RESPONSE" | jq .

            STATUS=$(echo "$RESPONSE" | jq -r '.data.status')

            echo "STATUS=$STATUS"

            case "$STATUS" in

              PUBLISH_COMPLETE)

                echo ""
                echo "================================"
                echo "TIKTOK POST COMPLETE"
                echo "================================"

                exit 0
                ;;

              FAILED)

                echo ""
                echo "================================"
                echo "TIKTOK POST FAILED"
                echo "================================"

                exit 1
                ;;

              PROCESSING_UPLOAD)

                echo "TikTok is processing the upload."
                ;;

              PROCESSING_DOWNLOAD)

                echo "TikTok is processing the video."
                ;;

              *)

                echo "Current status: $STATUS"
                ;;

            esac

          done

          echo ""
          echo "TikTok processing has not completed yet."
          echo "PUBLISH_ID=$PUBLISH_ID"

      # ============================================================
      # 15. SAVE VIDEO ARTIFACT
      # ============================================================
      - name: Upload generated video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-short-${{ github.run_number }}
          path: |
            output.mp4
            content.txt
            subtitles.srt
          retention-days: 3

      # ============================================================
      # 16. SAVE DEBUG INFORMATION
      # ============================================================
      - name: Save debug information
        if: always()
        run: |
          echo "================================"
          echo "FINAL DEBUG INFORMATION"
          echo "================================"

          if [ -f output.mp4 ]; then
            echo "output.mp4:"
            ls -lh output.mp4
          fi

          if [ -f content.txt ]; then
            echo ""
            echo "content.txt:"
            cat content.txt
          fi

          if [ -f subtitles.srt ]; then
            echo ""
            echo "subtitles.srt:"
            cat subtitles.srt
          fi

          echo ""
          echo "GitHub Run:"
          echo "${GITHUB_RUN_ID}"

          echo ""
          echo "Workflow:"
          echo "${GITHUB_WORKFLOW}"
