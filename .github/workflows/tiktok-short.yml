              "明日はまた始められる",
              "ここからでも大丈夫",
              "何度でもやり直せる",
              "自分を責めなくていい",
              "今日できたことを大切に",
              "あなたはあなたのペースで",
              "焦らなくていいよ",
              "少しずつで大丈夫",
              "今夜はゆっくり眠ろう",
              "明日の自分に任せよう",
              "今日もよく頑張ったね",
              "一度ゆっくり休もう",
              "10秒だけ自分を大切に",
              "ここまで来たことも十分",
              "また明日会おう",
              "次の挑戦で待ってるよ",
              "最後までありがとう",
              "また見に来てね",
              "次は当てられるかも",
              "もう一回だけ挑戦",
              "あなたの答えは正解だった？",
              "コメントで教えてね",
              "友達にも送ってみて",
              "今日も小さな一歩",
              "明日も一歩ずつ",
              "あなたなら大丈夫",
              "自分を信じていこう"
          ]

          seed = (
              int(datetime.datetime.now(datetime.timezone.utc).timestamp())
              + int(os.environ.get("GITHUB_RUN_ID", "0"))
              + int(os.environ.get("GITHUB_RUN_ATTEMPT", "0"))
          )

          random.seed(seed)

          category, category_texts = random.choice(contents)
          base = random.choice(category_texts)
          hook = random.choice(hooks)
          ending = random.choice(endings)

          text = f"{hook}。{base}。{ending}。"

          # 長すぎる場合は15秒に収まりやすいように短縮
          if len(text) > 95:
              text = f"{hook}。{base}。{ending}。"

          data = {
              "category": category,
              "hook": hook,
              "body": base,
              "ending": ending,
              "text": text,
              "seed": seed
          }

          with open("content.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("CATEGORY:", category)
          print("TEXT:", text)
          print("SEED:", seed)
          PY

          python generate_content.py

      # ============================================================
      # PEXELS PORTRAIT VIDEO
      # ============================================================

      - name: Search Pexels portrait video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p media

          QUERY="people"

          curl -s \
            -H "Authorization: ${PEXELS_API_KEY}" \
            "https://api.pexels.com/videos/search?query=${QUERY}&orientation=portrait&per_page=20" \
            > pexels.json

          VIDEO_URL=$(jq -r '
            .videos[]
            | .video_files[]
            | select(.width < .height)
            | .link
          ' pexels.json | head -n 1)

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "Portrait video not found. Trying fallback."

            curl -s \
              -H "Authorization: ${PEXELS_API_KEY}" \
              "https://api.pexels.com/videos/search?query=people&per_page=20" \
              > pexels_fallback.json

            VIDEO_URL=$(jq -r '
              .videos[]
              | .video_files[]
              | .link
            ' pexels_fallback.json | head -n 1)
          fi

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "No Pexels video found."
            exit 1
          fi

          echo "Downloading Pexels video..."

          curl -L \
            "$VIDEO_URL" \
            -o media/background.mp4

          test -s media/background.mp4

          echo "Pexels video downloaded."

      # ============================================================
      # JAPANESE TTS
      # ============================================================

      - name: Generate Japanese narration
        run: |
          TEXT=$(jq -r '.text' content.json)

          echo "Narration:"
          echo "$TEXT"

          edge-tts \
            --voice "ja-JP-NanamiNeural" \
            --rate "+10%" \
            --text "$TEXT" \
            --write-media media/narration.mp3

          test -s media/narration.mp3

      # ============================================================
      # FIT NARRATION TO 15 SECONDS
      # ============================================================

      - name: Fit narration to 15 seconds
        run: |
          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            media/narration.mp3)

          echo "Original narration duration: ${DURATION}s"

          SPEED=$(python - <<PY
          d = float("$DURATION")

          if d <= 14.5:
              speed = 1.0
          elif d <= 16.0:
              speed = d / 14.5
          else:
              speed = min(1.35, d / 14.5)

          print(speed)
          PY
          )

          echo "Narration speed: $SPEED"

          ffmpeg -y \
            -i media/narration.mp3 \
            -filter:a "atempo=${SPEED}" \
            media/narration_fit.mp3

          test -s media/narration_fit.mp3

          FINAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            media/narration_fit.mp3)

          echo "Final narration duration: ${FINAL_DURATION}s"

      # ============================================================
      # CREATE SRT SUBTITLES
      # ============================================================

      - name: Create synchronized subtitles
        run: |
          python - <<'PY'
          import json
          import subprocess
          import re

          with open("content.json", encoding="utf-8") as f:
              data = json.load(f)

          text = data["text"]

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "media/narration_fit.mp3"
              ],
              capture_output=True,
              text=True
          )

          duration = float(result.stdout.strip())
          duration = min(duration, 15.0)

          parts = [
              p.strip()
              for p in re.split(r"[。！？!?]", text)
              if p.strip()
          ]

          if not parts:
              parts = [text]

          total_chars = sum(len(p) for p in parts)

          def timestamp(seconds):
              seconds = max(0.0, min(15.0, seconds))

              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              secs = int(seconds % 60)
              millis = int(round((seconds - int(seconds)) * 1000))

              if millis >= 1000:
                  secs += 1
                  millis -= 1000

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{millis:03d}"
              )

          current = 0.0
          subtitles = []

          for i, part in enumerate(parts):

              if i == len(parts) - 1:
                  next_time = duration
              else:
                  ratio = len(part) / total_chars
                  next_time = current + duration * ratio

              subtitles.append(str(i + 1))
              subtitles.append(
                  f"{timestamp(current)} --> {timestamp(next_time)}"
              )
              subtitles.append(part)
              subtitles.append("")

              current = next_time

          with open(
              "media/subtitles.srt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(subtitles))

          print("Subtitle file:")
          print(open(
              "media/subtitles.srt",
              encoding="utf-8"
          ).read())
          PY

      # ============================================================
      # RENDER 1080x1920 / 15 SEC
      # ============================================================

      - name: Render 15 second TikTok video
        run: |
          ffmpeg -y \
            -stream_loop -1 \
            -i media/background.mp4 \
            -i media/narration_fit.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,subtitles=media/subtitles.srt:force_style='FontName=Noto Sans CJK JP,FontSize=20,PrimaryColour=&HFFFFFF&,OutlineColour=&H000000&,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=260'" \
            -t 15 \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            output.mp4

          test -s output.mp4

          echo "Video created."

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4

      # ============================================================
      # TIKTOK OAUTH
      # ============================================================

      - name: Get TikTok access token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_AUTH_CODE_TEMP: ${{ secrets.TIKTOK_AUTH_CODE_TEMP }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
        run: |
          if [ -n "$TIKTOK_REFRESH_TOKEN" ]; then

            echo "Using TikTok refresh token."

            RESPONSE=$(curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=${TIKTOK_CLIENT_KEY}" \
              --data-urlencode "client_secret=${TIKTOK_CLIENT_SECRET}" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=${TIKTOK_REFRESH_TOKEN}")

          elif [ -n "$TIKTOK_AUTH_CODE_TEMP" ]; then

            echo "Using temporary authorization code."

            RESPONSE=$(curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=${TIKTOK_CLIENT_KEY}" \
              --data-urlencode "client_secret=${TIKTOK_CLIENT_SECRET}" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "code=${TIKTOK_AUTH_CODE_TEMP}" \
              --data-urlencode "redirect_uri=${TIKTOK_REDIRECT_URI}")

          else

            echo "TikTok refresh token and temporary auth code are both missing."
            exit 1

          fi

          echo "$RESPONSE" > token.json

          ACCESS_TOKEN=$(jq -r '.access_token // empty' token.json)
          NEW_REFRESH_TOKEN=$(jq -r '.refresh_token // empty' token.json)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "TikTok OAuth failed."
            cat token.json
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          if [ -n "$NEW_REFRESH_TOKEN" ]; then
            echo "NEW_REFRESH_TOKEN=$NEW_REFRESH_TOKEN" >> "$GITHUB_ENV"
          fi

          echo "TikTok OAuth succeeded."

      # ============================================================
      # UPDATE ROTATED REFRESH TOKEN
      # ============================================================

      - name: Update rotated refresh token
        if: env.NEW_REFRESH_TOKEN != ''
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          NEW_REFRESH_TOKEN: ${{ env.NEW_REFRESH_TOKEN }}
        run: |
          if [ -z "$GH_ADMIN_TOKEN" ]; then
            echo "GH_ADMIN_TOKEN is not configured."
            exit 0
          fi

          echo "Updating rotated TikTok refresh token..."

          curl -sS \
            -X PATCH \
            -H "Authorization: Bearer ${GH_ADMIN_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/TIKTOK_REFRESH_TOKEN" \
            -d "{\"encrypted_value\":\"${NEW_REFRESH_TOKEN}\"}" \
            || true

      # ============================================================
      # CREATOR INFO
      # ============================================================

      - name: Get TikTok creator info
        run: |
          curl -sS \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/creator_info/query/" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d '{}' \
            > creator.json

          echo "=============================="
          echo "TIKTOK CREATOR INFO"
          echo "=============================="

          cat creator.json

          ERROR_CODE=$(jq -r '.error.code // empty' creator.json)

          if [ -n "$ERROR_CODE" ] && [ "$ERROR_CODE" != "ok" ]; then
            echo "Creator info request failed."
            exit 1
          fi

      # ============================================================
      # CALCULATE VIDEO CHUNKS
      # ============================================================

      - name: Prepare TikTok upload
        run: |
          VIDEO_SIZE=$(stat -c%s output.mp4)

          # TikTok FILE_UPLOAD chunk target
          MAX_CHUNK_SIZE=5000000

          if [ "$VIDEO_SIZE" -le "$MAX_CHUNK_SIZE" ]; then
            CHUNK_SIZE="$VIDEO_SIZE"
            TOTAL_CHUNKS=1
          else
            CHUNK_SIZE="$MAX_CHUNK_SIZE"
            TOTAL_CHUNKS=$(
              (
                VIDEO_SIZE + CHUNK_SIZE - 1
              ) / CHUNK_SIZE
            )
          fi

          echo "VIDEO_SIZE=$VIDEO_SIZE"
          echo "CHUNK_SIZE=$CHUNK_SIZE"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS"

          echo "VIDEO_SIZE=$VIDEO_SIZE" >> "$GITHUB_ENV"
          echo "CHUNK_SIZE=$CHUNK_SIZE" >> "$GITHUB_ENV"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS" >> "$GITHUB_ENV"

      # ============================================================
      # TIKTOK VIDEO INIT
      # ============================================================

      - name: Initialize TikTok Direct Post
        run: |
          cat > init.json <<EOF
          {
            "post_info": {
              "title": "15秒チャレンジ #TikTok",
              "privacy_level": "PUBLIC_TO_EVERYONE",
              "disable_duet": false,
              "disable_comment": false,
              "disable_stitch": false,
              "video_cover_timestamp_ms": 1000,
              "is_aigc": true
            },
            "source_info": {
              "source": "FILE_UPLOAD",
              "video_size": $VIDEO_SIZE,
              "chunk_size": $CHUNK_SIZE,
              "total_chunk_count": $TOTAL_CHUNKS
            }
          }
          EOF

          echo "=============================="
          echo "TIKTOK INIT REQUEST"
          echo "=============================="

          cat init.json

          curl -sS \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/video/init/" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d @init.json \
            > init_response.json

          echo "=============================="
          echo "TIKTOK INIT RESPONSE"
          echo "=============================="

          cat init_response.json

          ERROR_CODE=$(jq -r '.error.code // empty' init_response.json)

          if [ -n "$ERROR_CODE" ] && [ "$ERROR_CODE" != "ok" ]; then
            echo "TIKTOK INIT FAILED"
            exit 1
          fi

          PUBLISH_ID=$(jq -r '.data.publish_id // empty' init_response.json)
          UPLOAD_URL=$(jq -r '.data.upload_url // empty' init_response.json)

          if [ -z "$PUBLISH_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "TikTok did not return publish_id or upload_url."
            exit 1
          fi

          echo "PUBLISH_ID=$PUBLISH_ID" >> "$GITHUB_ENV"
          echo "UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"

          echo "TikTok initialization succeeded."

      # ============================================================
      # UPLOAD VIDEO
      # ============================================================

      - name: Upload TikTok video
        run: |
          VIDEO_SIZE=$(stat -c%s output.mp4)

          echo "=============================="
          echo "TIKTOK VIDEO UPLOAD"
          echo "=============================="

          echo "VIDEO_SIZE=$VIDEO_SIZE"
          echo "CHUNK_SIZE=$CHUNK_SIZE"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS"

          for ((i=0; i<TOTAL_CHUNKS; i++)); do

            START=$((i * CHUNK_SIZE))
            END=$((START + CHUNK_SIZE - 1))

            if [ "$END" -ge "$VIDEO_SIZE" ]; then
              END=$((VIDEO_SIZE - 1))
            fi

            LENGTH=$((END - START + 1))

            echo ""
            echo "Uploading chunk $((i + 1))/$TOTAL_CHUNKS"
            echo "START=$START"
            echo "END=$END"
            echo "LENGTH=$LENGTH"

            dd \
              if=output.mp4 \
              of="chunk_${i}.bin" \
              bs=1 \
              skip="$START" \
              count="$LENGTH" \
              status=none

            curl -sS \
              -X PUT \
              "$UPLOAD_URL" \
              -H "Content-Type: video/mp4" \
              -H "Content-Length: $LENGTH" \
              -H "Content-Range: bytes ${START}-${END}/${VIDEO_SIZE}" \
              --data-binary "@chunk_${i}.bin"

            rm -f "chunk_${i}.bin"

            echo "Chunk $((i + 1)) uploaded."

          done

          echo ""
          echo "TikTok video upload completed."

      # ============================================================
      # PUBLISH STATUS
      # ============================================================

      - name: Check TikTok publish status
        run: |
          echo "=============================="
          echo "TIKTOK PUBLISH STATUS"
          echo "=============================="

          for i in {1..20}; do

            echo ""
            echo "Checking status... $i/20"

            curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/post/publish/status/fetch/" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -d "{\"publish_id\":\"${PUBLISH_ID}\"}" \
              > status.json

            cat status.json

            STATUS=$(jq -r '.data.status // empty' status.json)

            echo "STATUS=$STATUS"

            if [ "$STATUS" = "PUBLISH_COMPLETE" ]; then
              echo ""
              echo "================================"
              echo "TIKTOK PUBLISH COMPLETE"
              echo "================================"
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo ""
              echo "TikTok publish failed."
              exit 1
            fi

            sleep 10

          done

          echo "TikTok processing timed out."
          exit 1

      # ============================================================
      # SAVE ARTIFACTS
      # ============================================================

      - name: Upload TikTok artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-short-${{ github.run_id }}
          path: |
            output.mp4
            content.json
            pexels.json
            creator.json
            token.json
            init.json
            init_response.json
            status.json
            media/subtitles.srt
          retention-days: 3
