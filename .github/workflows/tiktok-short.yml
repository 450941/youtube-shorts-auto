name: Generate TikTok Shorts

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Install
      # =========================================================
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk jq
          python -m pip install --upgrade pip
          pip install edge-tts

      # =========================================================
      # 3. Create deterministic seed
      # =========================================================
      - name: Create seed
        run: |
          DAY=$(date -u +%j)
          HOUR=$(date -u +%H)

          if [ "$HOUR" -lt 8 ]; then
            SLOT=0
          elif [ "$HOUR" -lt 12 ]; then
            SLOT=1
          else
            SLOT=2
          fi

          SEED=$((10#$DAY * 3 + SLOT))

          echo "SEED=$SEED" >> "$GITHUB_ENV"

          echo "DAY=$DAY"
          echo "HOUR=$HOUR"
          echo "SLOT=$SLOT"
          echo "SEED=$SEED"

      # =========================================================
      # 4. Generate 300,000+ combinations
      # =========================================================
      - name: Generate 300000+ content patterns
        run: |

          python - <<'PY'

          import os

          seed = int(os.environ["SEED"])

          contents = [

              {
                  "type": "2択クイズ",
                  "query": "person thinking",
                  "text": "AとB、直感で選んで。考える時間は3秒。Aだと思った？それともB？"
              },
              {
                  "type": "3択クイズ",
                  "query": "friends talking",
                  "text": "3択から直感で1つ選んで。1、2、3。最初に浮かんだ数字を信じて。"
              },
              {
                  "type": "心理ゲーム",
                  "query": "person thinking",
                  "text": "今から心理ゲーム。最初に思い浮かんだ色を覚えて。赤、青、黄色のどれ？"
              },
              {
                  "type": "予想ゲーム",
                  "query": "ball game",
                  "text": "このあと何が起きるか予想して。A、B、Cのどれだと思う？"
              },
              {
                  "type": "視覚チャレンジ",
                  "query": "optical illusion",
                  "text": "この映像を3秒だけ見て。何か変だと思ったら、もう一度見てみて。"
              },
              {
                  "type": "反射チャレンジ",
                  "query": "reaction challenge",
                  "text": "反射神経チャレンジ。画面が変わった瞬間に気づける？まだ。まだ。今！"
              },
              {
                  "type": "ミニ謎解き",
                  "query": "puzzle thinking",
                  "text": "これを5秒で考えて。答えは簡単そうで、意外と引っかかる。"
              },
              {
                  "type": "記憶チャレンジ",
                  "query": "memory game",
                  "text": "今から3つの言葉を覚えて。りんご、時計、猫。覚えた？"
              },
              {
                  "type": "直感チャレンジ",
                  "query": "person choosing",
                  "text": "深く考えずに選んで。左か右。最初に目が行った方を選んで。"
              },
              {
                  "type": "コメント参加",
                  "query": "friends talking",
                  "text": "あなたならどっち？朝型ならA、夜型ならB。直感で決めて。"
              },
              {
                  "type": "小さな挑戦",
                  "query": "person walking",
                  "text": "今日の小さな挑戦。スマホを10秒だけ置いて、ゆっくり深呼吸してみて。"
              },
              {
                  "type": "夜メッセージ",
                  "query": "night city person",
                  "text": "夜になると色々考えすぎるよね。でも今すぐ答えを出さなくても大丈夫。"
              },
              {
                  "type": "応援",
                  "query": "sunrise person",
                  "text": "今日は何もできなかったと思っているなら、明日は一つだけやってみよう。"
              },
              {
                  "type": "集中チャレンジ",
                  "query": "focused person",
                  "text": "画面の中央を3秒だけ見て。周りを見ないで、中央だけに集中して。"
              },
              {
                  "type": "観察チャレンジ",
                  "query": "city walking",
                  "text": "この映像の中で、最初に目に入ったものを覚えて。あなたは何を見つけた？"
              },
              {
                  "type": "選択ゲーム",
                  "query": "person choosing",
                  "text": "今の気分で選んで。静かな場所とにぎやかな場所、どっちに行きたい？"
              },
              {
                  "type": "タイミングゲーム",
                  "query": "running person",
                  "text": "ちょうどいいタイミングで画面を見られるか挑戦。まだ。まだ。今。"
              },
              {
                  "type": "予測チャレンジ",
                  "query": "sports prediction",
                  "text": "次に動く方向を予想して。左、右、それとも中央？決めた？"
              },
              {
                  "type": "数字ゲーム",
                  "query": "number game",
                  "text": "1から9までで、最初に浮かんだ数字を覚えて。あとで確認してみて。"
              },
              {
                  "type": "色ゲーム",
                  "query": "color background",
                  "text": "今一番気になる色を一つ選んで。赤、青、緑、黄色。直感で。"
              },
              {
                  "type": "気分チェック",
                  "query": "person relaxing",
                  "text": "今の気分を一言で表すなら、元気、普通、それとも疲れた？"
              },
              {
                  "type": "10秒チャレンジ",
                  "query": "person relaxing",
                  "text": "10秒だけ何も考えない時間を作ってみよう。画面を見ながらゆっくり呼吸して。"
              },
              {
                  "type": "勇気チャレンジ",
                  "query": "person mountain",
                  "text": "今日一つだけ先延ばししていることをやってみない？本当に小さなことでいい。"
              },
              {
                  "type": "リセット",
                  "query": "sunrise person",
                  "text": "ちょっと疲れたら一回リセット。深呼吸して、肩の力を抜いてみよう。"
              },
              {
                  "type": "自分時間",
                  "query": "person nature",
                  "text": "今日は誰かと比べなくていい。昨日の自分より少し楽なら、それで十分。"
              },
              {
                  "type": "再スタート",
                  "query": "person walking sunrise",
                  "text": "何回止まっても、また始めればいい。今日できる一番小さな一歩を選ぼう。"
              },
              {
                  "type": "夜の安心",
                  "query": "night person",
                  "text": "眠る前に今日のことを全部解決しなくていい。続きは明日の自分に任せよう。"
              },
              {
                  "type": "朝チャレンジ",
                  "query": "morning person",
                  "text": "朝起きたら、最初の10秒だけゆっくり動いてみよう。今日を急がなくていい。"
              },
              {
                  "type": "一歩チャレンジ",
                  "query": "person walking road",
                  "text": "大きな目標じゃなくていい。今日は一歩だけ進む。これを今日のミッションにしよう。"
              },
              {
                  "type": "自己肯定",
                  "query": "person peaceful",
                  "text": "うまくできなかった日も、自分を全部否定しなくていい。今日を終えたことも一つの結果。"
              }

          ]

          hook_bases = [
              "ちょっと待って。",
              "これ、直感で答えて。",
              "3秒だけ考えて。",
              "最初に思った方を選んで。",
              "深く考えないで。",
              "今の直感を信じて。",
              "一瞬で決めて。",
              "考える前に選んで。",
              "これは意外と難しい。",
              "あなたならどうする？",
              "今から勝負。",
              "ここで一回止めて。",
              "最後まで見て。",
              "答えを見る前に決めて。",
              "先に予想して。",
              "今の自分ならどっち？",
              "5秒だけ集中して。",
              "一発で当てられる？",
              "これ分かる人いる？",
              "あなたの答えは？"
          ]

          hook_suffixes = [
              "直感だけでいこう。",
              "最初の答えを覚えて。",
              "まだ答えは見ないで。",
              "迷ったら最初の方。",
              "答えを変えないで。",
          ]

          hooks = []

          for base in hook_bases:
              for suffix in hook_suffixes:
                  hooks.append(base + "\n" + suffix)

          hooks = hooks[:100]

          ending_bases = [
              "どうだった？",
              "当たった？",
              "できた？",
              "気づいた？",
              "分かった？",
              "あなたはどっち？",
              "コメントで教えて。",
              "もう一回やってみて。",
              "友達にも試してみて。",
              "最初の答えを覚えてた？",
              "直感は当たった？",
              "最後まで分かった？",
              "今の答えを忘れないで。",
              "意外だった？",
              "もう一度見ると違って見えるかも。",
              "答えは人それぞれ。",
              "あなたの結果はどうだった？",
              "次はもっと難しいかも。",
              "明日もう一回挑戦してみて。",
              "今日の小さなミッションでした。"
          ]

          ending_suffixes = [
              "ぜひコメントで。",
              "直感って面白いよね。",
              "もう一度挑戦してみて。",
              "友達にも聞いてみて。",
              "あなたの答えも知りたい。",
          ]

          endings = []

          for base in ending_bases:
              for suffix in ending_suffixes:
                  endings.append(base + "\n" + suffix)

          endings = endings[:100]

          content_index = seed % len(contents)
          remaining = seed // len(contents)
          hook_index = remaining % len(hooks)
          remaining = remaining // len(hooks)
          ending_index = remaining % len(endings)

          item = contents[content_index]
          hook = hooks[hook_index]
          ending = endings[ending_index]

          script = (
              hook
              + "\n"
              + item["text"]
              + "\n"
              + ending
          )

          total_patterns = (
              len(contents)
              * len(hooks)
              * len(endings)
          )

          print("TOTAL PATTERNS:", total_patterns)
          print("CONTENT:", item["type"])
          print("HOOK:", hook_index)
          print("ENDING:", ending_index)

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          with open("pexels_query.txt", "w", encoding="utf-8") as f:
              f.write(item["query"])

          with open("video_type.txt", "w", encoding="utf-8") as f:
              f.write(item["type"])

          title = item["type"] + "｜15秒チャレンジ"

          with open("video_title.txt", "w", encoding="utf-8") as f:
              f.write(title)

          PY

          echo "================================="
          echo "Generated content"
          echo "================================="

          cat video_type.txt
          echo
          cat script.txt

      # =========================================================
      # 5. Search Pexels
      # =========================================================
      - name: Search Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |

          set -e

          QUERY=$(cat pexels_query.txt)

          python - "$QUERY" <<'PY' > encoded_query.txt

          import sys
          import urllib.parse

          print(urllib.parse.quote(sys.argv[1]))

          PY

          ENCODED_QUERY=$(cat encoded_query.txt)

          echo "Pexels query: $QUERY"

          curl -fL \
            -H "Authorization: $PEXELS_API_KEY" \
            -H "Accept: application/json" \
            "https://api.pexels.com/v1/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=20" \
            -o pexels.json

          VIDEO_URL=$(jq -r '
            if (.videos and (.videos | length > 0)) then
              .videos
              | map(.video_files[])
              | map(select(.file_type == "video/mp4"))
              | map(select(.height > .width))
              | sort_by(.width)
              | reverse
              | .[0].link
            else
              empty
            end
          ' pexels.json)

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then

            echo "Portrait result not found."
            echo "Trying fallback search."

            curl -fL \
              -H "Authorization: $PEXELS_API_KEY" \
              -H "Accept: application/json" \
              "https://api.pexels.com/v1/videos/search?query=people&orientation=portrait&size=medium&per_page=20" \
              -o pexels.json

            VIDEO_URL=$(jq -r '
              if (.videos and (.videos | length > 0)) then
                .videos
                | map(.video_files[])
                | map(select(.file_type == "video/mp4"))
                | map(select(.height > .width))
                | sort_by(.width)
                | reverse
                | .[0].link
              else
                empty
              end
            ' pexels.json)

          fi

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "ERROR: No portrait Pexels video found."
            exit 1
          fi

          echo "Pexels video URL found."

          curl -fL "$VIDEO_URL" -o source.mp4

          test -s source.mp4

          echo "Pexels video downloaded."

      # =========================================================
      # 6. Generate narration
      # =========================================================
      - name: Generate narration
        run: |

          edge-tts \
            --voice "ja-JP-NanamiNeural" \
            --rate "+10%" \
            --text "$(cat script.txt)" \
            --write-media narration.mp3

          test -s narration.mp3

      # =========================================================
      # 7. Fit narration into 15 seconds
      # =========================================================
      - name: Fit narration
        run: |

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Original narration:"
          echo "$DURATION seconds"

          SPEED=$(python - "$DURATION" <<'PY'

          import sys

          duration = float(sys.argv[1])

          if duration <= 14.5:
              print("1.0")
          else:
              speed = duration / 14.5

              if speed > 1.95:
                  speed = 1.95

              print(f"{speed:.3f}")

          PY
          )

          echo "Audio speed:"
          echo "$SPEED"

          if [ "$SPEED" = "1.0" ]; then

            cp narration.mp3 narration_fit.mp3

          else

            ffmpeg \
              -y \
              -i narration.mp3 \
              -filter:a "atempo=$SPEED" \
              narration_fit.mp3

          fi

          test -s narration_fit.mp3

      # =========================================================
      # 8. Create synchronized subtitles
      # =========================================================
      - name: Create synchronized subtitles
        run: |

          python - <<'PY'

          import re
          import subprocess

          script = open(
              "script.txt",
              encoding="utf-8"
          ).read().strip()

          duration = float(
              subprocess.check_output([
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "narration_fit.mp3"
              ]).decode().strip()
          )

          duration = min(duration, 14.5)

          raw_parts = re.split(
              r'[\n。！？!?]+',
              script
          )

          parts = [
              x.strip()
              for x in raw_parts
              if x.strip()
          ]

          if not parts:
              parts = [script]

          final_parts = []

          for part in parts:

              if len(part) <= 18:
                  final_parts.append(part)
                  continue

              words = [
                  part[i:i+18]
                  for i in range(
                      0,
                      len(part),
                      18
                  )
              ]

              final_parts.extend(words)

          parts = final_parts
          count = len(parts)

          def timestamp(seconds):

              total_ms = int(seconds * 1000)

              hours = total_ms // 3600000

              total_ms %= 3600000

              minutes = total_ms // 60000

              total_ms %= 60000

              seconds_int = total_ms // 1000

              milliseconds = total_ms % 1000

              return (
                  f"{hours:02}:"
                  f"{minutes:02}:"
                  f"{seconds_int:02},"
                  f"{milliseconds:03}"
              )

          with open(
              "captions.srt",
              "w",
              encoding="utf-8"
          ) as f:

              for i, text in enumerate(parts):

                  start = duration * i / count

                  end = duration * (i + 1) / count

                  f.write(
                      f"{i+1}\n"
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                      f"{text}\n\n"
                  )

          PY

          echo "================================="
          echo "SUBTITLES"
          echo "================================="

          cat captions.srt

      # =========================================================
      # 9. Render 15-second vertical video
      # =========================================================
      - name: Render 15 second video
        run: |

          ffmpeg \
            -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i narration_fit.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=captions.srt:force_style='FontName=Noto Sans CJK JP,FontSize=52,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=4,Shadow=1,Alignment=2,MarginV=520'" \
            -t 15 \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            output.mp4

          test -s output.mp4

          echo "================================="
          echo "VIDEO CREATED"
          echo "================================="

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4

      # =========================================================
      # 10. Get TikTok access token
      # =========================================================
      - name: Get TikTok access token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUTH_CODE: ${{ secrets.TIKTOK_AUTH_CODE }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
        run: |

          set -e

          if [ -n "$TIKTOK_REFRESH_TOKEN" ]; then

            echo "Using TikTok refresh token."

            RESPONSE=$(curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" \
              --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=$TIKTOK_REFRESH_TOKEN")

          else

            echo "Using initial authorization code."

            RESPONSE=$(curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" \
              --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "code=$TIKTOK_AUTH_CODE" \
              --data-urlencode "redirect_uri=$TIKTOK_REDIRECT_URI")

          fi

          ERROR_CODE=$(echo "$RESPONSE" | jq -r '.error // empty')

          if [ -n "$ERROR_CODE" ]; then
            echo "TikTok OAuth returned an error."
            echo "$RESPONSE" | jq 'del(.access_token, .refresh_token)'
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: TikTok access token was not returned."
            echo "$RESPONSE" | jq 'del(.access_token, .refresh_token)'
            exit 1
          fi

          echo "TIKTOK_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          NEW_REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token // empty')

          if [ -n "$NEW_REFRESH_TOKEN" ]; then
            echo "A TikTok refresh token was returned."
            echo "It must be saved as TIKTOK_REFRESH_TOKEN for future scheduled runs."
          fi

      # =========================================================
      # 11. Get creator information
      # =========================================================
      - name: Get TikTok creator info
        run: |

          curl -sS \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/creator_info/query/" \
            -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d '{}' \
            -o creator.json

          echo "Creator information:"
          cat creator.json | jq .

          ERROR_CODE=$(jq -r \
            '.error.code // empty' \
            creator.json)

          if [ "$ERROR_CODE" != "ok" ]; then
            echo "ERROR: TikTok creator info failed."
            exit 1
          fi

          PRIVACY_OPTIONS=$(jq -r \
            '.data.privacy_level_options[]?' \
            creator.json)

          echo "Available privacy levels:"
          echo "$PRIVACY_OPTIONS"

      # =========================================================
      # 12. Initialize TikTok Direct Post
      # =========================================================
      - name: Initialize TikTok Direct Post
        run: |

          set -e

          FILE_SIZE=$(stat -c%s output.mp4)
          TITLE=$(cat video_title.txt)

          python - "$TITLE" "$FILE_SIZE" <<'PY' > init.json

          import json
          import sys

          title = sys.argv[1]
          file_size = int(sys.argv[2])

          data = {
              "post_info": {
                  "title": title,
                  "privacy_level": "SELF_ONLY",
                  "disable_duet": False,
                  "disable_comment": False,
                  "disable_stitch": False,
                  "video_cover_timestamp_ms": 1000,
                  "is_aigc": True
              },
              "source_info": {
                  "source": "FILE_UPLOAD",
                  "video_size": file_size,
                  "chunk_size": file_size,
                  "total_chunk_count": 1
              }
          }

          print(
              json.dumps(
                  data,
                  ensure_ascii=False
              )
          )

          PY

          echo "TikTok initialization request:"
          cat init.json | jq .

          curl -sS \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/video/init/" \
            -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d @init.json \
            -o publish.json

          echo "TikTok initialization response:"
          cat publish.json | jq .

          ERROR_CODE=$(jq -r \
            '.error.code // empty' \
            publish.json)

          if [ "$ERROR_CODE" != "ok" ]; then
            echo "ERROR: TikTok initialization failed."
            exit 1
          fi

          PUBLISH_ID=$(jq -r \
            '.data.publish_id // empty' \
            publish.json)

          UPLOAD_URL=$(jq -r \
            '.data.upload_url // empty' \
            publish.json)

          if [ -z "$PUBLISH_ID" ]; then
            echo "ERROR: publish_id was not returned."
            exit 1
          fi

          if [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: upload_url was not returned."
            exit 1
          fi

          echo "PUBLISH_ID=$PUBLISH_ID" >> "$GITHUB_ENV"
          echo "UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"

      # =========================================================
      # 13. Upload video
      # =========================================================
      - name: Upload video to TikTok
        run: |

          set -e

          FILE_SIZE=$(stat -c%s output.mp4)

          echo "Uploading video..."
          echo "File size: $FILE_SIZE bytes"

          curl -fL \
            -X PUT \
            "$UPLOAD_URL" \
            -H "Content-Type: video/mp4" \
            -H "Content-Length: $FILE_SIZE" \
            -H "Content-Range: bytes 0-$((FILE_SIZE - 1))/$FILE_SIZE" \
            --upload-file output.mp4

          echo "TikTok video upload completed."

      # =========================================================
      # 14. Check publish status
      # =========================================================
      - name: Check TikTok publish status
        run: |

          set -e

          for i in $(seq 1 12); do

            echo "================================="
            echo "TikTok status check $i / 12"
            echo "================================="

            RESPONSE=$(curl -sS \
              -X POST \
              "https://open.tiktokapis.com/v2/post/publish/status/fetch/" \
              -H "Authorization: Bearer $TIKTOK_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"publish_id\":\"$PUBLISH_ID\"}")

            echo "$RESPONSE" | jq .

            STATUS=$(echo "$RESPONSE" | jq -r \
              '.data.status // empty')

            echo "STATUS=$STATUS"

            if [ "$STATUS" = "PUBLISH_COMPLETE" ]; then

              echo "================================="
              echo "TikTok publish complete!"
              echo "================================="

              exit 0

            fi

            if [ "$STATUS" = "FAILED" ]; then

              echo "TikTok publish failed."

              exit 1

            fi

            sleep 10

          done

          echo "TikTok is still processing."
          echo "The workflow itself completed."

      # =========================================================
      # 15. Save generated video artifact
      # =========================================================
      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-short-${{ github.run_number }}
          path: |
            output.mp4
            script.txt
            captions.srt
            video_title.txt
            video_type.txt
