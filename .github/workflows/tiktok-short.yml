name: Generate TikTok Shorts

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL PACKAGES
      # ============================================================
      - name: Install packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            jq \
            curl \
            python3-pip

          python3 -m pip install --upgrade pip --break-system-packages

          python3 -m pip install \
            edge-tts \
            requests \
            --break-system-packages

          echo "================================"
          echo "INSTALL COMPLETE"
          echo "================================"

          ffmpeg -version | head -n 1
          python3 --version

      # ============================================================
      # 3. CREATE DIRECTORIES
      # ============================================================
      - name: Create directories
        run: |
          mkdir -p media
          mkdir -p output
          mkdir -p debug

          echo "================================"
          echo "DIRECTORIES CREATED"
          echo "================================"

          ls -la

      # ============================================================
      # 4. GENERATE CONTENT
      # ============================================================
      - name: Generate TikTok content
        env:
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import random
          import time
          import json
          import os

          run_id = os.environ.get("GH_RUN_ID", "0")

          seed = int(time.time()) + int(run_id)
          random.seed(seed)

          categories = [
              "2択クイズ",
              "3択クイズ",
              "心理ゲーム",
              "予想ゲーム",
              "視覚チャレンジ",
              "反射チャレンジ",
              "ミニ謎解き",
              "記憶チャレンジ",
              "直感チャレンジ",
              "コメント参加",
              "小さな挑戦",
              "夜メッセージ",
              "応援",
              "集中チャレンジ",
              "観察チャレンジ",
              "選択ゲーム",
              "タイミングゲーム",
              "予測チャレンジ",
              "数字ゲーム",
              "色ゲーム",
              "気分チェック",
              "10秒チャレンジ",
              "勇気チャレンジ",
              "リセット",
              "自分時間",
              "再スタート",
              "夜の安心",
              "朝チャレンジ",
              "一歩チャレンジ",
              "自己肯定"
          ]

          hooks = [
              "今から10秒だけ集中して",
              "直感で選んでください",
              "考えすぎたら負けです",
              "最初に思った方を選んで",
              "あなたはどっち？",
              "3秒以内に決めて",
              "これ意外と当たります",
              "最後まで見てください",
              "答えを知るとちょっと驚きます",
              "今の気分で選んで",
              "あなたの直感を試します",
              "一瞬で答えてください",
              "これは意外と難しい",
              "あなたならどうする？",
              "コメントする準備をして",
              "今だけ本気で考えて",
              "脳をちょっとだけ使います",
              "ここで選択してください",
              "あなたのタイプが分かります",
              "最後に答えを発表します",
              "10秒だけ付き合って",
              "これを当てられたらすごい",
              "あなたの予想は当たる？",
              "一度だけ見てください",
              "ここで止めずに見て",
              "感覚だけで答えて",
              "あなたの記憶力を試します",
              "一瞬だけ集中",
              "今のあなたに必要なのはどっち？",
              "今日の自分を試してみて",
              "迷ったら最初の答え"
          ]

          endings = [
              "答えはコメント欄で予想してみて",
              "正解は最後に出ます",
              "あなたは当たりましたか？",
              "コメントで教えてください",
              "友達にも試してみて",
              "もう一回やると違う答えになるかも",
              "最初の直感を信じてください",
              "今日も一歩だけ進めば十分です",
              "できなくても大丈夫",
              "ここまで見たあなたは十分頑張っています",
              "焦らなくて大丈夫です",
              "明日また挑戦してみて",
              "あなたのペースでいきましょう",
              "今日はここまででOK",
              "少し休んでください",
              "自分を責めなくて大丈夫",
              "また次の動画で会いましょう",
              "あなたなら大丈夫",
              "小さな一歩で十分です",
              "今日もお疲れさまでした"
          ]

          category = random.choice(categories)
          hook = random.choice(hooks)
          ending = random.choice(endings)

          if category == "2択クイズ":
              body = random.choice([
                  "朝起きて最初にするなら、水を飲む？それとも顔を洗う？",
                  "休日に過ごすなら、家でゆっくり？それとも外に出る？",
                  "今もらえるなら、1000円？それとも1万円を1年後？",
                  "旅行するなら、海？それとも山？",
                  "集中するなら、朝？それとも夜？"
              ])

          elif category == "3択クイズ":
              body = random.choice([
                  "今一番食べたいのは、Aラーメン、Bカレー、C寿司？",
                  "旅行するなら、A東京、B大阪、C北海道？",
                  "今必要なのは、A休む、B寝る、C遊ぶ？",
                  "一日だけ能力を選ぶなら、A透明、B瞬間移動、C未来予知？"
              ])

          elif category == "心理ゲーム":
              body = random.choice([
                  "目の前に3つのドアがあります。赤、青、黄色。直感で1つ選んでください。",
                  "知らない場所で最初に見るものは？空、建物、人。",
                  "誰かから突然連絡が来ました。最初に思うのは、嬉しい、怖い、気になる？"
              ])

          elif category == "予想ゲーム":
              body = random.choice([
                  "このあと数字は大きくなる？小さくなる？",
                  "次に出る色を予想してください。赤？青？黄色？",
                  "次の瞬間、どちらが先に動くと思う？"
              ])

          elif category == "視覚チャレンジ":
              body = "画面の中で変化した場所を探してください。見つけられる？"

          elif category == "反射チャレンジ":
              body = "画面に合図が出た瞬間、頭の中で数字の3を言ってください。"

          elif category == "ミニ謎解き":
              body = random.choice([
                  "1、2、3、5、8。次の数字は？",
                  "10から2を3回引いたらいくつ？",
                  "りんごが3個あります。2個食べたら残りはいくつ？"
              ])

          elif category == "記憶チャレンジ":
              body = "今から3つの言葉を覚えてください。猫、青、7。最後に思い出せる？"

          elif category == "直感チャレンジ":
              body = "赤と青、今どちらを選びたい？理由は考えなくてOK。"

          elif category == "コメント参加":
              body = "今の気分を数字で表すなら、1から10でいくつ？"

          elif category == "小さな挑戦":
              body = "今から10秒だけスマホを置いて、深呼吸してみてください。"

          elif category == "夜メッセージ":
              body = "今日うまくできなかったことがあっても、それだけであなたの価値は変わりません。"

          elif category == "応援":
              body = "最近ちょっと疲れているなら、今日は全部頑張らなくても大丈夫です。"

          elif category == "集中チャレンジ":
              body = "今から5秒だけ、画面の中央だけを見てください。"

          elif category == "観察チャレンジ":
              body = "画面の中に違和感がないか探してください。気づける？"

          elif category == "選択ゲーム":
              body = "今のあなたなら、挑戦する？それとも少し休む？"

          elif category == "タイミングゲーム":
              body = "数字が変わる瞬間を予想してください。"

          elif category == "予測チャレンジ":
              body = "次に何が起きるか、直感で予想してみてください。"

          elif category == "数字ゲーム":
              body = "7秒以内に7の倍数を3つ思い浮かべてください。"

          elif category == "色ゲーム":
              body = "今一番気になる色を1つ選んでください。"

          elif category == "気分チェック":
              body = "今の気分に近いのは、元気、普通、疲れた、どれ？"

          elif category == "10秒チャレンジ":
              body = "10秒だけ何も考えず、ゆっくり呼吸してください。"

          elif category == "勇気チャレンジ":
              body = "今日やろうと思って後回しにしたことを、1つだけ始めてみて。"

          elif category == "リセット":
              body = "一度深呼吸して、今日をここからやり直すつもりでいきましょう。"

          elif category == "自分時間":
              body = "今から1分だけ、自分のための時間にしてください。"

          elif category == "再スタート":
              body = "失敗したとしても、次の一回はまだ残っています。"

          elif category == "夜の安心":
              body = "今日はもう十分です。眠る前くらい、自分に優しくしてあげてください。"

          elif category == "朝チャレンジ":
              body = "朝の10秒だけ、今日やりたいことを1つ思い浮かべてください。"

          elif category == "一歩チャレンジ":
              body = "大きなことじゃなくていい。今日できる一歩を1つだけ。"

          elif category == "自己肯定":
              body = "今日ここまで来た。それだけでも十分です。"

          else:
              body = "あなたならどうしますか？"

          text = f"{hook}。{body}。{ending}"

          print("================================")
          print("CATEGORY:", category)
          print("TEXT:", text)
          print("================================")

          with open("content.txt", "w", encoding="utf-8") as f:
              f.write(text)

          with open("content.json", "w", encoding="utf-8") as f:
              json.dump({
                  "category": category,
                  "hook": hook,
                  "body": body,
                  "ending": ending,
                  "text": text
              }, f, ensure_ascii=False, indent=2)

          PY

          echo "================================"
          echo "CONTENT GENERATED"
          echo "================================"

          cat content.txt

      # ============================================================
      # 5. SEARCH PEXELS VIDEO
      # ============================================================
      - name: Search Pexels portrait video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "================================"
          echo "SEARCHING PEXELS VIDEO"
          echo "================================"

          QUERY="people lifestyle"

          RESPONSE=$(curl -s \
            -H "Authorization: ${PEXELS_API_KEY}" \
            "https://api.pexels.com/videos/search?query=${QUERY}&orientation=portrait&per_page=20")

          echo "$RESPONSE" > debug/pexels.json

          VIDEO_URL=$(echo "$RESPONSE" | jq -r '
            .videos[]
            .video_files[]
            | select(.width < .height)
            | select(.width >= 720)
            | .link
          ' | head -n 1)

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "Portrait video not found."
            exit 1
          fi

          echo "VIDEO URL:"
          echo "$VIDEO_URL"

          curl -L \
            --fail \
            "$VIDEO_URL" \
            -o media/background.mp4

          echo "================================"
          echo "VIDEO DOWNLOADED"
          echo "================================"

          ls -lh media/background.mp4

      # ============================================================
      # 6. GENERATE JAPANESE NARRATION
      # ============================================================
      - name: Generate Japanese narration
        run: |
          echo "================================"
          echo "GENERATING JAPANESE NARRATION"
          echo "================================"

          edge-tts \
            --voice "ja-JP-NanamiNeural" \
            --rate="+10%" \
            --text "$(cat content.txt)" \
            --write-media narration.mp3

          echo "================================"
          echo "NARRATION CREATED"
          echo "================================"

          ls -lh narration.mp3

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3

      # ============================================================
      # 7. FIT AUDIO TO EXACTLY 15 SECONDS
      # ============================================================
      - name: Fit narration to 15 seconds
        run: |
          echo "================================"
          echo "FITTING NARRATION TO 15 SECONDS"
          echo "================================"

          ffmpeg -y \
            -i narration.mp3 \
            -af "apad=pad_dur=15,atrim=duration=15" \
            -c:a aac \
            -b:a 128k \
            -ar 48000 \
            -ac 2 \
            -f ipod \
            narration_15.m4a

          echo "================================"
          echo "NARRATION CREATED"
          echo "================================"

          ls -lh narration_15.m4a

          echo "AUDIO DURATION:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration_15.m4a

      # ============================================================
      # 8. CREATE SUBTITLES
      # ============================================================
      - name: Create subtitles
        run: |
          echo "================================"
          echo "CREATING SUBTITLES"
          echo "================================"

          python3 <<'PY'
          import re

          text = open("content.txt", "r", encoding="utf-8").read().strip()

          # 15秒用に文章を適度な長さへ分割
          sentences = re.split(r'(?<=[。！？])', text)

          sentences = [
              s.strip()
              for s in sentences
              if s.strip()
          ]

          if not sentences:
              sentences = [text]

          total = 15.0
          count = len(sentences)

          # 1字幕あたりの最大表示数を調整
          if count > 6:
              sentences = sentences[:6]
              count = len(sentences)

          duration = total / count

          def fmt(sec):
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = int(sec % 60)
              ms = int(round((sec - int(sec)) * 1000))

              if ms >= 1000:
                  s += 1
                  ms -= 1000

              return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"

          with open("subtitles.srt", "w", encoding="utf-8") as f:
              for i, sentence in enumerate(sentences, start=1):
                  start = (i - 1) * duration
                  end = i * duration

                  f.write(f"{i}\n")
                  f.write(f"{fmt(start)} --> {fmt(end)}\n")
                  f.write(f"{sentence}\n\n")

          PY

          echo "================================"
          echo "SUBTITLES CREATED"
          echo "================================"

          cat subtitles.srt

          echo "================================"
          echo "CHECK AUDIO FILE"
          echo "================================"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration_15.m4a

      # ============================================================
      # 9. PREPARE BACKGROUND VIDEO
      # ============================================================
      - name: Prepare background video
        run: |
          echo "================================"
          echo "PREPARING BACKGROUND VIDEO"
          echo "================================"

          ffmpeg -y \
            -stream_loop -1 \
            -i media/background.mp4 \
            -t 15 \
            -vf "
              scale=1080:1920:
              force_original_aspect_ratio=increase,
              crop=1080:1920
            " \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            media/background_15.mp4

          echo "================================"
          echo "BACKGROUND READY"
          echo "================================"

          ls -lh media/background_15.mp4

      # ============================================================
      # 10. RENDER FINAL TIKTOK VIDEO
      # ============================================================
      - name: Render final TikTok video
        run: |
          echo "================================"
          echo "RENDERING FINAL VIDEO"
          echo "================================"

          ffmpeg -y \
            -i media/background_15.mp4 \
            -i narration_15.m4a \
            -filter_complex "
              [0:v]
              drawbox=
              x=0:
              y=0:
              w=iw:
              h=ih:
              color=black@0.18:
              t=fill,
              subtitles=subtitles.srt:
              force_style=
              'FontName=Noto Sans CJK JP,
               FontSize=18,
               PrimaryColour=&H00FFFFFF,
               OutlineColour=&H00000000,
               BorderStyle=1,
               Outline=3,
               Shadow=1,
               Alignment=2,
               MarginV=250'
              [v]
            " \
            -map "[v]" \
            -map 1:a:0 \
            -t 15 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -ar 48000 \
            -ac 2 \
            -movflags +faststart \
            output/tiktok.mp4

          echo "================================"
          echo "FINAL VIDEO CREATED"
          echo "================================"

          ls -lh output/tiktok.mp4

          echo "================================"
          echo "VIDEO INFORMATION"
          echo "================================"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of json \
            output/tiktok.mp4

      # ============================================================
      # 11. CHECK VIDEO SIZE
      # ============================================================
      - name: Check video size
        run: |
          VIDEO_SIZE=$(stat -c%s output/tiktok.mp4)

          echo "================================"
          echo "VIDEO SIZE"
          echo "================================"
          echo "$VIDEO_SIZE bytes"

          if [ "$VIDEO_SIZE" -le 0 ]; then
            echo "ERROR: VIDEO SIZE IS ZERO"
            exit 1
          fi

      # ============================================================
      # 12. GET TIKTOK ACCESS TOKEN
      # ============================================================
      - name: Get TikTok access token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_AUTH_CODE_TEMP: ${{ secrets.TIKTOK_AUTH_CODE_TEMP }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
        run: |
          echo "================================"
          echo "GETTING TIKTOK ACCESS TOKEN"
          echo "================================"

          TOKEN_RESPONSE=""

          if [ -n "$TIKTOK_REFRESH_TOKEN" ]; then

            echo "Using refresh token."

            TOKEN_RESPONSE=$(curl -s -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=${TIKTOK_CLIENT_KEY}" \
              --data-urlencode "client_secret=${TIKTOK_CLIENT_SECRET}" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=${TIKTOK_REFRESH_TOKEN}")

          elif [ -n "$TIKTOK_AUTH_CODE_TEMP" ]; then

            echo "Using temporary authorization code."

            TOKEN_RESPONSE=$(curl -s -X POST \
              "https://open.tiktokapis.com/v2/oauth/token/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=${TIKTOK_CLIENT_KEY}" \
              --data-urlencode "client_secret=${TIKTOK_CLIENT_SECRET}" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "redirect_uri=${TIKTOK_REDIRECT_URI}" \
              --data-urlencode "code=${TIKTOK_AUTH_CODE_TEMP}")

          else
            echo "ERROR: No TikTok token available."
            exit 1
          fi

          echo "$TOKEN_RESPONSE" > debug/token_response.json

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          NEW_REFRESH_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.refresh_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: ACCESS TOKEN NOT FOUND"
            cat debug/token_response.json
            exit 1
          fi

          echo "ACCESS TOKEN RECEIVED"

          printf '%s' "$ACCESS_TOKEN" > access_token.txt

          if [ -n "$NEW_REFRESH_TOKEN" ]; then
            printf '%s' "$NEW_REFRESH_TOKEN" > new_refresh_token.txt
            echo "A new refresh token was returned."
          fi

      # ============================================================
      # 13. GET CREATOR INFO
      # ============================================================
      - name: Get TikTok creator info
        run: |
          echo "================================"
          echo "GETTING CREATOR INFO"
          echo "================================"

          ACCESS_TOKEN=$(cat access_token.txt)

          CREATOR_RESPONSE=$(curl -s -X POST \
            "https://open.tiktokapis.com/v2/post/publish/creator_info/query/" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8")

          echo "$CREATOR_RESPONSE" > debug/creator_info.json

          echo "CREATOR INFO RESPONSE:"
          cat debug/creator_info.json

          ERROR_CODE=$(echo "$CREATOR_RESPONSE" | jq -r '.error.code // empty')

          if [ -n "$ERROR_CODE" ] && [ "$ERROR_CODE" != "ok" ]; then
            echo "TikTok creator info error."
            exit 1
          fi

          PRIVACY_LEVEL=$(echo "$CREATOR_RESPONSE" | jq -r '
            .data.privacy_level_options[0] // empty
          ')

          if [ -z "$PRIVACY_LEVEL" ]; then
            echo "WARNING: Privacy level could not be detected."
            PRIVACY_LEVEL="PUBLIC_TO_EVERYONE"
          fi

          echo "PRIVACY LEVEL:"
          echo "$PRIVACY_LEVEL"

          echo "$PRIVACY_LEVEL" > privacy_level.txt

      # ============================================================
      # 14. VIDEO SIZE / CHUNK CALCULATION
      # ============================================================
      - name: Calculate upload chunks
        run: |
          echo "================================"
          echo "CALCULATING UPLOAD CHUNKS"
          echo "================================"

          VIDEO_SIZE=$(stat -c%s output/tiktok.mp4)

          # TikTok Direct Post upload
          # 5MBを基本チャンクサイズとして使用
          MIN_CHUNK_SIZE=5000000
          MAX_CHUNK_SIZE=64000000

          if [ "$VIDEO_SIZE" -lt "$MIN_CHUNK_SIZE" ]; then
            CHUNK_SIZE="$VIDEO_SIZE"
            TOTAL_CHUNKS=1
          else
            CHUNK_SIZE="$MIN_CHUNK_SIZE"

            # 最後のチャンクを含むためのチャンク数
            TOTAL_CHUNKS=$(( VIDEO_SIZE / CHUNK_SIZE ))

            if [ $(( VIDEO_SIZE % CHUNK_SIZE )) -ne 0 ]; then
              TOTAL_CHUNKS=$(( TOTAL_CHUNKS + 1 ))
            fi
          fi

          echo "VIDEO_SIZE=$VIDEO_SIZE"
          echo "CHUNK_SIZE=$CHUNK_SIZE"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS"

          echo "$VIDEO_SIZE" > video_size.txt
          echo "$CHUNK_SIZE" > chunk_size.txt
          echo "$TOTAL_CHUNKS" > total_chunks.txt

      # ============================================================
      # 15. INITIALIZE TIKTOK DIRECT POST
      # ============================================================
      - name: Initialize TikTok Direct Post
        run: |
          echo "================================"
          echo "INITIALIZING TIKTOK DIRECT POST"
          echo "================================"

          ACCESS_TOKEN=$(cat access_token.txt)
          VIDEO_SIZE=$(cat video_size.txt)
          CHUNK_SIZE=$(cat chunk_size.txt)
          TOTAL_CHUNKS=$(cat total_chunks.txt)
          PRIVACY_LEVEL=$(cat privacy_level.txt)

          echo "VIDEO_SIZE=$VIDEO_SIZE"
          echo "CHUNK_SIZE=$CHUNK_SIZE"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS"
          echo "PRIVACY_LEVEL=$PRIVACY_LEVEL"

          INIT_BODY=$(jq -n \
            --arg source_info "FILE_UPLOAD" \
            --arg post_mode "DIRECT_POST" \
            --arg privacy_level "$PRIVACY_LEVEL" \
            --argjson chunk_size "$CHUNK_SIZE" \
            --argjson total_chunk_count "$TOTAL_CHUNKS" \
            '{
              post_info: {
                title: "",
                privacy_level: $privacy_level,
                disable_duet: false,
                disable_comment: false,
                disable_stitch: false,
                video_cover_timestamp_ms: 1000
              },
              source_info: {
                source: $source_info,
                video_size: null,
                chunk_size: $chunk_size,
                total_chunk_count: $total_chunk_count
              }
            }')

          INIT_BODY=$(echo "$INIT_BODY" | jq \
            --argjson size "$VIDEO_SIZE" \
            '.source_info.video_size = $size')

          echo "$INIT_BODY" > debug/init_request.json

          echo "================================"
          echo "INIT REQUEST"
          echo "================================"

          cat debug/init_request.json

          INIT_RESPONSE=$(curl -s -X POST \
            "https://open.tiktokapis.com/v2/post/publish/video/init/" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$INIT_BODY")

          echo "$INIT_RESPONSE" > debug/init_response.json

          echo "================================"
          echo "TIKTOK INIT RESPONSE"
          echo "================================"

          cat debug/init_response.json

          PUBLISH_ID=$(echo "$INIT_RESPONSE" | jq -r '.data.publish_id // empty')
          UPLOAD_URL=$(echo "$INIT_RESPONSE" | jq -r '.data.upload_url // empty')

          if [ -z "$PUBLISH_ID" ]; then
            echo "ERROR: PUBLISH ID NOT FOUND"
            exit 1
          fi

          if [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: UPLOAD URL NOT FOUND"
            exit 1
          fi

          echo "$PUBLISH_ID" > publish_id.txt
          echo "$UPLOAD_URL" > upload_url.txt

          echo "PUBLISH_ID:"
          echo "$PUBLISH_ID"

      # ============================================================
      # 16. UPLOAD VIDEO CHUNKS
      # ============================================================
      - name: Upload video chunks
        run: |
          echo "================================"
          echo "UPLOADING VIDEO CHUNKS"
          echo "================================"

          VIDEO_SIZE=$(cat video_size.txt)
          CHUNK_SIZE=$(cat chunk_size.txt)
          TOTAL_CHUNKS=$(cat total_chunks.txt)
          UPLOAD_URL=$(cat upload_url.txt)

          echo "VIDEO_SIZE=$VIDEO_SIZE"
          echo "CHUNK_SIZE=$CHUNK_SIZE"
          echo "TOTAL_CHUNKS=$TOTAL_CHUNKS"

          START=0

          for (( i=0; i<TOTAL_CHUNKS; i++ )); do

            START=$(( i * CHUNK_SIZE ))

            if [ "$i" -eq $(( TOTAL_CHUNKS - 1 )) ]; then
              END=$(( VIDEO_SIZE - 1 ))
            else
              END=$(( START + CHUNK_SIZE - 1 ))
            fi

            CURRENT_SIZE=$(( END - START + 1 ))

            echo "================================"
            echo "CHUNK $((i+1)) / $TOTAL_CHUNKS"
            echo "START=$START"
            echo "END=$END"
            echo "SIZE=$CURRENT_SIZE"
            echo "================================"

            dd \
              if=output/tiktok.mp4 \
              of="debug/chunk_${i}.bin" \
              bs=1 \
              skip="$START" \
              count="$CURRENT_SIZE" \
              status=none

            RESPONSE_FILE="debug/upload_${i}.response"

            HTTP_CODE=$(curl -s \
              -o "$RESPONSE_FILE" \
              -w "%{http_code}" \
              -X PUT \
              "$UPLOAD_URL" \
              -H "Content-Type: video/mp4" \
              -H "Content-Range: bytes ${START}-${END}/${VIDEO_SIZE}" \
              --data-binary "@debug/chunk_${i}.bin")

            echo "HTTP CODE: $HTTP_CODE"

            cat "$RESPONSE_FILE" || true

            if [ "$HTTP_CODE" != "200" ] &&
               [ "$HTTP_CODE" != "201" ] &&
               [ "$HTTP_CODE" != "206" ]; then

              echo "ERROR: CHUNK UPLOAD FAILED"
              exit 1
            fi

            rm -f "debug/chunk_${i}.bin"

          done

          echo "================================"
          echo "ALL CHUNKS UPLOADED"
          echo "================================"

      # ============================================================
      # 17. POLL TIKTOK PUBLISH STATUS
      # ============================================================
      - name: Check TikTok publish status
        run: |
          echo "================================"
          echo "CHECKING TIKTOK PUBLISH STATUS"
          echo "================================"

          ACCESS_TOKEN=$(cat access_token.txt)
          PUBLISH_ID=$(cat publish_id.txt)

          for i in {1..20}; do

            echo "--------------------------------"
            echo "STATUS CHECK $i / 20"
            echo "--------------------------------"

            STATUS_RESPONSE=$(curl -s -X POST \
              "https://open.tiktokapis.com/v2/post/publish/status/fetch/" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -d "$(jq -n \
                --arg publish_id "$PUBLISH_ID" \
                '{publish_id:$publish_id}')")

            echo "$STATUS_RESPONSE" > "debug/status_${i}.json"

            cat "debug/status_${i}.json"

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '
              .data.status // empty
            ')

            FAIL_REASON=$(echo "$STATUS_RESPONSE" | jq -r '
              .data.fail_reason // empty
            ')

            echo "STATUS=$STATUS"

            if [ -n "$FAIL_REASON" ]; then
              echo "FAIL_REASON=$FAIL_REASON"
            fi

            if [ "$STATUS" = "PUBLISH_COMPLETE" ]; then
              echo "================================"
              echo "TIKTOK PUBLISH COMPLETE"
              echo "================================"
              break
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "================================"
              echo "TIKTOK PUBLISH FAILED"
              echo "================================"
              exit 1
            fi

            sleep 15

          done

      # ============================================================
      # 18. SAVE DEBUG INFORMATION
      # ============================================================
      - name: Save debug information
        if: always()
        run: |
          echo "================================"
          echo "DEBUG FILES"
          echo "================================"

          find debug -maxdepth 1 -type f -printf "%f %s bytes\n" || true

          echo "================================"
          echo "CONTENT"
          echo "================================"

          cat content.txt || true

          echo "================================"
          echo "SUBTITLES"
          echo "================================"

          cat subtitles.srt || true

      # ============================================================
      # 19. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-short-${{ github.run_id }}
          path: |
            output/tiktok.mp4
            content.txt
            content.json
            subtitles.srt
            narration.mp3
            narration_15.m4a
            debug/
          retention-days: 7
