name: Generate TikTok Shorts

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            jq \
            curl

          python -m pip install --upgrade pip

          pip install \
            edge-tts \
            requests


      # ============================================================
      # 3. GENERATE CONTENT
      # ============================================================
      - name: Generate TikTok content
        run: |
          set -e

          mkdir -p media

          python <<'PY'
          import json
          import random
          import time
          import os

          random.seed(
              int(time.time())
              + int(os.environ.get("GITHUB_RUN_ID", "0"))
              + int(os.environ.get("GITHUB_RUN_ATTEMPT", "0"))
          )

          categories = [
              "2択クイズ",
              "3択クイズ",
              "心理ゲーム",
              "予想ゲーム",
              "視覚チャレンジ",
              "反射チャレンジ",
              "ミニ謎解き",
              "記憶チャレンジ",
              "直感チャレンジ",
              "コメント参加",
              "小さな挑戦",
              "夜メッセージ",
              "応援",
              "集中チャレンジ",
              "観察チャレンジ",
              "選択ゲーム",
              "タイミングゲーム",
              "予測チャレンジ",
              "数字ゲーム",
              "色ゲーム",
              "気分チェック",
              "10秒チャレンジ",
              "勇気チャレンジ",
              "リセット",
              "自分時間",
              "再スタート",
              "夜の安心",
              "朝チャレンジ",
              "一歩チャレンジ",
              "自己肯定"
          ]

          hooks = [
              "3秒で答えて",
              "直感で選んで",
              "考えすぎないで",
              "あなたならどっち？",
              "今の気分で選んで",
              "最初に思った方でOK",
              "コメントするならどっち？",
              "最後まで見て答えて",
              "これ意外と迷う",
              "あなたのタイプはどっち？",
              "10秒だけ挑戦",
              "今すぐできる",
              "一発で当ててみて",
              "答えを予想して",
              "あなたは分かる？",
              "これできたらすごい",
              "一瞬で選んで",
              "今日はこれだけ",
              "寝る前にやってみて",
              "朝一番にやってみて",
              "疲れてる人ほどやってみて",
              "今のあなたに当てはまる？",
              "最後に答えが出ます",
              "友達にも出してみて",
              "コメント欄で教えて",
              "どっちを選ぶ？",
              "あなたの直感を試します",
              "これは意外と難しい",
              "一緒にやってみよう",
              "今日の小さな挑戦"
          ]

          endings = [
              "コメントで教えてね",
              "あなたはどっちだった？",
              "当たったらすごい",
              "答えはコメント欄へ",
              "また明日挑戦してね",
              "できた人はすごい",
              "無理なら今日は休んでOK",
              "一歩できたら十分",
              "今日もお疲れさま",
              "明日はもっと気楽に",
              "自分のペースで大丈夫",
              "ここまで見たあなたはえらい",
              "焦らなくて大丈夫",
              "小さな一歩でOK",
              "また遊びに来てね",
              "保存して後でもう一回",
              "友達にも試してみて",
              "あなたの答えを残してね",
              "今日も無理しすぎないで",
              "明日も一緒にやろう"
          ]

          quiz_templates = [
              "AとB、今の直感ならどっち？",
              "1、2、3ならどれを選ぶ？",
              "一番最初に見えたものは？",
              "この中で一つだけ選ぶなら？",
              "今の気分に近いのはどれ？",
              "あなたならどれを選択する？",
              "一瞬で答えるならどれ？",
              "迷ったら最初の答えでOK",
              "あなたの予想は当たる？",
              "最後まで考えずに答えてみて"
          ]

          encouragement = [
              "今日は何もできなくても大丈夫。",
              "少し休むことも前に進むこと。",
              "全部完璧にしなくていい。",
              "今日を乗り越えた。それだけで十分。",
              "誰かと比べなくていい。",
              "自分のペースで進めばいい。",
              "疲れたら立ち止まっていい。",
              "明日の自分に任せてもいい。",
              "小さな一歩でも一歩。",
              "今は休む時間でもいい。",
              "頑張り続けなくても大丈夫。",
              "今日は自分を少しだけ大切に。",
              "うまくいかない日があってもいい。",
              "焦らなくて大丈夫。",
              "またやり直せばいい。",
              "ここまで来た自分を責めなくていい。",
              "何も決めない日があってもいい。",
              "少しだけ深呼吸してみよう。",
              "今できることだけで十分。",
              "明日は明日のペースでいい。"
          ]

          category = random.choice(categories)
          hook = random.choice(hooks)

          if category in [
              "夜メッセージ",
              "応援",
              "夜の安心",
              "自己肯定",
              "再スタート",
              "リセット",
              "自分時間"
          ]:
              message = random.choice(encouragement)

              text = f"{hook}。\n{message}\n{random.choice(endings)}"

          elif category in [
              "2択クイズ",
              "3択クイズ",
              "心理ゲーム",
              "予想ゲーム",
              "視覚チャレンジ",
              "反射チャレンジ",
              "ミニ謎解き",
              "記憶チャレンジ",
              "直感チャレンジ",
              "選択ゲーム",
              "タイミングゲーム",
              "予測チャレンジ",
              "数字ゲーム",
              "色ゲーム"
          ]:
              template = random.choice(quiz_templates)

              text = (
                  f"{hook}。\n"
                  f"{template}\n"
                  f"3秒だけ考えて。\n"
                  f"{random.choice(endings)}"
              )

          else:
              text = (
                  f"{hook}。\n"
                  f"今から10秒だけ、自分の感覚を試してみて。\n"
                  f"{random.choice(endings)}"
              )

          text = text.replace("。", "。\n")

          text = "\n".join(
              line.strip()
              for line in text.splitlines()
              if line.strip()
          )

          content = {
              "category": category,
              "text": text,
              "hook": hook
          }

          with open("content.json", "w", encoding="utf-8") as f:
              json.dump(
                  content,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("CONTENT GENERATED")
          print("================================")
          print(json.dumps(
              content,
              ensure_ascii=False,
              indent=2
          ))
          PY


      # ============================================================
      # 4. SEARCH PEXELS PORTRAIT VIDEO
      # ============================================================
      - name: Search Pexels portrait video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "SEARCHING PEXELS VIDEO"
          echo "================================"

          mkdir -p media

          if [ -z "${PEXELS_API_KEY:-}" ]; then
            echo "ERROR: PEXELS_API_KEY is empty."
            echo "Please check GitHub Secrets."
            exit 1
          fi

          echo "PEXELS_API_KEY detected."

          search_pexels() {
            local QUERY="$1"
            local OUTPUT="$2"

            echo ""
            echo "--------------------------------"
            echo "PEXELS SEARCH"
            echo "QUERY: ${QUERY}"
            echo "--------------------------------"

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 60 \
              -H "Authorization: ${PEXELS_API_KEY}" \
              -H "Accept: application/json" \
              --get \
              --data-urlencode "query=${QUERY}" \
              --data-urlencode "orientation=portrait" \
              --data-urlencode "size=medium" \
              --data-urlencode "per_page=20" \
              "https://api.pexels.com/videos/search" \
              -o "${OUTPUT}"
          }

          SEARCH_OK=0

          if search_pexels "people" "pexels.json"; then
            SEARCH_OK=1
          else
            echo "First Pexels search failed."
            echo "Trying fallback search..."
          fi

          if [ "$SEARCH_OK" -eq 0 ]; then
            if search_pexels "lifestyle" "pexels.json"; then
              SEARCH_OK=1
            else
              echo "Second Pexels search failed."
              echo "Trying nature fallback..."
            fi
          fi

          if [ "$SEARCH_OK" -eq 0 ]; then
            if search_pexels "nature" "pexels.json"; then
              SEARCH_OK=1
            else
              echo "All Pexels API requests failed."

              if [ -f pexels.json ]; then
                cat pexels.json || true
              fi

              exit 1
            fi
          fi

          if ! jq empty pexels.json >/dev/null 2>&1; then
            echo "ERROR: Pexels returned invalid JSON."
            cat pexels.json || true
            exit 1
          fi

          API_ERROR=$(jq -r '.error // empty' pexels.json)

          if [ -n "$API_ERROR" ]; then
            echo "PEXELS API ERROR"
            jq '.' pexels.json || cat pexels.json
            exit 1
          fi

          VIDEO_COUNT=$(jq -r '.videos | length' pexels.json 2>/dev/null || echo "0")

          echo "PEXELS VIDEO COUNT: ${VIDEO_COUNT}"

          if [ "$VIDEO_COUNT" = "0" ]; then
            echo "No videos were returned by Pexels."
            jq '.' pexels.json || cat pexels.json
            exit 1
          fi

          VIDEO_URL=$(jq -r '
            [
              .videos[]
              | .video_files[]
              | select(.link != null)
              | select(.width != null)
              | select(.height != null)
              | select(.height > .width)
              | {
                  link: .link,
                  width: .width,
                  height: .height
                }
            ]
            | sort_by(.width)
            | reverse
            | .[0].link // empty
          ' pexels.json)

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "Portrait video was not found."
            echo "Trying any available Pexels video."

            VIDEO_URL=$(jq -r '
              [
                .videos[]
                | .video_files[]
                | select(.link != null)
                | {
                    link: .link,
                    width: .width,
                    height: .height
                  }
              ]
              | sort_by(.width)
              | reverse
              | .[0].link // empty
            ' pexels.json)
          fi

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "ERROR: VIDEO URL NOT FOUND"
            jq '.' pexels.json || cat pexels.json
            exit 1
          fi

          echo "VIDEO URL FOUND."

          rm -f media/background.mp4

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 180 \
            "$VIDEO_URL" \
            -o media/background.mp4

          if [ ! -f media/background.mp4 ]; then
            echo "ERROR: background.mp4 was not created."
            exit 1
          fi

          VIDEO_FILE_SIZE=$(stat -c%s media/background.mp4)

          echo "DOWNLOADED VIDEO SIZE: ${VIDEO_FILE_SIZE} bytes"

          if [ "$VIDEO_FILE_SIZE" -le 10000 ]; then
            echo "ERROR: Downloaded video is too small."
            file media/background.mp4 || true
            exit 1
          fi

          if ! ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            media/background.mp4
          then
            echo "ERROR: Downloaded file is not a valid video."
            file media/background.mp4 || true
            exit 1
          fi

          echo "PEXELS VIDEO READY"
          ls -lh media/background.mp4


      # ============================================================
      # 5. GENERATE JAPANESE NARRATION
      # ============================================================
      - name: Generate narration
        run: |
          set -e

          TEXT=$(jq -r '.text' content.json)

          echo "================================"
          echo "GENERATING NARRATION"
          echo "================================"

          echo "$TEXT"

          edge-tts \
            --voice "ja-JP-NanamiNeural" \
            --rate "+10%" \
            --text "$TEXT" \
            --write-media media/narration.mp3

          test -s media/narration.mp3

          echo "Narration generated."

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            media/narration.mp3


      # ============================================================
      # 6. FIT NARRATION TO 15 SECONDS
      # ============================================================
      - name: Fit narration to 15 seconds
        run: |
          set -e

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of csv=p=0 \
            media/narration.mp3)

          echo "ORIGINAL AUDIO DURATION: ${DURATION}"

          SPEED=$(python - <<PY
          duration=float("${DURATION}")
          target=15.0

          if duration <= target:
              print("1.0")
          else:
              speed=duration/target

              if speed < 0.5:
                  speed=0.5

              if speed > 2.0:
                  speed=2.0

              print(f"{speed:.6f}")
          PY
          )

          echo "AUDIO SPEED: ${SPEED}"

          if [ "$SPEED" = "1.0" ]; then
            cp media/narration.mp3 media/narration_fit.mp3
          else
            ffmpeg -y \
              -i media/narration.mp3 \
              -filter:a "atempo=${SPEED}" \
              -c:a libmp3lame \
              -b:a 128k \
              media/narration_fit.mp3
          fi

          test -s media/narration_fit.mp3

          echo "FITTED AUDIO"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            media/narration_fit.mp3


      # ============================================================
      # 7. CREATE SUBTITLES
      # ============================================================
      - name: Create subtitles
        run: |
          set -e

          TEXT=$(jq -r '.text' content.json)

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of csv=p=0 \
            media/narration_fit.mp3)

          python <<PY
          import re

          text = """$TEXT"""
          duration = float("$DURATION")

          lines = [
              x.strip()
              for x in re.split(r"[\\n]+", text)
              if x.strip()
          ]

          if not lines:
              lines = [text.strip()]

          total_chars = sum(len(x) for x in lines)

          if total_chars <= 0:
              total_chars = 1

          current = 0.0

          def timestamp(sec):
              sec = max(0.0, sec)

              hours = int(sec // 3600)
              minutes = int((sec % 3600) // 60)
              seconds = int(sec % 60)
              millis = int(round((sec - int(sec)) * 1000))

              if millis >= 1000:
                  millis -= 1000
                  seconds += 1

              if seconds >= 60:
                  seconds -= 60
                  minutes += 1

              if minutes >= 60:
                  minutes -= 60
                  hours += 1

              return f"{hours:02d}:{minutes:02d}:{seconds:02d},{millis:03d}"

          with open(
              "media/subtitles.srt",
              "w",
              encoding="utf-8"
          ) as f:

              for i, line in enumerate(lines, 1):

                  weight = len(line) / total_chars

                  start = current
                  end = current + duration * weight

                  if i == len(lines):
                      end = duration

                  if end <= start:
                      end = start + 0.1

                  f.write(f"{i}\\n")
                  f.write(
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\\n"
                  )
                  f.write(f"{line}\\n\\n")

                  current = end

          print("SUBTITLES CREATED")

          print(
              open(
                  "media/subtitles.srt",
                  encoding="utf-8"
              ).read()
          )
          PY


      # ============================================================
      # 8. RENDER 15 SECOND VIDEO
      # ============================================================
      - name: Render 15 second TikTok video
        run: |
          set -e

          echo "================================"
          echo "RENDERING 15 SECOND VIDEO"
          echo "================================"

          ffmpeg -y \
            -stream_loop -1 \
            -i media/background.mp4 \
            -i media/narration_fit.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,subtitles=media/subtitles.srt:force_style='FontName=Noto Sans CJK JP,FontSize=20,PrimaryColour=&HFFFFFF&,OutlineColour=&H000000&,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=260'" \
            -t 15 \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            output.mp4

          test -s output.mp4

          echo "================================"
          echo "VIDEO CREATED"
          echo "================================"

          ls -lh output.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output.mp4


      # ============================================================
      # 9. GET TIKTOK ACCESS TOKEN
      # ============================================================
      - name: Get TikTok access token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUTH_CODE_TEMP: ${{ secrets.TIKTOK_AUTH_CODE_TEMP }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
        run: |
          set -e

          echo "================================"
          echo "GETTING TIKTOK ACCESS TOKEN"
          echo "================================"

          TOKEN_URL="https://open.tiktokapis.com/v2/oauth/token/"

          if [ -n "${TIKTOK_REFRESH_TOKEN:-}" ]; then

            echo "Using refresh token."

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              -X POST \
              "$TOKEN_URL" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=${TIKTOK_CLIENT_KEY}" \
              --data-urlencode "client_secret=${TIKTOK_CLIENT_SECRET}" \
              --data-urlencode "grant_type=refresh_token" \
              --data-urlencode "refresh_token=${TIKTOK_REFRESH_TOKEN}" \
              -o token.json

          elif [ -n "${TIKTOK_AUTH_CODE_TEMP:-}" ]; then

            echo "Using temporary authorization code."

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              -X POST \
              "$TOKEN_URL" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_key=${TIKTOK_CLIENT_KEY}" \
              --data-urlencode "client_secret=${TIKTOK_CLIENT_SECRET}" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "code=${TIKTOK_AUTH_CODE_TEMP}" \
              --data-urlencode "redirect_uri=${TIKTOK_REDIRECT_URI}" \
              -o token.json

          else
            echo "ERROR: No TikTok refresh token or temporary auth code."
            exit 1
          fi

          if ! jq empty token.json >/dev/null 2>&1; then
            echo "ERROR: TikTok token response is invalid JSON."
            cat token.json || true
            exit 1
          fi

          echo "TOKEN RESPONSE RECEIVED"

          ERROR_CODE=$(jq -r '.error // empty' token.json)

          if [ -n "$ERROR_CODE" ]; then
            echo "TikTok OAuth error:"
            jq '.' token.json
            exit 1
          fi

          ACCESS_TOKEN=$(jq -r '.access_token // empty' token.json)

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "ERROR: access_token not found."
            jq '.' token.json
            exit 1
          fi

          echo "TikTok access token obtained."

          echo "TIKTOK_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"


      # ============================================================
      # 10. CREATOR INFO
      # ============================================================
      - name: Get TikTok creator info
        env:
          ACCESS_TOKEN: ${{ env.TIKTOK_ACCESS_TOKEN }}
        run: |
          set -e

          echo "================================"
          echo "GETTING CREATOR INFO"
          echo "================================"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/creator_info/query/" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d '{}' \
            -o creator.json

          if ! jq empty creator.json >/dev/null 2>&1; then
            echo "ERROR: creator info response invalid."
            cat creator.json
            exit 1
          fi

          echo "CREATOR INFO RESPONSE"

          jq '.' creator.json


      # ============================================================
      # 11. PREPARE UPLOAD CHUNKS
      # ============================================================
      - name: Prepare TikTok upload chunks
        run: |
          set -e

          echo "================================"
          echo "PREPARING TIKTOK UPLOAD"
          echo "================================"

          VIDEO_SIZE=$(stat -c%s output.mp4)

          CHUNK_SIZE=5000000

          TOTAL_CHUNKS=$(( (VIDEO_SIZE + CHUNK_SIZE - 1) / CHUNK_SIZE ))

          echo "VIDEO_SIZE=${VIDEO_SIZE}"
          echo "CHUNK_SIZE=${CHUNK_SIZE}"
          echo "TOTAL_CHUNKS=${TOTAL_CHUNKS}"

          if [ "$TOTAL_CHUNKS" -lt 1 ]; then
            echo "ERROR: TOTAL_CHUNKS is invalid."
            exit 1
          fi

          rm -rf chunks
          mkdir -p chunks

          split \
            -b "${CHUNK_SIZE}" \
            -d \
            -a 4 \
            output.mp4 \
            chunks/part_

          echo "================================"
          echo "GENERATED CHUNKS"
          echo "================================"

          ls -lh chunks/

          ACTUAL_CHUNKS=$(
            find chunks \
              -maxdepth 1 \
              -type f \
              -name 'part_*' \
              | wc -l
          )

          echo "ACTUAL_CHUNKS=${ACTUAL_CHUNKS}"

          if [ "$ACTUAL_CHUNKS" -lt 1 ]; then
            echo "ERROR: No chunks were created."
            exit 1
          fi

          TOTAL_CHUNKS="$ACTUAL_CHUNKS"

          FIRST_CHUNK=$(
            find chunks \
              -maxdepth 1 \
              -type f \
              -name 'part_*' \
              | sort \
              | head -n 1
          )

          if [ -z "$FIRST_CHUNK" ]; then
            echo "ERROR: First chunk was not found."
            exit 1
          fi

          FIRST_CHUNK_SIZE=$(stat -c%s "$FIRST_CHUNK")

          echo "FIRST_CHUNK=${FIRST_CHUNK}"
          echo "FIRST_CHUNK_SIZE=${FIRST_CHUNK_SIZE}"
          echo "FINAL_TOTAL_CHUNKS=${TOTAL_CHUNKS}"

          echo "VIDEO_SIZE=${VIDEO_SIZE}" >> "$GITHUB_ENV"
          echo "CHUNK_SIZE=${CHUNK_SIZE}" >> "$GITHUB_ENV"
          echo "TOTAL_CHUNKS=${TOTAL_CHUNKS}" >> "$GITHUB_ENV"
          echo "FIRST_CHUNK=${FIRST_CHUNK}" >> "$GITHUB_ENV"
          echo "FIRST_CHUNK_SIZE=${FIRST_CHUNK_SIZE}" >> "$GITHUB_ENV"


      # ============================================================
      # 12. INITIALIZE TIKTOK DIRECT POST
      # ============================================================
      - name: Initialize TikTok Direct Post
        env:
          ACCESS_TOKEN: ${{ env.TIKTOK_ACCESS_TOKEN }}
        run: |
          set -e

          echo "================================"
          echo "INITIALIZING TIKTOK DIRECT POST"
          echo "================================"

          VIDEO_SIZE="${VIDEO_SIZE}"
          TOTAL_CHUNKS="${TOTAL_CHUNKS}"
          FIRST_CHUNK_SIZE="${FIRST_CHUNK_SIZE}"

          echo "VIDEO_SIZE=${VIDEO_SIZE}"
          echo "FIRST_CHUNK_SIZE=${FIRST_CHUNK_SIZE}"
          echo "TOTAL_CHUNKS=${TOTAL_CHUNKS}"

          python <<PY
          import json

          video_size = int("${VIDEO_SIZE}")
          total_chunks = int("${TOTAL_CHUNKS}")
          first_chunk_size = int("${FIRST_CHUNK_SIZE}")

          payload = {
              "post_info": {
                  "title": "毎日ショート",
                  "privacy_level": "SELF_ONLY",
                  "disable_duet": False,
                  "disable_comment": False,
                  "disable_stitch": False,
                  "is_aigc": True
              },
              "source_info": {
                  "source": "FILE_UPLOAD",
                  "video_size": video_size,
                  "chunk_size": first_chunk_size,
                  "total_chunk_count": total_chunks
              }
          }

          with open(
              "init_request.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            -X POST \
            "https://open.tiktokapis.com/v2/post/publish/video/init/" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            --data-binary @init_request.json \
            -o init_response.json

          cp init_response.json init.json

          echo "================================"
          echo "TIKTOK INIT RESPONSE"
          echo "================================"

          jq '.' init_response.json


      # ============================================================
      # 13. CHECK INIT ERROR
      # ============================================================
      - name: Check TikTok init response
        run: |
          set -e

          ERROR_CODE=$(jq -r '.error.code // empty' init_response.json)
          ERROR_MESSAGE=$(jq -r '.error.message // empty' init_response.json)

          if [ -n "$ERROR_CODE" ]; then
            echo "================================"
            echo "TIKTOK INIT ERROR"
            echo "================================"

            echo "CODE: ${ERROR_CODE}"
            echo "MESSAGE: ${ERROR_MESSAGE}"

            jq '.' init_response.json

            exit 1
          fi

          UPLOAD_URL=$(jq -r '.data.upload_url // empty' init_response.json)
          PUBLISH_ID=$(jq -r '.data.publish_id // empty' init_response.json)

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "ERROR: upload_url not found."
            jq '.' init_response.json
            exit 1
          fi

          if [ -z "$PUBLISH_ID" ] || [ "$PUBLISH_ID" = "null" ]; then
            echo "ERROR: publish_id not found."
            jq '.' init_response.json
            exit 1
          fi

          echo "UPLOAD_URL=${UPLOAD_URL}" >> "$GITHUB_ENV"
          echo "PUBLISH_ID=${PUBLISH_ID}" >> "$GITHUB_ENV"

          echo "TikTok Direct Post initialized."
          echo "Publish ID received."


      # ============================================================
      # 14. UPLOAD VIDEO CHUNKS
      # ============================================================
      - name: Upload video chunks to TikTok
        env:
          UPLOAD_URL: ${{ env.UPLOAD_URL }}
        run: |
          set -e

          echo "================================"
          echo "UPLOADING VIDEO TO TIKTOK"
          echo "================================"

          VIDEO_SIZE=$(stat -c%s output.mp4)

          OFFSET=0
          INDEX=0

          for FILE in $(find chunks -type f -name 'part_*' | sort); do

            CHUNK_FILE_SIZE=$(stat -c%s "$FILE")

            START="$OFFSET"
            END=$((OFFSET + CHUNK_FILE_SIZE - 1))

            echo ""
            echo "--------------------------------"
            echo "CHUNK ${INDEX}"
            echo "FILE: ${FILE}"
            echo "SIZE: ${CHUNK_FILE_SIZE}"
            echo "RANGE: ${START}-${END}"
            echo "TOTAL: ${VIDEO_SIZE}"
            echo "--------------------------------"

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              -X PUT \
              "${UPLOAD_URL}" \
              -H "Content-Type: video/mp4" \
              -H "Content-Length: ${CHUNK_FILE_SIZE}" \
              -H "Content-Range: bytes ${START}-${END}/${VIDEO_SIZE}" \
              --data-binary @"${FILE}"

            OFFSET=$((END + 1))
            INDEX=$((INDEX + 1))

          done

          if [ "$OFFSET" -ne "$VIDEO_SIZE" ]; then
            echo "ERROR: Uploaded byte count does not match video size."
            echo "OFFSET=${OFFSET}"
            echo "VIDEO_SIZE=${VIDEO_SIZE}"
            exit 1
          fi

          echo ""
          echo "================================"
          echo "TIKTOK VIDEO UPLOAD COMPLETE"
          echo "================================"


      # ============================================================
      # 15. CHECK PUBLISH STATUS
      # ============================================================
      - name: Check TikTok publish status
        env:
          ACCESS_TOKEN: ${{ env.TIKTOK_ACCESS_TOKEN }}
          PUBLISH_ID: ${{ env.PUBLISH_ID }}
        run: |
          set -e

          echo "================================"
          echo "CHECKING TIKTOK PUBLISH STATUS"
          echo "================================"

          for i in $(seq 1 12); do

            echo ""
            echo "STATUS CHECK ${i}/12"

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              -X POST \
              "https://open.tiktokapis.com/v2/post/publish/status/fetch/" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -d "{\"publish_id\":\"${PUBLISH_ID}\"}" \
              -o status.json

            jq '.' status.json

            STATUS=$(jq -r '.data.status // .status // empty' status.json)

            echo "STATUS=${STATUS}"

            case "$STATUS" in

              PUBLISH_COMPLETE)
                echo "================================"
                echo "TIKTOK PUBLISH COMPLETE"
                echo "================================"
                exit 0
                ;;

              FAILED)
                echo "================================"
                echo "TIKTOK PUBLISH FAILED"
                echo "================================"
                exit 1
                ;;

              *)
                echo "TikTok is still processing."
                sleep 10
                ;;

            esac

          done

          echo "================================"
          echo "PUBLISH STATUS TIMEOUT"
          echo "================================"

          exit 1


      # ============================================================
      # 16. SAVE CONTENT INFORMATION
      # ============================================================
      - name: Save final information
        if: always()
        run: |
          set +e

          echo "================================"
          echo "FINAL INFORMATION"
          echo "================================"

          echo ""
          echo "CONTENT:"

          if [ -f content.json ]; then
            jq '.' content.json
          fi

          echo ""
          echo "CREATOR:"

          if [ -f creator.json ]; then
            jq '.' creator.json
          fi

          echo ""
          echo "INIT:"

          if [ -f init_response.json ]; then
            jq '.' init_response.json
          fi

          echo ""
          echo "STATUS:"

          if [ -f status.json ]; then
            jq '.' status.json
          fi


      # ============================================================
      # 17. UPLOAD DEBUG ARTIFACTS
      # ============================================================
      - name: Upload TikTok artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-short-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            output.mp4
            content.json
            pexels.json
            creator.json
            token.json
            init.json
            init_request.json
            init_response.json
            status.json
            media/subtitles.srt
            media/narration.mp3
            media/narration_fit.mp3
