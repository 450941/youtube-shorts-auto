                  canvas = Image.new(
                      "RGB",
                      (1280, 720),
                      "white"
                  )

                  x = (
                      1280
                      - im.width
                  ) // 2

                  y = (
                      720
                      - im.height
                  ) // 2

                  canvas.paste(
                      im,
                      (x, y)
                  )

                  draw = ImageDraw.Draw(
                      canvas
                  )

                  font_candidates = [
                      "/usr/share/fonts/"
                      "opentype/noto/"
                      "NotoSansCJK-Bold.ttc",
                      "/usr/share/fonts/"
                      "opentype/noto/"
                      "NotoSansCJK-Regular.ttc"
                  ]

                  thumb_font = None

                  for fp in font_candidates:

                      if Path(fp).exists():

                          try:

                              thumb_font = (
                                  ImageFont.truetype(
                                      fp,
                                      52
                                  )
                              )

                              break

                          except Exception:
                              pass


                  if thumb_font is None:

                      thumb_font = (
                          ImageFont.load_default()
                      )


                  title_text = (
                      thumbnail_fact["title"]
                  )


                  if len(title_text) > 28:

                      title_text = (
                          title_text[:28]
                          + "…"
                      )


                  bbox = draw.textbbox(
                      (0, 0),
                      title_text,
                      font=thumb_font
                  )


                  tw = (
                      bbox[2]
                      - bbox[0]
                  )

                  th = (
                      bbox[3]
                      - bbox[1]
                  )


                  padding = 30


                  draw.rounded_rectangle(
                      (
                          640
                          - tw / 2
                          - padding,

                          570
                          - th / 2
                          - padding,

                          640
                          + tw / 2
                          + padding,

                          570
                          + th / 2
                          + padding
                      ),
                      radius=20,
                      fill=(0, 0, 0)
                  )


                  draw.text(
                      (
                          640
                          - tw / 2,

                          570
                          - th / 2
                      ),
                      title_text,
                      fill=(255, 255, 255),
                      font=thumb_font
                  )


                  canvas.save(
                      THUMBNAIL,
                      quality=95
                  )


              except Exception as e:

                  print(
                      "Thumbnail error:",
                      e
                  )


          # ============================================================
          # FALLBACK THUMBNAIL
          # ============================================================

          if not THUMBNAIL.exists():

              img = Image.new(
                  "RGB",
                  (1280, 720),
                  "white"
              )

              draw = ImageDraw.Draw(
                  img
              )

              font = ImageFont.load_default()

              draw.text(
                  (100, 300),
                  thumbnail_fact["title"],
                  fill="black",
                  font=font
              )

              img.save(
                  THUMBNAIL,
                  quality=95
              )


          # ============================================================
          # METADATA
          # ============================================================

          metadata = {
              "facts": selected_facts,
              "thumbnail_fact": thumbnail_fact,
              "duration_seconds": final_duration,
              "seed": SEED,
              "run_id": RUN_ID
          }


          with open(
              "output/metadata.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  metadata,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # FINAL INFO
          # ============================================================

          print()
          print("=" * 70)
          print("VIDEO GENERATION COMPLETE")
          print("=" * 70)

          print(
              "Output:",
              OUTPUT
          )

          print(
              "Duration:",
              final_duration,
              "seconds"
          )

          print(
              "Trivia count:",
              len(selected_facts)
          )

          print(
              "Thumbnail:",
              THUMBNAIL
          )

          print()
          print(
              "Selected trivia:"
          )

          for i, fact in enumerate(
              selected_facts,
              start=1
          ):

              print(
                  f"{i}. "
                  f"{fact['title']}"
              )

          print()
          print(
              "No duration stretching."
          )

          print(
              "Video ends after trivia #10."
          )

          PY

          python render_video.py


      # ============================================================
      # 7. Upload to YouTube
      # ============================================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |

          cat > upload_youtube.py <<'PY'

          import os
          import json
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          VIDEO = "output/final_video.mp4"

          THUMBNAIL = "output/thumbnail.jpg"


          SCOPES = [
              "https://www.googleapis.com/auth/youtube.upload"
          ]


          client_id = os.environ.get(
              "YOUTUBE_CLIENT_ID"
          )

          client_secret = os.environ.get(
              "YOUTUBE_CLIENT_SECRET"
          )

          refresh_token = os.environ.get(
              "YOUTUBE_REFRESH_TOKEN"
          )


          if not client_id:

              raise RuntimeError(
                  "YOUTUBE_CLIENT_ID is missing"
              )


          if not client_secret:

              raise RuntimeError(
                  "YOUTUBE_CLIENT_SECRET is missing"
              )


          if not refresh_token:

              raise RuntimeError(
                  "YOUTUBE_REFRESH_TOKEN is missing"
              )


          credentials = Credentials(
              None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=SCOPES
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          # ============================================================
          # Load metadata
          # ============================================================

          metadata_path = Path(
              "output/metadata.json"
          )


          if metadata_path.exists():

              with open(
                  metadata_path,
                  "r",
                  encoding="utf-8"
              ) as f:

                  metadata = json.load(f)

          else:

              metadata = {}


          thumbnail_fact = metadata.get(
              "thumbnail_fact",
              {}
          )


          title_base = thumbnail_fact.get(
              "title",
              "知ると面白い身近な雑学"
          )


          title = (
              f"{title_base} "
              f"知ると面白い身近な雑学10選"
          )


          title = title[:95]


          # ============================================================
          # DESCRIPTION
          # ============================================================

          description = """
          身近な「なぜ？」を集めた雑学動画です。

          心理、身体、食べ物、恋愛、日常など、
          普段の生活でふと気になる疑問を中心に紹介しています。

          気になった雑学があったらコメントで教えてください。

          #雑学
          #豆知識
          #心理学
          #日常
          #面白い雑学
          """


          body = {

              "snippet": {

                  "title": title,

                  "description": description,

                  "categoryId": "27",

                  "tags": [
                      "雑学",
                      "豆知識",
                      "面白い雑学",
                      "心理学",
                      "日常",
                      "身近な疑問",
                      "トリビア"
                  ]

              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False

              }

          }


          print(
              "Uploading:",
              title
          )


          media = MediaFileUpload(
              VIDEO,
              mimetype="video/mp4",
              resumable=True
          )


          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )


          response = None


          while response is None:

              status, response = (
                  request.next_chunk()
              )

              if status:

                  print(
                      "Upload progress:",
                      int(
                          status.progress()
                          * 100
                      ),
                      "%"
                  )


          video_id = response.get(
              "id"
          )


          print()
          print(
              "=" * 70
          )

          print(
              "YOUTUBE UPLOAD COMPLETE"
          )

          print(
              "Video ID:",
              video_id
          )

          print(
              "URL:",
              f"https://www.youtube.com/watch?v={video_id}"
          )

          print(
              "=" * 70
          )


          # ============================================================
          # Thumbnail
          # ============================================================

          if (
              video_id
              and
              Path(THUMBNAIL).exists()
          ):

              try:

                  youtube.thumbnails().set(
                      videoId=video_id,
                      media_body=MediaFileUpload(
                          THUMBNAIL,
                          mimetype="image/jpeg"
                      )
                  ).execute()

                  print(
                      "Thumbnail uploaded."
                  )

              except Exception as e:

                  print(
                      "Thumbnail upload failed:",
                      e
                  )


          # ============================================================
          # Save upload information
          # ============================================================

          upload_info = {

              "video_id": video_id,

              "url": (
                  "https://www.youtube.com/watch?v="
                  f"{video_id}"
              ),

              "title": title

          }


          with open(
              "output/upload_info.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  upload_info,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          PY

          python upload_youtube.py


