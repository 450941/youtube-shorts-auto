name: Generate 5-Minute Trivia Encouragement Video

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. Install system packages
      # ============================================================
      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-dejavu \
            jq \
            imagemagick

      # ============================================================
      # 4. Install Python packages
      # ============================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            pillow \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ============================================================
      # 5. Create working folders
      # ============================================================
      - name: Create media folders
        run: |
          rm -rf media
          mkdir -p media
          mkdir -p media/images
          mkdir -p media/audio
          mkdir -p media/scenes
          mkdir -p output

      # ============================================================
      # 6. Generate video
      # ============================================================
      - name: Generate video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |

          cat > render_video.py <<'PY'

          import os
          import re
          import sys
          import json
          import time
          import random
          import shutil
          import subprocess
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont


          # ============================================================
          # SETTINGS
          # ============================================================

          WIDTH = 1920
          HEIGHT = 1080

          FPS = 30

          MAX_FACTS = 10

          IMAGE_LIMIT = 20

          VOICE = "ja-JP-NanamiNeural"

          VOICE_RATE = "+8%"

          OUTPUT = Path("output/final_video.mp4")

          THUMBNAIL = Path("output/thumbnail.jpg")

          MEDIA = Path("media")

          IMAGE_DIR = MEDIA / "images"

          AUDIO_DIR = MEDIA / "audio"

          SCENE_DIR = MEDIA / "scenes"

          RUN_ID = os.environ.get("GITHUB_RUN_ID", "0")

          SEED = (
              int(time.time())
              + int(RUN_ID or "0")
              + os.getpid()
          )

          random.seed(SEED)


          # ============================================================
          # TRIVIA LIBRARY
          # ============================================================

          facts = [

              {
                  "category": "心理",
                  "title": "なぜ楽しい時間はあっという間に感じる？",
                  "body": "楽しい時間ほど、脳は目の前の出来事に集中します。すると時間そのものを意識する機会が減るため、あとから振り返ったときに短く感じやすくなります。逆に退屈な時間は時計を何度も確認するので、長く感じやすいんです。",
                  "keywords": ["楽しい", "笑う", "遊ぶ"]
              },

              {
                  "category": "心理",
                  "title": "なぜ寝る前になると急に昔のことを思い出す？",
                  "body": "昼間は仕事や学校など、たくさんの情報を処理しています。眠る前に静かになると外から入ってくる情報が減り、頭の中に残っていた記憶が浮かびやすくなります。だから布団に入った瞬間、昔の記憶が突然出てくることがあります。",
                  "keywords": ["寝る", "布団", "思い出"]
              },

              {
                  "category": "心理",
                  "title": "なぜ人は他人の目が気になる？",
                  "body": "人間は昔から集団の中で生きてきました。仲間から受け入れられることが生存に関係していたため、他人からどう見られているかを気にする仕組みが残っています。ただし実際には、自分が思うほど他人は自分を見ていないことも多いんです。",
                  "keywords": ["人", "見られる", "悩む"]
              },

              {
                  "category": "心理",
                  "title": "なぜスマホを見ると時間が消える？",
                  "body": "スマホには通知、動画、ニュース、ゲームなど、次々に新しい刺激が入ってきます。脳は新しい情報を見つけると注意を向けやすいため、もう少しだけと思っているうちに時間が過ぎてしまいます。",
                  "keywords": ["スマホ", "携帯電話", "動画"]
              },

              {
                  "category": "心理",
                  "title": "なぜ好きな曲は何回聴いても飽きにくい？",
