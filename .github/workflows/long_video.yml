              "segments.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = __import__(
                  "json"
              ).load(f)


          title = data["title"]

          description = data["description"]


          creds = Credentials(
              None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          creds.refresh(
              Request()
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=creds
          )


          body = {

              "snippet": {

                  "title": title,

                  "description": description,

                  "categoryId": "27",

                  "tags": [
                      "雑学",
                      "豆知識",
                      "激励",
                      "モチベーション",
                      "人生",
                      "5分",
                      "short trivia",
                      "knowledge"
                  ]

              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False

              }

          }


          media = MediaFileUpload(
              "trivia_video.mp4",
              chunksize=8 * 1024 * 1024,
              resumable=True
          )


          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )


          try:

              response = None

              while response is None:

                  status, response = (
                      request.next_chunk()
                  )

                  if status:

                      print(
                          "UPLOAD:",
                          int(
                              status.progress()
                              * 100
                          ),
                          "%"
                      )


              print(
                  "================================"
              )

              print(
                  "YOUTUBE UPLOAD SUCCESS"
              )

              print(
                  "VIDEO ID:",
                  response.get("id")
              )

              print(
                  "================================"
              )


          except HttpError as e:

              error_text = str(e)

              print(
                  "YOUTUBE UPLOAD ERROR:"
              )

              print(error_text)

              if (
                  "uploadLimitExceeded"
                  in error_text
              ):

                  print(
                      "YouTube upload limit reached."
                  )

                  print(
                      "The generated video is still saved "
                      "as a GitHub Actions artifact."
                  )

                  sys.exit(0)

              raise


          PY


          python upload_youtube.py
