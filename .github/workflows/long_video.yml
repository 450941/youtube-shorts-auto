          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError


          CLIENT_ID = os.environ.get(
              "YOUTUBE_CLIENT_ID"
          )

          CLIENT_SECRET = os.environ.get(
              "YOUTUBE_CLIENT_SECRET"
          )

          REFRESH_TOKEN = os.environ.get(
              "YOUTUBE_REFRESH_TOKEN"
          )


          # ========================================================
          # CHECK SECRETS
          # ========================================================

          if not all([
              CLIENT_ID,
              CLIENT_SECRET,
              REFRESH_TOKEN
          ]):

              print(
                  "YouTube secrets are missing."
              )

              sys.exit(0)


          # ========================================================
          # LOAD CONTENT
          # ========================================================

          with open(
              "segments.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          title = data["title"]

          description = data["description"]


          # ========================================================
          # AUTH
          # ========================================================

          creds = Credentials(
              None,
              refresh_token=REFRESH_TOKEN,
              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          creds.refresh(
              Request()
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=creds
          )


          # ========================================================
          # VIDEO BODY
          # ========================================================

          body = {

              "snippet": {

                  "title": title,

                  "description": description,

                  "categoryId": "27",

                  "tags": [
                      "雑学",
                      "豆知識",
                      "激励",
                      "モチベーション",
                      "人生",
                      "5分",
                      "知識",
                      "トリビア"
                  ]

              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False

              }

          }


          # ========================================================
          # VIDEO UPLOAD
          # ========================================================

          media = MediaFileUpload(
              "trivia_video.mp4",
              chunksize=8 * 1024 * 1024,
              resumable=True
          )


          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )


          try:

              response = None


              while response is None:

                  status, response = (
                      request.next_chunk()
                  )


                  if status:

                      print(
                          "UPLOAD:",
                          int(
                              status.progress()
                              * 100
                          ),
                          "%"
                      )


              video_id = response.get(
                  "id"
              )


              print(
                  "================================"
              )

              print(
                  "YOUTUBE UPLOAD SUCCESS"
              )

              print(
                  "VIDEO ID:",
                  video_id
              )

              print(
                  "================================"
              )


              # ====================================================
              # SET THUMBNAIL
              # ====================================================

              print(
                  "SETTING AUTOMATIC THUMBNAIL..."
              )


              thumbnail_media = MediaFileUpload(
                  "thumbnail.jpg",
                  mimetype="image/jpeg"
              )


              youtube.thumbnails().set(
                  videoId=video_id,
                  media_body=thumbnail_media
              ).execute()


              print(
                  "================================"
              )

              print(
                  "THUMBNAIL SET SUCCESS"
              )

              print(
                  "VIDEO ID:",
                  video_id
              )

              print(
                  "================================"
              )


          except HttpError as e:

              error_text = str(e)


              print(
                  "YOUTUBE ERROR:"
              )

              print(
                  error_text
              )


              if (
                  "uploadLimitExceeded"
                  in error_text
              ):

                  print(
                      "YouTube upload limit reached."
                  )

                  print(
                      "Video was generated successfully."
                  )

                  sys.exit(0)


              # ----------------------------------------------------
              # Thumbnail-only failure should not erase
              # successful video upload.
              # ----------------------------------------------------

              if (
                  "thumbnails.set"
                  in error_text
              ):

                  print(
                      "VIDEO UPLOAD SUCCEEDED,"
                  )

                  print(
                      "BUT THUMBNAIL SET FAILED."
                  )

                  sys.exit(0)


              raise


          PY


          python upload_youtube.py
