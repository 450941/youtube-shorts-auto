          python - <<'PY'

          import json
          import os
          import subprocess
          import requests
          import random
          import math
          from pathlib import Path


          TARGET = 25.0

          with open(
              "segments.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          scenes = data["scenes"]

          pexels_key = os.environ.get(
              "PEXELS_API_KEY",
              ""
          )


          # ========================================================
          # HELPERS
          # ========================================================

          def run(cmd):

              print("RUN:", " ".join(map(str, cmd)))

              subprocess.run(
                  cmd,
                  check=True
              )


          def duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return float(result.stdout.strip())


          def make_fallback(path):

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "lavfi",
                  "-i",
                  "color=c=0x101820:s=1280x720:r=30",
                  "-t",
                  str(TARGET),
                  "-pix_fmt",
                  "yuv420p",
                  "-an",
                  str(path)
              ])


          def download_pexels(query, output):

              if not pexels_key:
                  return False

              headers = {
                  "Authorization": pexels_key
              }

              params = {
                  "query": query,
                  "orientation": "landscape",
                  "size": "medium",
                  "per_page": 10
              }

              try:

                  response = requests.get(
                      "https://api.pexels.com/videos/search",
                      headers=headers,
                      params=params,
                      timeout=30
                  )

                  if response.status_code != 200:
                      print(
                          "Pexels error:",
                          response.status_code
                      )
                      return False

                  payload = response.json()

                  videos = payload.get(
                      "videos",
                      []
                  )

                  if not videos:
                      return False

                  random.shuffle(videos)

                  for video in videos:

                      files = video.get(
                          "video_files",
                          []
                      )

                      candidates = []

                      for item in files:

                          width = item.get(
                              "width",
                              0
                          )

                          height = item.get(
                              "height",
                              0
                          )

                          link = item.get(
                              "link"
                          )

                          if (
                              link
                              and width >= 720
                              and height >= 400
                          ):
                              candidates.append(
                                  (
                                      width * height,
                                      link
                                  )
                              )

                      if not candidates:
                          continue

                      candidates.sort(
                          reverse=True
                      )

                      link = candidates[0][1]

                      r = requests.get(
                          link,
                          timeout=60
                      )

                      if r.status_code != 200:
                          continue

                      with open(
                          output,
                          "wb"
                      ) as f:
                          f.write(r.content)

                      if output.stat().st_size > 50000:
                          return True

              except Exception as e:

                  print(
                      "Pexels exception:",
                      e
                  )

              return False


          def create_srt(text, output):

              # ----------------------------------------------------
              # Split text into readable chunks
              # ----------------------------------------------------

              clean = (
                  text
                  .replace("。", "。\n")
                  .replace("！", "！\n")
                  .replace("？", "？\n")
              )

              pieces = [
                  x.strip()
                  for x in clean.splitlines()
                  if x.strip()
              ]

              if not pieces:
                  pieces = [text]

              # Limit very small/large chunks

              final_pieces = []

              for piece in pieces:

                  if len(piece) <= 24:

                      final_pieces.append(piece)

                  else:

                      start = 0

                      while start < len(piece):

                          final_pieces.append(
                              piece[
                                  start:start + 24
                              ]
                          )

                          start += 24

              pieces = final_pieces

              total_chars = sum(
                  len(x)
                  for x in pieces
              )

              lines = []

              current = 0.0

              for i, piece in enumerate(pieces):

                  ratio = (
                      len(piece)
                      / max(total_chars, 1)
                  )

                  seg_duration = TARGET * ratio

                  start = current

                  end = min(
                      TARGET,
                      current + seg_duration
                  )

                  def ts(seconds):

                      ms = int(
                          round(
                              seconds * 1000
                          )
                      )

                      h = ms // 3600000
                      ms %= 3600000

                      m = ms // 60000
                      ms %= 60000

                      s = ms // 1000
                      ms %= 1000

                      return (
                          f"{h:02d}:"
                          f"{m:02d}:"
                          f"{s:02d},"
                          f"{ms:03d}"
                      )

                  lines.append(
                      f"{i + 1}\n"
                      f"{ts(start)} --> {ts(end)}\n"
                      f"{piece}\n"
                  )

                  current = end

              with open(
                  output,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("\n".join(lines))


          # ========================================================
          # RENDER EACH SCENE
          # ========================================================

          for scene in scenes:

              index = scene["index"]

              base = f"{index:02d}"

              audio_raw = Path(
                  f"audio/{base}_raw.mp3"
              )

              audio_fixed = Path(
                  f"audio/{base}.wav"
              )

              source_video = Path(
                  f"media/{base}_source.mp4"
              )

              fixed_video = Path(
                  f"media/{base}.mp4"
              )

              subtitle = Path(
                  f"subs/{base}.srt"
              )

              output = Path(
                  f"rendered/{base}.mp4"
              )


              # ====================================================
              # TTS
              # ====================================================

              script = scene["text"]

              print(
                  "================================"
              )

              print(
                  f"SCENE {index}"
              )

              print(script)

              print(
                  "================================"
              )

              run([
                  "edge-tts",
                  "--voice",
                  "ja-JP-NanamiNeural",
                  "--rate",
                  "+0%",
                  "--volume",
                  "+0%",
                  "--text",
                  script,
                  "--write-media",
                  str(audio_raw)
              ])


              # ====================================================
              # AUDIO DURATION
              # ====================================================

              raw_duration = duration(
                  audio_raw
              )

              print(
                  "RAW AUDIO:",
                  raw_duration
              )


              # ====================================================
              # FIT AUDIO TO 25 SEC
              # ====================================================

              if raw_duration > 25.0:

                  speed = raw_duration / TARGET

                  speed = max(
                      0.80,
                      min(
                          speed,
                          1.35
                      )
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(audio_raw),
                      "-filter:a",
                      f"atempo={speed:.5f}",
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(audio_fixed)
                  ])

                  fixed_duration = duration(
                      audio_fixed
                  )

                  if fixed_duration > TARGET:

                      speed2 = (
                          fixed_duration
                          / TARGET
                      )

                      speed2 = max(
                          0.80,
                          min(
                              speed2,
                              1.35
                          )
                      )

                      temp_audio = Path(
                          f"audio/{base}_temp.wav"
                      )

                      run([
                          "ffmpeg",
                          "-y",
                          "-i",
                          str(audio_fixed),
                          "-filter:a",
                          f"atempo={speed2:.5f}",
                          "-ar",
                          "48000",
                          "-ac",
                          "2",
                          str(temp_audio)
                      ])

                      temp_audio.replace(
                          audio_fixed
                      )

              else:

                  silence = (
                      TARGET - raw_duration
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(audio_raw),
                      "-f",
                      "lavfi",
                      "-t",
                      str(silence),
                      "-i",
                      "anullsrc=r=48000:cl=stereo",
                      "-filter_complex",
                      "[0:a][1:a]concat=n=2:v=0:a=1[out]",
                      "-map",
                      "[out]",
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(audio_fixed)
                  ])


              # ====================================================
              # SUBTITLE
              # ====================================================

              create_srt(
                  script,
                  subtitle
              )


              # ====================================================
              # VIDEO SEARCH
              # ====================================================

              print(
                  "VIDEO QUERY:",
                  scene["query"]
              )

              found = download_pexels(
                  scene["query"],
                  source_video
              )

              if not found:

                  print(
                      "Pexels video not found."
                  )

                  make_fallback(
                      source_video
                  )


              # ====================================================
              # VIDEO NORMALIZE
              # ====================================================

              normalized = Path(
                  f"media/{base}_normalized.mp4"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-stream_loop",
                  "-1",
                  "-i",
                  str(source_video),
                  "-t",
                  str(TARGET),
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=decrease,"
                  "pad=1280:720:(ow-iw)/2:(oh-ih)/2,"
                  "format=yuv420p",
                  "-r",
                  "30",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",
                  str(normalized)
              ])


              # ====================================================
              # BURN SUBTITLES + AUDIO
              # ====================================================

              subtitle_path = str(
                  subtitle.resolve()
              )

              subtitle_path = (
                  subtitle_path
                  .replace(
                      "\\",
                      "/"
                  )
                  .replace(
                      ":",
                      "\\:"
                  )
                  .replace(
                      "'",
                      "\\'"
                  )
              )

              vf = (
                  f"subtitles='{subtitle_path}'"
                  ":force_style="
                  "'FontName=Noto Sans CJK JP,"
                  "FontSize=24,"
                  "PrimaryColour=&H00FFFFFF,"
                  "OutlineColour=&H00000000,"
                  "BorderStyle=3,"
                  "Outline=2,"
                  "Shadow=1,"
                  "Alignment=2,"
                  "MarginV=45'"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(normalized),
                  "-i",
                  str(audio_fixed),
                  "-t",
                  str(TARGET),
                  "-vf",
                  vf,
                  "-map",
                  "0:v:0",
                  "-map",
                  "1:a:0",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",
                  "-ar",
                  "48000",
                  "-ac",
                  "2",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(output)
              ])


              # ====================================================
              # CHECK
              # ====================================================

              d = duration(
                  output
              )

              print(
                  f"SCENE {index} FINAL:",
                  d
              )


          print(
              "ALL 12 SCENES RENDERED"
          )

          PY


