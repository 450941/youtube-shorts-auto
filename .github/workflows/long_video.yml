name: Generate Long Trivia Video

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. GitHubリポジトリ取得
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. 必要なソフトをインストール
      # ==========================================
      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            jq \
            bc


      # ==========================================
      # 3. Pythonパッケージ
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib


      # ==========================================
      # 4. 雑学データ生成
      # ==========================================
      - name: Generate trivia.json
        run: |

          if [ ! -f generate_trivia.py ]; then
            echo "ERROR: generate_trivia.py がありません"
            exit 1
          fi

          echo "==================================="
          echo "雑学データ生成開始"
          echo "==================================="

          python generate_trivia.py

          if [ ! -f trivia.json ]; then
            echo "ERROR: trivia.json の生成に失敗しました"
            exit 1
          fi


      # ==========================================
      # 5. 雑学データ確認
      # ==========================================
      - name: Check trivia.json
        run: |

          COUNT=$(jq length trivia.json)

          echo "==================================="
          echo "雑学データ数: ${COUNT}"
          echo "==================================="

          if [ "$COUNT" -lt 100 ]; then
            echo "ERROR: 雑学データが100個未満です"
            exit 1
          fi


      # ==========================================
      # 6. 今回使う雑学をランダム選択
      # ==========================================
      - name: Select trivia
        run: |

          python - <<'PY'

          import json
          import random

          with open(
              "trivia.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          amount = min(
              120,
              len(data)
          )

          selected = random.sample(
              data,
              amount
          )

          with open(
              "selected_trivia.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  selected,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "今回使用する雑学:",
              len(selected)
          )

          PY


      # ==========================================
      # 7. フォルダ作成
      # ==========================================
      - name: Prepare folders
        run: |

          mkdir -p audio
          mkdir -p clips
          mkdir -p segments


      # ==========================================
      # 8. 各雑学ごとに
      #    ナレーション + 関連動画を取得
      # ==========================================
      - name: Generate narration and matching videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          python - <<'PY'

          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          import time


          # --------------------------------------
          # データ読み込み
          # --------------------------------------

          with open(
              "selected_trivia.json",
              "r",
              encoding="utf-8"
          ) as f:

              items = json.load(f)


          pexels_key = os.environ["PEXELS_API_KEY"]


          # --------------------------------------
          # 日本語テーマ → Pexels検索語
          # --------------------------------------

          keyword_map = {

              "猫": "cat",
              "犬": "dog",
              "イルカ": "dolphin",
              "クジラ": "whale",
              "ペンギン": "penguin",
              "カラス": "crow",
              "タコ": "octopus",
              "カメ": "turtle",
              "ゾウ": "elephant",
              "キリン": "giraffe",
              "ライオン": "lion",
              "チーター": "cheetah",
              "フクロウ": "owl",
              "コウモリ": "bat",
              "アリ": "ant",
              "ハチ": "bee",

              "太陽": "sun",
              "月": "moon",
              "地球": "earth",
              "火星": "mars",
              "木星": "jupiter",
              "土星": "saturn",
              "金星": "venus",
              "水星": "mercury",
              "星": "stars",
              "銀河": "galaxy",
              "ブラックホール": "black hole",
              "宇宙": "space",

              "脳": "human brain",
              "心臓": "human heart",
              "血液": "blood",
              "筋肉": "muscle",
              "骨": "human bones",
              "皮膚": "human skin",
              "目": "human eye",
              "耳": "human ear",
              "鼻": "human nose",
              "睡眠": "sleep",

              "チョコレート": "chocolate",
              "コーヒー": "coffee",
              "お米": "rice",
              "パン": "bread",
              "卵": "egg",
              "バナナ": "banana",
              "りんご": "apple",
              "トマト": "tomato",
              "じゃがいも": "potato",
              "カレー": "curry",
              "寿司": "sushi",
              "ラーメン": "ramen",
              "牛乳": "milk",
              "蜂蜜": "honey",

              "スマートフォン": "smartphone",
              "テレビ": "television",
              "冷蔵庫": "refrigerator",
              "電子レンジ": "microwave",
              "エレベーター": "elevator",
              "信号機": "traffic lights",
              "傘": "umbrella",
              "鉛筆": "pencil",
              "鏡": "mirror",
              "時計": "clock",
              "鍵": "key",

              "東京": "Tokyo Japan",
              "富士山": "Mount Fuji Japan",
              "新幹線": "Shinkansen train Japan",
              "コンビニ": "Japanese convenience store",
              "温泉": "Japanese hot spring",
              "桜": "cherry blossoms Japan",
              "神社": "Japanese shrine",
              "お寺": "Japanese temple",

              "海": "ocean",
              "山": "mountain",
              "川": "river",
              "雨": "rain",
              "雪": "snow",
              "雷": "lightning",
              "雲": "clouds",
              "虹": "rainbow",
              "風": "wind",
              "植物": "plants",
              "森林": "forest",
              "火山": "volcano"
          }


          # --------------------------------------
          # コマンド実行
          # --------------------------------------

          def run(cmd):

              subprocess.run(
                  cmd,
                  check=True
              )


          # --------------------------------------
          # 各雑学を処理
          # --------------------------------------

          for index, item in enumerate(items):

              fact = item.get(
                  "fact",
                  ""
              ).strip()

              if not fact:
                  continue


              topic = item.get(
                  "topic",
                  ""
              )


              query = keyword_map.get(
                  topic,
                  "science technology"
              )


              print("")
              print("===================================")
              print("雑学:", index + 1)
              print("テーマ:", topic)
              print("検索:", query)
              print("内容:", fact)
              print("===================================")


              # ----------------------------------
              # ナレーション
              # ----------------------------------

              audio_path = (
                  f"audio/audio_{index:03d}.mp3"
              )


              run([
                  "edge-tts",
                  "--voice",
                  "ja-JP-NanamiNeural",
                  "--rate=-10%",
                  "--text",
                  fact,
                  "--write-media",
                  audio_path
              ])


              # ----------------------------------
              # 音声時間
              # ----------------------------------

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      audio_path
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )


              duration = float(
                  result.stdout.strip()
              )


              # ----------------------------------
              # Pexels検索
              # ----------------------------------

              params = urllib.parse.urlencode({

                  "query": query,

                  "per_page": 10,

                  "orientation": "landscape"

              })


              url = (
                  "https://api.pexels.com/videos/search?"
                  + params
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": pexels_key
                  }
              )


              video_url = None


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )


                  for video in data.get(
                      "videos",
                      []
                  ):

                      files = video.get(
                          "video_files",
                          []
                      )


                      files = sorted(
                          files,
                          key=lambda x:
                              x.get("width", 0)
                              * x.get("height", 0),
                          reverse=True
                      )


                      for vf in files:

                          link = vf.get(
                              "link"
                          )

                          width = vf.get(
                              "width",
                              0
                          )


                          if (
                              link
                              and width >= 1280
                          ):

                              video_url = link

                              break


                      if video_url:
                          break


              except Exception as e:

                  print(
                      "Pexels検索エラー:",
                      e
                  )


              # ----------------------------------
              # 動画ダウンロード
              # ----------------------------------

              clip_path = (
                  f"clips/clip_{index:03d}.mp4"
              )


              if video_url:

                  try:

                      urllib.request.urlretrieve(
                          video_url,
                          clip_path
                      )

                  except Exception as e:

                      print(
                          "動画取得失敗:",
                          e
                      )

                      video_url = None


              # ----------------------------------
              # 見つからなかった場合
              # ----------------------------------

              if not video_url:

                  print(
                      "関連映像なし → 黒背景を使用"
                  )


                  run([
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      "color=c=black:s=1920x1080:r=30",
                      "-t",
                      str(
                          max(
                              duration,
                              3
                          )
                      ),
                      "-c:v",
                      "libx264",
                      "-pix_fmt",
                      "yuv420p",
                      clip_path
                  ])


              # ----------------------------------
              # 映像 + 音声を1セグメント化
              # ----------------------------------

              segment_path = (
                  f"segments/"
                  f"segment_{index:03d}.mp4"
              )


              run([
                  "ffmpeg",
                  "-y",

                  "-stream_loop",
                  "-1",

                  "-i",
                  clip_path,

                  "-i",
                  audio_path,

                  "-t",
                  str(duration),

                  "-vf",
                  "scale=1920:1080:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1920:1080",

                  "-map",
                  "0:v:0",

                  "-map",
                  "1:a:0",

                  "-c:v",
                  "libx264",

                  "-preset",
                  "veryfast",

                  "-crf",
                  "23",

                  "-c:a",
                  "aac",

                  "-b:a",
                  "192k",

                  "-pix_fmt",
                  "yuv420p",

                  "-shortest",

                  segment_path
              ])


              time.sleep(
                  0.3
              )


          print("")
          print("===================================")
          print("全セグメント生成完了")
          print("===================================")

          PY


      # ==========================================
      # 9. 動画結合リスト
      # ==========================================
      - name: Create concat list
        run: |

          rm -f concat.txt

          for file in segments/*.mp4
          do

            if [ -f "$file" ]; then

              echo "file '$PWD/$file'" \
                >> concat.txt

            fi

          done

          cat concat.txt


      # ==========================================
      # 10. 全動画を結合
      # ==========================================
      - name: Concatenate video
        run: |

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            long_video_no_subtitles.mp4


      # ==========================================
      # 11. 字幕作成
      # ==========================================
      - name: Create subtitles
        run: |

          python - <<'PY'

          import json
          import subprocess
          import re
          import os


          with open(
              "selected_trivia.json",
              "r",
              encoding="utf-8"
          ) as f:

              items = json.load(f)


          def duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      path
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return float(
                  result.stdout.strip()
              )


          def timestamp(sec):

              ms = int(
                  sec * 1000
              )

              h = ms // 3600000

              ms %= 3600000

              m = ms // 60000

              ms %= 60000

              s = ms // 1000

              ms %= 1000

              return (
                  f"{h:02d}:"
                  f"{m:02d}:"
                  f"{s:02d},"
                  f"{ms:03d}"
              )


          current = 0.0

          subtitle_index = 1


          with open(
              "subtitles.srt",
              "w",
              encoding="utf-8"
          ) as f:


              for i, item in enumerate(
                  items
              ):


                  audio_path = (
                      f"audio/audio_{i:03d}.mp3"
                  )


                  if not os.path.exists(
                      audio_path
                  ):
                      continue


                  text = item.get(
                      "fact",
                      ""
                  ).strip()


                  if not text:
                      continue


                  dur = duration(
                      audio_path
                  )


                  # 文章を自然な区切りで分割
                  chunks = re.findall(
                      r".{1,24}(?:。|、|！|？|$)",
                      text
                  )


                  chunks = [
                      x.strip()
                      for x in chunks
                      if x.strip()
                  ]


                  if not chunks:

                      chunks = [
                          text
                      ]


                  total_chars = sum(
                      len(x)
                      for x in chunks
                  )


                  local = current


                  for chunk in chunks:


                      chunk_dur = (
                          dur
                          * len(chunk)
                          / total_chars
                      )


                      start = local

                      end = (
                          local
                          + chunk_dur
                      )


                      f.write(
                          f"{subtitle_index}\n"
                          f"{timestamp(start)} --> "
                          f"{timestamp(end)}\n"
                          f"{chunk}\n\n"
                      )


                      subtitle_index += 1

                      local = end


                  current += dur


          print(
              "字幕作成完了:",
              subtitle_index - 1,
              "個"
          )

          PY


      # ==========================================
      # 12. 字幕を動画に焼き込み
      # ==========================================
      - name: Render subtitles
        run: |

          ffmpeg \
            -y \
            -i long_video_no_subtitles.mp4 \
            -vf "subtitles=subtitles.srt:force_style='FontName=Noto Sans CJK JP,FontSize=30,PrimaryColour=&HFFFFFF&,OutlineColour=&H000000&,Outline=3,Shadow=1,Alignment=2,MarginV=70'" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -pix_fmt yuv420p \
            long_video.mp4


      # ==========================================
      # 13. 完成動画確認
      # ==========================================
      - name: Check final video
        run: |

          echo "==================================="
          echo "完成動画"
          echo "==================================="

          ls -lh long_video.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries format=size \
            -of default=noprint_wrappers=1 \
            long_video.mp4


      # ==========================================
      # 14. YouTubeアップロード
      # ==========================================
      - name: Upload to YouTube
        env:

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}

          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |

          cat > upload_youtube.py <<'PY'

          import os
          import random

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload


          credentials = Credentials(

              None,

              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],

              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),

              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],

              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],

              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          titles = [

              "知らないと損する意外な雑学",

              "知った瞬間誰かに話したくなる雑学",

              "実は知られていない身近な雑学",

              "最後まで見ると世界の見え方が変わる雑学",

              "思わず続きを見たくなる雑学集",

              "意外すぎる身近な事実",

              "知っているようで知らない雑学",

              "あなたはいくつ知ってる？"

          ]


          body = {

              "snippet": {

                  "title": random.choice(
                      titles
                  ),

                  "description": (
                      "身近なのに意外と知らない雑学をまとめました。"
                      "\n\n"
                      "知っているようで知らない、"
                      "思わず誰かに話したくなる雑学を"
                      "テンポよく紹介しています。"
                      "\n\n"
                      "#雑学 #豆知識 #トリビア"
                  ),

                  "categoryId": "27"
              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False

              }
          }


          media = MediaFileUpload(

              "long_video.mp4",

              chunksize=-1,

              resumable=True,

              mimetype="video/mp4"

          )


          request = youtube.videos().insert(

              part="snippet,status",

              body=body,

              media_body=media

          )


          response = request.execute()


          print(
              "YouTube upload complete:",
              response["id"]
          )

          PY


          python upload_youtube.py


      # ==========================================
      # 15. 完成ファイル保存
      # ==========================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4

        with:

          name: long-video

          path: |

            long_video.mp4

            subtitles.srt

            selected_trivia.json

            trivia.json
