          # の順番で試す。
          # ============================================================

          def extract_official_images(page_url):

              found = []

              try:

                  response = session.get(
                      page_url,
                      timeout=20
                  )

                  if response.status_code != 200:
                      return found

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

                  for img in soup.find_all("img"):

                      candidates = [
                          img.get("src"),
                          img.get("data-src"),
                          img.get("data-lazy-src"),
                          img.get("data-original")
                      ]

                      for src in candidates:

                          if not src:
                              continue

                          src = urljoin(
                              page_url,
                              src
                          )

                          if (
                              "blogger.googleusercontent.com"
                              not in src
                              and
                              "bp.blogspot.com"
                              not in src
                          ):
                              continue

                          if src not in found:

                              found.append(src)

                          break

              except Exception as e:

                  print(
                      "Official page error:",
                      e
                  )

              return found


          def search_irasutoya(keyword, limit=3):

              print(
                  f"Searching Irasutoya: "
                  f"{keyword}"
              )

              results = []

              # --------------------------------------------------------
              # Method 1
              # Official Irasutoya search
              # --------------------------------------------------------

              try:

                  search_url = (
                      "https://www.irasutoya.com/"
                      "search?q="
                      + quote_plus(keyword)
                  )

                  print(
                      "Official search:",
                      search_url
                  )

                  response = session.get(
                      search_url,
                      timeout=20
                  )

                  print(
                      "Official search status:",
                      response.status_code
                  )

                  if response.status_code == 200:

                      soup = BeautifulSoup(
                          response.text,
                          "html.parser"
                      )

                      for a in soup.find_all(
                          "a",
                          href=True
                      ):

                          href = a.get("href")

                          if not href:
                              continue

                          href = urljoin(
                              search_url,
                              href
                          )

                          if (
                              "irasutoya.com"
                              not in href
                          ):
                              continue

                          if "/search" in href:
                              continue

                          if href.endswith(
                              ".html"
                          ):

                              images = (
                                  extract_official_images(
                                      href
                                  )
                              )

                              for image in images:

                                  if image not in results:

                                      results.append(
                                          image
                                      )

                                  if (
                                      len(results)
                                      >= limit
                                  ):
                                      break

                          if (
                              len(results)
                              >= limit
                          ):
                              break

              except Exception as e:

                  print(
                      "Official search error:",
                      e
                  )


              # --------------------------------------------------------
              # Method 2
              # Google fallback
              # --------------------------------------------------------

              if len(results) < limit:

                  queries = [
                      f"site:irasutoya.com {keyword}",
                      f"site:irasutoya.com {keyword} いらすとや"
                  ]

                  for query in queries:

                      if len(results) >= limit:
                          break

                      try:

                          google_url = (
                              "https://www.google.com/search"
                          )

                          response = session.get(
                              google_url,
                              params={
                                  "q": query,
                                  "num": 10
                              },
                              timeout=20
                          )

                          if (
                              response.status_code
                              != 200
                          ):
                              continue

                          soup = BeautifulSoup(
                              response.text,
                              "html.parser"
                          )

                          for a in soup.find_all(
                              "a",
                              href=True
                          ):

                              href = a.get(
                                  "href"
                              )

                              if not href:
                                  continue

                              if (
                                  "irasutoya.com"
                                  not in href
                              ):
                                  continue

                              if "/search" in href:
                                  continue

                              if not href.startswith(
                                  "http"
                              ):
                                  continue

                              images = (
                                  extract_official_images(
                                      href
                                  )
                              )

                              for image in images:

                                  if image not in results:

                                      results.append(
                                          image
                                      )

                                  if (
                                      len(results)
                                      >= limit
                                  ):
                                      break

                              if (
                                  len(results)
                                  >= limit
                              ):
                                  break

                      except Exception as e:

                          print(
                              "Google search error:",
                              e
                          )


              print(
                  "Found official images:",
                  len(results)
              )

              return results[:limit]


          # ============================================================
          # DOWNLOAD IMAGE
          # ============================================================

          def download_image(
              url,
              output_path
          ):

              try:

                  response = session.get(
                      url,
                      timeout=30
                  )

                  if (
                      response.status_code
                      != 200
                  ):
                      return False

                  content = response.content

                  if len(content) < 1000:
                      return False

                  with open(
                      output_path,
                      "wb"
                  ) as f:

                      f.write(content)

                  try:

                      with Image.open(
                          output_path
                      ) as im:

                          im.verify()

                  except Exception:

                      output_path.unlink(
                          missing_ok=True
                      )

                      return False

                  return True

              except Exception as e:

                  print(
                      "Download error:",
                      e
                  )

                  output_path.unlink(
                      missing_ok=True
                  )

                  return False


