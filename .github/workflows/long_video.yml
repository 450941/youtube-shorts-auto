name: Generate 5-Minute Trivia Encouragement Video

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. System packages
      # ============================================================
      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-dejavu \
            jq \
            imagemagick \
            curl

      # ============================================================
      # 4. Python packages
      # ============================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            pillow \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ============================================================
      # 5. Create folders
      # ============================================================
      - name: Create media folders
        run: |
          rm -rf media
          mkdir -p media/images
          mkdir -p media/audio
          mkdir -p media/scenes
          mkdir -p media/bgm
          mkdir -p output

      # ============================================================
      # 6. Download BGM
      # ============================================================
      - name: Download BGM
        run: |
          echo "Downloading BGM..."

          curl -L \
            --fail \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/John_Bartmann_-_09_-_Happy_Clappy.ogg" \
            -o media/bgm/trivia_bgm.ogg

          test -s media/bgm/trivia_bgm.ogg

          ffprobe \
            -v error \
            media/bgm/trivia_bgm.ogg

          ls -lh media/bgm/trivia_bgm.ogg

      # ============================================================
      # 7. Generate video
      # ============================================================
      - name: Generate video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}

        run: |

          cat > render_video.py <<'PY'

          import os
          import re
          import sys
          import json
          import time
          import random
          import shutil
          import subprocess
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont


          # ============================================================
          # SETTINGS
          # ============================================================

          WIDTH = 1920
          HEIGHT = 1080
          FPS = 30

          MAX_FACTS = 10

          # いらすとやの利用点数を考慮
          # サムネイル込み20点以内
          IMAGE_LIMIT = 19

          # 1雑学につき最大2種類
          IMAGES_PER_FACT = 2

          VOICE = "ja-JP-NanamiNeural"
          VOICE_RATE = "+8%"

          # BGM音量
          # 0.03 = かなり小さい
          # 0.05 = 小さめ
          # 0.08 = 標準
          # 0.12 = やや強め
          BGM_VOLUME = 0.055

          OUTPUT = Path(
              "output/final_video.mp4"
          )

          THUMBNAIL = Path(
              "output/thumbnail.jpg"
          )

          MEDIA = Path("media")
          IMAGE_DIR = MEDIA / "images"
          AUDIO_DIR = MEDIA / "audio"
          SCENE_DIR = MEDIA / "scenes"
          BGM_FILE = MEDIA / "bgm" / "trivia_bgm.ogg"

          RUN_ID = os.environ.get(
              "GITHUB_RUN_ID",
              "0"
          )

          SEED = (
              int(time.time())
              + int(RUN_ID or "0")
              + os.getpid()
          )

          random.seed(SEED)


          # ============================================================
          # TRIVIA
          # ============================================================

          facts = [

              {
                  "category": "心理",
                  "title": "なぜ楽しい時間はあっという間に感じる？",
                  "body": "楽しい時間ほど、脳は目の前の出来事に集中します。すると時間そのものを意識する機会が減るため、あとから振り返ったときに短く感じやすくなります。逆に退屈な時間は時計を何度も確認するので、長く感じやすいんです。",
                  "keywords": ["楽しい", "笑う", "遊ぶ"]
              },

              {
                  "category": "心理",
                  "title": "なぜ寝る前になると急に昔のことを思い出す？",
                  "body": "昼間は仕事や学校など、たくさんの情報を処理しています。眠る前に静かになると外から入ってくる情報が減り、頭の中に残っていた記憶が浮かびやすくなります。だから布団に入った瞬間、昔の記憶が突然出てくることがあります。",
