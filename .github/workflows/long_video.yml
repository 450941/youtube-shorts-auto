          # ============================================================
          # TEXT SPLITTING
          # ============================================================

          def split_text(text):

              text = text.strip()

              if len(text) <= 18:

                  return [text]

              punctuation = "。！？"

              pieces = []

              current = ""

              for char in text:

                  current += char

                  if (
                      char in punctuation
                      and len(current) >= 8
                  ):

                      pieces.append(
                          current.strip()
                      )

                      current = ""

              if current.strip():

                  pieces.append(
                      current.strip()
                  )

              result = []

              for piece in pieces:

                  while len(piece) > 22:

                      cut = 20

                      result.append(
                          piece[:cut]
                      )

                      piece = piece[cut:]

                  if piece:

                      result.append(
                          piece
                      )

              return result


          # ============================================================
          # SRT TIMESTAMP
          # ============================================================

          def srt_timestamp(seconds):

              seconds = max(
                  0,
                  seconds
              )

              milliseconds = int(
                  round(
                      (
                          seconds
                          - int(seconds)
                      ) * 1000
                  )
              )

              total = int(seconds)

              sec = total % 60

              minute = (
                  total // 60
              ) % 60

              hour = total // 3600

              if milliseconds >= 1000:

                  milliseconds = 0

                  sec += 1

              return (
                  f"{hour:02d}:"
                  f"{minute:02d}:"
                  f"{sec:02d},"
                  f"{milliseconds:03d}"
              )


          # ============================================================
          # CREATE SRT
          # ============================================================

          def create_srt(
              lines,
              audio_duration,
              output_path
          ):

              if not lines:

                  lines = [""]

              total_chars = sum(
                  max(
                      1,
                      len(line)
                  )
                  for line in lines
              )

              current = 0.0

              entries = []

              for i, line in enumerate(
                  lines
              ):

                  weight = max(
                      1,
                      len(line)
                  )

                  segment_duration = (
                      audio_duration
                      * weight
                      / total_chars
                  )

                  start = current

                  end = (
                      current
                      + segment_duration
                  )

                  if (
                      i
                      == len(lines) - 1
                  ):

                      end = audio_duration

                  entries.append(
                      (
                          i + 1,
                          start,
                          end,
                          line
                      )
                  )

                  current = end

              with open(
                  output_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for (
                      number,
                      start,
                      end,
                      line
                  ) in entries:

                      f.write(
                          f"{number}\n"
                      )

                      f.write(
                          f"{srt_timestamp(start)} "
                          f"--> "
                          f"{srt_timestamp(end)}\n"
                      )

                      f.write(
                          line
                      )

                      f.write(
                          "\n\n"
                      )


