          encouragements = [
              "もし今日うまくいかなかったとしても、それだけであなたの価値が決まるわけではありません。明日はまた別の日です。",
              "頑張っているのに結果が出ない日もあります。でも、見えないところで積み重なっているものまで消えるわけではありません。",
