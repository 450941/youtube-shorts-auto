name: Generate 5-Minute Trivia Encouragement Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================
      # 1. CHECKOUT
      # =========================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================
      # 2. INSTALL
      # =========================================

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            jq

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            edge-tts \
            requests \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2


      # =========================================
      # 3. GENERATE CONTENT
      # =========================================

      - name: Generate content
        env:
          RUN_ID: ${{ github.run_id }}
        run: |

          cat > generate_content.py <<'PY'

          import json
          import random
          import secrets
          import time
          import os
          from pathlib import Path


          # -----------------------------------------
          # RANDOM SEED
          # -----------------------------------------

          seed = (
              int(time.time() * 1000000)
              ^ secrets.randbits(64)
              ^ hash(os.environ.get("RUN_ID", "0"))
          )

          rng = random.Random(seed)


          # -----------------------------------------
          # HOOKS
          # -----------------------------------------

          hooks = [
              "実は、意外と知られていない話があります。",
              "学校ではあまり教えてくれない話を集めました。",
              "知っているようで知らない雑学を紹介します。",
              "これを知ると、ちょっと誰かに話したくなります。",
              "身近なものにも、意外な秘密があります。",
              "思わず「へぇ」と言いたくなる話です。",
              "今日から少しだけ見え方が変わるかもしれません。",
              "知らなくても困らないけど、知ると面白い話です。",
              "実は身近なところに、面白い科学があります。",
              "ちょっとした暇つぶしに、雑学をどうぞ。",
              "意外と知られていない事実を紹介します。",
              "あなたはいくつ知っていますか？",
              "大人になってから知ると面白い雑学です。",
              "一度知ったら誰かに話したくなる話です。",
              "普段何気なく見ているものにも秘密があります。",
              "知識が一つ増えるだけで、世界は少し面白くなります。",
              "今日は、へぇと思える話をまとめました。",
              "意外なところに科学の不思議があります。",
              "知らないままでもいい。でも知ると面白い。",
              "最後まで見ると、ちょっと得した気分になるかもしれません。",
              "実は、あなたの身近にも知られていない秘密があります。",
              "知っているだけで会話のネタになる雑学です。",
              "大人でも意外と知らない話です。",
              "今日は誰かに話したくなる話を紹介します。"
          ]


          # -----------------------------------------
          # FACTS
          # -----------------------------------------

          facts = [

              {
                  "title": "バナナ",
                  "text": "バナナは植物学上ではベリーの仲間です。普段のイメージとは少し違いますよね。逆に、イチゴは植物学上の本当のベリーではありません。",
                  "query": "banana fruit"
              },

              {
                  "title": "タコ",
                  "text": "タコには三つの心臓があります。さらに血液には銅を含む成分が使われているため、青っぽく見えることがあります。",
                  "query": "octopus underwater"
              },

              {
                  "title": "ハチミツ",
                  "text": "ハチミツは水分が少なく酸性でもあるため、微生物が増えにくい性質があります。そのため非常に長く保存できる食品として知られています。",
                  "query": "honey bees"
              },

              {
                  "title": "カカオ",
                  "text": "チョコレートの原料になるカカオの実は、幹や太い枝から直接実がつくことがあります。普段食べているチョコからは想像しにくい姿です。",
                  "query": "cacao tree"
              },

              {
                  "title": "ペンギン",
                  "text": "ペンギンは鳥の仲間ですが、空を飛ぶ代わりに水中を泳ぐことに特化しています。翼は飛ぶためではなく、泳ぐために使われます。",
                  "query": "penguin swimming"
              },

              {
                  "title": "雨の匂い",
                  "text": "雨が降ったときに感じる独特の匂いには、植物由来の成分や土壌中の微生物が関係しています。あの匂いにはちゃんと理由があります。",
                  "query": "rain drops"
              },

              {
                  "title": "雲",
                  "text": "雲はふわふわして見えますが、実際には大量の小さな水滴や氷の粒が集まっています。見た目よりずっと複雑な存在です。",
                  "query": "cloud sky"
              },

              {
                  "title": "宇宙",
                  "text": "宇宙空間では音がそのまま伝わりません。音は空気などの媒質を必要とするため、真空に近い宇宙空間では音を聞くことができません。",
                  "query": "space stars"
              },

              {
                  "title": "猫",
                  "text": "猫は甘味を感じる能力が人間とは大きく異なります。肉食に適応した結果、甘味を感じる仕組みの一部が働きません。",
                  "query": "cat close up"
              },

              {
                  "title": "虹",
                  "text": "虹は太陽の光が水滴の中で屈折や反射をすることで見えます。同じ場所にいても、見る人によって見えている虹は少し違います。",
                  "query": "rainbow sky"
              },

              {
                  "title": "月",
                  "text": "月が自分で光っているように見えますが、月が見せている光の多くは太陽の光を反射したものです。",
                  "query": "moon night"
              },

              {
                  "title": "夕焼け",
                  "text": "夕焼けが赤く見えるのは、太陽の光が大気の中を長く通ることで、青い光などが散らばりやすくなるためです。",
                  "query": "sunset sky"
              },

              {
                  "title": "深海",
                  "text": "深海では太陽の光がほとんど届きません。それでも、光を発する生物が存在します。これは生物発光と呼ばれています。",
                  "query": "deep sea"
              },

              {
                  "title": "イルカ",
                  "text": "イルカは音を使って周囲の情報を得ることができます。反射して戻ってくる音を利用する仕組みはエコーロケーションと呼ばれます。",
                  "query": "dolphin ocean"
              },

              {
                  "title": "カラス",
                  "text": "カラスは高い学習能力を持つことで知られています。道具を使ったり、複雑な問題を解いたりする行動も観察されています。",
                  "query": "crow bird"
              },

              {
                  "title": "ゾウ",
                  "text": "ゾウは非常に大きな体を持つ一方で、足音を抑えるような柔らかな足裏を持っています。",
                  "query": "elephant"
              },

              {
                  "title": "キリン",
                  "text": "キリンの首には、人間と同じように七つの頸椎があります。一つ一つの骨がとても長いのです。",
                  "query": "giraffe"
              },

              {
                  "title": "蝶",
                  "text": "蝶は脚で味を感じることができます。植物にとまったとき、脚にある感覚器で情報を得ています。",
                  "query": "butterfly flower"
              },

              {
                  "title": "ミツバチ",
                  "text": "ミツバチは仲間に餌場の場所を伝えるため、特徴的な動きを使って情報を伝えます。",
                  "query": "honeybee flower"
              },

              {
                  "title": "植物",
                  "text": "植物は光を使ってエネルギーを作ります。この光合成によって、私たちが呼吸する酸素の供給にもつながっています。",
                  "query": "green plants"
              },

              {
                  "title": "ひまわり",
                  "text": "若いひまわりは太陽の方向に合わせて向きを変えることがあります。ただし、成長するとその動きは小さくなります。",
                  "query": "sunflower field"
              },

              {
                  "title": "竹",
                  "text": "竹には非常に速く成長する種類があります。地下茎を広げながら成長する種類もあり、独特な増え方をします。",
                  "query": "bamboo forest"
              },

              {
                  "title": "キノコ",
                  "text": "キノコは植物ではありません。菌類という別のグループに分類され、植物とは異なる方法で栄養を得ています。",
                  "query": "mushroom forest"
              },

              {
                  "title": "トマト",
                  "text": "トマトは植物学上では果実です。料理では野菜として扱われることが多いため、分類の違いが面白い植物です。",
                  "query": "tomato garden"
              },

              {
                  "title": "イチゴ",
                  "text": "イチゴの表面にある小さな粒は、一般的には種のように見えますが、植物学的には一つ一つが果実にあたります。",
                  "query": "strawberry"
              },

              {
                  "title": "睡眠",
                  "text": "眠っている間も脳は完全に休んでいるわけではありません。記憶の整理など、さまざまな活動が行われています。",
                  "query": "sleep bedroom"
              },

              {
                  "title": "まばたき",
                  "text": "人は無意識のうちに何度もまばたきをしています。まばたきには目の表面を潤し、異物を取り除く役割があります。",
                  "query": "human eyes"
              },

              {
                  "title": "指紋",
                  "text": "指紋は非常に複雑な模様をしています。一般的には一人ひとり異なる特徴を持つとされ、本人確認にも利用されています。",
                  "query": "fingerprint hand"
              },

              {
                  "title": "香り",
                  "text": "香りの感じ方は、鼻だけではなく脳の働きにも大きく関係しています。同じ香りでも状況によって印象が変わることがあります。",
                  "query": "perfume flowers"
              },

              {
                  "title": "音楽",
                  "text": "音楽は感情や記憶と強く結びつくことがあります。昔聞いた曲を聴いた瞬間、当時の記憶がよみがえることもあります。",
                  "query": "music headphones"
              },

              {
                  "title": "海",
                  "text": "地球の表面には広大な海が広がっていますが、私たちが知っている海の世界はまだほんの一部です。",
                  "query": "ocean waves"
              },

              {
                  "title": "砂漠",
                  "text": "砂漠は一年を通して雨がほとんど降らない地域を指します。砂だけでなく、岩石や礫が広がる砂漠もあります。",
                  "query": "desert landscape"
              },

              {
                  "title": "地球",
                  "text": "地球は完全な球体ではありません。自転の影響によって赤道付近が少しふくらんだ形をしています。",
                  "query": "earth planet"
              },

              {
                  "title": "季節",
                  "text": "季節が生まれる大きな理由は、地球の地軸が傾いたまま太陽の周りを回っていることです。",
                  "query": "four seasons"
              },

              {
                  "title": "心拍",
                  "text": "心臓は一日中休むことなく血液を送り続けています。体全体に酸素や栄養を届ける重要な役割を担っています。",
                  "query": "human heart"
              },

              {
                  "title": "味覚",
                  "text": "味覚は舌だけで決まるわけではありません。香りや温度、食感なども食べ物の味の感じ方に大きく影響します。",
                  "query": "food tasting"
              },

              {
                  "title": "皮膚",
                  "text": "皮膚は体の外側を守るだけではありません。温度や痛みなどを感じたり、体温調節にも関わったりしています。",
                  "query": "human skin"
              },

              {
                  "title": "髪",
                  "text": "髪の毛は主にケラチンというタンパク質からできています。爪も同じようにケラチンを主成分としています。",
                  "query": "hair close up"
              },

              {
                  "title": "雷",
                  "text": "雷の放電によって周囲の空気は急激に熱せられます。その急激な膨張が、私たちが聞く雷鳴につながります。",
                  "query": "lightning storm"
              },

              {
                  "title": "金星",
                  "text": "金星では一日の長さが一年より長いという不思議な特徴があります。自転周期が非常に長いためです。",
                  "query": "venus planet"
              },

              {
                  "title": "飛行機の窓",
                  "text": "飛行機の窓には小さな穴が開いていることがあります。これは窓の構造や気圧に関係する重要な役割を持っています。",
                  "query": "airplane window"
              },

              {
                  "title": "月の距離",
                  "text": "月は地球から少しずつ遠ざかっています。非常にゆっくりした変化なので、普段の生活で気づくことはありません。",
                  "query": "moon earth"
              }

          ]


          # -----------------------------------------
          # ENCOURAGEMENTS
          # -----------------------------------------

          encouragements = [
              "知らないことを知るだけでも、毎日は少し面白くなります。",
              "小さな発見を楽しめる人は、日常の中にも面白さを見つけられます。",
              "全部を覚える必要はありません。ひとつ「へぇ」があれば十分です。",
              "今日ひとつ新しいことを知った。それだけでも十分です。",
              "知らなかったことを知る楽しさは、何歳からでも味わえます。",
              "毎日少しずつでも、新しいことを知る時間を大切にしたいですね。",
              "人生は、こういう小さな発見の積み重ねなのかもしれません。",
              "知識は誰かと比べるものではなく、自分の世界を広げるものです。",
              "たった一つの雑学でも、誰かとの会話のきっかけになるかもしれません。",
              "今日知ったことを、いつか誰かに話してみるのも面白そうです。",
              "知らないことを恥ずかしがる必要はありません。知ろうとすることが大切です。",
              "少しだけ興味を持つ。それだけで新しい発見が始まります。",
              "何気ない毎日の中にも、面白いことはたくさんあります。",
              "知識が増えると、同じ景色でも少し違って見えることがあります。",
              "今日の小さな「へぇ」を大切にしてみてください。"
          ]


          # -----------------------------------------
          # TRANSITIONS
          # -----------------------------------------

          transitions = [
              "ここからもう一つ。",
              "では、次の雑学です。",
              "もう一つ面白い話があります。",
              "続いてはこちら。",
              "実はまだあります。",
              "次も意外な話です。",
              "ここで少し視点を変えてみましょう。",
              "続いて、身近な話を一つ。",
              "まだまだ面白いことがあります。",
              "次の話も知っておくと面白いかもしれません。",
              "では、もう一ついきましょう。",
              "ここからも意外な雑学が続きます。"
          ]


          # -----------------------------------------
          # CLOSINGS
          # -----------------------------------------

          closings = [
              "知らなかったことを一つ知るだけでも、今日は少し違う一日になります。最後まで見てくれてありがとうございました。",
              "こういう小さな雑学を知っていくと、いつもの景色も少し違って見えてきます。最後までありがとうございました。",
              "今日知ったことが、誰かとの会話のきっかけになったら面白いですね。また次の雑学で会いましょう。",
              "知識は少しずつで大丈夫です。今日の一つを覚えておくだけでも十分。最後までありがとうございました。",
              "何気ない毎日の中にも、知らないことはたくさんあります。また面白い雑学を紹介します。",
              "最後まで見てくれてありがとうございました。次回も、思わず誰かに話したくなる雑学を紹介します。",
              "今日の雑学が少しでも面白かったら、また次の動画も覗いてみてください。ありがとうございました。"
          ]


          # -----------------------------------------
          # VISUAL THEMES
          # -----------------------------------------

          themes = [
              ["nature", "forest", "green leaves", "mountain"],
              ["ocean", "sea", "waves", "beach"],
              ["city", "street", "night city", "urban"],
              ["space", "stars", "galaxy", "night sky"],
              ["animal", "wildlife", "cat", "dog"],
              ["sunset", "sunrise", "sky", "cloud"],
              ["food", "fruit", "cooking", "kitchen"],
              ["science", "laboratory", "technology", "computer"],
              ["travel", "road trip", "train", "airplane"],
              ["flower", "garden", "plants", "spring"],
              ["rain", "water", "drops", "weather"],
              ["deep sea", "underwater", "coral", "fish"],
              ["forest sunlight", "trees", "woods", "nature"],
              ["ocean sunset", "sea sunset", "coast", "waves"],
              ["technology", "futuristic", "digital", "computer"],
              ["coffee", "desk", "morning", "workspace"],
              ["book", "reading", "library", "study"],
              ["road", "walking", "travel", "journey"],
              ["mountain", "hiking", "landscape", "nature"],
              ["stars", "night", "sky", "galaxy"]
          ]


          # -----------------------------------------
          # BUILD 12 SCENES
          # -----------------------------------------

          shuffled = facts[:]
          rng.shuffle(shuffled)

          selected = shuffled[:8]

          scenes = []

          for i in range(12):

              if i == 0:

                  fact = selected[0]

                  text = (
                      rng.choice(hooks)
                      + " "
                      + fact["title"]
                      + "について知っていますか？ "
                      + fact["text"]
                  )

                  query = fact["query"]

              elif i in [1, 3, 5, 7, 9]:

                  fact_index = min(
                      (i + 1) // 2,
                      len(selected) - 1
                  )

                  fact = selected[fact_index]

                  text = (
                      rng.choice(transitions)
                      + " "
                      + fact["title"]
                      + "の話です。 "
                      + fact["text"]
                  )

                  query = fact["query"]

              elif i in [2, 4, 6, 8, 10]:

                  text = rng.choice(encouragements)

                  theme = themes[i % len(themes)]

                  query = rng.choice(theme)

              else:

                  text = rng.choice(closings)

                  query = rng.choice([
                      "beautiful nature",
                      "sunset landscape",
                      "ocean sunset",
                      "forest sunlight",
                      "mountain landscape"
                  ])

              scenes.append({
                  "text": text,
                  "query": query
              })


          # -----------------------------------------
          # TITLE
          # -----------------------------------------

          titles = [
              "5分で知識が増える！知られざる雑学12選",
              "思わず誰かに話したくなる雑学12選",
              "知っていると面白い身近な雑学12選",
              "知らないとちょっと損？面白い雑学12選",
              "へぇが止まらない！意外な雑学12選",
              "毎日誰かに話したくなる雑学12選",
              "大人でも意外と知らない雑学12選",
              "知ると世界が少し面白くなる雑学12選",
              "身近なのに知らなかった雑学12選",
              "5分で楽しむ！驚きの雑学12選"
          ]

          title = rng.choice(titles)


          # -----------------------------------------
          # DESCRIPTION
          # -----------------------------------------

          description = (
              "身近だけど意外と知らない雑学を12個紹介します。\n"
              "知らなくても困らないけれど、知るとちょっと面白い話を集めました。\n\n"
              "今日の小さな発見を楽しんでください。\n\n"
              "#雑学 #豆知識 #トリビア #面白い話 #知識"
          )


          # -----------------------------------------
          # THUMBNAIL TEXT
          # -----------------------------------------

          thumbnail_texts = [
              "へぇが止まらない\n雑学12選",
              "知らないと損する\n雑学12選",
              "5分で知識が増える",
              "誰かに話したくなる\n雑学12選",
              "意外と知らない\n身近な雑学",
              "大人でも知らない\n雑学12選"
          ]

          thumbnail_text = rng.choice(thumbnail_texts)


          # -----------------------------------------
          # SAVE
          # -----------------------------------------

          Path("segments.json").write_text(
              json.dumps(
                  {
                      "title": title,
                      "description": description,
                      "scenes": scenes
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path("thumbnail_text.txt").write_text(
              thumbnail_text,
              encoding="utf-8"
          )

          print("========================================")
          print("CONTENT GENERATED")
          print("TITLE:", title)
          print("THUMBNAIL:")
          print(thumbnail_text)
          print("SCENES:", len(scenes))
          print("========================================")

          PY

          python generate_content.py


      # =========================================
      # 4. RENDER
      # =========================================

      - name: Render 5-minute video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |

          mkdir -p media
          mkdir -p audio
          mkdir -p subs
          mkdir -p rendered

          python - <<'PY'

          import asyncio
          import json
          import os
          import random
          import subprocess
          from pathlib import Path

          import requests
          import edge_tts


          TARGET = 25.0

          API_KEY = os.environ["PEXELS_API_KEY"]

          data = json.loads(
              Path("segments.json").read_text(
                  encoding="utf-8"
              )
          )

          scenes = data["scenes"]


          # =========================================
          # COMMAND
          # =========================================

          def run(cmd):

              print()
              print("RUN:")
              print(" ".join(str(x) for x in cmd))
              print()

              subprocess.run(
                  cmd,
                  check=True
              )


          # =========================================
          # DURATION
          # =========================================

          def get_duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return float(
                  result.stdout.strip()
              )


          # =========================================
          # SRT TIME
          # =========================================

          def srt_time(seconds):

              seconds = max(
                  0.0,
                  float(seconds)
              )

              total_ms = int(
                  round(seconds * 1000)
              )

              hours = total_ms // 3600000

              total_ms %= 3600000

              minutes = total_ms // 60000

              total_ms %= 60000

              secs = total_ms // 1000

              millis = total_ms % 1000

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{millis:03d}"
              )


          # =========================================
          # TEXT SPLIT
          # =========================================

          def split_text(text):

              result = []

              current = ""

              for ch in text:

                  current += ch

                  # 日本語の文章として自然な区切り
                  if ch in "。！？!?":

                      if current.strip():

                          result.append(
                              current.strip()
                          )

                          current = ""

                  # 長すぎる字幕を分割
                  elif len(current) >= 22:

                      # 読点が近くにあればそこで切る
                      if ch in "、，,":

                          result.append(
                              current.strip()
                          )

                          current = ""

                      # 26文字以上なら強制分割
                      elif len(current) >= 26:

                          result.append(
                              current.strip()
                          )

                          current = ""

              if current.strip():

                  result.append(
                      current.strip()
                  )

              return result


          # =========================================
          # CREATE SRT
          #
          # 実際の音声長を使用
          # =========================================

          def create_srt(
              text,
              audio_duration,
              output
          ):

              parts = split_text(text)

              if not parts:

                  parts = [text]

              total_chars = sum(
                  max(1, len(x))
                  for x in parts
              )

              current = 0.0

              blocks = []

              for i, part in enumerate(parts):

                  weight = (
                      max(1, len(part))
                      / total_chars
                  )

                  if i == len(parts) - 1:

                      end = audio_duration

                  else:

                      end = (
                          current
                          + audio_duration * weight
                      )

                  # 最低表示時間
                  if end - current < 0.45:

                      end = min(
                          audio_duration,
                          current + 0.45
                      )

                  blocks.append(
                      (
                          current,
                          end,
                          part
                      )
                  )

                  current = end


              srt_lines = []

              for i, (
                  start,
                  end,
                  text_part
              ) in enumerate(blocks, 1):

                  if end <= start:

                      continue

                  srt_lines.append(
                      str(i)
                  )

                  srt_lines.append(
                      f"{srt_time(start)} --> "
                      f"{srt_time(end)}"
                  )

                  srt_lines.append(
                      text_part
                  )

                  srt_lines.append("")


              Path(output).write_text(
                  "\n".join(srt_lines),
                  encoding="utf-8"
              )


              # 絶対に空ファイルにしない
              if not Path(output).exists():

                  raise RuntimeError(
                      f"SRT WAS NOT CREATED: {output}"
                  )

              if Path(output).stat().st_size == 0:

                  raise RuntimeError(
                      f"SRT IS EMPTY: {output}"
                  )

              print(
                  "SRT CREATED:",
                  output
              )


          # =========================================
          # ATEMPO
          # =========================================

          def make_atempo(speed):

              filters = []

              while speed > 2.0:

                  filters.append(
                      "atempo=2.0"
                  )

                  speed /= 2.0

              while speed < 0.5:

                  filters.append(
                      "atempo=0.5"
                  )

                  speed /= 0.5

              filters.append(
                  f"atempo={speed:.8f}"
              )

              return ",".join(filters)


          # =========================================
          # DOWNLOAD PEXELS
          # =========================================

          def get_video(query):

              headers = {
                  "Authorization": API_KEY
              }

              params = {
                  "query": query,
                  "orientation": "landscape",
                  "size": "medium",
                  "per_page": 20
              }

              try:

                  response = requests.get(
                      "https://api.pexels.com/videos/search",
                      headers=headers,
                      params=params,
                      timeout=30
                  )

                  response.raise_for_status()

                  videos = response.json().get(
                      "videos",
                      []
                  )

              except Exception as e:

                  print(
                      "PEXELS ERROR:",
                      e
                  )

                  videos = []


              if not videos:

                  print(
                      "NO RESULTS. FALLBACK."
                  )

                  params["query"] = "nature"

                  try:

                      response = requests.get(
                          "https://api.pexels.com/videos/search",
                          headers=headers,
                          params=params,
                          timeout=30
                      )

                      response.raise_for_status()

                      videos = response.json().get(
                          "videos",
                          []
                      )

                  except Exception:

                      videos = []


              if not videos:

                  return None


              random.shuffle(videos)


              candidates = []

              for video in videos:

                  for vf in video.get(
                      "video_files",
                      []
                  ):

                      width = vf.get(
                          "width",
                          0
                      )

                      height = vf.get(
                          "height",
                          0
                      )

                      link = vf.get(
                          "link"
                      )

                      if (
                          link
                          and width >= 720
                          and height >= 400
                      ):

                          candidates.append(
                              vf
                          )


              if not candidates:

                  return None


              candidates.sort(
                  key=lambda x:
                      x.get("width", 0)
                      * x.get("height", 0),
                  reverse=True
              )


              return candidates[
                  random.randrange(
                      min(
                          len(candidates),
                          5
                      )
                  )
              ]["link"]


          # =========================================
          # DOWNLOAD
          # =========================================

          def download_video(
              url,
              output
          ):

              print(
                  "DOWNLOAD:",
                  url
              )

              with requests.get(
                  url,
                  stream=True,
                  timeout=120
              ) as response:

                  response.raise_for_status()

                  with open(
                      output,
                      "wb"
                  ) as f:

                      for chunk in response.iter_content(
                          chunk_size=1024 * 1024
                      ):

                          if chunk:

                              f.write(chunk)


          # =========================================
          # TTS
          # =========================================

          async def create_tts(
              text,
              output
          ):

              communicate = edge_tts.Communicate(
                  text=text,
                  voice="ja-JP-NanamiNeural",
                  rate="+0%",
                  volume="+0%"
              )

              with open(
                  output,
                  "wb"
              ) as f:

                  async for chunk in communicate.stream():

                      if chunk["type"] == "audio":

                          f.write(
                              chunk["data"]
                          )


          # =========================================
          # EACH SCENE
          # =========================================

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              base = f"{index:02d}"

              print()
              print("=" * 60)
              print(
                  "SCENE:",
                  index
              )
              print(
                  scene["text"]
              )
              print("=" * 60)


              raw_audio = Path(
                  f"audio/{base}_raw.mp3"
              )

              audio = Path(
                  f"audio/{base}.wav"
              )

              source = Path(
                  f"media/{base}_source.mp4"
              )

              normalized = Path(
                  f"media/{base}_normalized.mp4"
              )

              srt = Path(
                  f"subs/{base}.srt"
              )

              rendered = Path(
                  f"rendered/{base}.mp4"
              )


              # -------------------------------------
              # TTS
              # -------------------------------------

              asyncio.run(
                  create_tts(
                      scene["text"],
                      raw_audio
                  )
              )


              raw_duration = get_duration(
                  raw_audio
              )

              print(
                  "RAW AUDIO:",
                  raw_duration
              )


              # -------------------------------------
              # SRT
              # -------------------------------------

              create_srt(
                  scene["text"],
                  raw_duration,
                  srt
              )


              # -------------------------------------
              # AUDIO 25 SEC
              # -------------------------------------

              if raw_duration > TARGET:

                  speed = (
                      raw_duration
                      / TARGET
                  )

                  print(
                      "AUDIO SPEED:",
                      speed
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(raw_audio),
                      "-filter:a",
                      make_atempo(speed),
                      "-t",
                      str(TARGET),
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(audio)
                  ])


                  # 字幕も速度に合わせて圧縮
                  parts = split_text(
                      scene["text"]
                  )

                  total_chars = sum(
                      max(1, len(x))
                      for x in parts
                  )

                  scale = (
                      TARGET
                      / raw_duration
                  )

                  lines = []

                  cursor = 0.0

                  for i, part in enumerate(parts):

                      weight = (
                          max(1, len(part))
                          / total_chars
                      )

                      original_start = cursor

                      if i == len(parts) - 1:

                          original_end = raw_duration

                      else:

                          original_end = (
                              cursor
                              + raw_duration * weight
                          )

                      start = (
                          original_start
                          * scale
                      )

                      end = (
                          original_end
                          * scale
                      )

                      end = min(
                          TARGET,
                          end
                      )

                      lines.append(
                          str(i + 1)
                      )

                      lines.append(
                          f"{srt_time(start)} --> "
                          f"{srt_time(end)}"
                      )

                      lines.append(
                          part
                      )

                      lines.append("")

                      cursor = original_end


                  srt.write_text(
                      "\n".join(lines),
                      encoding="utf-8"
                  )


              else:

                  silence = (
                      TARGET
                      - raw_duration
                  )

                  print(
                      "ADDING SILENCE:",
                      silence
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(raw_audio),
                      "-f",
                      "lavfi",
                      "-t",
                      str(silence),
                      "-i",
                      "anullsrc=r=48000:cl=stereo",
                      "-filter_complex",
                      "[0:a][1:a]concat=n=2:v=0:a=1[out]",
                      "-map",
                      "[out]",
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      "-t",
                      str(TARGET),
                      str(audio)
                  ])


              # -------------------------------------
              # VERIFY AUDIO
              # -------------------------------------

              final_audio_duration = get_duration(
                  audio
              )

              print(
                  "FINAL AUDIO:",
                  final_audio_duration
              )


              # -------------------------------------
              # PEXELS
              # -------------------------------------

              video_url = get_video(
                  scene["query"]
              )


              if video_url:

                  download_video(
                      video_url,
                      source
                  )

              else:

                  print(
                      "PEXELS FAILED - BLACK VIDEO"
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      "color=c=black:s=1280x720:r=30",
                      "-t",
                      str(TARGET),
                      "-pix_fmt",
                      "yuv420p",
                      str(source)
                  ])


              # -------------------------------------
              # NORMALIZE VIDEO
              # -------------------------------------

              run([
                  "ffmpeg",
                  "-y",
                  "-stream_loop",
                  "-1",
                  "-i",
                  str(source),
                  "-t",
                  str(TARGET),
                  "-vf",
                  "scale=1280:720:"
                  "force_original_aspect_ratio=decrease,"
                  "pad=1280:720:(ow-iw)/2:(oh-ih)/2,"
                  "format=yuv420p",
                  "-r",
                  "30",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",
                  str(normalized)
              ])


              # -------------------------------------
              # ABSOLUTE SRT PATH
              # -------------------------------------

              srt_path = str(
                  srt.resolve()
              )

              srt_path = (
                  srt_path
                  .replace("\\", "/")
                  .replace(":", "\\:")
              )


              # -------------------------------------
              # SUBTITLE FILTER
              # -------------------------------------

              subtitle_filter = (
                  "subtitles="
                  + "'"
                  + srt_path
                  + "'"
                  + ":force_style="
                  + "'"
                  + "FontName=Noto Sans CJK JP,"
                  + "FontSize=24,"
                  + "PrimaryColour=&H00FFFFFF,"
                  + "OutlineColour=&H00000000,"
                  + "BorderStyle=3,"
                  + "Outline=2,"
                  + "Shadow=1,"
                  + "Alignment=2,"
                  + "MarginV=45"
                  + "'"
              )


              # -------------------------------------
              # RENDER
              # -------------------------------------

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(normalized),
                  "-i",
                  str(audio),
                  "-t",
                  str(TARGET),
                  "-vf",
                  subtitle_filter,
                  "-map",
                  "0:v:0",
                  "-map",
                  "1:a:0",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",
                  "-ar",
                  "48000",
                  "-ac",
                  "2",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(rendered)
              ])


              print(
                  "SCENE COMPLETE:",
                  index
              )


          # =========================================
          # CONCAT
          # =========================================

          concat = Path(
              "concat.txt"
          )

          with concat.open(
              "w",
              encoding="utf-8"
          ) as f:

              for i in range(
                  1,
                  len(scenes) + 1
              ):

                  path = Path(
                      f"rendered/{i:02d}.mp4"
                  ).resolve()

                  f.write(
                      f"file '{path}'\n"
                  )


          run([
              "ffmpeg",
              "-y",
              "-f",
              "concat",
              "-safe",
              "0",
              "-i",
              str(concat),
              "-c",
              "copy",
              "trivia_video.mp4"
          ])


          # =========================================
          # FINAL 5 MINUTE VIDEO
          # =========================================

          run([
              "ffmpeg",
              "-y",
              "-i",
              "trivia_video.mp4",
              "-t",
              "300",
              "-c:v",
              "libx264",
              "-preset",
              "veryfast",
              "-crf",
              "23",
              "-c:a",
              "aac",
              "-b:a",
              "128k",
              "-movflags",
              "+faststart",
              "final_video.mp4"
          ])


          final_duration = get_duration(
              "final_video.mp4"
          )

          print()
          print("=" * 60)
          print(
              "FINAL VIDEO DURATION:",
              final_duration
          )
          print("=" * 60)

          if final_duration < 295:

              raise RuntimeError(
                  "FINAL VIDEO IS TOO SHORT"
              )

          print(
              "VIDEO RENDER SUCCESS"
          )

          PY


      # =========================================
      # 5. AUTOMATIC THUMBNAIL
      # =========================================

      - name: Create automatic thumbnail
        run: |

          FONT=$(fc-match \
            -f '%{file}\n' \
            "Noto Sans CJK JP" \
            | head -n 1)

          echo "FONT:"
          echo "$FONT"

          ffmpeg -y \
            -ss 8 \
            -i final_video.mp4 \
            -frames:v 1 \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,drawbox=x=0:y=0:w=iw:h=ih:color=black@0.18:t=fill,drawbox=x=35:y=450:w=1210:h=210:color=black@0.70:t=fill,drawtext=fontfile='$FONT':textfile='thumbnail_text.txt':fontcolor=white:fontsize=54:line_spacing=10:x=(w-text_w)/2:y=500" \
            -q:v 5 \
            thumbnail.jpg

          echo "THUMBNAIL CREATED"

          ls -lh thumbnail.jpg


      # =========================================
      # 6. UPLOAD YOUTUBE
      # =========================================

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |

          python - <<'PY'

          import os
          import json

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import (
              MediaFileUpload
          )

          from googleapiclient.errors import (
              HttpError
          )


          # =========================================
          # AUTH
          # =========================================

          scopes = [
              "https://www.googleapis.com/auth/youtube.upload"
          ]


          credentials = Credentials(
              token=None,
              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],
              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],
              scopes=scopes
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          # =========================================
          # CONTENT
          # =========================================

          data = json.loads(
              open(
                  "segments.json",
                  encoding="utf-8"
              ).read()
          )


          title = data["title"]

          description = data[
              "description"
          ]


          # =========================================
          # VIDEO BODY
          # =========================================

          body = {

              "snippet": {

                  "title": title,

                  "description": description,

                  "categoryId": "27"

              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False

              }

          }


          media = MediaFileUpload(
              "final_video.mp4",
              mimetype="video/mp4",
              resumable=True
          )


          print(
              "================================"
          )

          print(
              "START YOUTUBE UPLOAD"
          )

          print(
              "TITLE:",
              title
          )

          print(
              "================================"
          )


          # =========================================
          # VIDEO UPLOAD
          # =========================================

          try:

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media
              )

              response = request.execute()

              video_id = response[
                  "id"
              ]

              print(
                  "VIDEO UPLOAD SUCCESS"
              )

              print(
                  "VIDEO ID:",
                  video_id
              )

              print(
                  "https://www.youtube.com/watch?v="
                  + video_id
              )


          except HttpError as e:

              print(
                  "YOUTUBE ERROR:"
              )

              print(e)

              if "uploadLimitExceeded" in str(e):

                  print(
                      "YOUTUBE UPLOAD LIMIT"
                  )

                  raise SystemExit(0)

              raise


          # =========================================
          # THUMBNAIL
          # =========================================

          print(
              "START THUMBNAIL UPLOAD"
          )


          try:

              thumbnail_media = MediaFileUpload(
                  "thumbnail.jpg",
                  mimetype="image/jpeg"
              )


              youtube.thumbnails().set(
                  videoId=video_id,
                  media_body=thumbnail_media
              ).execute()


              print(
                  "THUMBNAIL UPLOAD SUCCESS"
              )


          except HttpError as e:

              print(
                  "THUMBNAIL ERROR:"
              )

              print(e)

              print(
                  "VIDEO WAS UPLOADED SUCCESSFULLY"
              )


          print(
              "================================"
          )

          print(
              "ALL DONE"
          )

          print(
              "================================"
          )

          PY


      # =========================================
      # 7. SAVE ARTIFACTS
      # =========================================

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-trivia-video
          path: |
            final_video.mp4
            thumbnail.jpg
            segments.json
          retention-days: 7
