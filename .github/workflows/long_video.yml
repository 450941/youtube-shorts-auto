              "何もできなかった日があっても大丈夫です。休むことも、明日へ進むための大切な時間です。",
              "小さな一歩は、一歩に変わりありません。大きく進めない日は、小さくてもいいので前を向いてみてください。",
              "周りが先に進んでいるように見えても、あなたの人生まで遅れているわけではありません。",
              "失敗した日は、人生の終わりではなく、一日が終わっただけです。また次の日があります。",
