name: Generate 5-Minute Trivia Encouragement Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu imagemagick curl jq

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow edge-tts google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Prepare folders
        run: |
          rm -rf media output
          mkdir -p media/images
          mkdir -p media/voice
          mkdir -p media/cuts
          mkdir -p media/subtitles
          mkdir -p output

      - name: Download BGM
        run: |
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/John_Bartmann_-_09_-_Happy_Clappy.ogg" \
            -o media/bgm.ogg

      - name: Check Python files
        run: |
          python -m py_compile render_video.py
          python -m py_compile upload_youtube.py

      - name: Generate video
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python render_video.py

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_youtube.py

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-long-video
          path: |
            output/final_video.mp4
            output/thumbnail.jpg
            output/video_info.json
            output/irasutoya_sources.json
          retention-days: 7
