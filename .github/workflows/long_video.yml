          def run(cmd):

              print("RUN:", " ".join(
                  str(x) for x in cmd
              ))

              subprocess.run(
                  cmd,
                  check=True
              )


          def get_duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      path
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return float(result.stdout.strip())


          # ==========================================================
