          python - <<'PY'

          import asyncio
          import json
          import os
          import random
          import subprocess
          from pathlib import Path

          import edge_tts
          import requests


          TARGET = 25.0

          VOICE = "ja-JP-NanamiNeural"


          # ========================================================
          # LOAD
          # ========================================================

          with open(
              "segments.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          scenes = data["scenes"]

          pexels_key = os.environ.get(
              "PEXELS_API_KEY",
              ""
          )


          # ========================================================
          # RUN
          # ========================================================

          def run(cmd):

              print(
                  "RUN:",
                  " ".join(map(str, cmd))
              )

              subprocess.run(
                  cmd,
                  check=True
              )


          # ========================================================
          # DURATION
          # ========================================================

          def duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return float(
                  result.stdout.strip()
              )


          # ========================================================
          # TIMESTAMP
          # ========================================================

          def ts(seconds):

              ms = int(
                  round(
                      max(0, seconds)
                      * 1000
                  )
              )

              h = ms // 3600000

              ms %= 3600000

              m = ms // 60000

              ms %= 60000

              s = ms // 1000

              ms %= 1000

              return (
                  f"{h:02d}:"
                  f"{m:02d}:"
                  f"{s:02d},"
                  f"{ms:03d}"
              )


          # ========================================================
          # FALLBACK
          # ========================================================

          def make_fallback(path):

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "lavfi",
                  "-i",
                  "color=c=0x101820:s=1280x720:r=30",
                  "-t",
                  str(TARGET),
                  "-pix_fmt",
                  "yuv420p",
                  "-an",
                  str(path)
              ])


          # ========================================================
          # PEXELS
          # ========================================================

          def download_pexels(
              query,
              output
          ):

              if not pexels_key:
                  return False

              try:

                  response = requests.get(
                      "https://api.pexels.com/videos/search",
                      headers={
                          "Authorization":
                          pexels_key
                      },
                      params={
                          "query": query,
                          "orientation": "landscape",
                          "size": "medium",
                          "per_page": 10
                      },
                      timeout=30
                  )

                  if response.status_code != 200:

                      print(
                          "PEXELS ERROR:",
                          response.status_code
                      )

                      return False

                  videos = (
                      response.json()
                      .get(
                          "videos",
                          []
                      )
                  )

                  if not videos:
                      return False

                  random.shuffle(videos)

                  for video in videos:

                      candidates = []

                      for vf in video.get(
                          "video_files",
                          []
                      ):

                          width = vf.get(
                              "width",
                              0
                          )

                          height = vf.get(
                              "height",
                              0
                          )

                          link = vf.get(
                              "link"
                          )

                          if (
                              link
                              and width >= 720
                              and height >= 400
                          ):

                              candidates.append(
                                  (
                                      width * height,
                                      link
                                  )
                              )

                      if not candidates:
                          continue

                      candidates.sort(
                          reverse=True
                      )

                      link = candidates[0][1]

                      r = requests.get(
                          link,
                          timeout=60
                      )

                      if r.status_code != 200:
                          continue

                      with open(
                          output,
                          "wb"
                      ) as f:

                          f.write(
                              r.content
                          )

                      if (
                          output.stat().st_size
                          > 50000
                      ):

                          return True

              except Exception as e:

                  print(
                      "PEXELS EXCEPTION:",
                      e
                  )

              return False


          # ========================================================
          # TTS WITH WORD TIMING
          # ========================================================

          async def create_tts(
              text,
              audio_path
          ):

              communicate = edge_tts.Communicate(
                  text,
                  VOICE,
                  rate="+0%",
                  volume="+0%"
              )

              boundaries = []

              with open(
                  audio_path,
                  "wb"
              ) as audio_file:

                  async for chunk in (
                      communicate.stream()
                  ):

                      if chunk["type"] == "audio":

                          audio_file.write(
                              chunk["data"]
                          )

                      elif (
                          chunk["type"]
                          == "WordBoundary"
                      ):

                          boundaries.append({
                              "start":
                                  chunk["offset"]
                                  / 10000000,
                              "duration":
                                  chunk["duration"]
                                  / 10000000,
                              "text":
                                  chunk.get(
                                      "text",
                                      ""
                                  )
                          })

              return boundaries


          # ========================================================
          # CREATE SRT FROM REAL TIMING
          # ========================================================

          def create_srt(
              boundaries,
              raw_duration,
              final_duration,
              output
          ):

              if not boundaries:

                  print(
                      "WARNING: No TTS boundaries"
                  )

                  return


              blocks = []

              current_text = ""

              current_start = None
              current_end = None

              MAX_CHARS = 18
              MAX_SECONDS = 3.2


              for item in boundaries:

                  word = (
                      item["text"]
                      .strip()
                  )

                  if not word:
                      continue

                  start = item["start"]

                  end = (
                      start
                      + item["duration"]
                  )


                  if current_start is None:

                      current_start = start
                      current_end = end
                      current_text = word

                      continue


                  candidate = (
                      current_text
                      + word
                  )

                  elapsed = (
                      end
                      - current_start
                  )


                  # Split at Japanese punctuation
                  # or when subtitle becomes too long.

                  should_split = (
                      len(candidate)
                      > MAX_CHARS
                      or elapsed
                      > MAX_SECONDS
                      or any(
                          current_text.endswith(x)
                          for x in [
                              "。",
                              "！",
                              "？"
                          ]
                      )
                  )


                  if should_split:

                      blocks.append({
                          "start":
                              current_start,
                          "end":
                              current_end,
                          "text":
                              current_text
                      })

                      current_start = start
                      current_end = end
                      current_text = word

                  else:

                      current_text = candidate
                      current_end = end


              if current_text:

                  blocks.append({
                      "start":
                          current_start,
                      "end":
                          current_end,
                      "text":
                          current_text
                  })


              # ====================================================
              # AUDIO SPEED SCALE
              # ====================================================

              scale = (
                  final_duration
                  / max(
                      raw_duration,
                      0.001
                  )
              )


              lines = []


              for i, block in enumerate(
                  blocks,
                  start=1
              ):

                  start = (
                      block["start"]
                      * scale
                  )

                  end = (
                      block["end"]
                      * scale
                  )

                  start = max(
                      0,
                      min(
                          start,
                          final_duration
                      )
                  )

                  end = max(
                      start + 0.05,
                      min(
                          end,
                          final_duration
                      )
                  )


                  lines.append(
                      f"{i}\n"
                      f"{ts(start)} --> "
                      f"{ts(end)}\n"
                      f"{block['text']}\n"
                  )


              with open(
                  output,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "\n".join(lines)
                  )


          # ========================================================
          # RENDER 12 SCENES
          # ========================================================

          for scene in scenes:

              index = scene["index"]

              base = f"{index:02d}"


              audio_raw = Path(
                  f"audio/{base}_raw.mp3"
              )

              audio_fixed = Path(
                  f"audio/{base}.wav"
              )

              source_video = Path(
                  f"media/{base}_source.mp4"
              )

              normalized = Path(
                  f"media/{base}_normalized.mp4"
              )

              subtitle = Path(
                  f"subs/{base}.srt"
              )

              output = Path(
                  f"rendered/{base}.mp4"
              )


              script = scene["text"]


              print(
                  "================================"
              )

              print(
                  "SCENE:",
                  index
              )

              print(script)

              print(
                  "================================"
              )


              # ====================================================
              # TTS
              # ====================================================

              boundaries = asyncio.run(
                  create_tts(
                      script,
                      audio_raw
                  )
              )


              raw_duration = duration(
                  audio_raw
              )


              print(
                  "RAW AUDIO:",
                  raw_duration
              )

              print(
                  "BOUNDARIES:",
                  len(boundaries)
              )


              # ====================================================
              # FIT TO 25 SEC
              # ====================================================

              if raw_duration > TARGET:

                  speed = (
                      raw_duration
                      / TARGET
                  )

                  speed = max(
                      0.80,
                      min(
                          speed,
                          1.35
                      )
                  )


                  run([
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(audio_raw),
                      "-filter:a",
                      f"atempo={speed:.5f}",
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(audio_fixed)
                  ])


                  fixed_duration = duration(
                      audio_fixed
                  )


                  if fixed_duration > TARGET:

                      speed2 = (
                          fixed_duration
                          / TARGET
                      )

                      speed2 = max(
                          0.80,
                          min(
                              speed2,
                              1.35
                          )
                      )


                      temp_audio = Path(
                          f"audio/{base}_temp.wav"
                      )


                      run([
                          "ffmpeg",
                          "-y",
                          "-i",
                          str(audio_fixed),
                          "-filter:a",
                          f"atempo={speed2:.5f}",
                          "-ar",
                          "48000",
                          "-ac",
                          "2",
                          str(temp_audio)
                      ])


                      temp_audio.replace(
                          audio_fixed
                      )

              else:

                  silence = (
                      TARGET
                      - raw_duration
                  )


                  run([
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(audio_raw),
                      "-f",
                      "lavfi",
                      "-t",
                      str(silence),
                      "-i",
                      "anullsrc=r=48000:cl=stereo",
                      "-filter_complex",
                      "[0:a][1:a]concat=n=2:v=0:a=1[out]",
                      "-map",
                      "[out]",
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(audio_fixed)
                  ])


              final_audio_duration = duration(
                  audio_fixed
              )


              # ====================================================
              # REAL SUBTITLE
              # ====================================================

              create_srt(
                  boundaries,
                  raw_duration,
                  final_audio_duration,
                  subtitle
              )


              # ====================================================
              # PEXELS
              # ====================================================

              found = download_pexels(
                  scene["query"],
                  source_video
              )


              if not found:

                  print(
                      "PEXELS NOT FOUND - FALLBACK"
                  )

                  make_fallback(
                      source_video
                  )


              # ====================================================
              # NORMALIZE VIDEO
              # ====================================================

              run([
                  "ffmpeg",
                  "-y",
                  "-stream_loop",
                  "-1",
                  "-i",
                  str(source_video),
                  "-t",
                  str(TARGET),
                  "-vf",
                  "scale=1280:720:force_original_aspect_ratio=decrease,"
                  "pad=1280:720:(ow-iw)/2:(oh-ih)/2,"
                  "format=yuv420p",
                  "-r",
                  "30",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",
                  str(normalized)
              ])


              # ====================================================
              # SUBTITLE PATH
              # ====================================================

              subtitle_path = str(
                  subtitle.resolve()
              )

              subtitle_path = (
                  subtitle_path
                  .replace(
                      "\\",
                      "/"
                  )
                  .replace(
                      ":",
                      "\\:"
                  )
                  .replace(
                      "'",
                      "\\'"
                  )
              )


              # ====================================================
              # SUBTITLE STYLE
              # ====================================================

              vf = (
                  f"subtitles='{subtitle_path}'"
                  ":force_style="
                  "'FontName=Noto Sans CJK JP,"
                  "FontSize=24,"
                  "PrimaryColour=&H00FFFFFF,"
                  "OutlineColour=&H00000000,"
                  "BorderStyle=3,"
                  "Outline=2,"
                  "Shadow=1,"
                  "Alignment=2,"
                  "MarginV=45'"
              )


              # ====================================================
              # FINAL SCENE
              # ====================================================

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(normalized),
                  "-i",
                  str(audio_fixed),
                  "-t",
                  str(TARGET),
                  "-vf",
                  vf,
                  "-map",
                  "0:v:0",
                  "-map",
                  "1:a:0",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "23",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",
                  "-ar",
                  "48000",
                  "-ac",
                  "2",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(output)
              ])


              print(
                  "SCENE FINAL:",
                  index,
                  duration(output)
              )


          print(
              "================================"
          )

          print(
              "ALL 12 SCENES RENDERED"
          )

          print(
              "REAL TTS SUBTITLES: ENABLED"
          )

          print(
              "================================"
          )

