          import json
          import os
          import subprocess

          from PIL import Image
          from PIL import ImageDraw
          from PIL import ImageFont


          # ========================================================
          # LOAD TITLE
          # ========================================================

          with open(
              "segments.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          title = data["title"]


          # ========================================================
          # THUMBNAIL TEXT
          # ========================================================

          texts = [
              "知らないと損する雑学12選",
              "へぇが止まらない雑学",
              "思わず話したくなる雑学",
              "知っていると得する話",
              "5分で楽しめる雑学",
              "雑学＋心が軽くなる話",
              "最後に少し元気になる話"
          ]


          index = (
              sum(
                  ord(c)
                  for c in title
              )
              % len(texts)
          )


          thumbnail_text = texts[index]


          # ========================================================
          # EXTRACT FRAME
          # ========================================================

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-ss",
                  "8",
                  "-i",
                  "trivia_video.mp4",
                  "-frames:v",
                  "1",
                  "-q:v",
                  "2",
                  "thumbnail_bg.jpg"
              ],
              check=True
          )


          image = Image.open(
              "thumbnail_bg.jpg"
          ).convert("RGB")


          # ========================================================
          # CROP
          # ========================================================

          W = 1280
          H = 720

          sw, sh = image.size

          source_ratio = sw / sh
          target_ratio = W / H


          if source_ratio > target_ratio:

              nw = int(
                  sh * target_ratio
              )

              left = (
                  sw - nw
              ) // 2

              image = image.crop(
                  (
                      left,
                      0,
                      left + nw,
                      sh
                  )
              )

          else:

              nh = int(
                  sw / target_ratio
              )

              top = (
                  sh - nh
              ) // 2

              image = image.crop(
                  (
                      0,
                      top,
                      sw,
                      top + nh
                  )
              )


          image = image.resize(
              (
                  W,
                  H
              ),
              Image.Resampling.LANCZOS
          )


          # ========================================================
          # DARKEN
          # ========================================================

          overlay = Image.new(
              "RGBA",
              (
                  W,
                  H
              ),
              (
                  0,
                  0,
                  0,
                  115
              )
          )


          image = Image.alpha_composite(
              image.convert("RGBA"),
              overlay
          )


          draw = ImageDraw.Draw(
              image
          )


          # ========================================================
          # FONT
          # ========================================================

          fonts = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          ]


          font_path = None

          for path in fonts:

              if os.path.exists(path):

                  font_path = path

                  break


          if not font_path:

              raise SystemExit(
                  "Japanese font not found."
              )


          font = ImageFont.truetype(
              font_path,
              70
          )


          small_font = ImageFont.truetype(
              font_path,
              34
          )


          # ========================================================
          # WRAP
          # ========================================================

          lines = []

          current = ""

          max_width = 1080


          for char in thumbnail_text:

              test = (
                  current
                  + char
              )

              bbox = draw.textbbox(
                  (
                      0,
                      0
                  ),
                  test,
                  font=font
              )

              width = (
                  bbox[2]
                  - bbox[0]
              )


              if (
                  width > max_width
                  and current
              ):

                  lines.append(
                      current
                  )

                  current = char

              else:

                  current = test


          if current:

              lines.append(
                  current
              )


          # ========================================================
          # MAIN TEXT
          # ========================================================

          line_height = 95

          total_height = (
              len(lines)
              * line_height
          )

          start_y = (
              H / 2
              - total_height / 2
          )


          for i, line in enumerate(lines):

              bbox = draw.textbbox(
                  (
                      0,
                      0
                  ),
                  line,
                  font=font
              )

              text_w = (
                  bbox[2]
                  - bbox[0]
              )

              x = (
                  W - text_w
              ) / 2

              y = (
                  start_y
                  + i * line_height
              )


              # Shadow

              draw.text(
                  (
                      x + 6,
                      y + 6
                  ),
                  line,
                  font=font,
                  fill=(0, 0, 0),
                  stroke_width=8,
                  stroke_fill=(0, 0, 0)
              )


              # Main

              draw.text(
                  (
                      x,
                      y
                  ),
                  line,
                  font=font,
                  fill=(255, 255, 255),
                  stroke_width=4,
                  stroke_fill=(0, 0, 0)
              )


          # ========================================================
          # LABEL
          # ========================================================

          label = "5分で楽しめる雑学"


          bbox = draw.textbbox(
              (
                  0,
                  0
              ),
              label,
              font=small_font
          )


          label_w = (
              bbox[2]
              - bbox[0]
          )


          draw.text(
              (
                  (W - label_w) / 2,
                  610
              ),
              label,
              font=small_font,
              fill=(255, 255, 255),
              stroke_width=2,
              stroke_fill=(0, 0, 0)
          )


          # ========================================================
          # SAVE
          # ========================================================

          quality = 90


          while quality >= 50:

              image.convert(
                  "RGB"
              ).save(
                  "thumbnail.jpg",
                  "JPEG",
                  quality=quality,
                  optimize=True
              )


              size = os.path.getsize(
                  "thumbnail.jpg"
              )


              print(
                  "THUMBNAIL:",
                  size,
                  "bytes",
                  "QUALITY:",
                  quality
              )


              if size <= 1900000:

                  break


              quality -= 5


          print(
              "THUMBNAIL CREATED"
          )


