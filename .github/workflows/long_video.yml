                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              print(result.stdout)

              if check and result.returncode != 0:

                  raise RuntimeError(
                      f"Command failed: "
                      f"{result.returncode}"
                  )

              return result


          def safe_filename(text):

              text = re.sub(
                  r'[\\/:*?"<>|]',
                  "_",
                  text
              )

              text = re.sub(
                  r"\s+",
                  "_",
                  text
              )

              return text[:100]


          def duration_seconds(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True
              )

              value = result.stdout.strip()

              if not value:
                  return 0.0

              return float(value)


          # ============================================================
