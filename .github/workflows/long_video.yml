      # =========================================================
      # 動画生成
      # =========================================================
      - name: Create video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat > create_video.py <<'PY'
          import json
          import os
          import subprocess
          import requests
          import time
          import html
          import re

          W = 1920
          H = 1080

          os.makedirs("audio", exist_ok=True)
          os.makedirs("clips", exist_ok=True)
          os.makedirs("segments", exist_ok=True)

          with open("trivia.json", encoding="utf-8") as f:
              trivia = json.load(f)

          def run(cmd):
              print("RUN:", " ".join(cmd))
              subprocess.run(cmd, check=True)

          def duration(path):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      path
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )
              return float(result.stdout.strip())

          # ---------------------------------------------------------
          # Edge TTS
          # ---------------------------------------------------------
          intro_text = (
              "絶対に誰かに話したくなる雑学30連発。"
              "知っているようで知らない、人間の脳と日常の不思議を紹介します。"
              "最後まで見ると、誰かに話したくなる雑学がきっと一つ見つかります。"
          )

          with open("intro.txt", "w", encoding="utf-8") as f:
              f.write(intro_text)

          run([
              "python", "-m", "edge_tts",
              "--voice", "ja-JP-NanamiNeural",
              "--rate=+5%",
              "--file", "intro.txt",
              "--write-media", "audio/intro.mp3"
          ])

          # ---------------------------------------------------------
          # SRT生成
          # 同じ原稿から字幕を作るのでナレーションと内容が一致する
          # ---------------------------------------------------------
          def split_text(text, max_chars=24):
              text = re.sub(r"\s+", "", text)
              parts = re.split(r"(?<=[。！？])", text)
              result = []

              for p in parts:
                  p = p.strip()
                  if not p:
                      continue

                  while len(p) > max_chars:
                      result.append(p[:max_chars])
                      p = p[max_chars:]

                  if p:
                      result.append(p)

              return result

          def srt_time(sec):
              ms = int((sec - int(sec)) * 1000)
              sec = int(sec)
              s = sec % 60
              m = (sec // 60) % 60
              h = sec // 3600
              return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"

          # ---------------------------------------------------------
          # Pexels動画取得
          # ---------------------------------------------------------
          def download_pexels(keyword, number):
              key = os.environ.get("PEXELS_API_KEY")

              if not key:
                  print("PEXELS_API_KEY is not set")
                  return None

              headers = {
                  "Authorization": key
              }

              try:
                  r = requests.get(
                      "https://api.pexels.com/videos/search",
                      headers=headers,
                      params={
                          "query": keyword,
                          "per_page": 15,
                          "orientation": "landscape"
                      },
                      timeout=30
                  )

                  if r.status_code != 200:
                      print("Pexels status:", r.status_code)
                      return None

                  videos = r.json().get("videos", [])

                  candidates = []

                  for video in videos:
                      for vf in video.get("video_files", []):
                          width = vf.get("width") or 0
                          height = vf.get("height") or 0
                          link = vf.get("link")

                          if (
                              link
                              and width >= 1280
                              and width > height
                          ):
                              candidates.append(vf)

                  if not candidates:
                      return None

                  candidates.sort(
                      key=lambda x: abs((x.get("width") or 1280) - 1920)
                  )

                  url = candidates[0]["link"]
                  path = f"clips/{number}.mp4"

                  data = requests.get(url, timeout=90)

                  if data.status_code == 200 and len(data.content) > 10000:
                      with open(path, "wb") as f:
                          f.write(data.content)

                      return path

              except Exception as e:
                  print("Pexels error:", e)

              return None

          # ---------------------------------------------------------
          # 各雑学の音声
          # ---------------------------------------------------------
          scripts = []

          for i, item in enumerate(trivia, 1):
              script = f"第{i}問。{item['script']}"
              scripts.append(script)

              txt = f"audio/{i}.txt"
              mp3 = f"audio/{i}.mp3"

              with open(txt, "w", encoding="utf-8") as f:
                  f.write(script)

              run([
                  "python", "-m", "edge_tts",
                  "--voice", "ja-JP-NanamiNeural",
                  "--rate=+3%",
                  "--file", txt,
                  "--write-media", mp3
              ])

          # ---------------------------------------------------------
          # 映像を取得
          # ---------------------------------------------------------
          for i, item in enumerate(trivia, 1):
              path = f"clips/{i}.mp4"

              if os.path.exists(path) and os.path.getsize(path) > 10000:
                  continue

              print(f"Downloading footage {i}: {item['keyword']}")

              downloaded = download_pexels(item["keyword"], i)

              if not downloaded:
                  print("Fallback video for", i)

                  run([
                      "ffmpeg", "-y",
                      "-f", "lavfi",
                      "-i", "color=c=0x111111:s=1920x1080:r=30",
                      "-f", "lavfi",
                      "-i", "noise=alls=8:allf=t+u",
                      "-t", "30",
                      "-filter_complex",
                      "[0:v][1:v]blend=all_mode=screen",
                      "-c:v", "libx264",
                      "-pix_fmt", "yuv420p",
                      path
                  ])

          # ---------------------------------------------------------
          # イントロ
          # ---------------------------------------------------------
          intro_duration = duration("audio/intro.mp3") + 1

          run([
              "ffmpeg", "-y",
              "-f", "lavfi",
              "-i", "color=c=0x101010:s=1920x1080:r=30",
              "-i", "audio/intro.mp3",
              "-t", str(intro_duration),
              "-vf",
              "drawtext="
              "fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:"
              "text='雑学30連発':"
              "fontcolor=white:"
              "fontsize=100:"
              "x=(w-text_w)/2:"
              "y=(h-text_h)/2,"
              "drawtext="
              "fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:"
              "text='最後まで見ると誰かに話したくなる':"
              "fontcolor=white:"
              "fontsize=42:"
              "x=(w-text_w)/2:"
              "y=650",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-c:a", "aac",
              "-b:a", "192k",
              "-pix_fmt", "yuv420p",
              "-shortest",
              "intro.mp4"
          ])

          segments = ["intro.mp4"]

          # ---------------------------------------------------------
          # 各雑学動画
          # ---------------------------------------------------------
          for i, item in enumerate(trivia, 1):

              audio = f"audio/{i}.mp3"
              video = f"clips/{i}.mp4"
              srt = f"segments/{i}.srt"
              output = f"segments/{i}.mp4"

              d = duration(audio) + 0.4

              # 字幕
              pieces = split_text(scripts[i-1])

              total_chars = sum(len(x) for x in pieces) or 1
              current = 0.0

              with open(srt, "w", encoding="utf-8") as f:
                  for n, piece in enumerate(pieces, 1):
                      part_duration = d * len(piece) / total_chars
                      start = current
                      end = min(d, current + part_duration)

                      f.write(
                          f"{n}\n"
                          f"{srt_time(start)} --> {srt_time(end)}\n"
                          f"{piece}\n\n"
                      )

                      current = end

              subtitle_path = os.path.abspath(srt).replace(":", "\\:")

              vf = (
                  "scale=1920:1080:force_original_aspect_ratio=increase,"
                  "crop=1920:1080,"
                  "setsar=1,"
                  "eq=saturation=1.08:contrast=1.04,"
                  "subtitles='"
                  + subtitle_path
                  + "':"
                  "force_style='"
                  "FontName=Noto Sans CJK JP,"
                  "FontSize=20,"
                  "PrimaryColour=&H00FFFFFF,"
                  "OutlineColour=&H80000000,"
                  "BorderStyle=3,"
                  "Outline=2,"
                  "Shadow=1,"
                  "Alignment=2,"
                  "MarginV=70"
                  "'"
              )

              run([
                  "ffmpeg", "-y",
                  "-stream_loop", "-1",
                  "-i", video,
                  "-i", audio,
                  "-t", str(d),
                  "-vf", vf,
                  "-map", "0:v:0",
                  "-map", "1:a:0",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-pix_fmt", "yuv420p",
                  "-shortest",
                  output
              ])

              segments.append(output)

          # ---------------------------------------------------------
          # 結合
          # ---------------------------------------------------------
          with open("concat.txt", "w", encoding="utf-8") as f:
              for path in segments:
                  f.write(f"file '{os.path.abspath(path)}'\n")

          run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat.txt",
              "-c", "copy",
              "trivia_video.mp4"
          ])

          # ---------------------------------------------------------
          # 字幕原稿も保存
          # ---------------------------------------------------------
          with open("subtitles.txt", "w", encoding="utf-8") as f:
              for i, script in enumerate(scripts, 1):
                  f.write(f"\n===== 雑学{i} =====\n")
                  f.write(script)
                  f.write("\n")

          final_duration = duration("trivia_video.mp4")

          print("======================================")
          print("VIDEO CREATED")
          print("Duration:", round(final_duration / 60, 2), "minutes")
          print("======================================")

          if final_duration < 8 * 60:
              print("WARNING: Video is shorter than expected.")

          if final_duration > 20 * 60:
              print("WARNING: Video is longer than 20 minutes.")

