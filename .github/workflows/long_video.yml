name: Generate 5-Minute Trivia Encouragement Video

on:
  workflow_dispatch:
  schedule:
    # 日本時間 12:00
    - cron: "0 3 * * *"

    # 日本時間 18:00
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    # 動画生成に時間がかかるため60分
    timeout-minutes: 60

    steps:

      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. Python
      # ========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ========================================
      # 3. System packages
      # ========================================
      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-dejavu \
            imagemagick \
            curl \
            jq


      # ========================================
      # 4. Python packages
      # ========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            pillow \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2


      # ========================================
      # 5. Prepare folders
      # ========================================
      - name: Prepare folders
        run: |
          rm -rf media output

          mkdir -p media/images
          mkdir -p media/voice
          mkdir -p media/cuts
          mkdir -p media/subtitles
          mkdir -p output


      # ========================================
      # 6. Download BGM
      # ========================================
      - name: Download BGM
        run: |
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/John_Bartmann_-_09_-_Happy_Clappy.ogg" \
            -o media/bgm.ogg

          test -s media/bgm.ogg

          echo "BGM download OK"


      # ========================================
      # 7. Check Python files
      # ========================================
      - name: Check Python files
        run: |
          echo "Checking render_video.py..."

          python -m py_compile render_video.py

          echo "Checking upload_youtube.py..."

          python -m py_compile upload_youtube.py

          echo "Python files OK"


      # ========================================
      # 8. Check trivia database
      # ========================================
      - name: Check trivia database
        run: |
          echo "========================================"
          echo "CHECK TRIVIA DATABASE"
          echo "========================================"

          if [ ! -f trivia.json ]; then
            echo "ERROR: trivia.json がありません"
            exit 1
          fi

          python - <<'PY'
          import json

          with open("trivia.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"trivia.json: {len(data)}件")

          if len(data) != 1000:
              raise SystemExit(
                  f"ERROR: trivia.json が1000件ではありません: {len(data)}件"
              )

          print("1000件OK!")
          PY


      # ========================================
      # 9. Check Pexels Secret
      # ========================================
      - name: Check Pexels Secret
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "========================================"
          echo "CHECK PEXELS API"
          echo "========================================"

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "ERROR: PEXELS_API_KEY がGitHub Secretsから取得できません。"
            exit 1
          fi

          echo "PEXELS_API_KEY: OK"


      # ========================================
      # 10. Generate long video
      # ========================================
      - name: Generate video
        env:
          PYTHONUNBUFFERED: "1"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "========================================"
          echo "START LONG VIDEO GENERATOR"
          echo "========================================"

          echo "開始時刻:"
          date

          python render_video.py

          echo "終了時刻:"
          date


      # ========================================
      # 11. Check generated files
      # ========================================
      - name: Check generated files
        run: |
          echo "========================================"
          echo "CHECK GENERATED FILES"
          echo "========================================"

          if [ ! -f output/final_video.mp4 ]; then
            echo "ERROR: final_video.mp4 がありません"
            exit 1
          fi

          if [ ! -f output/thumbnail.jpg ]; then
            echo "ERROR: thumbnail.jpg がありません"
            exit 1
          fi

          if [ ! -f output/video_info.json ]; then
            echo "ERROR: video_info.json がありません"
            exit 1
          fi

          echo ""
          echo "Video:"
          ls -lh output/final_video.mp4

          echo ""
          echo "Thumbnail:"
          ls -lh output/thumbnail.jpg

          echo ""
          echo "Video info:"
          ls -lh output/video_info.json

          echo ""
          echo "Output directory:"
          ls -lah output


      # ========================================
      # 12. Show video information
      # ========================================
      - name: Show video information
        run: |
          echo "========================================"
          echo "VIDEO INFORMATION"
          echo "========================================"

          if [ -f output/video_info.json ]; then
            cat output/video_info.json
          fi


      # ========================================
      # 13. Upload to YouTube
      # ========================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "========================================"
          echo "UPLOAD TO YOUTUBE"
          echo "========================================"

          python upload_youtube.py


      # ========================================
      # 14. Save generated files
      # ========================================
      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-long-video-${{ github.run_id }}

          path: |
            output/final_video.mp4
            output/thumbnail.jpg
            output/video_info.json
            output/irasutoya_sources.json

          retention-days: 7


      # ========================================
      # 15. Finish
      # ========================================
      - name: Complete
        run: |
          echo "========================================"
          echo "LONG VIDEO GENERATION COMPLETE"
          echo "========================================"

          echo "日本時間:"
          TZ=Asia/Tokyo date

          echo ""
          echo "今回の動画:"
          ls -lh output/final_video.mp4

          echo ""
          echo "サムネイル:"
          ls -lh output/thumbnail.jpg

          echo ""
          echo "完了しました！"
