      # =========================================================
      # サムネイル
      # =========================================================
      - name: Create thumbnail
        run: |
          ffmpeg -y \
            -f lavfi \
            -i color=c=0x101010:s=1280x720 \
            -vf "drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:text='絶対に誰かに話したくなる':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=180,drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:text='雑学30連発':fontcolor=white:fontsize=110:x=(w-text_w)/2:y=300,drawtext=fontfile=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:text='あなたはいくつ知ってる？':fontcolor=white:fontsize=46:x=(w-text_w)/2:y=470" \
            -frames:v 1 \
            thumbnail.jpg

      # =========================================================
      # GitHubから動画を確認できるように保存
      # =========================================================
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivia-video
          path: |
            trivia_video.mp4
            thumbnail.jpg
            subtitles.txt
            segments/*.srt
          retention-days: 7

      # =========================================================
      # YouTube自動投稿
      # =========================================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          scopes = [
              "https://www.googleapis.com/auth/youtube.upload"
          ]

          credentials = Credentials(
              None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=scopes
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": "絶対に誰かに話したくなる雑学30連発【知らないと損】",
                  "description": """
          知っているようで知らない雑学を30個紹介します。

          人間の脳、記憶、睡眠、音楽、スマホ、日常生活など、
          思わず誰かに話したくなる雑学をまとめました。

          あなたはいくつ知っていましたか？

          #雑学
          #豆知識
          #トリビア
          #面白い雑学
          #知識
                  """.strip(),
                  "tags": [
                      "雑学",
                      "豆知識",
                      "トリビア",
                      "面白い雑学",
                      "雑学動画",
                      "知識",
                      "脳科学",
                      "心理学",
                      "睡眠",
                      "人間の不思議"
                  ],
                  "categoryId": "27"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "trivia_video.mp4",
              mimetype="video/mp4",
              resumable=True,
              chunksize=1024 * 1024 * 8
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None

          while response is None:
              status, response = request.next_chunk()

              if status:
                  print(
                      "Upload progress:",
                      int(status.progress() * 100),
                      "%"
                  )

          print("======================================")
          print("YouTube upload complete")
          print("Video ID:", response["id"])
          print(
              "https://www.youtube.com/watch?v="
              + response["id"]
          )
          print("======================================")
          PY

          python upload_youtube.py
