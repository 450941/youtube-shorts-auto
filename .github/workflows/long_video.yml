          # ==========================================================
          # SOFT SUBTITLE
          #
          # 黒背景なし
          # 優しい文字
          # 薄い影
          # ==========================================================

          ASS_HEADER = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          ScaledBorderAndShadow: yes
          WrapStyle: 2

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Soft,Noto Sans CJK JP,54,&H00FFFDF5,&H00FFFDF5,&H33000000,&H00000000,0,0,0,0,100,100,0,0,1,1.0,2.0,2,70,70,150,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """


          def ass_time(seconds):

              h = int(seconds // 3600)

              m = int(
                  (seconds % 3600) // 60
              )

              s = int(seconds % 60)

              cs = int(
                  round(
                      (seconds - int(seconds))
                      * 100
                  )
              )

              if cs >= 100:
                  s += 1
                  cs = 0

              return (
                  f"{h}:{m:02d}:{s:02d}.{cs:02d}"
              )


          def escape_ass(text):

              text = str(text)

              text = text.replace(
                  "\\",
                  r"\\"
              )

              text = text.replace(
                  "{",
                  r"\{"
              )

              text = text.replace(
                  "}",
                  r"\}"
              )

              return text.replace(
                  "\n",
                  r"\N"
              )


          # ==========================================================
          # SHORT SUBTITLE WRAP
          # ==========================================================

          def make_short_lines(text):

              text = normalize_text(text)

              # ある程度短く切る
              if len(text) <= 17:
                  return text

              # 読点・句点優先
              separators = [
                  "？",
                  "！",
                  "。",
                  "、"
              ]

              for sep in separators:

                  if sep in text:

                      parts = text.split(sep)

                      if len(parts) >= 2:

                          left = parts[0].strip()
                          right = sep.join(
                              parts[1:]
                          ).strip()

                          if left and right:

                              return (
                                  left
                                  + r"\N"
                                  + right
                              )

              # 真ん中で切る
              middle = len(text) // 2

              return (
                  text[:middle]
                  + r"\N"
                  + text[middle:]
              )


          # ==========================================================
          # BUILD SUBTITLE EVENTS
          # ==========================================================

          subtitle_events = []

          current_time = 0

          for fact in selected_facts:

              for seg in fact["audio_segments"]:

                  start = current_time
                  end = (
                      current_time
                      + seg["duration"]
                  )

                  text = make_short_lines(
                      seg["text"]
                  )

                  subtitle_events.append({
                      "start": start,
                      "end": end,
                      "text": text
                  })

                  current_time = end


          subtitle_path = (
              "media/subtitles/main.ass"
          )

          lines = [ASS_HEADER]

          for event in subtitle_events:

              lines.append(
                  "Dialogue: 0,"
                  f"{ass_time(event['start'])},"
                  f"{ass_time(event['end'])},"
                  "Soft,,0,0,0,,"
                  f"{event['text']}"
              )

          Path(
