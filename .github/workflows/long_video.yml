          def prepare_image(src, dst):

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  src,
                  "-vf",
                  (
                      "scale=900:1500:"
                      "force_original_aspect_ratio=decrease,"
                      "pad=900:1500:"
                      "(ow-iw)/2:"
                      "(oh-ih)/2:"
                      "color=ffffff"
                  ),
                  "-frames:v",
                  "1",
                  dst
              ])


