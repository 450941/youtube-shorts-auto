          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |

          cat > upload_youtube.py <<'PY'

          import os
          import json

          from pathlib import Path

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload


          VIDEO = (
              "output/final_video.mp4"
          )

          THUMBNAIL = (
              "output/thumbnail.jpg"
          )


          credentials = Credentials(
              None,

              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],

              token_uri=
                  "https://oauth2.googleapis.com/token",

              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],

              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],

              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          with open(
              "output/metadata.json",
              "r",
              encoding="utf-8"
          ) as f:

              metadata = json.load(f)


          facts = metadata.get(
              "facts",
              []
          )


          first_title = (
              facts[0]["title"]
              if facts
              else "知ると面白い身近な雑学"
          )


          title = (
              first_title
              + " 知ると面白い身近な雑学10選"
          )


          title = title[:95]


          description = """
          身近な「なぜ？」を集めた雑学動画です。

          心理、身体、食べ物、恋愛、日常など、
          普段の生活でふと気になる疑問を紹介しています。

          気になった雑学があったら
          コメントで教えてください。

          BGM:
          Happy Clappy
          John Bartmann
          CC0 1.0

          #雑学
          #豆知識
          #面白い雑学
          #心理学
          #日常
          """


          body = {

              "snippet": {

                  "title":
                      title,

                  "description":
                      description,

                  "categoryId":
                      "27",

                  "tags": [

                      "雑学",
                      "豆知識",
                      "面白い雑学",
                      "心理学",
                      "身近な疑問",
                      "トリビア",
                      "日常"
                  ]

              },

              "status": {

                  "privacyStatus":
                      "public",

                  "selfDeclaredMadeForKids":
                      False

              }

          }


          print(
              "Uploading:"
          )

          print(
              title
          )


          media = MediaFileUpload(
              VIDEO,

              mimetype=
                  "video/mp4",

              resumable=True
          )


          request = youtube.videos().insert(
              part="snippet,status",

              body=body,

              media_body=media
          )


          response = None


          while response is None:

              status, response = (
                  request.next_chunk()
              )

              if status:

                  print(
                      "Upload:",
                      int(
                          status.progress()
                          * 100
                      ),
                      "%"
                  )


          video_id = response[
              "id"
          ]


          print()
          print(
              "================================"
          )

          print(
              "YOUTUBE UPLOAD COMPLETE"
          )

          print(
              "================================"
          )

          print(
              "Video ID:",
              video_id
          )

          print(
              "URL:",
              "https://www.youtube.com/watch?v="
              + video_id
          )


          # ============================================================
          # Thumbnail
          # ============================================================

          if Path(
              THUMBNAIL
          ).exists():

              try:

                  youtube.thumbnails().set(
                      videoId=video_id,

                      media_body=MediaFileUpload(
                          THUMBNAIL,
                          mimetype="image/jpeg"
                      )
                  ).execute()

                  print(
                      "Thumbnail uploaded."
                  )

              except Exception as e:

                  print(
                      "Thumbnail error:",
                      e
                  )


          # ============================================================
          # Save upload information
          # ============================================================

          with open(
              "output/upload_info.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "video_id":
                          video_id,

                      "url":
                          "https://www.youtube.com/watch?v="
                          + video_id,

                      "title":
                          title
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          PY

          python upload_youtube.py


      # ============================================================
      # 9. Upload artifacts
      # ============================================================
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-trivia-video
          path: |
            output/final_video.mp4
            output/thumbnail.jpg
            output/metadata.json
            output/upload_info.json
          retention-days: 7
