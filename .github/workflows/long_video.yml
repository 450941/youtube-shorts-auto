          # ========================================================

          closings = [
              "今日が完璧じゃなくても大丈夫です。明日はまた別の日。自分のペースでいきましょう。",
              "ここまで見たあなたへ。今日も一日お疲れさまでした。明日は今日より少しだけ楽になりますように。",
              "全部頑張らなくて大丈夫です。できることを一つずつ。それで十分です。",
              "世界には知らないことがまだたくさんあります。そしてあなたの未来にも、まだ知らない景色があります。",
              "今日うまくいかなかったことは、今日の終わりと一緒に置いていきましょう。明日はまた始められます。",
              "少しでも面白いと思ってもらえたなら、それで十分です。今日も自分の時間を大切にしてください。",
