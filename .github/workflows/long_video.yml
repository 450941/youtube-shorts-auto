name: Generate 5-Minute Trivia Encouragement Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            jq

          pip install --upgrade pip

          pip install \
            edge-tts \
            requests \
            pillow \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2


      # ============================================================
      # GENERATE CONTENT
      # ============================================================

      - name: Generate massive variation content
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |

          cat > generate_content.py <<'PY'

          import json
          import random
          import secrets
          import time
          import os


          # ========================================================
          # RANDOM SEED
          # ========================================================

          run_id = os.environ.get(
              "GITHUB_RUN_ID",
              "0"
          )

          seed = (
              int(time.time() * 1000000)
              ^ secrets.randbits(64)
              ^ hash(run_id)
          )

          random.seed(seed)

          print("SEED:", seed)


          # ========================================================
          # HOOKS
          # ========================================================

          hooks = [
              "実は今日、知っているだけで少し得をする話を紹介します。",
              "これ、意外と知らない人が多い話です。",
              "最後まで見ると、誰かに話したくなるかもしれません。",
              "今日は、頭に残る雑学と少しだけ心が軽くなる話です。",
              "知っているようで知らないことを紹介します。",
              "たった5分で、いくつ新しい発見があるでしょうか。",
              "最初は普通の話ですが、意外な話が出てきます。",
              "あなたはいくつ知っていますか？",
              "身近なところにある不思議を覗いてみましょう。",
              "学校ではあまり教えてくれない話を集めました。",
              "知識だけではなく、最後に少し元気になれる話も入っています。",
              "今日という日が少しだけ面白くなる話を始めます。",
              "誰かとの会話で使える話を集めました。",
              "え、そうなの？と思う話が登場します。",
              "知らなくても困らない。でも知ると面白い。そんな話です。",
              "今回は雑学だけで終わりません。",
              "世界の不思議から、日々を頑張るあなたへの言葉まで。",
              "少し疲れている人にも聞いてほしい5分間です。",
              "暇つぶしのつもりで、最後まで聞いてみてください。",
              "今日一つでも新しい発見があれば、それだけで十分です。"
          ]


          # ========================================================
          # FACTS
          # ========================================================

          facts = [

              ("バナナ",
               "バナナは一般的には果物ですが、植物学ではベリーの仲間に分類されます。普段のイメージと植物学上の分類が違う代表的な食べ物です。",
               "banana tropical fruit plantation"),

              ("タコ",
               "タコには三つの心臓があります。二つはえらに血液を送り、もう一つが全身に血液を送ります。海の生き物には驚く仕組みがあります。",
               "octopus underwater ocean"),

              ("ハチミツ",
