              "自分を責めることに使っている力を、今日は少しだけ自分を休ませるために使ってみてください。",
              "完璧じゃなくても大丈夫です。七割でも一歩進めたなら、それは十分に意味があります。",
              "昨日の自分と今日の自分を比べてみてください。ほんの少しでも変わっていれば、それは前進です。",
              "頑張れない日があるからといって、頑張ってきた時間までなくなるわけではありません。",
              "誰かに認めてもらえない日でも、自分が積み重ねた時間は消えません。",
              "焦らなくて大丈夫です。人生には、急がなくてもいい時間があります。",
              "今日できたことが一つでもあるなら、それをちゃんと数えてあげてください。",
              "自信がなくても始めることはできます。自信は、始めた後についてくることもあります。",
              "明日の自分を少し楽にするために、今日は一つだけ片付けてみる。それくらいで十分です。",
              "人生は一日で決まりません。今日の結果だけで、自分の未来まで決めなくて大丈夫です。",
              "今日を頑張った自分に、最後くらい優しい言葉をかけてあげてください。"
          ]


          # ========================================================
