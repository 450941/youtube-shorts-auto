name: Generate 5-Minute Trivia Encouragement Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # SYSTEM
      # ============================================================
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-dejavu \
            fonts-noto-color-emoji \
            imagemagick \
            curl \
            jq

      # ============================================================
      # PYTHON PACKAGES
      # ============================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            beautifulsoup4 \
            pillow \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ============================================================
      # DIRECTORIES
      # ============================================================
      - name: Prepare directories
        run: |
          rm -rf media
          rm -rf output
          mkdir -p media
          mkdir -p media/images
          mkdir -p media/voice
          mkdir -p media/cuts
          mkdir -p media/subtitles
          mkdir -p output

      # ============================================================
      # BGM
      # ============================================================
      - name: Download BGM
        run: |
          curl -L \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/John_Bartmann_-_09_-_Happy_Clappy.ogg" \
            -o media/bgm.ogg

      # ============================================================
      # CREATE RENDER SCRIPT
      # ============================================================
      - name: Create render_video.py
        run: |
          cat > render_video.py <<'PY'
          import os
          import re
          import json
          import time
          import random
          import hashlib
          import subprocess
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image


          # ==========================================================
          # CONFIG
          # ==========================================================

          WIDTH = 1080
          HEIGHT = 1920

          MAX_FACTS = 10

          # いらすとやのユニーク素材は19点以内
          # サムネイルに1点使っても合計20点以内
          IMAGE_LIMIT = 19

          VOICE = "ja-JP-NanamiNeural"
          VOICE_RATE = "+8%"
          VOICE_VOLUME = 1.0

          BGM_VOLUME = 0.035

          FPS = 30

          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/128 Safari/537.36"
          })


          # ==========================================================
          # FACT DATABASE
          #
          # 重要:
          # ただ文章を読むのではなく
          #
          # HOOK
          # ↓
          # ANSWER
          # ↓
          # REASON
          # ↓
          # PUNCH
          #
          # の4段構成にする
          # ==========================================================

          facts = [

              {
                  "title": "なぜ楽しい時間はあっという間？",
                  "hook": "楽しい時間って、なんで一瞬で終わると思う？",
                  "answer": "実は、時間そのものを意識しなくなるから。",
                  "reason": "楽しいことに集中すると、脳は目の前の出来事に注意を向けます。",
                  "punch": "だから気づいたら「もうこんな時間？」になるんです。",
                  "visual": ["笑う人", "楽しむ人", "遊ぶ人", "時計を見る人"]
              },

              {
                  "title": "寝る前に昔を思い出す理由",
                  "hook": "布団に入った瞬間、昔のことを思い出すことない？",
                  "answer": "実は、静かになると記憶が浮かびやすくなるから。",
                  "reason": "昼間は仕事や学校など、外から入る情報を大量に処理しています。",
                  "punch": "そして静かになった瞬間、頭の中に残っていた記憶が出てくるんです。",
