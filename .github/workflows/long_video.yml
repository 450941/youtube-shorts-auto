              "知っているようで知らないことを、12個紹介します。",
              "たった5分で、いくつ新しい発見があるでしょうか。",
              "最初は普通の話ですが、後半に意外な話が出てきます。",
              "あなたはいくつ知っていますか？",
              "身近なところにある不思議を、今日は少しだけ覗いてみましょう。",
              "学校ではあまり教えてくれない話を集めました。",
              "知識だけではなく、最後に少し元気になれる話も入っています。",
              "今日という日が少しだけ面白くなる話を始めます。",
              "誰かとの会話で使える話を集めました。",
              "『え、そうなの？』と思う話がいくつか登場します。",
              "知らなくても困らない。でも知ると面白い。そんな話です。",
              "今回は雑学だけで終わりません。",
              "世界の不思議から、日々を頑張るあなたへの言葉まで。",
              "少し疲れている人にも聞いてほしい5分間です。",
