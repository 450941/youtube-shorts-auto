name: Generate Long Trivia Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install edge-tts requests google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      # =========================================================
      # 30本の長め雑学原稿を作成
      # =========================================================
      - name: Generate trivia scripts
        run: |
          cat > generate_trivia.py <<'PY'
          import json

          trivia = [

            {
              "title": "人間の脳は「何もしない時」も動いている",
              "keyword": "brain thinking",
              "script": """
          まず最初の雑学です。
          実は、人間の脳は「何もしていない時」でも完全に休んでいるわけではありません。
          ぼーっとしている時、何も考えていないように感じますよね。
          でも脳の中では、過去の出来事を思い出したり、これから起こることを想像したり、自分自身について考えたりする活動が続いています。
          つまり、ベッドでぼーっとしている時間も、脳が完全に停止している時間ではありません。
          むしろ、突然いいアイデアが浮かんだり、悩みの答えが出てきたりするのは、こうした時間が関係していることがあります。
          「何もしない時間」って、実は完全な無駄ではないのかもしれません。
              """.strip()
            },

            {
              "title": "匂いで昔の記憶が突然よみがえる理由",
              "keyword": "perfume memory",
              "script": """
          次の雑学。
          昔の記憶が、突然よみがえった経験はありませんか？
          特に不思議なのが「匂い」です。
          例えば、昔住んでいた家の匂いを嗅いだ瞬間、何年も思い出していなかった記憶が一気によみがえることがあります。
          これは偶然ではありません。
          嗅覚は、感情や記憶に関係する脳の領域と強く結びついています。
          だから、写真を見るよりも、昔の匂いを嗅いだほうが当時の感情までリアルによみがえることがあります。
          香水、雨の匂い、学校の教室、実家の料理。
          あなたにも「この匂いを嗅ぐと昔を思い出す」というものがあるかもしれません。
              """.strip()
            },

            {
              "title": "知らない場所では時間が長く感じることがある",
              "keyword": "travel city walking",
              "script": """
          旅行に行った時、行きは長く感じたのに、帰りはあっという間だった。
          そんな経験ありませんか？
          実は、人間の時間の感じ方は、出来事の数や新しさに影響されます。
          初めて行く場所では、見るもの、聞くもの、覚えるものがたくさんあります。
          そのため、後から振り返ると「ものすごく長い時間を過ごした」ように感じることがあります。
          一方、いつもの通勤や通学のように、毎日同じことを繰り返していると、記憶に残る新しい情報が少なくなります。
          すると、振り返った時に時間が一瞬で過ぎたように感じることがあります。
          「最近、一年が早すぎる」と感じるなら、新しいことを始めてみるのも面白いかもしれません。
              """.strip()
            },

            {
              "title": "同じ曲を何度も聴くと好きになることがある",
              "keyword": "headphones music",
              "script": """
          最初は特に好きじゃなかった曲なのに、何度も聴いているうちに好きになった。
          こんな経験ありませんか？
          これは、人間の心理として知られている現象の一つです。
          同じものに繰り返し触れることで、親しみを感じやすくなることがあります。
          曲の最初の印象が普通でも、何度も聴いているうちにメロディーを覚え、次に来る展開まで予想できるようになります。
          そして「知っている」という感覚が、心地よさにつながることがあります。
          だから、何度も聴いてしまう曲があるのは不思議なことではありません。
          気づいたら口ずさんでいる曲ほど、あなたの頭の中にしっかり入り込んでいるのかもしれません。
              """.strip()
            },

            {
              "title": "人は自分の名前に反応しやすい",
              "keyword": "people conversation",
              "script": """
          騒がしい場所でも、自分の名前だけは聞こえた。
          そんな経験ありませんか？
          実は、人間は自分に関係する情報へ注意を向けやすい傾向があります。
          たくさんの人が話している場所でも、自分の名前や、自分に関係する話題が聞こえると、急に注意が向くことがあります。
          これは、自分にとって重要な情報を脳が優先して処理するためだと考えられています。
          だから、人混みの中で名前を呼ばれると、思わず振り返ってしまいます。
          逆に言えば、誰かと話す時に相手の名前を呼ぶことは、相手の注意を引くきっかけにもなります。
          ただし、使いすぎるとちょっと不自然なので、そこはほどほどに。
              """.strip()
            },

            {
              "title": "眠っている間に記憶は整理されている",
              "keyword": "sleep bedroom",
              "script": """
          寝るという行為は、ただ体を休ませるだけではありません。
          実は睡眠中、脳では記憶や学習に関係するさまざまな処理が行われています。
          昼間に覚えたことを、睡眠によって整理し、長期的な記憶として定着させる働きがあると考えられています。
          だから、テスト前に徹夜して全部覚えようとするより、勉強した後にしっかり眠ることも大切です。
          「寝たら忘れそう」と思うかもしれません。
          でも実際には、睡眠は記憶を整理するための大切な時間でもあります。
          今日覚えたことを脳に定着させるためにも、睡眠は意外と重要なんです。
              """.strip()
            },

            {
              "title": "朝の光が体内時計に関係している",
              "keyword": "morning sunlight",
              "script": """
          朝起きたらカーテンを開ける。
          たったこれだけの行動が、生活リズムに関係しています。
          人間の体には、約一日の周期で変化する体内時計があります。
          そして光は、その体内時計を調整する重要な刺激の一つです。
          朝に光を浴びることで、体は「今は朝なんだ」と認識しやすくなります。
          反対に、夜遅くまで強い光を浴び続けると、眠気のタイミングに影響することがあります。
          もちろん生活リズムには個人差があります。
          でも、朝起きて太陽の光を浴びるというシンプルな習慣には、体内時計を整える助けになる面があります。
              """.strip()
            },

            {
              "title": "人間は同時に何個ものことへ集中するのが苦手",
              "keyword": "multitasking computer",
              "script": """
          スマホを見ながらテレビを見て、さらに誰かと話す。
          自分はマルチタスクが得意だと思っていませんか？
          実は、人間の注意力は、何個もの作業を同時に完全処理しているというより、作業を高速で切り替えていることが多いとされています。
          例えばメッセージを確認してから仕事に戻ると、仕事へ再び集中するまでに少し時間がかかります。
          これを何度も繰り返すと、思った以上に集中力が削られることがあります。
          「ながら作業なら時間を有効活用できる」と思っていても、実際には切り替えそのものにコストがかかっている場合があります。
          集中したい時は、一つだけに絞る。
          シンプルですが、かなり大切な考え方です。
              """.strip()
            },

            {
              "title": "予想外の出来事に脳が強く反応する",
              "keyword": "surprise reaction",
              "script": """
          人間は、予想していたことより、予想外のことが起きた時に強く反応します。
          例えば、普通の動画を見ている途中で突然展開が変わると、思わず画面に集中しますよね。
          これは、脳が常に「次に何が起こるか」をある程度予測しているからです。
          そして現実が予測と違った時、その違いが重要な情報として扱われます。
          「え、そうなるの？」という瞬間に注意が向くのは、そのためです。
          面白い動画に意外な展開が多いのも、こうした人間の性質と相性がいいからかもしれません。
          つまり、予想を裏切る瞬間には、人間の注意を一気に引きつける力があります。
              """.strip()
            },

            {
              "title": "小さな達成感が次の行動につながる",
              "keyword": "achievement success",
              "script": """
          「今日は何もできなかった」と思ってしまう日ってありますよね。
          そんな時は、目標をものすごく小さくしてみる方法があります。
          例えば、部屋を全部掃除するのではなく、机の上だけ片づける。
