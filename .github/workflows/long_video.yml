name: Generate Long Trivia Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fontconfig \
            jq \
            bc

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          python -m pip install google-api-python-client
          python -m pip install google-auth
          python -m pip install google-auth-httplib2
          python -m pip install google-auth-oauthlib

      - name: Test Edge TTS
        run: |
          echo "これは音声テストです。" > test_tts.txt

          python -m edge_tts \
            --voice ja-JP-NanamiNeural \
            --rate=-5% \
            --file test_tts.txt \
            --write-media test_tts.mp3

          test -f test_tts.mp3

          echo "Edge-TTS OK"

      - name: Generate trivia
        run: |
          test -f generate_trivia.py
          python generate_trivia.py
          test -f trivia.json

      - name: Check trivia
        run: |
          COUNT=$(jq length trivia.json)

          echo "雑学件数: $COUNT"

          if [ "$COUNT" -lt 120 ]; then
            echo "ERROR: 120件未満です"
            exit 1
          fi

      - name: Select trivia
        run: |
          python - <<'PY'
          import json
          import random

          with open("trivia.json", encoding="utf-8") as f:
              data = json.load(f)

          random.shuffle(data)

          selected = data[:120]

          for i, item in enumerate(selected, 1):
              item["video_index"] = i

          with open(
              "selected_trivia.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  selected,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("今回使用:", len(selected))
          PY

      - name: Create folders
        run: |
          rm -rf audio clips segments subtitles
          mkdir -p audio clips segments subtitles

      - name: Generate narration and footage
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.parse
          import time

          with open(
              "selected_trivia.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          API_KEY = os.environ["PEXELS_API_KEY"]

          keyword_map = {
              "octopus": [
                  "octopus underwater",
                  "octopus ocean",
                  "octopus animal"
              ],
              "cat": [
                  "cat animal",
                  "cat close up",
                  "cute cat"
              ],
              "dog": [
                  "dog animal",
                  "dog running",
                  "dog close up"
              ],
              "bird": [
                  "birds flying",
                  "bird nature",
                  "birds wildlife"
              ],
              "shark": [
                  "shark ocean",
                  "shark underwater",
                  "shark swimming"
              ],
              "whale": [
                  "whale ocean",
                  "whale underwater",
                  "whale swimming"
              ],
              "dolphin": [
                  "dolphin ocean",
                  "dolphin underwater",
                  "dolphins swimming"
              ],
              "fish": [
                  "fish underwater",
                  "tropical fish",
                  "fish ocean"
              ],
              "brain": [
                  "human brain",
                  "brain neuroscience",
                  "human neuroscience"
              ],
              "heart": [
                  "human heart",
                  "heart medical",
                  "human body"
              ],
              "blood": [
                  "blood cells",
                  "blood medical",
                  "human blood"
              ],
              "sleep": [
                  "sleeping person",
                  "sleep bedroom",
                  "person sleeping"
              ],
              "eye": [
                  "human eye",
                  "eye close up",
                  "human face eye"
              ],
              "ear": [
                  "human ear",
                  "ear close up",
                  "human anatomy"
              ],
              "moon": [
                  "moon space",
                  "moon night",
                  "full moon"
              ],
              "sun": [
                  "sun space",
                  "sun sky",
                  "sunlight"
              ],
              "planet": [
                  "planet space",
                  "solar system",
                  "space planet"
              ],
              "black hole": [
                  "black hole space",
                  "space galaxy",
                  "deep space"
              ],
              "galaxy": [
                  "galaxy space",
                  "milky way",
                  "deep space"
              ],
              "space": [
                  "outer space",
                  "galaxy stars",
                  "space universe"
              ],
              "ocean": [
                  "ocean underwater",
                  "deep ocean",
                  "ocean waves"
              ],
              "water": [
                  "water",
                  "water drops",
                  "ocean water"
              ],
              "ice": [
                  "ice close up",
                  "ice glacier",
                  "melting ice"
              ],
              "fire": [
                  "fire flames",
                  "fire close up",
                  "burning fire"
              ],
              "rain": [
                  "rain",
                  "rain drops",
                  "rain city"
              ],
              "snow": [
                  "snow",
                  "snowfall",
                  "winter snow"
              ],
              "forest": [
                  "forest",
                  "forest trees",
                  "nature forest"
              ],
              "train": [
                  "train railway",
                  "high speed train",
                  "Japanese train"
              ],
              "japan": [
                  "Japan Tokyo",
                  "Japan city",
                  "Japanese street"
              ],
              "computer": [
                  "computer technology",
                  "computer screen",
                  "technology"
              ],
              "internet": [
                  "internet technology",
                  "computer network",
                  "digital technology"
              ],
              "robot": [
                  "robot technology",
                  "robot",
                  "artificial intelligence"
              ],
              "food": [
                  "food cooking",
                  "food close up",
                  "Japanese food"
              ],
              "science": [
                  "science laboratory",
                  "scientist experiment",
                  "science experiment"
              ],
              "nature": [
                  "nature landscape",
                  "nature wildlife",
                  "beautiful nature"
              ]
          }

          def run(cmd):
              print(cmd)

              result = subprocess.run(
                  cmd,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"失敗: {cmd}"
                  )

          def duration(path):
              result = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      path
                  ]
              )

              return float(
                  result.decode().strip()
              )

          def search_pexels(query):
              params = urllib.parse.urlencode({
                  "query": query,
                  "orientation": "landscape",
                  "size": "large",
                  "per_page": 15
              })

              url = (
                  "https://api.pexels.com/videos/search?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": API_KEY
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      return json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      ).get("videos", [])

              except Exception as e:
                  print(
                      "Pexels検索失敗:",
                      e
                  )

                  return []

          def select_video(videos):

              candidates = []

              for video in videos:

                  for vf in video.get(
                      "video_files",
                      []
                  ):

                      link = vf.get("link")
                      width = vf.get("width") or 0
                      height = vf.get("height") or 0

                      if not link:
                          continue

                      if width < 1000:
                          continue

                      if height <= 0:
                          continue

                      if width <= height:
                          continue

                      score = width

                      quality = str(
                          vf.get(
                              "quality",
                              ""
                          )
                      ).lower()

                      if quality == "hd":
                          score += 5000

                      if quality == "sd":
                          score -= 1000

                      candidates.append(
                          (score, link)
                      )

              if not candidates:
                  return None

              candidates.sort(
                  reverse=True
              )

              return candidates[0][1]

          for index, item in enumerate(
              data,
              1
          ):

              fact = str(
                  item.get(
                      "fact",
                      ""
                  )
              ).strip()

              keyword = str(
                  item.get(
                      "keyword",
                      ""
                  )
              ).lower().strip()

              # narration text
              script = (
                  "これ、知っていましたか？ "
                  + fact
                  + "。 "
                  + "でも、ここからが面白いところです。 "
                  + "一見すると普通に思えますが、実はかなり意外です。 "
                  + "こうした身近な事実を知ると、普段見ているものが少し違って見えてきます。"
              )

              # 長すぎる場合は短縮
              if len(script) > 180:
                  script = (
                      "これ、知っていましたか？ "
                      + fact
                      + "。 "
                      + "でも、ここからが面白いところです。 "
                      + "実は、この事実には意外なポイントがあります。"
                  )

              txt = f"audio/{index}.txt"
              mp3 = f"audio/{index}.mp3"

              with open(
                  txt,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(script)

              run(
                  f'python -m edge_tts '
                  f'--voice ja-JP-NanamiNeural '
                  f'--rate=-5% '
                  f'--file "{txt}" '
                  f'--write-media "{mp3}"'
              )

              audio_duration = duration(
                  mp3
              )

              queries = keyword_map.get(
                  keyword,
                  [
                      keyword,
                      "interesting science",
                      "nature documentary"
                  ]
              )

              selected_url = None

              for query in queries:

                  print(
                      f"Pexels検索: {query}"
                  )

                  videos = search_pexels(
                      query
                  )

                  selected_url = select_video(
                      videos
                  )

                  if selected_url:
                      break

              clip = (
                  f"clips/{index}.mp4"
              )

              downloaded = False

              if selected_url:

                  try:
                      urllib.request.urlretrieve(
                          selected_url,
                          clip
                      )

                      if os.path.getsize(
                          clip
                      ) > 100000:

                          subprocess.run(
                              [
                                  "ffprobe",
                                  "-v",
                                  "error",
                                  clip
                              ],
                              check=True
                          )

                          downloaded = True

                  except Exception as e:

                      print(
                          "映像取得失敗:",
                          e
                      )

              if not downloaded:

                  print(
                      "映像なし。代替映像を作成"
                  )

                  run(
                      f'ffmpeg -y '
                      f'-f lavfi '
                      f'-i "testsrc2='
                      f'size=1920x1080:rate=30" '
                      f'-t {audio_duration} '
                      f'-vf "eq='
                      f'brightness=-0.05:'
                      f'saturation=1.2" '
                      f'-c:v libx264 '
                      f'-pix_fmt yuv420p '
                      f'"{clip}"'
                  )

              segment = (
                  f"segments/{index}.mp4"
              )

              run(
                  f'ffmpeg -y '
                  f'-stream_loop -1 '
                  f'-i "{clip}" '
                  f'-i "{mp3}" '
                  f'-t {audio_duration} '
                  f'-vf "scale=1920:1080:'
                  f'force_original_aspect_ratio=increase,'
                  f'crop=1920:1080" '
                  f'-map 0:v:0 '
                  f'-map 1:a:0 '
                  f'-c:v libx264 '
                  f'-preset veryfast '
                  f'-crf 23 '
                  f'-pix_fmt yuv420p '
                  f'-c:a aac '
                  f'-b:a 128k '
                  f'-shortest '
                  f'"{segment}"'
              )

              # scriptを保存
              with open(
                  f"subtitles/{index}.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(script)

              print(
                  f"{index}/120 完了"
              )

              time.sleep(0.2)

          print(
              "映像・音声生成完了"
          )
          PY

      - name: Create concat list
        run: |
          rm -f concat.txt

          for file in segments/*.mp4
          do
            echo "file '$PWD/$file'" >> concat.txt
          done

          cat concat.txt

      - name: Concatenate video
        run: |
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            long_raw.mp4

      - name: Generate subtitles
        run: |
          python - <<'PY'
          import json
          import subprocess
          import os

          with open(
              "selected_trivia.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          def get_duration(path):

              result = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      path
                  ]
              )

              return float(
                  result.decode().strip()
              )

          def timestamp(sec):

              ms = int(sec * 1000)

              h = ms // 3600000
              m = (
                  ms % 3600000
              ) // 60000
              s = (
                  ms % 60000
              ) // 1000
              ms = ms % 1000

              return (
                  f"{h:02d}:"
                  f"{m:02d}:"
                  f"{s:02d},"
                  f"{ms:03d}"
              )

          def split_text(text):

              chunks = []

              while len(text) > 22:

                  cut = -1

                  for mark in [
                      "。",
                      "！",
                      "？",
                      "、"
                  ]:

                      p = text.rfind(
                          mark,
                          0,
                          22
                      )

                      if p > cut:
                          cut = p

                  if cut < 5:
                      cut = 21

                  chunks.append(
                      text[
                          :cut + 1
                      ].strip()
                  )

                  text = text[
                      cut + 1:
                  ].strip()

              if text:
                  chunks.append(text)

              return chunks

          current = 0
          subtitle_id = 1

          with open(
              "subtitles.srt",
              "w",
              encoding="utf-8"
          ) as srt:

              for index in range(
                  1,
                  len(data) + 1
              ):

                  path = (
                      f"audio/{index}.mp3"
                  )

                  text_path = (
                      f"subtitles/{index}.txt"
                  )

                  if not os.path.exists(
                      path
                  ):
                      continue

                  with open(
                      text_path,
                      encoding="utf-8"
                  ) as f:
                      text = f.read().strip()

                  d = get_duration(
                      path
                  )

                  chunks = split_text(
                      text
                  )

                  if not chunks:
                      continue

                  total_chars = sum(
                      len(x)
                      for x in chunks
                  )

                  offset = 0

                  for chunk in chunks:

                      chunk_time = (
                          d
                          * len(chunk)
                          / total_chars
                      )

                      start = (
                          current
                          + offset
                      )

                      end = (
                          start
                          + chunk_time
                      )

                      srt.write(
                          f"{subtitle_id}\n"
                      )

                      srt.write(
                          f"{timestamp(start)} --> "
                          f"{timestamp(end)}\n"
                      )

                      srt.write(
                          chunk
                          + "\n\n"
                      )

                      subtitle_id += 1

                      offset += chunk_time

                  current += d

          print(
              "字幕生成完了"
          )
          PY

      - name: Render subtitles
        run: |
          ffmpeg -y \
            -i long_raw.mp4 \
            -vf "subtitles=subtitles.srt:force_style='FontName=Noto Sans CJK JP,FontSize=42,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=3,Shadow=1,Alignment=2,MarginV=65'" \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            long_video.mp4

      - name: Generate YouTube metadata
        run: |
          python - <<'PY'
          import json
          import random

          with open(
              "selected_trivia.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          title_list = [
              "最後まで見ると誰かに話したくなる雑学120選",
              "「え、そうなの？」知った瞬間に驚く雑学120選",
              "実は知らない人が多い雑学120選",
              "ほとんどの人が知らない意外な雑学120選",
              "次々と予想を裏切ってくる雑学120選"
          ]

          title = random.choice(
              title_list
          )

          description = (
              "知っているようで知らない。"
              "一見普通に見えるものの裏側には、"
              "意外な事実が隠れています。\n\n"
              "今回は、動物、人体、宇宙、科学、"
              "食べ物、自然などから、"
              "思わず誰かに話したくなる雑学を"
              "テンポよく120個紹介します。\n\n"
              "#雑学 #豆知識 #トリビア"
          )

          metadata = {
              "title": title,
              "description": description,
              "tags": [
                  "雑学",
                  "豆知識",
                  "トリビア",
                  "雑学まとめ",
                  "面白い雑学",
                  "意外な事実",
                  "知らない雑学"
              ]
          }

          with open(
              "youtube_metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  metadata,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "タイトル:",
              title
          )
          PY

      - name: Generate thumbnail
        run: |
          ffmpeg -y \
            -ss 1 \
            -i segments/1.mp4 \
            -frames:v 1 \
            -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,eq=brightness=-0.10:saturation=1.25" \
            thumbnail.jpg

      - name: Check files
        run: |
          test -f long_video.mp4
          test -f thumbnail.jpg
          test -f subtitles.srt
          test -f selected_trivia.json
          test -f youtube_metadata.json

          ls -lh long_video.mp4
          ls -lh thumbnail.jpg

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |

          cat > upload_youtube.py <<'PY'

          import os
          import json

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              None,
              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],
              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          with open(
              "youtube_metadata.json",
              encoding="utf-8"
          ) as f:
              metadata = json.load(f)

          body = {
              "snippet": {
                  "title": metadata["title"],
                  "description": metadata["description"],
                  "tags": metadata["tags"],
                  "categoryId": "27",
                  "defaultLanguage": "ja",
                  "defaultAudioLanguage": "ja"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "long_video.mp4",
              chunksize=8 * 1024 * 1024,
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None

          while response is None:

              status, response = request.next_chunk()

              if status:
                  print(
                      "アップロード:",
                      int(
                          status.progress() * 100
                      ),
                      "%"
                  )

          print(
              "YouTube公開完了"
          )

          print(
              "https://www.youtube.com/watch?v="
              + response["id"]
          )

          PY

          python upload_youtube.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: long-video-output
          path: |
            long_video.mp4
            thumbnail.jpg
            subtitles.srt
            selected_trivia.json
            trivia.json
            youtube_metadata.json
          retention-days: 7
