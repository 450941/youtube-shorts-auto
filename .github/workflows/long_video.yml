name: Generate 5-Minute Trivia Encouragement Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            jq

          pip install --upgrade pip

          pip install \
            edge-tts \
            requests \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2


      # ============================================================
      # GENERATE CONTENT
      # ============================================================

      - name: Generate massive variation content
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          TZ: Asia/Tokyo
        run: |

          cat > generate_content.py <<'PY'

          import json
          import random
          import secrets
          import time
          import os
          from datetime import datetime


          # ==========================================================
          # UNIQUE RANDOM SEED
          # ==========================================================

          run_id = os.environ.get("GITHUB_RUN_ID", "0")

          seed = (
              int(time.time() * 1000000)
              ^ secrets.randbits(64)
              ^ hash(run_id)
          )

          random.seed(seed)

          print("======================================")
          print("RANDOM SEED:", seed)
          print("RUN ID:", run_id)
          print("======================================")


          # ==========================================================
          # HOOKS
          # ==========================================================

          hooks = [

