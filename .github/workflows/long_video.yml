                  "title": "なぜ『あと5分』が何度も続く？",
                  "body": "今すぐ始めるより少し先延ばしした方が楽に感じると、人は短い延期を選びやすくなります。5分という短い時間なら大きな問題ではないと思いやすいため、繰り返しているうちにかなりの時間が経ってしまいます。",
                  "keywords": ["時計", "スマホ", "寝る"]
              },

              {
                  "category": "日常",
                  "title": "なぜやる気が出てから行動しようと思うと動けない？",
                  "body": "やる気を行動の前提にすると、気分が変わるまで待つことになります。一方で、ほんの少し行動を始めることで気分が後からついてくることもあります。行動とやる気は必ずしも一方向の関係ではありません。",
                  "keywords": ["やる気", "行動", "考える"]
              }

          ]


          # ============================================================
          # UTIL
          # ============================================================

          def run(cmd, check=True):

              print(
                  "RUN:",
                  " ".join(
                      map(str, cmd)
                  )
              )

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              print(result.stdout)

              if check and result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed: {result.returncode}"
                  )

              return result


          def get_duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True
              )

              try:
                  return float(
                      result.stdout.strip()
                  )
              except Exception:
                  return 0.0


          def safe_name(text):

              text = re.sub(
                  r'[\\/:*?"<>|]',
                  "_",
                  text
              )

              return text[:80]


          # ============================================================
          # HTTP
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/126 Safari/537.36",

              "Accept-Language":
                  "ja,en;q=0.8"
          })


          # ============================================================
          # IMAGE SEARCH
          # ============================================================

          def get_image_urls_from_page(page_url):

              results = []

              try:

                  r = session.get(
                      page_url,
                      timeout=20
                  )

                  if r.status_code != 200:
                      return []

                  soup = BeautifulSoup(
                      r.text,
                      "html.parser"
                  )

                  for img in soup.find_all("img"):

                      candidates = [
                          img.get("src"),
                          img.get("data-src"),
                          img.get("data-lazy-src"),
                          img.get("data-original")
                      ]

                      for src in candidates:

                          if not src:
                              continue

                          src = urljoin(
                              page_url,
                              src
                          )

                          if (
                              "blogger.googleusercontent.com"
                              in src
                              or
                              "bp.blogspot.com"
                              in src
                          ):

                              if src not in results:
                                  results.append(src)

                          break

              except Exception as e:

                  print(
                      "Page image error:",
                      e
                  )

              return results


          def search_irasutoya(keyword):

              print(
                  "IRASUTOYA SEARCH:",
                  keyword
              )

              results = []

              # --------------------------------------------------------
              # Official search
              # --------------------------------------------------------

              try:

                  url = (
                      "https://www.irasutoya.com/"
                      "search?q="
                      + quote_plus(keyword)
                  )

                  r = session.get(
                      url,
                      timeout=20
                  )

                  print(
                      "Search status:",
                      r.status_code
                  )

                  if r.status_code == 200:

                      soup = BeautifulSoup(
                          r.text,
                          "html.parser"
                      )

                      links = []

                      for a in soup.find_all(
                          "a",
                          href=True
                      ):

                          href = urljoin(
                              url,
                              a["href"]
                          )

                          if (
                              "irasutoya.com"
                              in href
                              and
                              href.endswith(".html")
                              and
                              "/search" not in href
                          ):

                              if href not in links:
                                  links.append(href)

                      for page in links[:10]:

                          images = (
                              get_image_urls_from_page(
                                  page
                              )
                          )

                          for image in images:

                              if image not in results:
                                  results.append(image)

                              if len(results) >= 5:
                                  break

                          if len(results) >= 5:
                              break

              except Exception as e:

                  print(
                      "Official search error:",
                      e
                  )


              # --------------------------------------------------------
              # Google fallback
              # --------------------------------------------------------

              if len(results) < 2:

                  try:

                      query = (
                          "site:irasutoya.com "
                          + keyword
                      )

                      r = session.get(
                          "https://www.google.com/search",
                          params={
                              "q": query,
                              "num": 10
                          },
                          timeout=20
                      )

                      if r.status_code == 200:

                          soup = BeautifulSoup(
                              r.text,
                              "html.parser"
                          )

                          links = []

                          for a in soup.find_all(
                              "a",
                              href=True
                          ):

                              href = a["href"]

                              if (
                                  "irasutoya.com"
                                  in href
                                  and
                                  href.startswith("http")
                                  and
                                  "/search" not in href
                              ):

                                  if href not in links:
                                      links.append(href)

                          for page in links[:8]:

                              images = (
                                  get_image_urls_from_page(
                                      page
                                  )
                              )

                              for image in images:

                                  if image not in results:
                                      results.append(image)

                                  if len(results) >= 5:
                                      break

                              if len(results) >= 5:
                                  break

                  except Exception as e:

                      print(
                          "Google fallback error:",
                          e
                      )

              return results


          # ============================================================
          # IMAGE DOWNLOAD
          # ============================================================

          used_urls = set()
          downloaded_images = []


          def download_image(url, path):

              try:

                  r = session.get(
                      url,
                      timeout=30
                  )

                  if r.status_code != 200:
                      return False

                  if len(r.content) < 5000:
                      return False

                  with open(
                      path,
                      "wb"
                  ) as f:
                      f.write(r.content)

                  with Image.open(path) as im:
                      im.verify()

                  return True

              except Exception as e:

                  print(
                      "Download error:",
                      e
                  )

                  path.unlink(
                      missing_ok=True
                  )

                  return False


          # ============================================================
          # SELECT 10 FACTS
          # ============================================================

          selected_facts = random.sample(
              facts,
              MAX_FACTS
          )


          # ============================================================
          # IMAGE COLLECTION
          #
          # 最大19種類。
          # 20点目はサムネイルで同じ画像を使う。
          # ============================================================

          fact_images = []


          for fact_index, fact in enumerate(
              selected_facts,
              start=1
          ):

              print()
              print(
                  "=" * 60
              )

              print(
                  f"FACT {fact_index}:",
                  fact["title"]
              )

              local = []

              for keyword in fact["keywords"]:

                  if len(local) >= IMAGES_PER_FACT:
                      break

                  if len(downloaded_images) >= IMAGE_LIMIT:
                      break

                  candidates = search_irasutoya(
                      keyword
                  )

                  for url in candidates:

                      if len(local) >= IMAGES_PER_FACT:
                          break

                      if len(downloaded_images) >= IMAGE_LIMIT:
                          break

                      if url in used_urls:
                          continue

                      filename = (
                          f"image_"
                          f"{len(downloaded_images)+1:02d}.jpg"
                      )

                      path = (
                          IMAGE_DIR
                          / filename
                      )

                      if download_image(
                          url,
                          path
                      ):

                          used_urls.add(url)

                          downloaded_images.append(
                              path
                          )

                          local.append(
                              path
                          )

                          print(
                              "Downloaded:",
                              path
                          )

              fact_images.append(local)


          # ============================================================
          # FALLBACK
          # ============================================================

          def make_fallback(path, title):

              img = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  "white"
              )

              draw = ImageDraw.Draw(img)

              font_path = (
                  "/usr/share/fonts/"
                  "opentype/noto/"
                  "NotoSansCJK-Bold.ttc"
              )

              font = ImageFont.truetype(
                  font_path,
                  64
              )

              text = title

              bbox = draw.textbbox(
                  (0, 0),
                  text,
                  font=font
              )

              w = bbox[2] - bbox[0]
              h = bbox[3] - bbox[1]

              draw.text(
                  (
                      (WIDTH - w) / 2,
                      (HEIGHT - h) / 2
                  ),
                  text,
                  fill="black",
                  font=font
              )

              img.save(
                  path,
                  quality=95
              )


          for i in range(
              len(fact_images)
          ):

              if not fact_images[i]:

                  fallback = (
                      IMAGE_DIR
                      / f"fallback_{i+1:02d}.jpg"
                  )

                  make_fallback(
                      fallback,
                      selected_facts[i]["title"]
                  )

                  fact_images[i] = [
                      fallback
                  ]


          # ============================================================
          # TEXT SPLITTER
          # ============================================================

          def split_text(text):

              text = text.strip()

              sentences = re.findall(
                  r".+?[。！？]",
                  text
              )

              if not sentences:
                  sentences = [text]

              result = []

              for sentence in sentences:

                  sentence = sentence.strip()

                  while len(sentence) > 24:

                      # 読みやすい場所で切る
                      positions = [
                          sentence.rfind("、", 0, 22),
                          sentence.rfind(" ", 0, 22)
                      ]

                      cut = max(
                          positions
                      )

                      if cut < 8:
                          cut = 20

                      result.append(
                          sentence[:cut + 1]
                      )

                      sentence = sentence[
                          cut + 1:
                      ].strip()

                  if sentence:
                      result.append(sentence)

              return result


          # ============================================================
          # TTS
          # ============================================================

          async_code = r'''
          import asyncio
          import sys
          import edge_tts

          async def main():

              text = sys.argv[1]
              output = sys.argv[2]

              voice = edge_tts.Communicate(
                  text,
                  "ja-JP-NanamiNeural",
                  rate="+8%"
              )

              await voice.save(output)

          asyncio.run(main())
          '''

          with open(
              "tts_generate.py",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(async_code)


          # ============================================================
          # SUBTITLE
          # ============================================================

          SUBTITLE_STYLE = (
              "FontName=Noto Sans CJK JP,"
              "FontSize=42,"
              "PrimaryColour=&H00FFFFFF,"
              "OutlineColour=&H00000000,"
              "BorderStyle=3,"
              "BackColour=&HAA000000,"
              "Outline=2,"
              "Shadow=0,"
              "MarginV=65,"
              "Alignment=2"
          )


          def make_srt(
              path,
              text,
              duration
          ):

              ms = int(
                  duration * 1000
              )

              h = ms // 3600000
              ms %= 3600000

              m = ms // 60000
              ms %= 60000

              s = ms // 1000
              ms %= 1000

              end = (
                  f"{h:02d}:"
                  f"{m:02d}:"
                  f"{s:02d},"
                  f"{ms:03d}"
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "1\n"
                  )

                  f.write(
                      "00:00:00,000 --> "
                      + end
                      + "\n"
                  )

                  f.write(
                      text
                      + "\n\n"
                  )


          # ============================================================
          # RENDER CHUNK
          # ============================================================

          def render_chunk(
              image,
              audio,
              text,
              output,
              direction
          ):

              duration = get_duration(
                  audio
              )

              if duration <= 0:
                  raise RuntimeError(
                      "Audio duration is zero"
                  )

              srt = (
                  output.parent
                  / f"{output.stem}.srt"
              )

              make_srt(
                  srt,
                  text,
                  duration
              )

              # --------------------------------------------------------
              # Dynamic zoom
              # --------------------------------------------------------

              if direction > 0:

                  zoom = (
                      "zoompan="
                      "z=1.0+0.00004*on:"
                      "d=1:"
                      "s=1920x1080:"
                      "fps=30"
                  )

              else:

                  zoom = (
                      "zoompan="
                      "z=1.03-0.00004*on:"
                      "d=1:"
                      "s=1920x1080:"
                      "fps=30"
                  )

              visual = (
                  output.parent
                  / f"{output.stem}_visual.mp4"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-loop",
                  "1",
                  "-i",
                  str(image),
                  "-vf",
                  (
                      "scale=1920:1080:"
                      "force_original_aspect_ratio=decrease,"
                      "pad=1920:1080:"
                      "(ow-iw)/2:"
                      "(oh-ih)/2,"
                      + zoom
                      + ",format=yuv420p"
                  ),
                  "-t",
                  f"{duration:.3f}",
                  "-r",
                  "30",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "20",
                  "-pix_fmt",
                  "yuv420p",
                  str(visual)
              ])

              # --------------------------------------------------------
              # Subtitle burn
              # --------------------------------------------------------

              srt_path = str(
                  srt.resolve()
              )

              srt_path = (
                  srt_path
                  .replace("\\", "/")
                  .replace(":", "\\:")
              )

              subtitle_filter = (
                  "subtitles="
                  + srt_path
                  + ":force_style='"
                  + SUBTITLE_STYLE
                  + "'"
              )

              subtitle_video = (
                  output.parent
                  / f"{output.stem}_subtitle.mp4"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(visual),
                  "-vf",
                  subtitle_filter,
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "20",
                  "-pix_fmt",
                  "yuv420p",
                  str(subtitle_video)
              ])

              # --------------------------------------------------------
              # Audio
              # --------------------------------------------------------

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(subtitle_video),
                  "-i",
                  str(audio),
                  "-map",
                  "0:v:0",
                  "-map",
                  "1:a:0",
                  "-c:v",
                  "copy",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-shortest",
                  "-movflags",
                  "+faststart",
                  str(output)
              ])

              visual.unlink(
                  missing_ok=True
              )

              subtitle_video.unlink(
                  missing_ok=True
              )

              srt.unlink(
                  missing_ok=True
              )


          # ============================================================
          # CREATE SEGMENTS
          # ============================================================

          segments = []


          for fact_no, fact in enumerate(
              selected_facts,
              start=1
          ):

              print()
              print(
                  "=" * 70
              )

              print(
                  f"FACT {fact_no}/10"
              )

              print(
                  fact["title"]
              )

              print(
                  "=" * 70
              )

              # --------------------------------------------------------
              # 構成
              #
              # ①質問
              # ②答え・説明
              # ③理由
              # ④余韻
              # --------------------------------------------------------

              chunks = [
                  fact["title"]
              ]

              body_chunks = split_text(
                  fact["body"]
              )

              chunks.extend(
                  body_chunks
              )

              # 3〜5カット程度
              if len(chunks) > 5:

                  chunks = (
                      chunks[:4]
                      + [
                          "つまり、身近な現象にもちゃんと理由があります。"
                      ]
                  )

              if len(chunks) < 3:

                  chunks.append(
                      "意外ですが、これには理由があります。"
                  )

                  chunks.append(
                      "身近な現象ほど、知ると面白いですよね。"
                  )


              images = fact_images[
                  fact_no - 1
              ]


              for chunk_no, text in enumerate(
                  chunks,
                  start=1
              ):

                  audio = (
                      AUDIO_DIR
                      / (
                          f"fact_"
                          f"{fact_no:02d}_"
                          f"{chunk_no:02d}.mp3"
                      )
                  )

                  segment = (
                      SCENE_DIR
                      / (
                          f"segment_"
                          f"{fact_no:02d}_"
                          f"{chunk_no:02d}.mp4"
                      )
                  )

                  # ----------------------------------------------------
                  # TTS
                  # ----------------------------------------------------

                  run([
                      sys.executable,
                      "tts_generate.py",
                      text,
                      str(audio)
                  ])

                  # ----------------------------------------------------
                  # Image rotation
                  # ----------------------------------------------------

                  image = images[
                      (chunk_no - 1)
                      % len(images)
                  ]

                  direction = (
                      1
                      if chunk_no % 2
                      else -1
                  )

                  render_chunk(
                      image,
                      audio,
                      text,
                      segment,
                      direction
                  )

                  segments.append(
                      segment
                  )


          # ============================================================
          # CONCAT
          # ============================================================

          concat_file = (
              MEDIA
              / "concat.txt"
          )

          with open(
              concat_file,
              "w",
              encoding="utf-8"
          ) as f:

              for segment in segments:

                  path = (
                      str(
                          segment.resolve()
                      )
                  )

                  path = path.replace(
                      "'",
                      "'\\''"
                  )

                  f.write(
                      "file '"
                      + path
                      + "'\n"
                  )


          raw_video = (
              MEDIA
              / "raw_video.mp4"
          )


          run([
              "ffmpeg",
              "-y",
              "-f",
              "concat",
              "-safe",
              "0",
              "-i",
              str(concat_file),
              "-c",
              "copy",
              "-movflags",
              "+faststart",
              str(raw_video)
          ])


          raw_duration = get_duration(
              raw_video
          )


          print()
          print(
              "RAW DURATION:",
              raw_duration
          )


          # ============================================================
          # BGM MIX
          # ============================================================

          final_with_bgm = (
              MEDIA
              / "final_with_bgm.mp4"
          )


          fade_start = max(
              0,
              raw_duration - 2
          )


          filter_complex = (
              "[0:a]"
              "loudnorm="
              "I=-16:"
              "TP=-1.5:"
              "LRA=11"
              "[voice];"

              "[1:a]"
              f"volume={BGM_VOLUME},"
              "afade="
              f"t=out:st={fade_start:.3f}:d=2"
              "[bgm];"

