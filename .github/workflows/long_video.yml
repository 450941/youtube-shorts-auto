                          % len(all_image_items)
                      ]

                  global_image_counter += 1

                  src = item["path"]

                  duration = seg["duration"]

                  cut_path = (
                      f"media/cuts/"
                      f"cut_{i:02d}_{j:02d}.mp4"
                  )

                  # カットごとに違うズーム
                  if (
                      (i + j) % 2 == 0
                  ):

                      zoom_expr = (
                          "min(zoom+0.0008,1.10)"
                      )

                  else:

                      zoom_expr = (
                          "max(zoom-0.0006,1.0)"
                      )

                  vf = (
                      f"scale=1080:1920:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop=1080:1920,"
                      f"zoompan="
                      f"z='{zoom_expr}':"
                      f"d='1':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"s=1080x1920:"
                      f"fps={FPS},"
                      f"setsar=1"
                  )

                  run([
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      src,
                      "-t",
                      str(duration),
                      "-vf",
                      vf,
                      "-r",
                      str(FPS),
                      "-an",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "20",
                      "-pix_fmt",
                      "yuv420p",
                      cut_path
                  ])

                  cut_files.append(
                      cut_path
                  )


          # ==========================================================
          # CONCAT
          # ==========================================================

          concat_file = (
              "media/cuts/concat.txt"
          )

          with open(
              concat_file,
              "w",
              encoding="utf-8"
          ) as f:

              for cut in cut_files:

                  f.write(
                      "file '"
                      + os.path.abspath(cut)
                      + "'\n"
                  )


          silent_video = (
              "media/silent_video.mp4"
          )

          run([
              "ffmpeg",
              "-y",
              "-f",
              "concat",
              "-safe",
              "0",
              "-i",
              concat_file,
              "-an",
              "-c:v",
              "libx264",
              "-preset",
              "veryfast",
              "-crf",
              "20",
              "-pix_fmt",
              "yuv420p",
              silent_video
          ])


          # ==========================================================
          # CONCAT ALL VOICE
          # ==========================================================

          voice_list = (
              "media/voice/voices.txt"
          )

          with open(
              voice_list,
              "w",
              encoding="utf-8"
          ) as f:

              for fact in selected_facts:

                  for seg in fact["audio_segments"]:

                      f.write(
                          "file '"
                          + os.path.abspath(
                              seg["file"]
                          )
                          + "'\n"
                      )


          narration = (
              "media/narration.mp3"
          )

          run([
              "ffmpeg",
              "-y",
              "-f",
              "concat",
              "-safe",
              "0",
              "-i",
              voice_list,
              "-c:a",
              "libmp3lame",
              "-b:a",
              "192k",
              narration
          ])


          # ==========================================================
          # FINAL VIDEO
          #
          # BGM
          # ナレーション
          # 字幕
          # を合成
          # ==========================================================

          final_video = (
              "output/final_video.mp4"
          )

          subtitle_filter = (
              "subtitles="
              "media/subtitles/main.ass:"
              "fontsdir=/usr/share/fonts/opentype/noto"
          )

          run([
              "ffmpeg",
              "-y",

              "-i",
              silent_video,

              "-i",
              narration,

              "-stream_loop",
              "-1",
              "-i",
              "media/bgm.ogg",

              "-filter_complex",

              (
                  "[2:a]"
                  f"volume={BGM_VOLUME}"
                  "[bgm];"

                  "[1:a]"
                  f"volume={VOICE_VOLUME}"
                  "[voice];"

                  "[bgm][voice]"
                  "amix=inputs=2:"
                  "duration=first:"
                  "dropout_transition=2"
                  "[audio]"
              ),

              "-map",
              "0:v",

              "-map",
              "[audio]",

              "-vf",
              subtitle_filter,

              "-t",
              str(total_duration),

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "19",

              "-pix_fmt",
              "yuv420p",

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-movflags",
              "+faststart",

              final_video
          ])


          # ==========================================================
          # THUMBNAIL
          # ==========================================================

          thumbnail_source = (
              prepared_images[0]
          )

          thumbnail = (
              "output/thumbnail.jpg"
          )

          run([
              "ffmpeg",
              "-y",
              "-i",
              thumbnail_source,
              "-frames:v",
              "1",
              "-q:v",
              "2",
              thumbnail
          ])


          # ==========================================================
          # SAVE INFO
          # ==========================================================

          info = {
              "facts": [
                  {
                      "title": f["title"],
                      "hook": f["hook"],
                      "answer": f["answer"]
                  }
                  for f in selected_facts
              ],
              "duration": total_duration,
              "unique_irasutoya_images": len(
                  all_image_items
              )
          }

          Path(
              "output/video_info.json"
          ).write_text(
              json.dumps(
                  info,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          print("")
          print("======================================")
          print("VIDEO GENERATION COMPLETE")
          print("======================================")
          print(
              "Facts:",
              len(selected_facts)
          )
          print(
              "Unique Irasutoya images:",
              len(all_image_items)
          )
          print(
              "Duration:",
              total_duration
          )
          print(
              "Output:",
              final_video
          )
          print("======================================")


          PY

      # ============================================================
      # RENDER
      # ============================================================
      - name: Generate video
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python render_video.py

      # ============================================================
      # YOUTUBE UPLOAD SCRIPT
      # ============================================================
      - name: Create upload_youtube.py
        run: |
          cat > upload_youtube.py <<'PY'
          import os
          import json

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]


          creds = Credentials(
              None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=creds
          )


          with open(
              "output/video_info.json",
              "r",
              encoding="utf-8"
          ) as f:

              info = json.load(f)


          first_title = info["facts"][0]["title"]

          title = (
              first_title
              + " 知ると面白い身近な雑学10選"
          )


          description = """身近なのに意外と知らない雑学を10個紹介します。

「なんで？」
と思ったことのある身近な現象を、できるだけ分かりやすくまとめました。

#雑学
#豆知識
#面白い雑学
#心理
#科学
"""


          body = {
              "snippet": {
                  "title": title[:100],
                  "description": description,
                  "tags": [
                      "雑学",
                      "豆知識",
                      "面白い雑学",
                      "身近な雑学",
                      "心理",
                      "科学"
                  ],
                  "categoryId": "27"
              },

              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }


          media = MediaFileUpload(
              "output/final_video.mp4",
              chunksize=-1,
              resumable=True
          )


          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )


          response = request.execute()

          video_id = response["id"]

          print(
              "Uploaded:",
              f"https://youtu.be/{video_id}"
          )


          # ========================================================
          # THUMBNAIL
          # ========================================================

          try:

              youtube.thumbnails().set(
                  videoId=video_id,
                  media_body=MediaFileUpload(
                      "output/thumbnail.jpg"
                  )
              ).execute()

              print("Thumbnail uploaded.")

          except Exception as e:

              print(
                  "Thumbnail upload failed:",
                  e
              )


          PY

      # ============================================================
      # YOUTUBE UPLOAD
      # ============================================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_youtube.py

      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-long-video
          path: |
            output/final_video.mp4
            output/thumbnail.jpg
            output/video_info.json
            output/irasutoya_sources.json
          retention-days: 7
