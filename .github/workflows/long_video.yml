name: Generate Long Trivia Video

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk jq

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Select content
        run: |
          echo "SEED=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Create script
        run: |
          python - <<'PY'
          import os
          import random

          seed = int(os.environ["SEED"])
          random.seed(seed)

          facts = [

          "人間の脳は、何もしていないように見える時間でもかなり活発に働いています。ぼーっとしている時間が完全な休憩とは限りません。",

          "人は一度気になったものを見ると、その答えを知るまで妙に気になってしまいます。これは日常の『なんで？』にも関係しています。",

          "実は、記憶は録画のように保存されているわけではありません。思い出すたびに、少しずつ内容が変化することがあります。",

          "同じ言葉でも、何度も聞いているうちに違和感がなくなることがあります。脳は繰り返し触れる情報を処理しやすくしていきます。",

          "人間は見えているものを全部同時に認識しているわけではありません。重要だと判断した情報を優先して処理しています。",

          "眠っている間も脳は完全に停止しているわけではありません。記憶の整理など、起きているときとは違う仕事をしています。",

          "実は、退屈な時間ほど時計が長く感じられることがあります。逆に夢中になっていると、時間が一瞬で過ぎたように感じます。",

          "人間の目は意外と多くの情報を受け取っていますが、そのすべてを意識しているわけではありません。脳が必要な情報を選んでいます。",

          "同じ景色でも、知識を持ってから見ると違って見えることがあります。知識が増えると、今まで見えていなかった情報に気づくようになります。",

          "人は『あと少しだけ』と思っているときほど、やめるタイミングを失いやすくなります。ゲームや動画で起きることもあります。",

          "冷たい水より、ぬるい水のほうが熱く感じることがあります。人間の感覚は絶対的な温度より、直前との違いに影響されるからです。",

          "同じ重さのものでも、持ち方によって重く感じたり軽く感じたりします。身体は単純に重さだけを判断しているわけではありません。",

          "人は自分の名前を、周囲の雑音の中でも聞き取りやすい傾向があります。自分に関係する情報を脳が優先しているからです。",

          "実は、選択肢が多ければ多いほど、必ずしも満足度が上がるわけではありません。選ぶこと自体に疲れてしまうことがあります。",

          "人は一度決めたことを、その後も正しいと思いたくなる傾向があります。だからこそ、最初の判断に引っ張られることがあります。",

          "匂いは記憶と強く結びつくことがあります。昔の匂いを嗅いだ瞬間、忘れていた記憶が突然よみがえることがあります。",

          "音楽を聞くと、過去の出来事を思い出すことがあります。音そのものだけでなく、そのときの感情まで一緒に思い出すことがあります。",

          "人間は完全に同じ顔を毎回同じように認識しているわけではありません。照明や角度によって、脳の判断は変化します。",

          "実は、笑顔は楽しいときだけに出るものではありません。緊張しているときや困っているときにも、人は笑うことがあります。",

          "人は他人の行動を見ていると、無意識にその動きをまねることがあります。会話中の姿勢や表情でも起こります。",

          "カカオ豆は、そのままではチョコレートのような甘い味がするわけではありません。加工によって、私たちが知っている香りや味になります。",

          "バナナは植物学的には果物ですが、植物として見ると意外な分類になります。普段の呼び方と科学的な分類は一致しないことがあります。",

          "トマトが野菜なのか果物なのかという話は、実は『料理上の分類』と『植物学上の分類』を分けると話が変わります。",

          "蜂蜜は非常に保存性が高い食品です。水分が少なく、微生物が増えにくい環境になっています。",

          "パンが焼けると香ばしい匂いがするのは、単純に温めているだけではありません。加熱によってさまざまな化学反応が起きています。",

          "ポップコーンが爆発するのは、中に水分が閉じ込められているからです。加熱されると水が水蒸気になり、内部の圧力が上がります。",

          "炭酸飲料の泡は、液体の中に溶けていた二酸化炭素が外へ出ているものです。だから開けた直後ほど泡が多くなります。",

          "冷蔵庫に入れれば何でも長持ちするわけではありません。食材によっては低温が品質を落とすこともあります。",

          "電子レンジは食べ物を『外側から中へ』温めているとは限りません。電磁波によって食品中の分子が動き、熱が生まれます。",

          "氷が水に浮くのは、固体になった水のほうが液体の水より密度が低くなるという、少し変わった性質を持っているからです。",

          "世界には、一日の中でほとんど雨が降らない場所もあれば、年間を通して大量の雨が降る場所もあります。地球の水分布はかなり偏っています。",

          "砂漠は『砂が一面に広がっている場所』とは限りません。岩石や礫で覆われた砂漠もあります。",

          "雷は一瞬で終わっているように見えても、実際には同じ場所で複数回発生することがあります。",

          "雲はふわふわして見えますが、実際には大量の小さな水滴や氷の粒が集まっています。",

          "海の水が塩辛い理由には、陸地から流れ込んだ物質などが長い時間をかけて関係しています。",

          "地球上の水は、雨になったり川になったり海になったりしながら、長い時間をかけて循環しています。",

          "月は毎日同じ形に見えるわけではありません。太陽の光を受けた部分の見え方が変化するためです。",

          "地球から見ると太陽と月はかなり違う大きさですが、空では似た大きさに見えることがあります。距離の違いが関係しています。",

          "宇宙空間では音が普通の空気中のようには伝わりません。音を伝えるための物質がほとんど存在しないからです。",

          "太陽の光が地球に届くまでには時間がかかります。私たちが見ている太陽は、少し前の太陽です。",

          "星は夜空では小さな点に見えますが、実際には非常に大きな天体もあります。遠すぎるため小さく見えています。",

          "地球は完全な球体ではありません。自転しているため、赤道付近が少しふくらんだ形になっています。",

          "人間が立っている地面は止まっているように感じますが、地球そのものは自転しています。私たちはその動きを普段ほとんど感じません。",

          "音の速さは、空気の温度などによって変化します。つまり音は、いつでも完全に同じ速度で進むわけではありません。",

          "光は非常に速く進みますが、宇宙規模で考えるとそれでも時間が必要です。遠くの星を見ることは、過去を見ることでもあります。",

          "猫は高い場所を好むことがあります。周囲を見渡しやすく、安全を確認しやすいという理由が考えられています。",

          "犬の鼻が濡れていることには、匂いを捉える能力などが関係しています。ただし、常に濡れていなければ健康というわけではありません。",

          "カラスは非常に高い認知能力を持つことで知られています。道具を使ったり、複雑な問題を解決したりする行動も確認されています。",

          "タコには複数の心臓があります。しかも泳ぐときと休んでいるときで、働き方が変わります。",

          "イルカは仲間同士で特徴的な音を使ってコミュニケーションを取ることが知られています。",

          "キリンの首が長いのには、進化の歴史が関係しています。首の骨の数そのものが人間より極端に多いわけではありません。",

          "ペンギンは鳥ですが、空を飛ぶ代わりに水中で非常に効率よく泳ぐ方向へ適応しています。",

          "コウモリは哺乳類です。空を飛ぶため、鳥と似ているように見えますが、生物学的にはまったく別のグループです。",

          "カメレオンが色を変える理由は、単純に周囲と同じ色になるためだけではありません。体温調節やコミュニケーションにも関係しています。",

          "フクロウは首をかなり大きく回せます。ただし、骨格だけでなく血管などにも特殊な仕組みがあります。",

          "アリは小さな体ですが、集団になると非常に複雑な行動を見せます。個体よりも群れ全体で問題を解決するように見えることがあります。",

          "ミツバチは仲間に餌の場所を伝えるため、特徴的な動きをします。単純な虫の行動だと思うと、かなり驚きます。",

          "植物も光を利用して成長に必要なエネルギーを作ります。私たちが普段見ている葉っぱの中では、かなり複雑な反応が進んでいます。",

          "ひまわりが太陽を追いかけるというイメージは有名ですが、成長段階などによって動き方は変わります。",

          "竹は種類によっては非常に速く成長します。条件がそろうと、一日にかなりの高さまで伸びる種類もあります。",

          "木の年輪を見ると、成長した環境について手がかりが得られることがあります。",

          "植物は動かないように見えますが、光や重力、水分などに反応して成長方向を変えています。",

          "日本の自動販売機が多い理由には、治安やインフラ、設置環境など複数の要因があります。",

          "日本の電車が時間に正確だとよく言われますが、正確さを支えるのは運転士だけではありません。駅や信号など多くの仕組みが関係しています。",

          "コンビニのおにぎりには、海苔をパリッと保つための独特な包装があります。食べる直前に海苔とご飯を分ける仕組みです。",

          "駅のホームにある点字ブロックには、場所によって異なる役割があります。線状のものと点状のものでは意味が違います。",

          "横断歩道の白線は、単に道路を飾るためにあるわけではありません。歩行者が渡る場所を明確にする重要な役割があります。",

          "信号機の色には理由があります。赤や青、黄色には視認性や国際的な慣習など、複数の背景があります。",

          "鉛筆の芯は実際の鉛でできているわけではありません。主成分は黒鉛と粘土です。",

          "消しゴムは紙の上の鉛筆の粒子を取り除くことで文字を消しています。単純に黒い部分を白く塗っているわけではありません。",

          "紙は薄く見えますが、顕微鏡で見ると大量の繊維が複雑に絡み合っています。",

          "ガラスは透明ですが、光をすべてそのまま通しているわけではありません。表面で反射したり、一部が吸収されたりします。",

          "鏡に映る自分は左右が逆になっていると思いがちですが、正確には前後の位置関係が反転しています。",

          "エレベーターの鏡には、閉鎖感を減らしたり、空間を広く感じさせたりする効果が期待されています。",

          "階段を上るときと下りるときでは、同じ距離でも身体にかかる負担の感じ方が違います。筋肉の使い方が変わるからです。",

          "人間は立っているだけでも、完全に静止しているわけではありません。身体は細かな揺れを常に調整しています。",

          "くしゃみをするとき、目を閉じることがあります。これは反射的な身体反応の一つです。",

          "あくびは眠いときだけに起きるものではありません。緊張や疲労、周囲の状況などでも起こります。",

          "鳥肌は、寒いときだけではなく、強い感情を感じたときにも起こることがあります。",

          "人は緊張すると手が冷たく感じることがあります。血流の変化などが関係しています。",

          "笑うときには、実際には顔だけでなく多くの筋肉が動いています。",

          "人間の心拍数は、運動だけでなく感情や緊張、環境によっても変化します。",

          "眠る直前に身体がビクッと動くことがあります。これは入眠時に起こることがある自然な現象です。",

          "夢を見ている間の脳活動は、起きているときと完全に同じではありませんが、かなり活発な状態になることがあります。",

          "人は自分の声を録音で聞くと、普段聞いている声と違って感じることがあります。骨を通じて聞く音が普段の聞こえ方に影響しているからです。",

          "同じ曲でも、初めて聞いたときより何度か聞いた後のほうが好きになることがあります。繰り返しによって親しみが生まれるためです。",

          "知らない曲でも、何度か聞くうちにサビを覚えてしまうことがあります。脳は繰り返されるパターンを学習します。",

          "人間は途中で終わった作業のほうが、完了した作業より気になってしまうことがあります。",

          "『続きが気になる』という感覚は、動画や物語を見るときの強い原動力になります。",

          "答えがすぐ分からない問題ほど、頭の中に残ることがあります。",

          "人は予想していた結果と違うことが起きると、強く注意を向ける傾向があります。",

          "だからこそ、当たり前だと思っていたことの裏側を知ると、妙に面白く感じることがあります。",

          "例えば、普段使っているスマートフォンも、画面を触った瞬間から大量の処理をしています。人間にはそのほとんどが見えません。",

          "インターネットは目に見えませんが、世界中のデータセンターや通信設備によって支えられています。",

          "写真を一枚撮るだけでも、スマートフォンの中では光を電気信号に変換する処理などが行われています。",

          "カメラは人間の目と似ている部分がありますが、光の情報を処理する方法は大きく異なります。",

          "スマートフォンの画面は、何も表示していないように見える黒い部分でも、完全に何も起きていないとは限りません。",

          "電池は使っているうちに少しずつ性能が変化します。充電回数だけでなく、温度なども影響します。",

          "同じ商品でも、店内の照明によって色の見え方が変わることがあります。私たちが見る色は光の条件に左右されます。",

          "白い紙が白く見えるのは、すべての光を吸収しているからではありません。多くの光を反射しているため白く見えます。",

          "黒い服が暑く感じられることがあるのは、光の吸収と関係しています。ただし、実際の体感温度には素材や風なども影響します。",

          "雨上がりの匂いには、土や植物などから出るさまざまな物質が関係しています。",

          "新品の本の匂いが独特なのは、紙やインク、接着剤などから出る揮発性物質が関係しています。",

          "古い本の匂いも独特です。紙に含まれる成分が時間とともに変化することが関係しています。",

          "海の匂いは海水そのものだけでなく、海洋生物などが作り出す物質も関係しています。",

          "雨の日に音が違って聞こえることがあります。湿度などが音の伝わり方に影響するためです。",

          "雪が積もると、周囲が静かになったように感じることがあります。雪が音を吸収する働きがあるためです。",

          "同じ場所でも、昼と夜では音の聞こえ方が違って感じることがあります。温度や湿度、周囲の活動量などが変わるからです。",

          "実は、身近な『当たり前』の多くには理由があります。そして、その理由を一つ知るだけで、いつもの景色が少し違って見えることがあります。"

          ]

          # 100個以上のネタから35個を選ぶ
          selected = random.sample(facts, 35)

          lines = []

          for i, fact in enumerate(selected):
              if i == 0:
                  lines.append(fact)
              else:
                  transitions = [
                      "でも、ここで一つ面白いことがあります。",
                      "ところが、話はここで終わりません。",
                      "そして、ここからが意外です。",
                      "これだけなら普通に聞こえますが、実はもう一つあります。",
                      "ここでちょっと考えてみてください。",
                      "さらに面白いのがここです。",
                      "ところが、逆に考えると不思議です。",
                      "実はこれ、別のところでも起きています。"
                  ]
                  lines.append(random.choice(transitions))
                  lines.append(fact)

          # 途中に短い引きを入れる
          hooks = [
              "この次の話、かなり意外です。",
              "ここを知ると、さっきの話が少し違って見えます。",
              "実はこの話、まだ続きがあります。",
              "ここから少しだけ話が変わります。",
              "次は、かなり身近な話です。",
              "これ、普段なら絶対に気にしません。",
              "でも知ってしまうと、たぶん気になります。"
          ]

          final_lines = []

          for i, line in enumerate(lines):
              final_lines.append(line)

              if i > 0 and i % 6 == 0:
                  final_lines.append(random.choice(hooks))

          text = "\n\n".join(final_lines)

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(text)

          print("文字数:", len(text))
          print("雑学数:", len(selected))
          PY

      - name: Generate narration
        run: |
          edge-tts \
            --voice ja-JP-NanamiNeural \
            --rate="-10%" \
            --file script.txt \
            --write-media voice.mp3

      - name: Create subtitles
        run: |
          python - <<'PY'
          import re
          import subprocess

          with open("script.txt", encoding="utf-8") as f:
              text = f.read().strip()

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  "voice.mp3"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          duration = float(result.stdout.strip())

          chunks = re.split(r'(?<=[。！？])', text)
          chunks = [x.strip() for x in chunks if x.strip()]

          total_chars = sum(len(x) for x in chunks)

          def timestamp(sec):
              ms = int(sec * 1000)
              h = ms // 3600000
              ms %= 3600000
              m = ms // 60000
              ms %= 60000
              s = ms // 1000
              ms %= 1000
              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          with open("captions.srt", "w", encoding="utf-8") as f:
              current = 0.0

              for i, chunk in enumerate(chunks, 1):

                  length = duration * len(chunk) / max(total_chars, 1)

                  start = current
                  end = current + length

                  f.write(f"{i}\n")
                  f.write(
                      f"{timestamp(start)} --> {timestamp(end)}\n"
                  )
                  f.write(chunk + "\n\n")

                  current = end

          print("音声時間:", duration)
          print("字幕数:", len(chunks))
          PY

      - name: Search background videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p clips

          QUERIES=(
            "city night"
            "nature"
            "technology"
            "space"
            "ocean"
            "people walking"
          )

          INDEX=0

          for QUERY in "${QUERIES[@]}"; do

            curl -L --fail \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=$(printf '%s' "$QUERY" | sed 's/ /%20/g')&orientation=landscape&size=medium&per_page=10" \
              -o "search_${INDEX}.json"

            COUNT=$(jq '.videos | length' "search_${INDEX}.json")

            if [ "$COUNT" -gt 0 ]; then

              VIDEO_INDEX=$((SEED % COUNT))

              VIDEO_URL=$(jq -r --argjson index "$VIDEO_INDEX" '
                .videos[$index].video_files
                | map(select(.file_type=="video/mp4"))
                | sort_by(.width)
                | reverse
                | .[0].link
              ' "search_${INDEX}.json")

              if [ "$VIDEO_URL" != "null" ] && [ -n "$VIDEO_URL" ]; then
                curl -L --fail "$VIDEO_URL" -o "clips/clip_${INDEX}.mp4"
              fi

            fi

            INDEX=$((INDEX + 1))
          done

          ls -lh clips

      - name: Create visual timeline
        run: |
          python - <<'PY'
          import os
          import subprocess

          files = []

          for name in sorted(os.listdir("clips")):
              if name.endswith(".mp4"):
                  files.append("clips/" + name)

          if not files:
              raise SystemExit("No video clips found")

          with open("concat.txt", "w", encoding="utf-8") as f:
              for path in files:
                  f.write(f"file '{os.path.abspath(path)}'\n")

          subprocess.run([
              "ffmpeg",
              "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat.txt",
              "-c", "copy",
              "background.mp4"
          ], check=True)

          print("使用映像:", files)
          PY

      - name: Render long video
        run: |
          ffmpeg -y \
            -stream_loop -1 \
            -i background.mp4 \
            -i voice.mp3 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,subtitles=captions.srt:force_style='FontName=Noto Sans CJK JP,FontSize=24,Alignment=2,MarginV=70,Outline=2'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -shortest \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            long_video.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |

          cat > upload_youtube.py <<'PY'

          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          seed = int(os.environ["SEED"])

          titles = [
              "知らない方がよかった雑学",
              "これを知ると世界の見え方が変わる",
              "最後まで見ると誰かに話したくなる雑学",
              "実は誰も教えてくれない身近な雑学",
              "知ってしまうと気になる雑学"
          ]

          title = titles[seed % len(titles)]

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": title,
                  "description": (
                      "身近なのに意外と知らない話を、"
                      "テンポよくまとめています。\n\n"
                      "気になった話があればコメントで教えてください。"
                  ),
                  "categoryId": "27"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "long_video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = request.execute()

          print("================================")
          print("Long video uploaded!")
          print("Video ID:", response["id"])
          print("Title:", title)
          print("================================")

          PY

          python upload_youtube.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: long-video
          path: long_video.mp4
          retention-days: 1
