          def official_image_url(url):
              if not url:
                  return False

              host = urlparse(url).netloc.lower()

              allowed = [
                  "blogger.googleusercontent.com",
                  "bp.blogspot.com",
                  "www.irasutoya.com",
                  "irasutoya.com"
              ]

              return any(host.endswith(x) for x in allowed)


          def extract_main_image(page_url):
              r = get(page_url)

              if not r:
                  return None

              try:
                  soup = BeautifulSoup(r.text, "html.parser")

                  title = ""
                  if soup.title:
                      title = normalize_text(soup.title.get_text())

                  og = soup.find(
                      "meta",
                      attrs={"property": "og:image"}
                  )

                  if og and og.get("content"):
                      img = urljoin(page_url, og["content"])

                      if official_image_url(img):
                          return {
                              "page": page_url,
                              "title": title,
                              "image": img
                          }

                  # fallback
                  candidates = []

                  for img_tag in soup.find_all("img"):
                      src = (
                          img_tag.get("data-src")
                          or img_tag.get("data-lazy-src")
                          or img_tag.get("src")
                      )

                      if not src:
                          continue

                      src = urljoin(page_url, src)

                      if not official_image_url(src):
                          continue

                      width = img_tag.get("width")
                      height = img_tag.get("height")

                      try:
                          w = int(width) if width else 0
                          h = int(height) if height else 0
                      except Exception:
                          w = h = 0

                      candidates.append(
                          (w * h, src)
                      )

                  candidates.sort(reverse=True)

                  if candidates:
                      return {
                          "page": page_url,
                          "title": title,
                          "image": candidates[0][1]
                      }

              except Exception:
                  pass

              return None


          # ==========================================================
          # SEARCH OFFICIAL IRASUTOYA
          # ==========================================================

          def search_irasutoya(term, max_pages=12):

              query = quote_plus(term)

              urls = []

              # Google
              google_url = (
                  "https://www.google.com/search?"
                  f"q=site%3Airasutoya.com+{query}"
              )

              r = get(google_url)

              if r:
                  soup = BeautifulSoup(r.text, "html.parser")

                  for a in soup.find_all("a"):
                      href = a.get("href", "")

                      if not href:
                          continue

                      if "irasutoya.com" not in href:
                          continue

                      if "/20" not in href:
                          continue

                      if href.startswith("/url?q="):
                          href = href.split("/url?q=", 1)[1].split("&", 1)[0]

                      if href.startswith("http"):
                          href = href.split("#")[0]

                          if href not in urls:
                              urls.append(href)

                      if len(urls) >= max_pages:
                          break

              # 公式検索
              official_search = (
                  f"https://www.irasutoya.com/search?q={query}"
              )

              r = get(official_search)

              if r:
                  soup = BeautifulSoup(r.text, "html.parser")

                  for a in soup.find_all("a", href=True):

                      href = urljoin(
                          "https://www.irasutoya.com/",
                          a["href"]
                      )

                      if "irasutoya.com" not in href:
                          continue

                      if "/20" not in href:
                          continue

                      if href not in urls:
                          urls.append(href)

                      if len(urls) >= max_pages:
                          break

              return urls


          # ==========================================================
          # SCORE
          #
          # 「人・行動」を強く評価
          # 「物だけ」を減点
          # ==========================================================

          def score_page(title, terms):

              text = normalize_text(title).lower()

              score = 0

              for term in terms:
                  if term.lower() in text:
                      score += 35

              for word in PERSON_WORDS:
                  if word.lower() in text:
                      score += 25

              for word in ACTION_WORDS:
                  if word.lower() in text:
                      score += 15

              for word in OBJECT_ONLY_WORDS:
                  if word.lower() in text:
                      score -= 25

              return score


          # ==========================================================
          # SEARCH PERSON-FIRST IMAGE
          # ==========================================================

          image_cache = {}

          def find_person_image(terms):

              cache_key = "|".join(sorted(terms))

              if cache_key in image_cache:
                  return image_cache[cache_key]

              candidates = []

              for term in terms:

                  pages = search_irasutoya(
                      term,
                      max_pages=10
                  )

                  for page in pages:

                      if page in image_cache:
                          item = image_cache[page]

                          if item:
                              candidates.append(item)

                          continue

                      item = extract_main_image(page)

                      image_cache[page] = item

                      if not item:
                          continue

                      item["score"] = score_page(
                          item["title"],
                          terms
                      )

                      candidates.append(item)

              candidates.sort(
                  key=lambda x: x.get("score", 0),
                  reverse=True
              )

              # 上位から人物系を優先
              for item in candidates:

                  title = item.get("title", "").lower()

                  has_person = any(
                      w.lower() in title
                      for w in PERSON_WORDS
                  )

                  has_action = any(
                      w.lower() in title
                      for w in ACTION_WORDS
                  )

                  if has_person and has_action:
                      image_cache[cache_key] = item
                      return item

              # 次点
              if candidates:
                  image_cache[cache_key] = candidates[0]
                  return candidates[0]

              image_cache[cache_key] = None
              return None


          # ==========================================================
          # DOWNLOAD IMAGE
          # ==========================================================

          downloaded = {}

          def download_image(item, index):

              if not item:
                  return None

              url = item["image"]

              if url in downloaded:
                  return downloaded[url]

              ext = ".jpg"

              if ".png" in url.lower():
                  ext = ".png"

              filename = (
                  f"media/images/"
                  f"irasutoya_{index:02d}{ext}"
              )

              try:

                  r = SESSION.get(
                      url,
                      timeout=30
                  )

                  if r.status_code != 200:
                      return None

                  Path(filename).write_bytes(
                      r.content
                  )

                  # 画像として開けるか確認
                  with Image.open(filename) as im:
                      im.verify()

                  downloaded[url] = filename

                  return filename

              except Exception:

                  try:
                      if os.path.exists(filename):
                          os.remove(filename)
                  except Exception:
                      pass

                  return None


