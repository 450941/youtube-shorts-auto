          async def create_voice(text, output):

              import edge_tts

              communicate = edge_tts.Communicate(
                  text,
                  VOICE,
                  rate=VOICE_RATE
              )

              await communicate.save(output)


          async def generate_all_voice():

              import asyncio

              for i, fact in enumerate(selected_facts):

                  segments = [
                      fact["hook"],
                      fact["answer"],
                      fact["reason"],
                      fact["punch"]
                  ]

                  fact["audio_segments"] = []

                  for j, text in enumerate(segments):

                      filename = (
                          f"media/voice/"
                          f"fact_{i:02d}_{j:02d}.mp3"
                      )

                      await create_voice(
                          text,
