name: Generate YouTube Short

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install tools
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            jq \
            curl

          fc-cache -fv

          echo "=== FFmpeg ==="
          ffmpeg -version | head -n 1

          echo "=== Japanese fonts ==="
          fc-list | grep -i "Noto Sans CJK" | head -n 5 || true

      # ============================================================
      # 3. Install Python packages
      # ============================================================
      - name: Install Python packages
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      # ============================================================
      # 4. Prepare Pexels history
      # ============================================================
      - name: Prepare Pexels history
        run: |
          set -e

          touch used_pexels.txt

          echo "=========================================="
          echo "Pexels history"
          echo "=========================================="

          COUNT=$(grep -cve '^[[:space:]]*$' used_pexels.txt || true)

          echo "Previously used videos: $COUNT"

      # ============================================================
      # 5. Create seed
      # ============================================================
      - name: Create seed
        run: |
          set -e

          DAY=$(($(date +%s) / 86400))

          HOUR=$(date -u +%H)
          HOUR=$((10#$HOUR))

          SLOT=$((HOUR / 12))

          SEED=$((DAY * 2 + SLOT))

          echo "SEED=$SEED" >> "$GITHUB_ENV"

          echo "========================================"
          echo "SEED: $SEED"
          echo "DAY : $DAY"
          echo "HOUR: $HOUR"
          echo "SLOT: $SLOT"
          echo "========================================"

      # ============================================================
      # 6. Select ONE encouragement from 1000 patterns
      # ============================================================
      - name: Generate encouragement script
        run: |
          set -e

          test -f encouragement_1000.json

          python - <<'PY'
          import json
          import os

          seed = int(os.environ["SEED"])

          with open(
              "encouragement_1000.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if isinstance(data, list):

              contents = data

          elif isinstance(data, dict):

              if "encouragement" in data:
                  contents = data["encouragement"]

              elif "contents" in data:
                  contents = data["contents"]

              elif "messages" in data:
                  contents = data["messages"]

              else:
                  raise RuntimeError(
                      "encouragement_1000.json の形式が認識できません。"
                  )

          else:

              raise RuntimeError(
                  "encouragement_1000.json が正しいJSONではありません。"
              )

          if not contents:

              raise RuntimeError(
                  "激励メッセージが0件です。"
              )

          normalized = []

          for item in contents:

              if isinstance(item, str):

                  text = item.strip()
                  title = text[:30]

              elif isinstance(item, dict):

                  text = str(
                      item.get("text")
                      or item.get("message")
                      or item.get("content")
                      or ""
                  ).strip()

                  title = str(
                      item.get("title")
                      or text[:30]
                  ).strip()

              else:

                  continue

              if not text:
                  continue

              normalized.append(
                  {
                      "text": text,
                      "title": title
                  }
              )

          contents = normalized

          if not contents:

              raise RuntimeError(
                  "有効な激励メッセージがありません。"
              )

          index = seed % len(contents)

          selected = contents[index]

          text = selected["text"]
          title = selected["title"]

          with open(
              "script.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(text)

          category = "激励"

          with open(
              "category.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(category)

          with open(
              "content_title.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(title)

          queries = [
              "person sunrise",
              "person sunset",
              "walking nature",
              "mountain sunrise",
              "ocean sunset",
              "person looking sky",
              "sunlight window",
              "forest walking",
              "peaceful nature",
              "hope sunrise"
          ]

          query = queries[
              seed % len(queries)
          ]

          with open(
              "pexels_query.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(query)

          video_title = (
              title
              + "｜今日のあなたへ #Shorts"
          )

          with open(
              "video_title.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(video_title)

          print("==========================================")
          print("ENCOURAGEMENT ONLY")
          print("==========================================")
          print("TOTAL MESSAGES:", len(contents))
          print("SEED          :", seed)
          print("INDEX         :", index)
          print("TITLE         :", title)
          print("QUERY         :", query)
          print("------------------------------------------")
          print("SCRIPT:")
          print(text)
          print("==========================================")
          PY

          QUERY=$(cat pexels_query.txt)

          VIDEO_TITLE=$(cat video_title.txt)

          CATEGORY=$(cat category.txt)

          echo "QUERY=$QUERY" >> "$GITHUB_ENV"

          echo "VIDEO_TITLE=$VIDEO_TITLE" >> "$GITHUB_ENV"

          echo "CATEGORY=$CATEGORY" >> "$GITHUB_ENV"

      # ============================================================
      # 7. Download NEW Pexels video
      # ============================================================
      - name: Download NEW Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |
          set -e

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "ERROR: PEXELS_API_KEY がありません"
            exit 1
          fi

          touch used_pexels.txt

          echo "=========================================="
          echo "Pexels search"
          echo "Category: $CATEGORY"
          echo "Query: $QUERY"
          echo "=========================================="

          search_pexels() {

            SEARCH_QUERY="$1"

            echo "Searching: $SEARCH_QUERY"

            ENCODED_QUERY=$(python - <<PY
          import urllib.parse

          print(
              urllib.parse.quote(
                  """$SEARCH_QUERY"""
              )
          )
          PY
            )

            curl \
              --fail \
              -L \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=80" \
              -o pexels.json

            COUNT=$(jq '.videos | length' pexels.json)

            echo "Results: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              return
            fi

            for i in $(seq 0 $((COUNT - 1))); do

              CANDIDATE=$(jq -r \
                --argjson index "$i" \
                '
                .videos[$index].video_files
                | map(
                    select(
                      .file_type=="video/mp4"
                      and .width >= 720
                      and .height > .width
                    )
                  )
                | sort_by(.width)
                | reverse
                | .[0].link // empty
                ' \
                pexels.json
              )

              if [ -z "$CANDIDATE" ]; then
                continue
              fi

              if grep -Fxq "$CANDIDATE" used_pexels.txt; then

                echo "SKIP USED VIDEO:"
                echo "$CANDIDATE"

                continue
              fi

              VIDEO_URL="$CANDIDATE"

              echo "=========================================="
              echo "NEW VIDEO FOUND"
              echo "$VIDEO_URL"
              echo "=========================================="

              return

            done
          }

          VIDEO_URL=""

          search_pexels "$QUERY"

          if [ -z "$VIDEO_URL" ]; then

            echo "No unused video in main search."

            search_pexels "sunrise"

          fi

          if [ -z "$VIDEO_URL" ]; then

            echo "No unused sunrise video."

            search_pexels "people"

          fi

          if [ -z "$VIDEO_URL" ]; then

            echo "=========================================="
            echo "ERROR"
            echo "=========================================="

            echo "新しいPexels動画が見つかりません。"
            echo "同じ映像を再利用せず、処理を停止します。"

            echo "=========================================="

            exit 1

          fi

          echo "Downloading NEW video..."

          curl \
            --fail \
            -L \
            "$VIDEO_URL" \
            -o source.mp4

          test -s source.mp4

          echo "$VIDEO_URL" >> used_pexels.txt

          echo "=========================================="
          echo "Video downloaded successfully."
          echo "Added to used_pexels.txt"
          echo "=========================================="

      # ============================================================
      # 8. Generate narration
      # ============================================================
      - name: Generate narration
        run: |
          set -e

          echo "Generating Japanese encouragement narration..."

          edge-tts \
            --voice ja-JP-NanamiNeural \
            --rate="+8%" \
            --file script.txt \
            --write-media voice.mp3

          test -s voice.mp3

          echo "Original narration duration:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3

      # ============================================================
      # 9. Fit narration to approximately 14.8 seconds
      # ============================================================
      - name: Fit narration
        run: |
          set -e

          TARGET=14.8

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "=========================================="
          echo "Original narration: $DURATION seconds"
          echo "Target duration: $TARGET seconds"
          echo "=========================================="

          SPEED=$(python - <<PY
          d = float("$DURATION")
          target = float("$TARGET")

          speed = d / target

          if speed < 0.5:
              speed = 0.5

          if speed > 2.0:
              speed = 2.0

          print(f"{speed:.8f}")
          PY
          )

          echo "Atempo: $SPEED"

          ffmpeg \
            -y \
            -i voice.mp3 \
            -filter:a "atempo=$SPEED" \
            -vn \
            voice_fit.mp3

          mv voice_fit.mp3 voice.mp3

          FINAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "=========================================="
          echo "Adjusted narration: $FINAL_DURATION seconds"
          echo "=========================================="

          if ! awk \
            "BEGIN {exit !($FINAL_DURATION >= 14.3 && $FINAL_DURATION <= 15.0)}"
          then

            echo "ERROR: Narration was not fitted correctly."

            exit 1

          fi

          echo "Narration fit OK."

      # ============================================================
      # 10. Create ASS subtitles
      # ============================================================
      - name: Create ASS subtitles
        run: |
          set -e

          python - <<'PY'
          import subprocess
          import re

          with open(
              "script.txt",
              encoding="utf-8"
          ) as f:

              raw_lines = [
                  x.strip()
                  for x in f.read().splitlines()
                  if x.strip()
              ]

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "voice.mp3"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          duration = float(
              result.stdout.strip()
          )

          duration = min(
              duration,
              15.0
          )

          def split_text(text):

              text = re.sub(
                  r"\s+",
                  "",
                  text
              )

              parts = re.split(
                  r"(?<=[。！？!?])",
                  text
              )

              parts = [
                  p.strip()
                  for p in parts
                  if p.strip()
              ]

              final = []

              for part in parts:

                  while len(part) > 18:

                      cut = 18

                      for i in range(12, 19):

                          if (
                              i < len(part)
                              and part[i] in "、，"
                          ):

                              cut = i + 1
                              break

                      final.append(
                          part[:cut]
                      )

                      part = part[cut:]

                  if part:
                      final.append(part)

              return final

          chunks = []

          for line in raw_lines:
              chunks.extend(
                  split_text(line)
              )

          if not chunks:

              raise RuntimeError(
                  "No subtitle chunks."
              )

          weights = []

          for chunk in chunks:

              clean = re.sub(
                  r"[^\wぁ-んァ-ン一-龥ー]",
                  "",
                  chunk
              )

              weights.append(
                  max(len(clean), 1)
              )

          total_weight = sum(
              weights
          )

          def ass_time(seconds):

              if seconds < 0:
                  seconds = 0

              hours = int(
                  seconds // 3600
              )

              minutes = int(
                  (seconds % 3600) // 60
              )

              secs = int(
                  seconds % 60
              )

              centis = int(
                  round(
                      (
                          seconds
                          - int(seconds)
                      ) * 100
                  )
              )

              if centis >= 100:

                  centis -= 100
                  secs += 1

              if secs >= 60:

                  secs -= 60
                  minutes += 1

              if minutes >= 60:

                  minutes -= 60
                  hours += 1

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{secs:02d}."
                  f"{centis:02d}"
              )

          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans CJK JP,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,4,2,2,60,60,260,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          current = 0.0

          with open(
              "captions.ass",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(header)

              for index, chunk in enumerate(
                  chunks
              ):

                  ratio = (
                      weights[index]
                      / total_weight
                  )

                  segment = (
                      duration
                      * ratio
                  )

                  start = current

                  end = (
                      current
                      + segment
                  )

                  if (
                      index
                      == len(chunks) - 1
                  ):

                      end = duration

                  if len(chunk) > 10:

                      midpoint = (
                          len(chunk) // 2
                      )

                      candidates = []

                      for i in range(
                          max(
                              5,
                              midpoint - 5
                          ),
                          min(
                              len(chunk) - 1,
                              midpoint + 6
                          )
                      ):

                          if chunk[i] in "、。！？":

                              candidates.append(
                                  i + 1
                              )

                      if candidates:

                          split_at = min(
                              candidates,
                              key=lambda x:
                              abs(
                                  x - midpoint
                              )
                          )

                      else:

                          split_at = midpoint

                      text = (
                          chunk[:split_at]
                          + r"\N"
                          + chunk[split_at:]
                      )

                  else:

                      text = chunk

                  f.write(
                      "Dialogue: 0,"
                      + ass_time(start)
                      + ","
                      + ass_time(end)
                      + ",Default,,0,0,0,,"
                      + text
                      + "\n"
                  )

                  current = end

          print("==========================================")
          print("ASS subtitle created")
          print("Audio duration:", duration)
          print("Chunks:", len(chunks))
          print("==========================================")

      # ============================================================
      # 11. Render Short
      #     Video ends exactly with narration
      # ============================================================
      - name: Render Short
        run: |
          set -e

          echo "=========================================="
          echo "Rendering Short"
          echo "NO EXTRA SILENCE"
          echo "Category: $CATEGORY"
          echo "=========================================="

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "Audio duration: $AUDIO_DURATION"

          ffmpeg \
            -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i voice.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,ass=captions.ass" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -t "$AUDIO_DURATION" \
            -movflags +faststart \
            short.mp4

          test -s short.mp4

          echo "=========================================="
          echo "Render completed."
          echo "Video ends exactly with narration."
          echo "No extra silence."
          echo "=========================================="

      # ============================================================
      # 12. Check video
      # ============================================================
      - name: Check video
        run: |
          set -e

          echo "=========================================="
          echo "VIDEO INFORMATION"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            short.mp4

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            short.mp4)

          echo ""
          echo "Final duration: $DURATION"

          if ! awk \
            "BEGIN {exit !($DURATION >= 14.0 && $DURATION <= 15.0)}"
          then

            echo "ERROR: Video duration is not close enough to 15 seconds."

            exit 1

          fi

          echo "Video check OK."

      # ============================================================
      # 13. Create YouTube upload script
      # ============================================================
      - name: Create YouTube upload script
        run: |
          set -e

          cat > upload.py <<'PY'
          import os

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload


          CLIENT_ID = os.environ[
              "YOUTUBE_CLIENT_ID"
          ]

          CLIENT_SECRET = os.environ[
              "YOUTUBE_CLIENT_SECRET"
          ]

          REFRESH_TOKEN = os.environ[
              "YOUTUBE_REFRESH_TOKEN"
          ]


          credentials = Credentials(

              token=None,

              refresh_token=REFRESH_TOKEN,

              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),

              client_id=CLIENT_ID,

              client_secret=CLIENT_SECRET,

              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          title = os.environ.get(
              "VIDEO_TITLE",
              "今日のあなたへ #Shorts"
          )


          description = (
              "今日を頑張るあなたへ。\n"
              "少しでも心が軽くなる言葉を15秒で。\n\n"
              "#Shorts #激励 #応援 #前向き #モチベーション"
          )


          tags = [
              "Shorts",
              "激励",
              "応援",
              "前向き",
              "モチベーション",
              "励まし",
              "癒し",
              "言葉"
          ]


          body = {

              "snippet": {

                  "title": title,

                  "description": description,

                  "tags": tags,

                  "categoryId": "22"
              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False
              }
          }


          media = MediaFileUpload(

              "short.mp4",

              mimetype="video/mp4",

              resumable=True
          )


          request = youtube.videos().insert(

              part="snippet,status",

              body=body,

              media_body=media
          )


          response = None


          while response is None:

              status, response = (
                  request.next_chunk()
              )

              if status:

                  print(
                      "Upload progress:",
                      int(
                          status.progress() * 100
                      ),
                      "%"
                  )


          print(
              "=========================================="
          )

          print(
              "YouTube upload completed!"
          )

          print(
              "Category: 激励"
          )

          print(
              "Video ID:",
              response["id"]
          )

          print(
              "URL:",
              "https://www.youtube.com/watch?v="
              + response["id"]
          )

          print(
              "=========================================="
          )
          PY

      # ============================================================
      # 14. Upload to YouTube
      # ============================================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ env.VIDEO_TITLE }}
          CATEGORY: ${{ env.CATEGORY }}

        run: |
          set -e

          python upload.py

      # ============================================================
      # 15. Save Pexels history
      # ============================================================
      - name: Save Pexels history
        run: |
          set -e

          echo "=========================================="
          echo "Saving Pexels video history"
          echo "=========================================="

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_pexels.txt

          if git diff --cached --quiet; then

            echo "No changes to Pexels history."

          else

            git commit \
              -m "Update used Pexels video history"

            git push

          fi

      # ============================================================
      # 16. Upload artifact
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4

        with:

          name: youtube-short-${{ github.run_number }}

          path: |
            short.mp4
            script.txt
            captions.ass
            category.txt
            content_title.txt
            used_pexels.txt

          retention-days: 3
