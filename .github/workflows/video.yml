name: Generate YouTube Short

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct MP4 video URL"
        required: true
        type: string
      title:
        description: "YouTube title"
        required: true
        type: string
      script:
        description: "Japanese narration script"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Edge TTS
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Download video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          curl -L --fail "$VIDEO_URL" -o source.mp4
          test -s source.mp4
          ffprobe -v error source.mp4

      - name: Save script
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          printf '%s' "$SCRIPT" > script.txt
          test -s script.txt

      - name: Generate Japanese voice
        run: |
          edge-tts \
            --voice ja-JP-NanamiNeural \
            --file script.txt \
            --write-media voice.mp3

      - name: Get voice duration
        run: |
          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of 
