name: Generate YouTube Short

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct MP4 video URL"
        required: true
        type: string
      title:
        description: "YouTube title"
        required: true
        type: string
      script:
        description: "Japanese narration script"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Edge TTS
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Download video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          curl -L --fail "$VIDEO_URL" -o source.mp4
          test -s source.mp4
          ffprobe -v error source.mp4

      - name: Save script
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          printf '%s' "$SCRIPT" > script.txt
          test -s script.txt

      - name: Generate Japanese voice
        run: |
          edge-tts \
            --voice ja-JP-NanamiNeural \
            --file script.txt \
            --write-media voice.mp3

      - name: Get voice duration
        run: |
          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 voice.mp3)

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "Voice duration: $DURATION"

      - name: Create subtitles
        env:
          SCRIPT: ${{ inputs.script }}
          DURATION: ${{ env.DURATION }}
        run: |
          python - <<'PY'
          import os
          import math

          text = os.environ["SCRIPT"].replace("\r", "").strip()
          duration = float(os.environ["DURATION"])

          chunks = [
              text[i:i+18]
              for i in range(0, len(text), 18)
          ]

          chunk_duration = duration / max(len(chunks), 1)

          def timestamp(sec):
              ms = int(sec * 1000)
              h = ms // 3600000
              ms %= 3600000
              m = ms // 60000
              ms %= 60000
              s = ms // 1000
              ms %= 1000
              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          with open("captions.srt", "w", encoding="utf-8") as f:
              for i, chunk in enumerate(chunks, 1):
                  start = (i - 1) * chunk_duration
                  end = min(i * chunk_duration, duration)

                  f.write(f"{i}\n")
                  f.write(
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                  )
                  f.write(chunk + "\n\n")
          PY

      - name: Render vertical video
        run: |
          ffmpeg -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i voice.mp3 \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=captions.srt:force_style='FontName=Noto Sans CJK JP,FontSize=24,Alignment=2,MarginV=180,Outline=2'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
    
