name: Generate YouTube Short

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ==========================================
      # 1. 必要ツール
      # ==========================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk jq

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      # ==========================================
      # 3. SEED作成
      # ==========================================
      - name: Create seed
        run: |

          set -e

          DAY=$(($(date +%s) / 86400))
          HOUR=$(date -u +%H)
          HOUR=$((10#$HOUR))
          SLOT=$((HOUR / 12))

          SEED=$((DAY * 2 + SLOT))

          echo "SEED=$SEED" >> "$GITHUB_ENV"

          echo "================================"
          echo "SEED: $SEED"
          echo "================================"

      # ==========================================
      # 4. 300,000パターン生成
      # ==========================================
      - name: Generate 300000 patterns
        run: |

          set -e

          python - <<'PY'

          import os

          seed = int(os.environ["SEED"])

          # =====================================================
          # 雑学本体
          #
          # 30種類
          # =====================================================

          facts = [

              {
                  "query": "octopus underwater",
                  "title": "タコの心臓は3つ",
                  "text": "タコには心臓が3つあります。しかも、そのうち2つはエラへ血液を送っています。"
              },

              {
                  "query": "octopus underwater",
                  "title": "タコの血は青い",
                  "text": "タコの血は青色です。酸素を運ぶ成分に、鉄ではなく銅を含む物質が使われています。"
              },

              {
                  "query": "cat cute",
                  "title": "猫は甘さを感じにくい",
                  "text": "猫は人間のように甘味を感じるための仕組みがうまく働きません。だから甘い物への反応が違います。"
              },

              {
                  "query": "butterfly",
                  "title": "チョウは足で味を感じる",
                  "text": "チョウには足にも味を感じるための器官があります。花に止まったとき、食べられるものか確認しています。"
              },

              {
                  "query": "bat flying",
                  "title": "コウモリは空を飛べる哺乳類",
                  "text": "コウモリは、継続的な飛行ができる唯一の哺乳類です。しかも種類によっては音で周囲を把握します。"
              },

              {
                  "query": "hummingbird",
                  "title": "ハチドリは後ろ向きに飛べる",
                  "text": "ハチドリは鳥の中でも珍しく、後ろ向きに飛ぶことができます。翼を特殊な動かし方で使っています。"
              },

              {
                  "query": "penguin",
                  "title": "ペンギンには膝がある",
                  "text": "ペンギンにも膝があります。ただし、脚の奥に隠れているため、外からは分かりにくいんです。"
              },

              {
                  "query": "wombat",
                  "title": "ウォンバットのフンは四角い",
                  "text": "ウォンバットのフンは四角い形をしています。腸の形や収縮の仕組みが関係しています。"
              },

              {
                  "query": "crow bird",
                  "title": "カラスは人の顔を覚える",
                  "text": "カラスは人の顔を見分ける能力について研究されています。人間が思う以上に記憶力が優れています。"
              },

              {
                  "query": "dolphin ocean",
                  "title": "イルカには特徴的な呼び声がある",
                  "text": "イルカには個体ごとに特徴的な呼び声があり、仲間とのコミュニケーションに使われています。"
              },

              {
                  "query": "human brain",
                  "title": "記憶は録画ではない",
                  "text": "人間の記憶は、動画のようにそのまま保存されるわけではありません。思い出すときに再構成されます。"
              },

              {
                  "query": "brain psychology",
                  "title": "自分の名前には反応しやすい",
                  "text": "騒がしい場所でも、自分の名前が聞こえると注意を向けやすくなる現象が知られています。"
              },

              {
                  "query": "brain thinking",
                  "title": "マルチタスクは切り替えが多い",
                  "text": "人間は複数のことを同時にしているように感じても、実際には注意を素早く切り替えている場合があります。"
              },

              {
                  "query": "sleep bed",
                  "title": "睡眠中も脳は働いている",
                  "text": "眠っている間も脳が完全に停止するわけではありません。睡眠中にもさまざまな活動が続いています。"
              },

              {
                  "query": "music headphones",
                  "title": "音楽は記憶を呼び起こす",
                  "text": "音楽は過去の出来事や感情と結びつき、昔の記憶を思い出すきっかけになることがあります。"
              },

              {
                  "query": "smell perfume",
                  "title": "香りは記憶と結びつきやすい",
                  "text": "香りは記憶や感情と強く結びつくことがあります。昔の香りで突然記憶がよみがえることがあるのはそのためです。"
              },

              {
                  "query": "banana",
                  "title": "バナナは植物学上ベリー",
                  "text": "植物学上では、バナナはベリーに分類されます。普段のイメージとはかなり違います。"
              },

              {
                  "query": "strawberry",
                  "title": "イチゴは植物学上のベリーではない",
                  "text": "イチゴは普段ベリーと呼ばれますが、植物学上の分類では一般的なベリーとは異なります。"
              },

              {
                  "query": "popcorn",
                  "title": "ポップコーンが爆発する理由",
                  "text": "ポップコーンの粒の中には水分があります。加熱すると水蒸気になり、圧力で粒が弾けます。"
              },

              {
                  "query": "bread bakery",
                  "title": "パンが古くなる科学",
                  "text": "パンが時間とともに硬くなるのは、単純に水分がなくなるだけではありません。デンプンの変化も関係しています。"
              },

              {
                  "query": "ice water",
                  "title": "氷は水に浮く",
                  "text": "氷は液体の水より密度が低いため、水に浮きます。これは水が持つ珍しい性質の一つです。"
              },

              {
                  "query": "lightning storm",
                  "title": "雷は太陽表面より高温になることがある",
                  "text": "雷の放電が通る空気は、瞬間的に太陽表面より高い温度になることがあります。"
              },

              {
                  "query": "rainbow sky",
                  "title": "虹は条件次第で円に見える",
                  "text": "虹は条件がそろうと円形に近い姿として見えることがあります。地上では一部しか見えないことが多いんです。"
              },

              {
                  "query": "sky blue",
                  "title": "空が青く見える理由",
                  "text": "空が青く見えるのは、太陽光が大気中で散乱するためです。青い光は特に散乱されやすい性質があります。"
              },

              {
                  "query": "moon space",
                  "title": "月の光は自分で作っていない",
                  "text": "夜空で輝いて見える月の光は、月自身が作った光ではありません。太陽の光を反射しています。"
              },

              {
                  "query": "sun earth space",
                  "title": "太陽の光が地球に届くまで",
                  "text": "太陽から地球まで光が届くには、およそ8分20秒かかります。今見ている太陽は少し前の姿です。"
              },

              {
                  "query": "venus planet",
                  "title": "金星は1日が1年より長い",
                  "text": "金星では、自転にかかる時間が公転周期より長いという不思議な特徴があります。"
              },

              {
                  "query": "mars planet",
                  "title": "火星では青い夕焼けが見える",
                  "text": "火星の夕焼けは、地球とは違って青っぽく見えることがあります。大気中の細かなちりが関係しています。"
              },

              {
                  "query": "saturn planet",
                  "title": "土星は水より平均密度が低い",
                  "text": "土星の平均密度は水より低いです。もちろん実際に巨大な水槽へ浮かべることはできません。"
              },

              {
                  "query": "airplane window",
                  "title": "飛行機の窓には小さな穴がある",
                  "text": "飛行機の窓にある小さな穴は、窓の層の間の圧力差を調整する役割があります。"
              }

          ]

          # =====================================================
          # 100種類の導入
          # 10 × 10
          # =====================================================

          hook_a = [
              "実は、",
              "意外ですが、",
              "知っていましたか？",
              "これ、意外と知られていません。",
              "ここで一つ、面白い話です。",
              "身近な話ですが、",
              "一見普通ですが、",
              "思わず誰かに話したくなるのが、",
              "実は私たちの身近に、",
              "たった15秒ですが、"
          ]

          hook_b = [
              "こんな事実があります。",
              "ちゃんと理由があります。",
              "科学で説明できます。",
              "意外な仕組みがあります。",
              "面白い秘密があります。",
              "知られざる特徴があります。",
              "ちょっと不思議な現象があります。",
              "知ると見方が変わります。",
              "意外な事実が隠れています。",
              "答えを知ると納得します。"
          ]

          hooks = [
              a + b
              for a in hook_a
              for b in hook_b
          ]

          # =====================================================
          # 100種類の締め
          # 10 × 10
          # =====================================================

          end_a = [
              "知っておくと",
              "覚えておくと",
              "次に見たときは",
              "誰かに話すと",
              "こういう話を知ると",
              "身近な世界を見ると",
              "次にこの話題が出たら",
              "今日の雑学として",
              "こういう小さな発見が",
              "世界はこうして見ると"
          ]

          end_b = [
              "ちょっと得した気分です。",
              "思わず話したくなります。",
              "少し見え方が変わります。",
              "きっと思い出せます。",
              "意外と面白いですよね。",
              "また一つ知識が増えました。",
              "ちょっとだけ楽しくなります。",
              "話のネタになります。",
              "不思議に感じるはずです。",
              "まだまだ奥深いんです。"
          ]

          endings = [
              a + "、" + b
              for a in end_a
              for b in end_b
          ]

          # =====================================================
          # 300,000通り
          #
          # 30 facts
          # × 100 hooks
          # × 100 endings
          # = 300,000
          #
          # seedを混ぜて順番に消化
          # =====================================================

          FACT_COUNT = len(facts)
          HOOK_COUNT = len(hooks)
          END_COUNT = len(endings)

          TOTAL = (
              FACT_COUNT
              * HOOK_COUNT
              * END_COUNT
          )

          # mixed-radix
          #
          # これにより300,000組を一周するまで
          # 同じ組み合わせが基本的に再登場しません。

          fact_index = seed % FACT_COUNT

          hook_index = (
              seed // FACT_COUNT
          ) % HOOK_COUNT

          ending_index = (
              seed // (FACT_COUNT * HOOK_COUNT)
          ) % END_COUNT

          fact = facts[fact_index]

          hook = hooks[hook_index]

          ending = endings[ending_index]

          # =====================================================
          # 台本
          # =====================================================

          script = (
              hook
              + "\n"
              + fact["text"]
              + "\n"
              + ending
          )

          # =====================================================
          # 保存
          # =====================================================

          with open(
              "script.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(script)

          with open(
              "category.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(fact["title"])

          with open(
              "pexels_query.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(fact["query"])

          with open(
              "video_title.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  fact["title"]
                  + " #Shorts"
              )

          # =====================================================
          # ログ
          # =====================================================

          print("")
          print("========================================")
          print("300,000 PATTERN ENGINE")
          print("========================================")

          print(
              "Facts:",
              FACT_COUNT
          )

          print(
              "Hooks:",
              HOOK_COUNT
          )

          print(
              "Endings:",
              END_COUNT
          )

          print(
              "TOTAL:",
              TOTAL
          )

          print(
              "Seed:",
              seed
          )

          print(
              "Fact index:",
              fact_index
          )

          print(
              "Hook index:",
              hook_index
          )

          print(
              "Ending index:",
              ending_index
          )

          print("")
          print("TITLE:")
          print(fact["title"])

          print("")
          print("SCRIPT:")
          print(script)

          print("========================================")

          PY

          QUERY=$(cat pexels_query.txt)

          VIDEO_TITLE=$(cat video_title.txt)

          echo "QUERY=$QUERY" >> "$GITHUB_ENV"

          echo "VIDEO_TITLE=$VIDEO_TITLE" >> "$GITHUB_ENV"

      # ==========================================
      # 5. Pexels映像
      # ==========================================
      - name: Download Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |

          set -e

          ENCODED_QUERY=$(python - <<PY
          import urllib.parse
          print(
              urllib.parse.quote(
                  """$QUERY"""
              )
          )
          PY
          )

          curl \
            --fail \
            -L \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=20" \
            -o pexels.json

          COUNT=$(jq '.videos | length' pexels.json)

          echo "Pexels videos: $COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "No portrait video found."
            echo "Trying fallback..."

            curl \
              --fail \
              -L \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=people&orientation=portrait&size=medium&per_page=20" \
              -o pexels.json

            COUNT=$(jq '.videos | length' pexels.json)

          fi

          test "$COUNT" -gt 0

          INDEX=$((SEED % COUNT))

          VIDEO_URL=$(jq -r \
            --argjson index "$INDEX" \
            '
            .videos[$index].video_files
            | map(
                select(
                  .file_type=="video/mp4"
                )
              )
            | sort_by(.width)
            | reverse
            | .[0].link
            ' \
            pexels.json
          )

          test -n "$VIDEO_URL"

          curl \
            --fail \
            -L \
            "$VIDEO_URL" \
            -o source.mp4

          test -s source.mp4

          echo "Pexels video downloaded."

      # ==========================================
      # 6. ナレーション
      # ==========================================
      - name: Generate narration
        run: |

          set -e

          edge-tts \
            --voice ja-JP-NanamiNeural \
            --rate="+8%" \
            --file script.txt \
            --write-media voice.mp3

          echo "Voice generated."

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3

      # ==========================================
      # 7. 音声を15秒以内へ調整
      # ==========================================
      - name: Fit narration
        run: |

          set -e

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3
          )

          echo "Narration: $DURATION seconds"

          if awk "BEGIN {exit !($DURATION > 14.5)}"; then

            SPEED=$(python - <<PY
          d = float("$DURATION")
          speed = d / 14.5

          if speed < 1:
              speed = 1

          if speed > 1.95:
              speed = 1.95

          print(f"{speed:.6f}")
          PY
            )

            echo "Speed: $SPEED"

            ffmpeg \
              -y \
              -i voice.mp3 \
              -filter:a "atempo=$SPEED" \
              voice2.mp3

            mv voice2.mp3 voice.mp3

          fi

      # ==========================================
      # 8. 字幕
      # ==========================================
      - name: Create subtitles
        run: |

          set -e

          python - <<'PY'

          import subprocess

          with open(
              "script.txt",
              encoding="utf-8"
          ) as f:

              lines = [
                  x.strip()
                  for x in f.read().splitlines()
                  if x.strip()
              ]

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "voice.mp3"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          duration = float(
              result.stdout.strip()
          )

          duration = min(
              duration,
              14.5
          )

          total_chars = sum(
              len(x)
              for x in lines
          )

          def ts(seconds):

              ms = int(seconds * 1000)

              h = ms // 3600000

              ms %= 3600000

              m = ms // 60000

              ms %= 60000

              s = ms // 1000

              ms %= 1000

              return (
                  f"{h:02}:"
                  f"{m:02}:"
                  f"{s:02},"
                  f"{ms:03}"
              )

          current = 0

          with open(
              "captions.srt",
              "w",
              encoding="utf-8"
          ) as f:

              for i, line in enumerate(
                  lines,
                  1
              ):

                  ratio = (
                      len(line)
                      /
                      max(total_chars, 1)
                  )

                  segment = (
                      duration
                      * ratio
                  )

                  start = current

                  end = min(
                      current + segment,
                      14.5
                  )

                  f.write(
                      f"{i}\n"
                  )

                  f.write(
                      f"{ts(start)} --> "
                      f"{ts(end)}\n"
                  )

                  f.write(
                      line
                  )

                  f.write("\n\n")

                  current = end

          PY

      # ==========================================
      # 9. 動画生成
      # ==========================================
      - name: Render 15 second Short
        run: |

          set -e

          ffmpeg \
            -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i voice.mp3 \
            -t 15 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=captions.srt:force_style='FontName=Noto Sans CJK JP,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=230'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -af "apad=pad_dur=15,atrim=0:15" \
            -t 15 \
            short.mp4

          test -s short.mp4

      # ==========================================
      # 10. 動画チェック
      # ==========================================
      - name: Check video
        run: |

          set -e

          echo "================================"
          echo "FINAL VIDEO"
          echo "================================"

          ls -lh short.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            short.mp4

          ffprobe \
            -v error \
            -show_streams \
            short.mp4

      # ==========================================
      # 11. YouTube投稿
      # ==========================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |

          set -e

          cat > upload.py <<'PY'

          import os

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload


          credentials = Credentials(

              token=None,

              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],

              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),

              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],

              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],

              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]

          )


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          title = os.environ.get(
              "VIDEO_TITLE",
              "知らないと驚く雑学 #Shorts"
          )


          description = (
              "15秒で楽しめる雑学ショートです。\n"
              "知っていると誰かに話したくなる豆知識を紹介します。\n"
              "\n"
              "#Shorts #雑学 #豆知識"
          )


          body = {

              "snippet": {

                  "title": title,

                  "description": description,

                  "categoryId": "22"

              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False

              }

          }


          media = MediaFileUpload(

              "short.mp4",

              mimetype="video/mp4",

              resumable=True

          )


          request = youtube.videos().insert(

              part="snippet,status",

              body=body,

              media_body=media

          )


          response = request.execute()


          print("")
          print("================================")
          print("YOUTUBE UPLOAD SUCCESS")
          print("================================")

          print(
              "VIDEO ID:",
              response["id"]
          )

          print(
              "TITLE:",
              title
          )

          print(
              "URL:",
              "https://www.youtube.com/watch?v="
              + response["id"]
          )

          print("================================")


          PY

