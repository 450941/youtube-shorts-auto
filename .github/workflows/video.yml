name: Generate YouTube Short

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk jq

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Select daily content
        run: |
          DAY=$(($(date +%s) / 86400))
          HOUR=$(date -u +%H)
          HOUR=$((10#$HOUR))
          SLOT=$((HOUR / 12))
          SEED=$((DAY * 2 + SLOT))

          echo "SEED=$SEED" >> "$GITHUB_ENV"

          INDEX=$((SEED % 20))

          case $INDEX in
            0) QUERY="calm nature" ;;
            1) QUERY="sunset" ;;
            2) QUERY="city night" ;;
            3) QUERY="ocean" ;;
            4) QUERY="walking" ;;
            5) QUERY="rain" ;;
            6) QUERY="morning" ;;
            7) QUERY="mountain" ;;
            8) QUERY="coffee" ;;
            9) QUERY="peaceful life" ;;
            10) QUERY="forest" ;;
            11) QUERY="road trip" ;;
            12) QUERY="clouds" ;;
            13) QUERY="river" ;;
            14) QUERY="beach" ;;
            15) QUERY="stars night" ;;
            16) QUERY="flowers" ;;
            17) QUERY="city walking" ;;
            18) QUERY="sunrise" ;;
            19) QUERY="quiet room" ;;
          esac

          echo "QUERY=$QUERY" >> "$GITHUB_ENV"

      - name: Search Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          curl -L --fail \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/videos/search?query=$(printf '%s' "$QUERY" | sed 's/ /%20/g')&orientation=portrait&size=medium&per_page=20" \
            -o pexels.json

          COUNT=$(jq '.videos | length' pexels.json)
          test "$COUNT" -gt 0

          VIDEO_INDEX=$((SEED % COUNT))

          VIDEO_URL=$(jq -r --argjson index "$VIDEO_INDEX" '
            .videos[$index].video_files
            | map(select(.file_type=="video/mp4"))
            | sort_by(.width)
            | reverse
            | .[0].link
          ' pexels.json)

          test -n "$VIDEO_URL"
          test "$VIDEO_URL" != "null"

          curl -L --fail "$VIDEO_URL" -o source.mp4

          test -s source.mp4
          ffprobe -v error source.mp4

      - name: Create viral style script
        run: |
          OPENINGS=(
            "もし今、何もやる気が出ないなら、この動画だけ見てください。"
            "実は、頑張っている人ほど気づいていないことがあります。"
            "最近、心から笑えていますか。"
            "誰にも言えないけど、しんどいと思っていませんか。"
            "何もしたくない日がある人へ。"
            "周りは前に進んでいるのに、自分だけ止まっている気がする。"
            "頑張っているのに、なぜか報われない。そんな日があります。"
            "夜になると急に不安になる人へ。"
            "自分だけ弱いと思っていませんか。"
            "今日、何もできなかったと思っているあなたへ。"
            "本当は疲れているのに、無理して笑っていませんか。"
            "誰かの言葉に傷ついたあなたへ。"
            "人生がうまくいかないと感じるときがあります。"
            "忘れられない失敗を、何度も思い出してしまう人へ。"
            "大丈夫なふりをしている人へ。"
            "もしかすると、あなたに必要なのは努力じゃないかもしれません。"
            "自分を責めることが癖になっていませんか。"
            "朝起きるだけで疲れている。そんな日もあります。"
            "人と比べて落ち込んでしまうあなたへ。"
            "今日は少しだけ、頑張るのをやめてみませんか。"
            "何をしても楽しくないと感じるときがあります。"
            "誰にも褒められなくても、続けていることがあります。"
            "本当に強い人は、ずっと頑張り続ける人ではありません。"
            "つらいと言えない人ほど、頑張りすぎています。"
            "もし今日が人生で一番しんどい日なら。"
            "自分には価値がないと思ったことはありませんか。"
            "心が限界に近づくと、ある変化が起こります。"
            "明日のことを考えるだけで苦しくなる夜があります。"
            "誰かに必要とされたいと思うことがあります。"
            "頑張れない自分を、責めなくていいんです。"
          )

          MIDDLES=(
            "それは怠けているからではなく、心が休みたがっているサインかもしれません。"
            "人間はずっと走り続けられるようにはできていません。休む時間も必要です。"
            "他人の人生と自分の人生を比べなくて大丈夫です。"
            "見えないところで積み重ねた努力は、ちゃんとあなたの中に残っています。"
            "今日できなかったことより、今日ここまで耐えたことを大切にしてください。"
            "すぐに答えを出さなくても大丈夫です。時間をかけてもいいんです。"
            "つらいときは、誰かに頼ってもいい。全部一人で抱える必要はありません。"
            "人生には、前に進む時間だけではなく、立ち止まる時間もあります。"
            "失敗したからといって、あなた自身が失敗した人になるわけではありません。"
            "自分に向ける言葉だけでも、少し優しくしてみてください。"
            "完璧じゃなくてもいい。むしろ、完璧じゃないからこそ人間らしいんです。"
            "小さな一歩は、本人が思っている以上に大きな一歩です。"
            "誰かに理解されなくても、あなたが感じた苦しさは本物です。"
            "今日を乗り越えるだけで精一杯なら、それだけで十分頑張っています。"
            "今の自分を否定するより、まずはそのまま受け止めてみてください。"
            "何も変わらないように見える日にも、少しずつ時間は進んでいます。"
            "あなたの価値は、仕事ができるかどうかだけでは決まりません。"
            "元気になれない自分を、無理に元気にしなくても大丈夫です。"
            "誰かの期待通りに生きる必要はありません。"
            "焦って答えを探さなくても、今は休むことを選んでいいんです。"
            "できることを一つだけ。それで十分な日もあります。"
            "過去の自分も、そのときできることを精一杯やっていました。"
            "心が疲れているときは、普通にできていたことさえ難しくなります。"
            "助けを求めることは、弱さではなく自分を守るための行動です。"
            "今日という一日は、明日の自分を決めるすべてではありません。"
            "少し休んだあとに、また歩き出せばいいんです。"
            "人生には、自分ではどうにもできない時期もあります。"
            "誰かと同じ速さで進む必要はありません。"
            "今の自分にできることだけで十分です。"
            "つらい気持ちは、無理に消そうとしなくてもいいんです。"
          )

          ENDINGS=(
            "だから今日は、自分に「よくやった」と言ってあげてください。"
            "今日を生き抜いた。それだけで十分です。"
            "明日は、今日より少しだけ楽になりますように。"
            "あなたの人生は、あなたのペースで進めばいい。"
            "今夜くらい、自分を休ませてあげてください。"
            "大丈夫。ゆっくりでも前に進んでいます。"
            "焦らなくていい。あなたにはあなたの時間があります。"
            "何もできない日があっても、あなたの価値は変わりません。"
            "明日また、できることから始めればいいんです。"
            "今日も本当に、お疲れさまでした。"
            "あなたが思っているより、あなたはちゃんと頑張っています。"
            "この言葉が必要な誰かにも、そっと届けてあげてください。"
            "忘れないでください。あなたは一人ではありません。"
            "今は休んでいい。立ち止まっていいんです。"
            "いつか今日を振り返って、少し笑える日が来ますように。"
            "あなた自身を、あなたが一番大切にしてあげてください。"
            "明日も無理せず、自分の歩幅でいきましょう。"
            "今日ここまで来たことを、ちゃんと褒めてあげてください。"
            "ゆっくりでいい。その一歩には意味があります。"
            "この動画を閉じる前に、一度だけ深呼吸してみてください。"
            "今日も生きている。それだけで十分です。"
            "あなたの物語は、まだ終わっていません。"
            "つらいときは、誰かに話してください。"
            "自分を責めるのは、今日はもう終わりにしましょう。"
            "また明日、ここから始めればいいんです。"
            "あなたの未来は、今日だけでは決まりません。"
            "少しずつで大丈夫です。"
            "あなたのペースでいいんです。"
            "今日も一日、よく頑張りました。"
            "明日は少しでも、心が軽くなりますように。"
          )

          O_COUNT=${#OPENINGS[@]}
          M_COUNT=${#MIDDLES[@]}
          E_COUNT=${#ENDINGS[@]}

          O_INDEX=$((SEED % O_COUNT))
          M_INDEX=$(((SEED / O_COUNT) % M_COUNT))
          E_INDEX=$(((SEED / O_COUNT / M_COUNT) % E_COUNT))

          TEXT="${OPENINGS[$O_INDEX]} ${MIDDLES[$M_INDEX]} ${ENDINGS[$E_INDEX]}"

          printf '%s\n' "$TEXT" > script.txt

          echo "Generated script:"
          cat script.txt

      - name: Generate Japanese voice
        run: |
          edge-tts \
            --voice ja-JP-NanamiNeural \
            --file script.txt \
            --write-media voice.mp3

      - name: Get voice duration
        run: |
          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 voice.mp3)

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"

      - name: Create subtitles
        run: |
          python - <<'PY'
          import os

          with open("script.txt", encoding="utf-8") as f:
              text = f.read().strip()

          duration = float(os.environ["DURATION"])

          chunks = []
          current = ""

          for char in text:
              current += char
              if char in "。！？":
                  chunks.append(current.strip())
                  current = ""

          if current.strip():
              chunks.append(current.strip())

          chunk_duration = duration / len(chunks)

          def timestamp(sec):
              ms = int(sec * 1000)
              h = ms // 3600000
              ms %= 3600000
              m = ms // 60000
              ms %= 60000
              s = ms // 1000
              ms %= 1000
              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          with open("captions.srt", "w", encoding="utf-8") as f:
              for i, chunk in enumerate(chunks, 1):
                  start = (i - 1) * chunk_duration
                  end = min(i * chunk_duration, duration)

                  f.write(f"{i}\n")
                  f.write(f"{timestamp(start)} --> {timestamp(end)}\n")
                  f.write(chunk + "\n\n")
          PY

      - name: Render vertical video
        run: |
          ffmpeg -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i voice.mp3 \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=captions.srt:force_style='FontName=Noto Sans CJK JP,FontSize=24,Alignment=2,MarginV=180,Outline=2'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            short.mp4

      - name: Check output
        run: |
          ls -lh short.mp4
          ffprobe -v error short.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": "今日、少し疲れているあなたへ #Shorts",
                  "description": "無理しなくて大丈夫。今日も自分のペースで。 #Shorts",
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = request.execute()

          print("YouTube upload completed!")
          print("Video ID:", response["id"])
          PY

          python upload_youtube.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: short.mp4
          retention-days: 1
