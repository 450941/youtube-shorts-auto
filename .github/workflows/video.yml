name: Generate YouTube Short

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install tools
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            jq \
            curl \
            python3 \
            python3-pip

      # ============================================================
      # 3. Install Python packages
      # ============================================================
      - name: Install Python packages
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ============================================================
      # 4. Prepare Pexels history
      # ============================================================
      - name: Prepare Pexels history
        run: |
          set -e

          if [ ! -f used_pexels.txt ]; then
            touch used_pexels.txt
          fi

          echo "=========================================="
          echo "PEXELS HISTORY"
          echo "=========================================="

          wc -l used_pexels.txt || true

      # ============================================================
      # 5. Select encouragement message
      # ============================================================
      - name: Select encouragement
        env:
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          python <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          source = Path("encouragement_1000.json")

          if not source.exists():
              raise FileNotFoundError(
                  "encouragement_1000.json が見つかりません"
              )

          data = json.loads(
              source.read_text(
                  encoding="utf-8"
              )
          )

          # --------------------------------------------------------
          # JSON形式対応
          # --------------------------------------------------------
          if isinstance(data, list):

              raw_contents = data

          elif isinstance(data, dict):

              raw_contents = None

              for key in [
                  "encouragement",
                  "contents",
                  "messages",
                  "items"
              ]:

                  if isinstance(data.get(key), list):
                      raw_contents = data[key]
                      break

              if raw_contents is None:
                  raise ValueError(
                      "encouragement_1000.json に対象リストがありません"
                  )

          else:
              raise ValueError(
                  "encouragement_1000.json の形式が不正です"
              )

          contents = []

          for item in raw_contents:

              if isinstance(item, str):

                  text = item.strip()
                  title = ""

              elif isinstance(item, dict):

                  text = ""

                  for key in [
                      "text",
                      "message",
                      "content",
                      "encouragement"
                  ]:

                      if item.get(key):
                          text = str(
                              item[key]
                          ).strip()
                          break

                  title = str(
                      item.get(
                          "title",
                          ""
                      )
                  ).strip()

              else:
                  continue

              if text:
                  contents.append({
                      "text": text,
                      "title": title
                  })

          if not contents:
              raise ValueError(
                  "有効な激励メッセージがありません"
              )

          # --------------------------------------------------------
          # 1日2本
          # UTC 00:00 / 12:00
          # --------------------------------------------------------
          now = datetime.now(
              timezone.utc
          )

          epoch = datetime(
              1970,
              1,
              1,
              tzinfo=timezone.utc
          )

          day = (
              now.date() -
              epoch.date()
          ).days

          hour = now.hour

          slot = hour // 12

          seed = (
              day * 2 +
              slot
          )

          index = (
              seed %
              len(contents)
          )

          selected = contents[index]

          script = selected["text"]

          original_title = selected["title"]

          # --------------------------------------------------------
          # 改行・空白整理
          # --------------------------------------------------------
          clean = re.sub(
              r"\s+",
              "",
              script
          )

          if not clean:
              raise ValueError(
                  "本文が空です"
              )

          # --------------------------------------------------------
          # 冒頭フック
          #
          # 最初の文章を優先
          # --------------------------------------------------------
          parts = re.split(
              r"(?<=[。！？!?])",
              clean
          )

          first_sentence = ""

          for part in parts:

              part = part.strip()

              if part:
                  first_sentence = part
                  break

          if not first_sentence:
              first_sentence = clean

          hook = first_sentence[:28]

          if len(hook) < 8:
              hook = clean[:28]

          # --------------------------------------------------------
          # YouTubeタイトル
          # --------------------------------------------------------
          if original_title:

              video_title = (
                  original_title.strip()
              )

          else:

              video_title = hook

          video_title = video_title[:70]

          # --------------------------------------------------------
          # Pexels検索ワード
          #
          # 毎回変化させる
          # --------------------------------------------------------
          queries = [
              "person thinking",
              "person walking city",
              "sunrise person",
              "sunset person",
              "young person walking",
              "person looking sky",
              "person working",
              "person studying",
              "person running",
              "person nature",
              "calm person",
              "happy person",
              "person overcoming",
              "person mountain",
              "city night person",
              "morning person",
              "motivational person",
              "person silhouette",
              "person beach",
              "person alone",
              "person smiling",
              "person looking window",
              "person outdoors",
              "person journey",
              "person success"
          ]

          query = queries[
              seed %
              len(queries)
          ]

          # --------------------------------------------------------
          # 保存
          # --------------------------------------------------------
          Path(
              "script.txt"
          ).write_text(
              script,
              encoding="utf-8"
          )

          Path(
              "category.txt"
          ).write_text(
              "激励・応援",
              encoding="utf-8"
          )

          Path(
              "content_title.txt"
          ).write_text(
              video_title,
              encoding="utf-8"
          )

          Path(
              "video_title.txt"
          ).write_text(
              video_title +
              " #Shorts",
              encoding="utf-8"
          )

          Path(
              "hook.txt"
          ).write_text(
              hook,
              encoding="utf-8"
          )

          Path(
              "pexels_query.txt"
          ).write_text(
              query,
              encoding="utf-8"
          )

          print("==========================================")
          print("ENCOURAGEMENT SELECTED")
          print("==========================================")
          print(f"Total messages : {len(contents)}")
          print(f"Index          : {index}")
          print(f"Characters     : {len(script)}")
          print(f"Title          : {video_title}")
          print(f"Hook           : {hook}")
          print(f"Pexels query   : {query}")
          print("==========================================")
          PY

      # ============================================================
      # 6. Generate narration
      # ============================================================
      - name: Generate narration
        run: |
          set -e

          echo "=========================================="
          echo "GENERATING NARRATION"
          echo "=========================================="

          edge-tts \
            --voice ja-JP-NanamiNeural \
            --rate="+8%" \
            --file script.txt \
            --write-media voice.mp3

          if [ ! -s voice.mp3 ]; then
            echo "ERROR: voice.mp3 が作成されませんでした"
            exit 1
          fi

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo ""
          echo "Narration duration:"
          echo "$AUDIO_DURATION seconds"

      # ============================================================
      # 7. Check narration
      #
      # 15秒制限なし
      # 自然速度のまま
      # ============================================================
      - name: Check narration
        run: |
          set -e

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "=========================================="
          echo "NARRATION INFORMATION"
          echo "=========================================="
          echo "Duration: $DURATION seconds"
          echo "Natural speed: ON"
          echo "Forced 15 seconds: OFF"
          echo "=========================================="

          if ! awk "BEGIN {exit !($DURATION > 0)}"; then
            echo "ERROR: Narration duration is invalid."
            exit 1
          fi

      # ============================================================
      # 8. Download multiple Pexels videos
      #
      # 約5秒ごとに映像を切り替えるため、
      # 複数の縦動画を取得
      #
      # 未使用映像を最優先
      # 足りなければ過去映像を再利用
      # ============================================================
      - name: Download Pexels videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "ERROR: PEXELS_API_KEY がありません"
            exit 1
          fi

          mkdir -p clips

          touch used_pexels.txt

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          # --------------------------------------------------------
          # 約5秒ごと
          #
          # 例:
          # 35秒 → 7本
          # 45秒 → 9本
          # 60秒 → 12本
          #
          # 最大14本
          # --------------------------------------------------------
          CLIP_COUNT=$(python - <<PY
          import math

          duration = float("$AUDIO_DURATION")

          count = max(
              1,
              math.ceil(duration / 5.0)
          )

          count = min(
              count,
              14
          )

          print(count)
          PY
          )

          echo "=========================================="
          echo "PEXELS MULTI CLIP MODE"
          echo "=========================================="
          echo "Audio duration : $AUDIO_DURATION"
          echo "Clip count     : $CLIP_COUNT"
          echo "Target change  : about every 5 seconds"
          echo "=========================================="

          PRIMARY_QUERY=$(cat pexels_query.txt)

          # --------------------------------------------------------
          # 検索ワード
          # --------------------------------------------------------
          QUERIES=(
            "$PRIMARY_QUERY"
            "person walking city"
            "person thinking"
            "sunrise person"
            "sunset person"
            "person nature"
            "person working"
            "person studying"
            "person running"
            "person looking sky"
            "person outdoors"
            "person mountain"
            "person beach"
            "person journey"
            "person success"
            "motivational person"
            "calm person"
            "happy person"
            "city night person"
          )

          USED_THIS_RUN=""

          # ========================================================
          # 関数: 未使用動画を探す
          # ========================================================
          find_new_video() {

            local SEARCH_QUERY="$1"

            local ENCODED_QUERY

            ENCODED_QUERY=$(python -c \
              "import urllib.parse; print(urllib.parse.quote('''$SEARCH_QUERY'''))"
            )

            RESPONSE=$(curl -s \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=80&page=1")

            COUNT=$(echo "$RESPONSE" | jq '.videos | length')

            if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
              return 1
            fi

            for ROW in $(seq 0 $((COUNT - 1))); do

              VIDEO_ID=$(echo "$RESPONSE" |
                jq -r ".videos[$ROW].id"
              )

              FILE_URL=$(
                echo "$RESPONSE" |
                jq -r ".videos[$ROW].video_files |
                  map(select(
                    .file_type == \"video/mp4\"
                    and (.width // 0) >= 720
                    and (.height // 0) >= 1000
                  ))
                  | sort_by(.width // 0)
                  | reverse
                  | .[0].link // empty"
              )

              if [ -z "$FILE_URL" ] ||
                 [ "$FILE_URL" = "null" ]; then
                continue
              fi

              # ----------------------------------------------------
              # 過去使用済みならスキップ
              # ----------------------------------------------------
              if grep -Fqx \
                "$FILE_URL" \
                used_pexels.txt; then
                continue
              fi

              # ----------------------------------------------------
              # 今回の動画内で既に使用したらスキップ
              # ----------------------------------------------------
              if echo "$USED_THIS_RUN" |
                grep -Fqx "$FILE_URL"; then
                continue
              fi

              SELECTED_URL="$FILE_URL"
              SELECTED_ID="$VIDEO_ID"

              return 0

            done

            return 1
          }

          # ========================================================
          # 関数: 過去動画から再利用
          # ========================================================
          find_old_video() {

            local SEARCH_QUERY="$1"

            local ENCODED_QUERY

            ENCODED_QUERY=$(python -c \
              "import urllib.parse; print(urllib.parse.quote('''$SEARCH_QUERY'''))"
            )

            RESPONSE=$(curl -s \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=40&page=1")

            COUNT=$(echo "$RESPONSE" | jq '.videos | length')

            if [ "$COUNT" = "0" ] ||
               [ "$COUNT" = "null" ]; then
              return 1
            fi

            for ROW in $(seq 0 $((COUNT - 1))); do

              VIDEO_ID=$(echo "$RESPONSE" |
                jq -r ".videos[$ROW].id"
              )

              FILE_URL=$(
                echo "$RESPONSE" |
                jq -r ".videos[$ROW].video_files |
                  map(select(
                    .file_type == \"video/mp4\"
                    and (.width // 0) >= 720
                    and (.height // 0) >= 1000
                  ))
                  | sort_by(.width // 0)
                  | reverse
                  | .[0].link // empty"
              )

              if [ -z "$FILE_URL" ] ||
                 [ "$FILE_URL" = "null" ]; then
                continue
              fi

              if echo "$USED_THIS_RUN" |
                grep -Fqx "$FILE_URL"; then
                continue
              fi

              SELECTED_URL="$FILE_URL"
              SELECTED_ID="$VIDEO_ID"

              return 0

            done

            return 1
          }

          # ========================================================
          # 必要本数を取得
          # ========================================================
          for N in $(seq 1 "$CLIP_COUNT"); do

            echo ""
            echo "=========================================="
            echo "CLIP $N / $CLIP_COUNT"
            echo "=========================================="

            SELECTED_URL=""
            SELECTED_ID=""

            # ------------------------------------------------------
            # まず未使用動画を探す
            # ------------------------------------------------------
            for SEARCH_QUERY in "${QUERIES[@]}"; do

              echo "Searching NEW: $SEARCH_QUERY"

              if find_new_video "$SEARCH_QUERY"; then
                break
              fi

            done

            # ------------------------------------------------------
            # 未使用が見つからなければ再利用
            # ------------------------------------------------------
            if [ -z "$SELECTED_URL" ]; then

              echo ""
              echo "No unused video available."
              echo "Trying previously used videos."

              for SEARCH_QUERY in "${QUERIES[@]}"; do

                echo "Searching OLD: $SEARCH_QUERY"

                if find_old_video "$SEARCH_QUERY"; then
                  break
                fi

              done

            fi

            if [ -z "$SELECTED_URL" ]; then
              echo "ERROR: Pexels video が見つかりませんでした"
              exit 1
            fi

            echo "Selected ID: $SELECTED_ID"
            echo "Selected URL: $SELECTED_URL"

            OUT="clips/clip_${N}.mp4"

            curl -L \
              --fail \
              --retry 3 \
              --retry-delay 2 \
              "$SELECTED_URL" \
              -o "$OUT"

            if [ ! -s "$OUT" ]; then
              echo "ERROR: $OUT が空です"
              exit 1
            fi

            # ------------------------------------------------------
            # 今回使用したURLを記録
            # ------------------------------------------------------
            echo "$SELECTED_URL" >> used_pexels.txt

            USED_THIS_RUN="${USED_THIS_RUN}"$'\n'"$SELECTED_URL"

            echo "Downloaded:"
            ls -lh "$OUT"

          done

          echo ""
          echo "=========================================="
          echo "ALL PEXELS CLIPS DOWNLOADED"
          echo "=========================================="

          ls -lh clips/

      # ============================================================
      # 9. Prepare 5-second clip segments
      #
      # 各映像を5秒にして連結
      # ============================================================
      - name: Prepare video clips
        run: |
          set -e

          mkdir -p prepared

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          CLIP_COUNT=$(find clips \
            -maxdepth 1 \
            -name "clip_*.mp4" |
            wc -l)

          echo "=========================================="
          echo "PREPARING CLIPS"
          echo "=========================================="
          echo "Audio duration: $AUDIO_DURATION"
          echo "Clip count: $CLIP_COUNT"
          echo "=========================================="

          # --------------------------------------------------------
          # 各映像を縦1080x1920へ統一
          # 5秒へ切り出す
          # --------------------------------------------------------
          for FILE in clips/clip_*.mp4; do

            NAME=$(basename "$FILE" .mp4)

            ffmpeg -y \
              -stream_loop -1 \
              -i "$FILE" \
              -t 5 \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              -r 30 \
              "prepared/${NAME}.mp4"

          done

          echo ""
          echo "Prepared clips:"
          ls -lh prepared/

      # ============================================================
      # 10. Create 5-second video montage
      # ============================================================
      - name: Create video montage
        run: |
          set -e

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "=========================================="
          echo "CREATING VIDEO MONTAGE"
          echo "=========================================="

          # --------------------------------------------------------
          # concat.txt作成
          # --------------------------------------------------------
          rm -f concat.txt

          for FILE in prepared/clip_*.mp4; do

            ABS_PATH=$(realpath "$FILE")

            echo "file '$ABS_PATH'" >> concat.txt

          done

          cat concat.txt

          # --------------------------------------------------------
          # 全クリップを連結
          # --------------------------------------------------------
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            montage.mp4

          if [ ! -s montage.mp4 ]; then
            echo "ERROR: montage.mp4 が作成されませんでした"
            exit 1
          fi

          # --------------------------------------------------------
          # 音声時間に合わせて最終映像を作る
          # --------------------------------------------------------
          ffmpeg -y \
            -i montage.mp4 \
            -t "$AUDIO_DURATION" \
            -c copy \
            montage_trimmed.mp4

          mv montage_trimmed.mp4 montage.mp4

          echo ""
          echo "Montage duration:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            montage.mp4

      # ============================================================
      # 11. Create subtitles + opening hook
      # ============================================================
      - name: Create subtitles
        run: |
          set -e

          python <<'PY'
          import subprocess
          import re
          from pathlib import Path

          script = Path(
              "script.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          hook = Path(
              "hook.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          # --------------------------------------------------------
          # 音声時間
          # --------------------------------------------------------
          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "voice.mp3"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          duration = float(
              result.stdout.strip()
          )

          if duration <= 0:
              raise RuntimeError(
                  "音声時間が取得できません"
              )

          # --------------------------------------------------------
          # ASS時間
          # --------------------------------------------------------
          def ass_time(seconds):

              seconds = max(
                  0.0,
                  seconds
              )

              h = int(
                  seconds // 3600
              )

              m = int(
                  (seconds % 3600) // 60
              )

              s = int(
                  seconds % 60
              )

              cs = int(
                  round(
                      (
                          seconds -
                          int(seconds)
                      ) * 100
                  )
              )

              if cs >= 100:
                  s += 1
                  cs = 0

              if s >= 60:
                  m += 1
                  s = 0

              if m >= 60:
                  h += 1
                  m = 0

              return (
                  f"{h}:"
                  f"{m:02d}:"
                  f"{s:02d}."
                  f"{cs:02d}"
              )

          # --------------------------------------------------------
          # ASSエスケープ
          #
          # \Nは改行として使うため触らない
          # --------------------------------------------------------
          def escape_ass(text):

              return (
                  text
                  .replace(
                      "{",
                      r"\{"
                  )
                  .replace(
                      "}",
                      r"\}"
                  )
              )

          # --------------------------------------------------------
          # 空白除去
          # --------------------------------------------------------
          clean = re.sub(
              r"\s+",
              "",
              script
          )

          # --------------------------------------------------------
          # 句読点で文章分割
          # --------------------------------------------------------
          sentences = re.split(
              r"(?<=[。！？!?])",
              clean
          )

          sentences = [
              x.strip()
              for x in sentences
              if x.strip()
          ]

          chunks = []

          # --------------------------------------------------------
          # 自然な字幕サイズに分割
          # --------------------------------------------------------
          for sentence in sentences:

              if len(sentence) <= 24:

                  chunks.append(
                      sentence
                  )

                  continue

              remaining = sentence

              while len(remaining) > 24:

                  candidates = []

                  for i in range(
                      12,
                      min(
                          24,
                          len(remaining)
                      ) + 1
                  ):

                      if remaining[
                          i - 1
                      ] in "、，,":

                          candidates.append(i)

                  if candidates:

                      cut = candidates[-1]

                  else:

                      cut = min(
                          20,
                          len(remaining)
                      )

                  part = (
                      remaining[:cut]
                      .strip()
                  )

                  if part:
                      chunks.append(
                          part
                      )

                  remaining = (
                      remaining[cut:]
                      .strip()
                  )

              if remaining:

                  chunks.append(
                      remaining
                  )

          if not chunks:

              chunks = [clean]

          # --------------------------------------------------------
          # 文字数による時間配分
          # --------------------------------------------------------
          total_chars = sum(
              len(x)
              for x in chunks
          )

          events = []

          current = 0.0

          for chunk in chunks:

              weight = (
                  len(chunk) /
                  total_chars
              )

              chunk_duration = (
                  duration *
                  weight
              )

              start = current

              end = (
                  current +
                  chunk_duration
              )

              display = chunk

              # ----------------------------------------------------
              # 長い字幕だけ2行
              # ----------------------------------------------------
              if len(chunk) >= 20:

                  break_positions = [
                      i
                      for i in range(
                          8,
                          len(chunk) - 4
                      )
                      if chunk[
                          i - 1
                      ] in "、，,"
                  ]

                  if break_positions:

                      pos = break_positions[
                          len(
                              break_positions
                          ) // 2
                      ]

                  else:

                      pos = (
                          len(chunk) // 2
                      )

                  display = (
                      chunk[:pos]
                      + r"\N"
                      + chunk[pos:]
                  )

              events.append(
                  (
                      start,
                      end,
                      display
                  )
              )

              current = end

          # --------------------------------------------------------
          # ASS
          # --------------------------------------------------------
          lines = []

          lines.append(
              "[Script Info]"
          )

          lines.append(
              "ScriptType: v4.00+"
          )

          lines.append(
              "PlayResX: 1080"
          )

          lines.append(
              "PlayResY: 1920"
          )

          lines.append(
              "WrapStyle: 2"
          )

          lines.append(
              "ScaledBorderAndShadow: yes"
          )

          lines.append("")

          lines.append(
              "[V4+ Styles]"
          )

          lines.append(
              "Format: Name, Fontname, Fontsize, "
              "PrimaryColour, SecondaryColour, "
              "OutlineColour, BackColour, Bold, Italic, "
              "Underline, StrikeOut, ScaleX, ScaleY, "
              "Spacing, Angle, BorderStyle, Outline, "
              "Shadow, Alignment, MarginL, MarginR, "
              "MarginV, Encoding"
          )

          # 本文
          lines.append(
              "Style: Default,"
              "Noto Sans CJK JP,"
              "62,"
              "&H00FFFFFF,"
              "&H00FFFFFF,"
              "&H00111111,"
              "&H80000000,"
              "1,0,0,0,"
              "100,100,0,0,"
              "1,4,1,"
              "2,80,80,170,1"
          )

          # フック
          lines.append(
              "Style: Hook,"
              "Noto Sans CJK JP,"
              "70,"
              "&H00FFFFFF,"
              "&H00FFFFFF,"
              "&H00111111,"
              "&H90000000,"
              "1,0,0,0,"
              "100,100,0,0,"
              "1,5,2,"
              "8,80,80,1"
          )

          lines.append("")

          lines.append(
              "[Events]"
          )

          lines.append(
              "Format: Layer, Start, End, Style, Name, "
              "MarginL, MarginR, MarginV, Effect, Text"
          )

          # --------------------------------------------------------
          # 冒頭フック
          # --------------------------------------------------------
          hook_end = min(
              2.8,
              duration
          )

          hook_text = escape_ass(
              hook
          )

          lines.append(
              "Dialogue: 10,"
              + ass_time(0)
              + ","
              + ass_time(hook_end)
              + ",Hook,,0,0,0,,"
              + r"{\fad(200,200)}"
              + hook_text
          )

          # --------------------------------------------------------
          # 本文字幕
          # --------------------------------------------------------
          for start, end, text in events:

              lines.append(
                  "Dialogue: 1,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + escape_ass(text)
              )

          Path(
              "captions.ass"
          ).write_text(
              "\n".join(lines) +
              "\n",
              encoding="utf-8"
          )

          print("==========================================")
          print("SUBTITLE CREATED")
          print("==========================================")
          print(f"Duration : {duration:.2f}s")
          print(f"Chunks   : {len(events)}")
          print(f"Hook     : {hook}")
          print("Natural Japanese splitting: ON")
          print("ASS line break: ON")
          print("15-second limit: OFF")
          print("==========================================")
          PY

      # ============================================================
      # 12. Render final vertical video
      #
      # 約5秒ごとに映像が切り替わる
      # ナレーション終了で動画終了
      # ============================================================
      - name: Render final video
        run: |
          set -e

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "=========================================="
          echo "RENDERING FINAL VIDEO"
          echo "=========================================="
          echo "Audio duration: $AUDIO_DURATION"
          echo "Scene change: approximately every 5 seconds"
          echo "=========================================="

          ffmpeg -y \
            -i montage.mp4 \
            -i voice.mp3 \
            -vf "ass=captions.ass" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -t "$AUDIO_DURATION" \
            -movflags +faststart \
            short.mp4

          if [ ! -s short.mp4 ]; then
            echo "ERROR: short.mp4 が作成されませんでした"
            exit 1
          fi

          echo ""
          echo "Final video:"
          ls -lh short.mp4

      # ============================================================
      # 13. Check final video
      # ============================================================
      - name: Check video
        run: |
          set -e

          echo "=========================================="
          echo "VIDEO INFORMATION"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            short.mp4

          VIDEO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            short.mp4)

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo ""
          echo "Video duration : $VIDEO_DURATION"
          echo "Audio duration : $AUDIO_DURATION"

          if ! awk \
            "BEGIN {exit !($VIDEO_DURATION > 0)}"; then

            echo "ERROR: Video duration is invalid."
            exit 1

          fi

          DIFF=$(python - <<PY
          video = float("$VIDEO_DURATION")
          audio = float("$AUDIO_DURATION")
          print(abs(video - audio))
          PY
          )

          echo "Duration difference: $DIFF seconds"

          if ! awk \
            "BEGIN {exit !($DIFF <= 0.20)}"; then

            echo "ERROR: Video and narration durations differ too much."
            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "VIDEO CHECK OK"
          echo "=========================================="

      # ============================================================
      # 14. Create YouTube uploader
      # ============================================================
      - name: Create uploader
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -e

          cat > upload.py <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          CLIENT_ID = os.environ[
              "YOUTUBE_CLIENT_ID"
          ]

          CLIENT_SECRET = os.environ[
              "YOUTUBE_CLIENT_SECRET"
          ]

          REFRESH_TOKEN = os.environ[
              "YOUTUBE_REFRESH_TOKEN"
          ]

          title = open(
              "video_title.txt",
              encoding="utf-8"
          ).read().strip()

          # --------------------------------------------------------
          # 概要欄
          # 15秒固定表現なし
          # --------------------------------------------------------
          description = (
              "今日を頑張るあなたへ。\n"
              "心が少し軽くなる言葉を届けます。\n\n"
              "#Shorts #激励 #応援 #前向き #モチベーション"
          )

          tags = [
              "Shorts",
              "激励",
              "応援",
              "前向き",
              "モチベーション",
              "励まし",
              "人生",
              "言葉",
              "自己成長"
          ]

          credentials = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": description,
                  "tags": tags,
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = request.execute()

          video_id = response["id"]

          print("==========================================")
          print("YOUTUBE UPLOAD SUCCESS")
          print("==========================================")
          print(
              f"Video ID: {video_id}"
          )
          print(
              f"https://www.youtube.com/watch?v={video_id}"
          )
          print("==========================================")
          PY

      # ============================================================
      # 15. Upload to YouTube
      # ============================================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -e

          python upload.py

      # ============================================================
      # 16. Save Pexels history
      # ============================================================
      - name: Save Pexels history
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -e

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_pexels.txt

          if git diff --cached --quiet; then

            echo "No Pexels history changes."

          else

            git commit \
              -m "Update Pexels video history"

            git push

          fi

      # ============================================================
      # 17. Upload artifacts
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: |
            short.mp4
            voice.mp3
            script.txt
            captions.ass
            hook.txt
            category.txt
            content_title.txt
            video_title.txt
            pexels_query.txt
            used_pexels.txt
            montage.mp4
          retention-days: 3
