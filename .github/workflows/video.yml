name: Generate YouTube Short

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk jq

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Select content and duration
        run: |
          DAY=$(($(date +%s) / 86400))
          HOUR=$(date -u +%H)
          HOUR=$((10#$HOUR))
          SLOT=$((HOUR / 12))

          SEED=$((DAY * 2 + SLOT))

          echo "SEED=$SEED" >> "$GITHUB_ENV"

          # 偶数 = 60秒
          # 奇数 = 15秒
          if (( SEED % 2 == 0 )); then
            DURATION=60
          else
            DURATION=15
          fi

          echo "DURATION=$DURATION" >> "$GITHUB_ENV"

          INDEX=$((SEED % 20))

          case $INDEX in
            0) QUERY="calm nature" ;;
            1) QUERY="sunset" ;;
            2) QUERY="city night" ;;
            3) QUERY="ocean" ;;
            4) QUERY="walking" ;;
            5) QUERY="rain" ;;
            6) QUERY="morning" ;;
            7) QUERY="mountain" ;;
            8) QUERY="coffee" ;;
            9) QUERY="peaceful life" ;;
            10) QUERY="forest" ;;
            11) QUERY="road trip" ;;
            12) QUERY="clouds" ;;
            13) QUERY="river" ;;
            14) QUERY="beach" ;;
            15) QUERY="stars night" ;;
            16) QUERY="flowers" ;;
            17) QUERY="city walking" ;;
            18) QUERY="sunrise" ;;
            19) QUERY="quiet room" ;;
          esac

          echo "QUERY=$QUERY" >> "$GITHUB_ENV"

          echo "SEED=$SEED"
          echo "DURATION=$DURATION"
          echo "QUERY=$QUERY"

      - name: Search Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          curl -L --fail \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/videos/search?query=$(printf '%s' "$QUERY" | sed 's/ /%20/g')&orientation=portrait&size=medium&per_page=20" \
            -o pexels.json

          COUNT=$(jq '.videos | length' pexels.json)

          test "$COUNT" -gt 0

          VIDEO_INDEX=$((SEED % COUNT))

          VIDEO_URL=$(jq -r --argjson index "$VIDEO_INDEX" '
            .videos[$index].video_files
            | map(select(.file_type=="video/mp4"))
            | sort_by(.width)
            | reverse
            | .[0].link
          ' pexels.json)

          test -n "$VIDEO_URL"
          test "$VIDEO_URL" != "null"

          curl -L --fail "$VIDEO_URL" -o source.mp4

          test -s source.mp4

          ffprobe -v error source.mp4

      - name: Create script
        run: |
          python - <<'PY'
          import os

          seed = int(os.environ["SEED"])
          duration = int(os.environ["DURATION"])

          openings = [
              "もし今、何もやる気が出ないなら、この動画だけ見てください。",
              "実は、頑張っている人ほど気づいていないことがあります。",
              "最近、心から笑えていますか。",
              "誰にも言えないけど、しんどいと思っていませんか。",
              "何もしたくない日がある人へ。",
              "周りは前に進んでいるのに、自分だけ止まっている気がする。",
              "頑張っているのに、なぜか報われない。そんな日があります。",
              "夜になると急に不安になる人へ。",
              "自分だけ弱いと思っていませんか。",
              "今日、何もできなかったと思っているあなたへ。",
              "本当は疲れているのに、無理して笑っていませんか。",
              "誰かの言葉に傷ついたあなたへ。",
              "人生がうまくいかないと感じるときがあります。",
              "忘れられない失敗を、何度も思い出してしまう人へ。",
              "大丈夫なふりをしている人へ。",
              "もしかすると、あなたに必要なのは努力じゃないかもしれません。",
              "自分を責めることが癖になっていませんか。",
              "朝起きるだけで疲れている。そんな日もあります。",
              "人と比べて落ち込んでしまうあなたへ。",
              "今日は少しだけ、頑張るのをやめてみませんか。"
          ]

          middles = [
              "それは怠けているからではなく、心が休みたがっているサインかもしれません。ずっと同じ力で走り続けられる人はいません。頑張る時間があるなら、休む時間があってもいいんです。今日は少しだけ、自分に優しくしてみてください。",
              "他人の人生と自分の人生を比べなくても大丈夫です。SNSでは誰かの成功ばかりが目に入ります。でも、その人にも見えない苦しさがあります。あなたにはあなたの時間があります。焦って誰かと同じ速さになる必要はありません。",
              "今日できなかったことばかり考えてしまうかもしれません。でも、今日ここまで耐えたことも、ちゃんと一つの頑張りです。何もできない日があってもいいんです。明日になったら、また小さなことから始めればいい。",
              "つらいときは、全部を一人で抱えなくても大丈夫です。誰かに話すだけで、答えが見つからなくても心が少し軽くなることがあります。助けを求めることは弱さではありません。自分を守るための大切な行動です。",
              "失敗したからといって、あなた自身が失敗した人になるわけではありません。過去の自分も、そのときできることを精一杯やっていました。だから、いつまでも自分を責め続けなくていいんです。少しずつ前を向けば十分です。",
              "完璧じゃなくても大丈夫です。誰かの期待通りに生きる必要もありません。うまくいかない日があるからこそ、うまくいった日の嬉しさにも気づけます。今の自分を否定する前に、まずはそのまま受け止めてみてください。",
              "心が疲れているときは、普通にできていたことさえ難しくなることがあります。それを自分の弱さだと思わなくて大丈夫です。今できることを一つだけやってみる。それだけでも十分な一日があります。",
              "何も変わらないように見える日にも、時間は少しずつ進んでいます。すぐに答えを出さなくてもいいんです。立ち止まっても、遠回りしても大丈夫です。自分の歩幅で進めば、それでいいんです。",
              "あなたの価値は、仕事ができるかどうかや、誰かに認められるかどうかだけでは決まりません。何も成し遂げられないと思う日にも、あなた自身の価値はなくなりません。自分に向ける言葉を、少しだけ優しくしてみてください。",
              "元気になれない自分を、無理に元気にしなくても大丈夫です。つらい気持ちをすぐに消そうとしなくてもいいんです。今日は今日を乗り越える。それだけを目標にしてもいい。小さな一歩は、思っている以上に大きな一歩です。",
              "過去のことを何度も思い出してしまう夜があります。でも、過去の出来事があなたの未来まで決めるわけではありません。これから先に、まだ経験していない日があります。今日だけを見て、未来まで諦めなくて大丈夫です。",
              "誰かと同じ速さで進む必要はありません。早く結果が出る人もいれば、時間をかけて進む人もいます。大切なのは、誰かに勝つことではなく、自分自身を見失わないことです。ゆっくりでも、自分の道を歩いていけばいいんです。",
              "誰にも褒められない努力もあります。誰にも気づかれない頑張りもあります。でも、それが無意味になるわけではありません。見えないところで積み重ねたものは、ちゃんとあなたの中に残っています。",
              "つらい気持ちは、無理に消そうとしなくても大丈夫です。悲しいなら悲しくていい。疲れたなら休んでいい。自分の感情を否定するより、まずは今そう感じている自分を受け止めてあげてください。",
              "人生には、自分ではどうにもできない時期もあります。そんなときに無理やり前へ進もうとすると、もっと疲れてしまうことがあります。立ち止まることも人生の一部です。休んだあとに、また歩き出せばいいんです。",
              "焦って答えを探さなくても大丈夫です。人生にはすぐに答えが出ないこともあります。今は分からなくても、時間が経ってから意味に気づくことがあります。だから今日は、今日できることだけで十分です。",
              "自分を責めることが癖になっている人は、できなかったことばかり数えてしまいます。でも本当は、できたこともたくさんあります。朝起きたこと。ここまで来たこと。それだけでも、今日を頑張った証拠です。",
              "誰かに理解されなくても、あなたが感じた苦しさは本物です。無理に笑わなくてもいいし、大丈夫なふりをしなくてもいいんです。あなた自身が少しでも楽になれる場所を、大切にしてください。",
              "明日のことを考えるだけで苦しくなる夜があります。そんなときは、一週間先のことまで考えなくても大丈夫です。まずは今日を終えることだけ考えてください。そして、できるならゆっくり眠ってください。",
              "本当に強い人は、ずっと頑張り続ける人ではありません。自分が疲れていることを認めて、休むことができる人でもあります。頑張ることだけが正解ではありません。自分を守ることも、立派な選択です。",
              "誰かの期待通りに生きなくても大丈夫です。人生は一度きりだからこそ、自分がどう生きたいかを少しずつ考えていいんです。すぐに答えが出なくても大丈夫。自分のペースで探していけばいいんです。"
          ]

          endings = [
              "だから今日は、自分に「よくやった」と言ってあげてください。",
              "今日をここまで生きた。それだけでも十分です。",
              "焦らなくて大丈夫です。あなたにはあなたの時間があります。",
              "何もできない日があっても、あなたの価値は変わりません。",
              "明日は今日より少しだけ、心が軽くなりますように。",
              "あなたの物語は、まだ終わっていません。",
              "今日は、自分にも少し優しくしてあげてください。",
              "つらいときは、誰かに話してください。一人で抱えなくても大丈夫です。",
              "また明日、ここから始めればいいんです。",
              "今日も一日、本当にお疲れさまでした。",
              "休むことは、諦めることではありません。",
              "あなたには、あなたの歩幅があります。",
              "今は無理をしなくても大丈夫です。",
              "小さな一歩でも、それは前進です。",
              "今日を乗り越えた。それだけで十分です。",
              "明日の自分に、今日の自分を責めさせなくていいんです。",
              "自分を大切にすることも、立派な選択です。",
              "すぐに答えが出なくても大丈夫です。",
              "ゆっくりでいいんです。あなたの人生だから。",
              "今夜は少しだけ、心を休ませてあげてください。"
          ]

          short_lines = [
              "無理して頑張らなくても大丈夫です。今日は休んでいいんです。",
              "今日何もできなかったとしても、あなたの価値は変わりません。",
              "人と比べなくて大丈夫。あなたにはあなたの時間があります。",
              "疲れたら休んでいい。休むことも前に進むための一歩です。",
              "つらいときは、一人で全部抱えなくても大丈夫です。",
              "頑張れない日は、頑張らなくていい日なのかもしれません。",
              "明日のことまで考えなくていい。まずは今日を終えれば十分です。",
              "自分を責めるより、今日ここまで来た自分を認めてあげてください。",
              "人生は遠回りしても大丈夫。自分の歩幅で進めばいいんです。",
              "あなたの価値は、誰かと比べて決まるものではありません。"
          ]

          opening = openings[seed % len(openings)]
          middle = middles[(seed // len(openings)) % len(middles)]
          ending = endings[(seed // len(openings) // len(middles)) % len(endings)]

          if duration == 15:
              line = short_lines[(seed // 7) % len(short_lines)]
              text = f"{opening} {line} {ending}"
          else:
              text = f"{opening} {middle} {ending}"

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(text)

          print("Duration:", duration)
          print("Script:")
          print(text)
          PY

      - name: Generate Japanese voice
        run: |
          if [ "$DURATION" -eq 15 ]; then
            RATE="-8%"
          else
            RATE="-5%"
          fi

          edge-tts \
            --voice ja-JP-NanamiNeural \
            --rate="$RATE" \
            --file script.txt \
            --write-media voice.mp3

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3

      - name: Create subtitles synced to voice
        run: |
          python - <<'PY'
          import subprocess
          import re

          with open("script.txt", encoding="utf-8") as f:
              text = f.read().strip()

          # 音声の実際の長さを取得
          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  "voice.mp3"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          audio_duration = float(result.stdout.strip())

          # 句点などで文章を分割
          chunks = re.split(r'(?<=[。！？])', text)
          chunks = [x.strip() for x in chunks if x.strip()]

          # 各文章の文字数に応じて時間を配分
          total_chars = sum(len(x) for x in chunks)

          def timestamp(sec):
              ms = int(sec * 1000)

              h = ms // 3600000
              ms %= 3600000

              m = ms // 60000
              ms %= 60000

              s = ms // 1000
              ms %= 1000

              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          with open("captions.srt", "w", encoding="utf-8") as f:
              current = 0.0

              for i, chunk in enumerate(chunks, 1):
                  portion = len(chunk) / max(total_chars, 1)
                  length = audio_duration * portion

                  start = current
                  end = current + length

                  f.write(f"{i}\n")
                  f.write(
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                  )
                  f.write(chunk + "\n\n")

                  current = end

          print("Audio duration:", audio_duration)
          print("Subtitle chunks:", len(chunks))
          PY

          cat captions.srt

      - name: Render video
        run: |
          ffmpeg -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i voice.mp3 \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=captions.srt:force_style='FontName=Noto Sans CJK JP,FontSize=24,Alignment=2,MarginV=180,Outline=2'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -af "apad=pad_dur=$DURATION,atrim=0:$DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -t "$DURATION" \
            short.mp4

      - name: Check output
        run: |
          ls -lh short.mp4

          DURATION_CHECK=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 short.mp4)

          echo "Final video duration: $DURATION_CHECK seconds"

          ffprobe -v error short.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          seed = int(os.environ.get("SEED", "0"))
          duration = int(os.environ.get("DURATION", "60"))

          titles_60 = [
              "今、疲れているあなたへ #Shorts",
              "頑張りすぎているあなたへ #Shorts",
              "今日、何もできなかったあなたへ #Shorts",
              "心が疲れた夜に見てほしい言葉 #Shorts",
              "もう頑張れないと思ったあなたへ #Shorts",
              "自分を責めてしまう人へ #Shorts",
              "人生に疲れたときに見てほしい #Shorts",
              "しんどいとき、この言葉を思い出して #Shorts",
              "大丈夫なふりをしているあなたへ #Shorts",
              "今日を頑張ったあなたへ #Shorts",
              "何もしたくない日に見てほしい #Shorts",
              "夜、不安になったあなたへ #Shorts",
              "自分だけ遅れている気がする人へ #Shorts",
              "心が限界になる前に見てほしい #Shorts",
              "疲れた心に届けたい言葉 #Shorts",
              "あなたは一人じゃない #Shorts",
              "うまくいかない日に思い出して #Shorts",
              "自分の人生に迷ったときへ #Shorts",
              "今日もよく頑張りました #Shorts",
              "少し疲れたあなたへ #Shorts"
          ]

          titles_15 = [
              "これだけは覚えておいて #Shorts",
              "疲れたときに思い出して #Shorts",
              "頑張れない日はこれを見て #Shorts",
              "自分を責めているあなたへ #Shorts",
              "15秒だけ聞いてください #Shorts",
              "しんどいあなたへ #Shorts",
              "今日を頑張ったあなたへ #Shorts",
              "心が疲れたときに #Shorts",
              "大丈夫。焦らなくていい #Shorts",
              "あなたのペースでいい #Shorts",
              "無理して笑わなくていい #Shorts",
              "もう少しだけ休もう #Shorts",
              "今日何もできなかった人へ #Shorts",
              "人と比べてしまうあなたへ #Shorts",
              "夜に不安になったら #Shorts",
              "一人で抱えないで #Shorts",
              "明日でいいこともある #Shorts",
              "休むことも大切です #Shorts",
              "あなたには価値がある #Shorts",
              "今日もお疲れさまでした #Shorts"
          ]

          descriptions = [
              "疲れたときに思い出してほしい言葉です。無理せず自分のペースで。 #Shorts",
              "今日を頑張ったあなたへ。少しでも心が軽くなりますように。 #Shorts",
              "つらいときは一人で抱えなくても大丈夫です。 #Shorts",
              "自分を責めすぎないでください。あなたのペースで大丈夫です。 #Shorts",
              "今日も一日お疲れさまでした。明日はまた小さな一歩から。 #Shorts"
          ]

          if duration == 15:
              title = titles_15[seed % len(titles_15)]
          else:
              title = titles_60[seed % len(titles_60)]

          description = descriptions[seed % len(descriptions)]

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": title,
                  "description": description,
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = request.execute()

          print("YouTube upload completed!")
          print("Duration:", duration)
          print("Title:", title)
          print("Video ID:", response["id"])
          PY

          python upload_youtube.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: short.mp4
          retention-days: 1
