name: Generate YouTube Short

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk jq

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Select daily content
        run: |
          DAY=$(($(date +%s) / 86400))
          HOUR=$(date -u +%H)
          HOUR=$((10#$HOUR))
          SLOT=$((HOUR / 12))
          SEED=$((DAY * 2 + SLOT))

          echo "SEED=$SEED" >> "$GITHUB_ENV"

          INDEX=$((SEED % 20))

          case $INDEX in
            0) QUERY="calm nature" ;;
            1) QUERY="sunset" ;;
            2) QUERY="city night" ;;
            3) QUERY="ocean" ;;
            4) QUERY="walking" ;;
            5) QUERY="rain" ;;
            6) QUERY="morning" ;;
            7) QUERY="mountain" ;;
            8) QUERY="coffee" ;;
            9) QUERY="peaceful life" ;;
            10) QUERY="forest" ;;
            11) QUERY="road trip" ;;
            12) QUERY="clouds" ;;
            13) QUERY="river" ;;
            14) QUERY="beach" ;;
            15) QUERY="stars night" ;;
            16) QUERY="flowers" ;;
            17) QUERY="city walking" ;;
            18) QUERY="sunrise" ;;
            19) QUERY="quiet room" ;;
          esac

          echo "QUERY=$QUERY" >> "$GITHUB_ENV"

      - name: Search Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          curl -L --fail \
            -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/videos/search?query=$(printf '%s' "$QUERY" | sed 's/ /%20/g')&orientation=portrait&size=medium&per_page=20" \
            -o pexels.json

          COUNT=$(jq '.videos | length' pexels.json)

          test "$COUNT" -gt 0

          VIDEO_INDEX=$((SEED % COUNT))

          VIDEO_URL=$(jq -r --argjson index "$VIDEO_INDEX" '
            .videos[$index].video_files
            | map(select(.file_type=="video/mp4"))
            | sort_by(.width)
            | reverse
            | .[0].link
          ' pexels.json)

          test -n "$VIDEO_URL"
          test "$VIDEO_URL" != "null"

          curl -L --fail "$VIDEO_URL" -o source.mp4

          test -s source.mp4
          ffprobe -v error source.mp4

      - name: Create 60 second script
        run: |
          OPENINGS=(
            "もし今、何もやる気が出ないなら、この動画だけ見てください。"
            "実は、頑張っている人ほど気づいていないことがあります。"
            "最近、心から笑えていますか。"
            "誰にも言えないけど、しんどいと思っていませんか。"
            "何もしたくない日がある人へ。"
            "周りは前に進んでいるのに、自分だけ止まっている気がする。"
            "頑張っているのに、なぜか報われない。そんな日があります。"
            "夜になると急に不安になる人へ。"
            "自分だけ弱いと思っていませんか。"
            "今日、何もできなかったと思っているあなたへ。"
            "本当は疲れているのに、無理して笑っていませんか。"
            "誰かの言葉に傷ついたあなたへ。"
            "人生がうまくいかないと感じるときがあります。"
            "忘れられない失敗を、何度も思い出してしまう人へ。"
            "大丈夫なふりをしている人へ。"
            "もしかすると、あなたに必要なのは努力じゃないかもしれません。"
            "自分を責めることが癖になっていませんか。"
            "朝起きるだけで疲れている。そんな日もあります。"
            "人と比べて落ち込んでしまうあなたへ。"
            "今日は少しだけ、頑張るのをやめてみませんか。"
            "何をしても楽しくないと感じるときがあります。"
            "誰にも褒められなくても、続けていることがあります。"
            "本当に強い人は、ずっと頑張り続ける人ではありません。"
            "つらいと言えない人ほど、頑張りすぎています。"
            "もし今日が人生で一番しんどい日なら。"
            "自分には価値がないと思ったことはありませんか。"
            "心が限界に近づくと、ある変化が起こります。"
            "明日のことを考えるだけで苦しくなる夜があります。"
            "誰かに必要とされたいと思うことがあります。"
            "頑張れない自分を、責めなくていいんです。"
          )

          MIDDLES=(
            "それは怠けているからではなく、心が休みたがっているサインかもしれません。人間は、ずっと同じ力で走り続けられるようにはできていません。頑張る時間があるなら、休む時間があってもいいんです。今日は少しだけ、自分に優しくしてみてください。"
            "他人の人生と自分の人生を比べなくても大丈夫です。SNSを見れば、誰かの成功ばかりが目に入ります。でも、その人にも見えない苦しさがあります。あなたにはあなたの時間があります。焦って誰かと同じ速さになる必要はありません。"
            "今日できなかったことばかり考えてしまうかもしれません。でも、今日ここまで耐えたことも、ちゃんと一つの頑張りです。何もできない日があってもいいんです。明日になったら、また小さなことから始めればいい。"
            "つらいときは、全部を一人で抱えなくても大丈夫です。誰かに話すだけで、答えが見つからなくても心が少し軽くなることがあります。助けを求めることは弱さではありません。自分を守るための大切な行動です。"
            "失敗したからといって、あなた自身が失敗した人になるわけではありません。過去の自分も、そのときできることを精一杯やっていました。だから、いつまでも自分を責め続けなくていいんです。少しずつ前を向けば十分です。"
            "完璧じゃなくても大丈夫です。誰かの期待通りに生きる必要もありません。うまくいかない日があるからこそ、うまくいった日の嬉しさにも気づけます。今の自分を否定する前に、まずはそのまま受け止めてみてください。"
            "心が疲れているときは、普通にできていたことさえ難しくなることがあります。それを自分の弱さだと思わなくて大丈夫です。今できることを一つだけやってみる。それだけでも十分な一日があります。"
            "何も変わらないように見える日にも、時間は少しずつ進んでいます。すぐに答えを出さなくてもいいんです。立ち止まっても、遠回りしても大丈夫です。自分の歩幅で進めば、それでいいんです。"
            "あなたの価値は、仕事ができるかどうかや、誰かに認められるかどうかだけでは決まりません。何も成し遂げられないと思う日にも、あなた自身の価値はなくなりません。自分に向ける言葉を、少しだけ優しくしてみてください。"
            "元気になれない自分を、無理に元気にしなくても大丈夫です。つらい気持ちをすぐに消そうとしなくてもいいんです。今日は今日を乗り越える。それだけを目標にしてもいい。小さな一歩は、思っている以上に大きな一歩です。"
            "過去のことを何度も思い出してしまう夜があります。でも、過去の出来事があなたの未来まで決めるわけではありません。これから先に、まだ経験していない日があります。今日だけを見て、未来まで諦めなくて大丈夫です。"
            "誰かと同じ速さで進む必要はありません。早く結果が出る人もいれば、時間をかけて進む人もいます。大切なのは、誰かに勝つことではなく、自分自身を見失わないことです。ゆっくりでも、自分の道を歩いていけばいいんです。"
            "誰にも褒められない努力もあります。誰にも気づかれない頑張りもあります。でも、それが無意味になるわけではありません。見えないところで積み重ねたものは、ちゃんとあなたの中に残っています。"
            "つらい気持ちは、無理に消そうとしなくても大丈夫です。悲しいなら悲しくていい。疲れたなら休んでいい。自分の感情を否定するより、まずは今そう感じている自分を受け止めてあげてください。"
            "人生には、自分ではどうにもできない時期もあります。そんなときに無理やり前へ進もうとすると、もっと疲れてしまうことがあります。立ち止まることも人生の一部です。休んだあとに、また歩き出せばいいんです。"
            "焦って答えを探さなくても大丈夫です。人生にはすぐに答えが出ないこともあります。今は分からなくても、時間が経ってから意味に気づくことがあります。だから今日は、今日できることだけで十分です。"
            "自分を責めることが癖になっている人は、できなかったことばかり数えてしまいます。でも本当は、できたこともたくさんあります。朝起きたこと。ここまで来たこと。それだけでも、今日を頑張った証拠です。"
            "誰かに理解されなくても、あなたが感じた苦しさは本物です。無理に笑わなくてもいいし、大丈夫なふりをしなくてもいいんです。あなた自身が少しでも楽になれる場所を、大切にしてください。"
            "明日のことを考えるだけで苦しくなる夜があります。そんなときは、一週間先のことまで考えなくても大丈夫です。まずは今日を終えることだけ考えてください。そして、できるならゆっくり眠ってください。"
            "本当に強い人は、ずっと頑張り続ける人ではありません。自分が疲れていることを認めて、休むことができる人でもあります。頑張ることだけが正解ではありません。自分を守ることも、立派な選択です。"
            "誰かの期待通りに生きなくても大丈夫です。人生は一度きりだからこそ、自分がどう生きたいかを少しずつ考えていいんです。すぐに答えが出なくても大丈夫。自分のペースで探していけばいいんです。"
            "何をしても楽しくないと感じる日があります。そんな日は、無理に楽しもうとしなくても大丈夫です。何もしない時間が必要なこともあります。心が少し落ち着くまで、自分を急かさずに過ごしてください。"
            "人と比べて落ち込んでしまうことがあります。でも、見えているのはその人の人生の一部分だけです。あなたが知らないところで、その人も悩んでいるかもしれません。だから、自分の人生を誰かの一部分と比べなくていいんです。"
            "もし今、頑張ることに疲れているなら、少し休んでください。休んだからといって、今までの努力が消えるわけではありません。むしろ、これからまた歩き出すために必要な時間かもしれません。"
            "自分には価値がないと思う瞬間があっても、その考えが事実とは限りません。疲れているときほど、自分を悪く見てしまうことがあります。だからこそ、そんな日は重要な決断を急がず、まず自分を休ませてあげてください。"
            "心が限界に近づいているときは、何をしても余裕がなくなることがあります。そんなときに必要なのは、さらに自分を追い込むことではありません。少し立ち止まって、今の自分に必要なものを考えてみてください。"
            "誰かに必要とされたいと思うのは、決して悪いことではありません。でも、誰かから必要とされることだけがあなたの価値ではありません。あなた自身があなたを大切にすることも、とても大切なことです。"
            "今日という一日は、明日の自分を決めるすべてではありません。今日うまくいかなかったとしても、それだけで未来が決まるわけではありません。明日はまた別の日です。もう一度、小さな一歩から始めればいいんです。"
            "できることを一つだけ。それで十分な日もあります。部屋を少し片付ける。水を飲む。外の空気を吸う。誰かに連絡する。それくらい小さなことでいいんです。小さな行動が、次の一歩につながることがあります。"
            "人生には、前に進む時間だけではなく、立ち止まる時間もあります。止まっているように見える時間にも、心の中では何かが変わっているかもしれません。だから、焦らなくて大丈夫です。あなたにはあなたの時間があります。"
            "頑張れない自分を責めなくていいんです。ずっと頑張ってきたからこそ、疲れているのかもしれません。今は休むことを選んでもいい。休むことは、諦めることではありません。また歩き出すための準備です。"
          )

          ENDINGS=(
            "だから今日は、自分に「よくやった」と言ってあげてください。明日はまた、できることから始めればいいんです。"
            "今日をここまで生きた。それだけでも十分です。今夜くらい、自分をゆっくり休ませてあげてください。"
            "焦らなくて大丈夫です。あなたにはあなたの時間があります。自分の歩幅で、少しずつ進んでいきましょう。"
            "何もできない日があっても、あなたの価値は変わりません。今日も本当に、お疲れさまでした。"
            "明日は今日より少しだけ、心が軽くなりますように。今は無理をせず、自分を大切にしてください。"
            "あなたの物語は、まだ終わっていません。これから先には、まだ知らない景色があります。"
            "この言葉が必要な誰かにも、そっと届けてあげてください。そして今日は、自分にも優しくしてあげてください。"
            "つらいときは、誰かに話してください。一人で全部抱えなくても大丈夫です。"
            "また明日、ここから始めればいいんです。今日は今日で、十分頑張りました。"
            "この動画を閉じる前に、一度だけ深呼吸してみてください。今日も一日、本当にお疲れさまでした。"
          )

          O_COUNT=${#OPENINGS[@]}
          M_COUNT=${#MIDDLES[@]}
          E_COUNT=${#ENDINGS[@]}

          O_INDEX=$((SEED % O_COUNT))
          M_INDEX=$(((SEED / O_COUNT) % M_COUNT))
          E_INDEX=$(((SEED / O_COUNT / M_COUNT) % E_COUNT))

          OPENING="${OPENINGS[$O_INDEX]}"
          MIDDLE="${MIDDLES[$M_INDEX]}"
          ENDING="${ENDINGS[$E_INDEX]}"

          TEXT="${OPENING} ${MIDDLE} ${ENDING}"

          printf '%s\n' "$TEXT" > script.txt

          echo "Generated script:"
          cat script.txt

      - name: Generate Japanese voice
        run: |
          edge-tts \
            --voice ja-JP-NanamiNeural \
            --rate=-12% \
            --file script.txt \
            --write-media voice.mp3

      - name: Create subtitles
        run: |
          python - <<'PY'
          with open("script.txt", encoding="utf-8") as f:
              text = f.read().strip()

          chunks = []
          current = ""

          for char in text:
              current += char

              if char in "。！？":
                  chunks.append(current.strip())
                  current = ""

          if current.strip():
              chunks.append(current.strip())

          duration = 60.0
          chunk_duration = duration / max(len(chunks), 1)

          def timestamp(sec):
              ms = int(sec * 1000)

              h = ms // 3600000
              ms %= 3600000

              m = ms // 60000
              ms %= 60000

              s = ms // 1000
              ms %= 1000

              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          with open("captions.srt", "w", encoding="utf-8") as f:
              for i, chunk in enumerate(chunks, 1):
                  start = (i - 1) * chunk_duration
                  end = min(i * chunk_duration, duration)

                  f.write(f"{i}\n")
                  f.write(f"{timestamp(start)} --> {timestamp(end)}\n")
                  f.write(chunk + "\n\n")
          PY

      - name: Render 60 second vertical video
        run: |
          ffmpeg -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i voice.mp3 \
            -t 60 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=captions.srt:force_style='FontName=Noto Sans CJK JP,FontSize=24,Alignment=2,MarginV=180,Outline=2'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -af "apad=pad_dur=60,atrim=0:60" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -t 60 \
            short.mp4

      - name: Check output
        run: |
          ls -lh short.mp4

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 short.mp4)

          echo "Final video duration: $DURATION seconds"

          ffprobe -v error short.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > upload_youtube.py <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          seed = int(os.environ.get("SEED", "0"))

          titles = [
              "今、疲れているあなたへ #Shorts",
              "頑張りすぎているあなたへ #Shorts",
              "今日、何もできなかったあなたへ #Shorts",
              "心が疲れた夜に見てほしい言葉 #Shorts",
              "もう頑張れないと思ったあなたへ #Shorts",
              "自分を責めてしまう人へ #Shorts",
              "人生に疲れたときに見てほしい #Shorts",
              "しんどいとき、この言葉を思い出して #Shorts",
              "大丈夫なふりをしているあなたへ #Shorts",
              "今日を頑張ったあなたへ #Shorts",
              "何もしたくない日に見てほしい #Shorts",
              "夜、不安になったあなたへ #Shorts",
              "自分だけ遅れている気がする人へ #Shorts",
              "心が限界になる前に見てほしい #Shorts",
              "もう少しだけ頑張る前に #Shorts",
              "疲れた心に届けたい言葉 #Shorts",
              "あなたは一人じゃない #Shorts",
              "うまくいかない日に思い出して #Shorts",
              "自分の人生に迷ったときへ #Shorts",
              "今日もよく頑張りました #Shorts"
          ]

          descriptions = [
              "今日を頑張ったあなたへ。無理せず自分のペースで。 #Shorts",
              "疲れたときに思い出してほしい言葉です。 #Shorts",
              "あなたのペースで大丈夫。今日もお疲れさまでした。 #Shorts",
              "つらい夜に、少しでも心が軽くなりますように。 #Shorts",
              "無理をしすぎないで。自分を大切にしてください。 #Shorts"
          ]

          title = titles[seed % len(titles)]
          description = descriptions[seed % len(descriptions)]

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": title,
                  "description": description,
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = request.execute()

          print("YouTube upload completed!")
          print("Title:", title)
          print("Video ID:", response["id"])
          PY

          python upload_youtube.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: short.mp4
          retention-days: 1
