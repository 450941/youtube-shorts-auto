name: Generate YouTube Short

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install tools
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            jq \
            curl \
            python3 \
            python3-pip

      # ============================================================
      # 3. Install Python packages
      # ============================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ============================================================
      # 4. Prepare Pexels history
      # ============================================================
      - name: Prepare Pexels history
        run: |
          set -e

          if [ ! -f used_pexels.txt ]; then
            touch used_pexels.txt
          fi

          echo "Used Pexels videos:"
          wc -l used_pexels.txt || true

      # ============================================================
      # 5. Select encouragement message
      # ============================================================
      - name: Select encouragement
        env:
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          python <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          source = Path("encouragement_1000.json")

          if not source.exists():
              raise FileNotFoundError(
                  "encouragement_1000.json が見つかりません"
              )

          data = json.loads(source.read_text(encoding="utf-8"))

          # --------------------------------------------------------
          # JSON形式に対応
          # --------------------------------------------------------
          if isinstance(data, list):
              raw_contents = data

          elif isinstance(data, dict):
              for key in [
                  "encouragement",
                  "contents",
                  "messages",
                  "items"
              ]:
                  if isinstance(data.get(key), list):
                      raw_contents = data[key]
                      break
              else:
                  raise ValueError(
                      "encouragement_1000.json に対象リストがありません"
                  )

          else:
              raise ValueError("JSONの形式が不正です")

          contents = []

          for item in raw_contents:

              if isinstance(item, str):
                  text = item.strip()
                  title = ""

              elif isinstance(item, dict):
                  text = ""

                  for key in [
                      "text",
                      "message",
                      "content",
                      "encouragement"
                  ]:
                      if item.get(key):
                          text = str(item[key]).strip()
                          break

                  title = str(
                      item.get("title", "")
                  ).strip()

              else:
                  continue

              if text:
                  contents.append({
                      "text": text,
                      "title": title
                  })

          if not contents:
              raise ValueError(
                  "有効な激励メッセージがありません"
              )

          # --------------------------------------------------------
          # 1日2本
          # UTC 00:00 / 12:00
          # --------------------------------------------------------
          now = datetime.now(timezone.utc)

          day = (now.date() - datetime(
              1970, 1, 1,
              tzinfo=timezone.utc
          ).date()).days

          hour = now.hour
          slot = hour // 12

          seed = day * 2 + slot

          index = seed % len(contents)

          selected = contents[index]

          script = selected["text"]
          original_title = selected["title"]

          # --------------------------------------------------------
          # 本文から冒頭フックを作る
          # --------------------------------------------------------
          import re

          clean = re.sub(
              r"\s+",
              "",
              script
          )

          # 最初の文章を優先
          parts = re.split(
              r"(?<=[。！？!?])",
              clean
          )

          first_sentence = ""

          for part in parts:
              part = part.strip()
              if part:
                  first_sentence = part
                  break

          if not first_sentence:
              first_sentence = clean

          # 長すぎる場合は短くする
          hook = first_sentence[:28]

          if len(hook) < 8:
              hook = clean[:28]

          # --------------------------------------------------------
          # タイトル
          # --------------------------------------------------------
          if original_title:
              video_title = original_title.strip()

          else:
              video_title = hook

          # YouTubeタイトル長を考慮
          video_title = video_title[:70]

          # --------------------------------------------------------
          # Pexels検索ワード
          # 内容を直接検索するのではなく、
          # 感情・状況系をローテーション
          # --------------------------------------------------------
          queries = [
              "person thinking",
              "person walking city",
              "sunrise person",
              "sunset person",
              "young person walking",
              "person looking sky",
              "person working",
              "person studying",
              "person running",
              "person nature",
              "calm person",
              "happy person",
              "person overcoming",
              "person mountain",
              "city night person",
              "morning person",
              "motivational person",
              "person silhouette",
              "person beach",
              "person alone",
              "person smiling",
              "person looking window",
              "person outdoors",
              "person journey",
              "person success"
          ]

          query = queries[
              seed % len(queries)
          ]

          # --------------------------------------------------------
          # 出力
          # --------------------------------------------------------
          Path("script.txt").write_text(
              script,
              encoding="utf-8"
          )

          Path("category.txt").write_text(
              "激励・応援",
              encoding="utf-8"
          )

          Path("content_title.txt").write_text(
              video_title,
              encoding="utf-8"
          )

          Path("video_title.txt").write_text(
              video_title + " #Shorts",
              encoding="utf-8"
          )

          Path("hook.txt").write_text(
              hook,
              encoding="utf-8"
          )

          Path("pexels_query.txt").write_text(
              query,
              encoding="utf-8"
          )

          print("==========================================")
          print("ENCOURAGEMENT SELECTED")
          print("==========================================")
          print(f"Total messages : {len(contents)}")
          print(f"Index          : {index}")
          print(f"Title          : {video_title}")
          print(f"Hook           : {hook}")
          print(f"Pexels query   : {query}")
          print(f"Characters     : {len(script)}")
          print("==========================================")

      # ============================================================
      # 6. Download Pexels video
      #
      # 未使用映像を最優先
      # ↓
      # 未使用が無ければ過去映像を再利用
      # ↓
      # 同じ映像の連続使用は可能な限り回避
      # ============================================================
      - name: Download Pexels video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -e

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "ERROR: PEXELS_API_KEY がありません"
            exit 1
          fi

          QUERY=$(cat pexels_query.txt)

          echo "=========================================="
          echo "PEXELS SEARCH"
          echo "=========================================="
          echo "Primary query: $QUERY"

          touch used_pexels.txt

          # --------------------------------------------------------
          # 検索候補
          # --------------------------------------------------------
          QUERIES=(
            "$QUERY"
            "sunrise person"
            "person walking"
            "person nature"
            "motivational person"
            "person looking sky"
            "person working"
            "person outdoors"
          )

          FOUND_NEW="false"
          SELECTED_URL=""
          SELECTED_ID=""

          # --------------------------------------------------------
          # 未使用映像を探す
          # --------------------------------------------------------
          for SEARCH_QUERY in "${QUERIES[@]}"; do

            echo ""
            echo "Searching: $SEARCH_QUERY"

            ENCODED_QUERY=$(python -c "import urllib.parse; print(urllib.parse.quote('''$SEARCH_QUERY'''))")

            RESPONSE=$(curl -s \
              -H "Authorization: $PEXELS_API_KEY" \
              "https://api.pexels.com/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=80&page=1")

            COUNT=$(echo "$RESPONSE" | jq '.videos | length')

            if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
              continue
            fi

            # ------------------------------------------------------
            # 候補を調べる
            # ------------------------------------------------------
            for ROW in $(seq 0 $((COUNT - 1))); do

              VIDEO_ID=$(echo "$RESPONSE" | jq -r ".videos[$ROW].id")

              FILE_URL=$(
                echo "$RESPONSE" |
                jq -r ".videos[$ROW].video_files |
                  map(select(
                    .file_type == \"video/mp4\"
                    and (.width // 0) >= 720
                    and (.height // 0) >= 1000
                  ))
                  | sort_by(.width // 0)
                  | reverse
                  | .[0].link // empty"
              )

              if [ -z "$FILE_URL" ] || [ "$FILE_URL" = "null" ]; then
                continue
              fi

              # ----------------------------------------------------
              # 過去使用チェック
              # ----------------------------------------------------
              if grep -Fqx "$FILE_URL" used_pexels.txt; then
                continue
              fi

              SELECTED_URL="$FILE_URL"
              SELECTED_ID="$VIDEO_ID"
              FOUND_NEW="true"

              echo "NEW PEXELS VIDEO FOUND"
              echo "Video ID: $SELECTED_ID"

              break
            done

            if [ "$FOUND_NEW" = "true" ]; then
              break
            fi

          done

          # --------------------------------------------------------
          # 未使用映像が無かった場合
          # 過去映像を再利用
          # --------------------------------------------------------
          if [ "$FOUND_NEW" != "true" ]; then

            echo ""
            echo "=========================================="
            echo "No unused Pexels video found."
            echo "Falling back to previously used videos."
            echo "=========================================="

            # 直前の映像はできるだけ避ける
            LAST_URL=$(tail -n 1 used_pexels.txt 2>/dev/null || true)

            for SEARCH_QUERY in "${QUERIES[@]}"; do

              echo ""
              echo "Fallback search: $SEARCH_QUERY"

              ENCODED_QUERY=$(python -c "import urllib.parse; print(urllib.parse.quote('''$SEARCH_QUERY'''))")

              RESPONSE=$(curl -s \
                -H "Authorization: $PEXELS_API_KEY" \
                "https://api.pexels.com/videos/search?query=${ENCODED_QUERY}&orientation=portrait&size=medium&per_page=40&page=1")

              COUNT=$(echo "$RESPONSE" | jq '.videos | length')

              if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
                continue
              fi

              # まず直前の映像以外を探す
              for ROW in $(seq 0 $((COUNT - 1))); do

                VIDEO_ID=$(echo "$RESPONSE" | jq -r ".videos[$ROW].id")

                FILE_URL=$(
                  echo "$RESPONSE" |
                  jq -r ".videos[$ROW].video_files |
                    map(select(
                      .file_type == \"video/mp4\"
                      and (.width // 0) >= 720
                      and (.height // 0) >= 1000
                    ))
                    | sort_by(.width // 0)
                    | reverse
                    | .[0].link // empty"
                )

                if [ -z "$FILE_URL" ] || [ "$FILE_URL" = "null" ]; then
                  continue
                fi

                if [ "$FILE_URL" = "$LAST_URL" ]; then
                  continue
                fi

                SELECTED_URL="$FILE_URL"
                SELECTED_ID="$VIDEO_ID"

                break 2
              done
            done
          fi

          if [ -z "$SELECTED_URL" ]; then
            echo "ERROR: Pexels video が見つかりませんでした"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "SELECTED PEXELS VIDEO"
          echo "=========================================="
          echo "ID: $SELECTED_ID"
          echo "URL: $SELECTED_URL"
          echo "=========================================="

          # --------------------------------------------------------
          # ダウンロード
          # --------------------------------------------------------
          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            "$SELECTED_URL" \
            -o source.mp4

          if [ ! -s source.mp4 ]; then
            echo "ERROR: source.mp4 が空です"
            exit 1
          fi

          # URLを履歴へ追加
          echo "$SELECTED_URL" >> used_pexels.txt

          echo ""
          echo "Downloaded:"
          ls -lh source.mp4

      # ============================================================
      # 7. Generate narration
      # ============================================================
      - name: Generate narration
        run: |
          set -e

          echo "=========================================="
          echo "GENERATING NARRATION"
          echo "=========================================="

          edge-tts \
            --voice ja-JP-NanamiNeural \
            --rate="+8%" \
            --file script.txt \
            --write-media voice.mp3

          if [ ! -s voice.mp3 ]; then
            echo "ERROR: voice.mp3 が作成されませんでした"
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3

      # ============================================================
      # 8. Keep narration natural
      #
      # 15秒に無理やり合わせない
      # atempoによる圧縮・引き伸ばしなし
      # ============================================================
      - name: Check narration
        run: |
          set -e

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "=========================================="
          echo "NARRATION INFORMATION"
          echo "=========================================="
          echo "Duration: $DURATION seconds"
          echo "Speed: Natural"
          echo "Forced 15 seconds: OFF"
          echo "=========================================="

          if ! awk "BEGIN {exit !($DURATION > 0)}"; then
            echo "ERROR: Narration duration is invalid."
            exit 1
          fi

      # ============================================================
      # 9. Create subtitles + hook overlay
      # ============================================================
      - name: Create subtitles
        run: |
          set -e

          python <<'PY'
          import subprocess
          import re
          from pathlib import Path

          script = Path("script.txt").read_text(
              encoding="utf-8"
          ).strip()

          hook = Path("hook.txt").read_text(
              encoding="utf-8"
          ).strip()

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  "voice.mp3"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          duration = float(result.stdout.strip())

          # --------------------------------------------------------
          # ASS時間
          # --------------------------------------------------------
          def ass_time(seconds):
              seconds = max(0.0, seconds)

              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = int(seconds % 60)
              cs = int(round((seconds - int(seconds)) * 100))

              if cs >= 100:
                  s += 1
                  cs = 0

              if s >= 60:
                  m += 1
                  s = 0

              if m >= 60:
                  h += 1
                  m = 0

              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          # --------------------------------------------------------
          # ASSエスケープ
          # --------------------------------------------------------
          def escape_ass(text):
              return (
                  text
                  .replace("\\", r"\\")
                  .replace("{", r"\{")
                  .replace("}", r"\}")
              )

          # --------------------------------------------------------
          # 文章を字幕単位へ分割
          # --------------------------------------------------------
          clean = re.sub(
              r"\s+",
              "",
              script
          )

          sentences = re.split(
              r"(?<=[。！？!?])",
              clean
          )

          chunks = []

          for sentence in sentences:

              sentence = sentence.strip()

              if not sentence:
                  continue

              # 長すぎる字幕を分割
              while len(sentence) > 18:

                  cut = 18

                  # 読点などを優先
                  candidates = [
                      i for i in range(
                          8,
                          min(18, len(sentence)) + 1
                      )
                      if sentence[i - 1] in "、，, "
                  ]

                  if candidates:
                      cut = candidates[-1]

                  chunks.append(
                      sentence[:cut]
                  )

                  sentence = sentence[cut:]

              if sentence:
                  chunks.append(sentence)

          if not chunks:
              chunks = [clean]

          # --------------------------------------------------------
          # 文字数に応じて時間配分
          # --------------------------------------------------------
          total_chars = sum(
              len(x) for x in chunks
          )

          events = []

          current = 0.0

          for chunk in chunks:

              weight = (
                  len(chunk) / total_chars
              )

              chunk_duration = (
                  duration * weight
              )

              start = current
              end = current + chunk_duration

              # 2行化
              display = chunk

              if len(display) >= 12:
                  midpoint = len(display) // 2

                  # 日本語なら中央付近で改行
                  display = (
                      display[:midpoint]
                      + r"\N"
                      + display[midpoint:]
                  )

              events.append(
                  (
                      start,
                      end,
                      display
                  )
              )

              current = end

          # --------------------------------------------------------
          # ASS本体
          # --------------------------------------------------------
          header = r"""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans CJK JP,62,&H00FFFFFF,&H00FFFFFF,&H00111111,&H80000000,1,0,0,0,100,100,0,0,1,4,1,2,80,80,170,1
          Style: Hook,Noto Sans CJK JP,70,&H00FFFFFF,&H00FFFFFF,&H00000000,&H90000000,1,0,0,0,100,100,0,0,1,5,2,5,90,90,0,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          lines = [
              line.strip()
              for line in header.strip().splitlines()
          ]

          # --------------------------------------------------------
          # 冒頭フック
          # 0〜2.8秒
          # --------------------------------------------------------
          hook_end = min(
              2.8,
              duration
          )

          hook_display = escape_ass(
              hook
          )

          lines.append(
              "Dialogue: 10,"
              + ass_time(0)
              + ","
              + ass_time(hook_end)
              + ",Hook,,0,0,0,,"
              + r"{\fad(200,200)}"
              + hook_display
          )

          # --------------------------------------------------------
          # 本文字幕
          # --------------------------------------------------------
          for start, end, text in events:

              lines.append(
                  "Dialogue: 1,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + escape_ass(text)
              )

          Path("captions.ass").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("==========================================")
          print("SUBTITLE CREATED")
          print("==========================================")
          print(f"Duration : {duration:.2f}s")
          print(f"Chunks   : {len(chunks)}")
          print(f"Hook     : {hook}")
          print("==========================================")
          PY

      # ============================================================
      # 10. Render vertical video
      #
      # 映像はナレーション時間までループ
      # ============================================================
      - name: Render video
        run: |
          set -e

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo "=========================================="
          echo "RENDERING VIDEO"
          echo "=========================================="
          echo "Audio duration: $AUDIO_DURATION"
          echo "Video will end with narration."
          echo "=========================================="

          ffmpeg -y \
            -stream_loop -1 \
            -i source.mp4 \
            -i voice.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,ass=captions.ass" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -t "$AUDIO_DURATION" \
            -movflags +faststart \
            short.mp4

          if [ ! -s short.mp4 ]; then
            echo "ERROR: short.mp4 が作成されませんでした"
            exit 1
          fi

      # ============================================================
      # 11. Check video
      #
      # 15秒制限なし
      # 音声と動画の長さだけ確認
      # ============================================================
      - name: Check video
        run: |
          set -e

          echo "=========================================="
          echo "VIDEO INFORMATION"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            short.mp4

          VIDEO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            short.mp4)

          AUDIO_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3)

          echo ""
          echo "Video duration : $VIDEO_DURATION"
          echo "Audio duration : $AUDIO_DURATION"

          if ! awk "BEGIN {exit !($VIDEO_DURATION > 0)}"; then
            echo "ERROR: Video duration is invalid."
            exit 1
          fi

          DIFF=$(python - <<PY
          video = float("$VIDEO_DURATION")
          audio = float("$AUDIO_DURATION")
          print(abs(video - audio))
          PY
          )

          echo "Duration difference: $DIFF seconds"

          if ! awk "BEGIN {exit !($DIFF <= 0.20)}"; then
            echo "ERROR: Video and narration durations differ too much."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "VIDEO CHECK OK"
          echo "=========================================="

      # ============================================================
      # 12. Create YouTube uploader
      # ============================================================
      - name: Create uploader
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -e

          cat > upload.py <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]

          title = open(
              "video_title.txt",
              encoding="utf-8"
          ).read().strip()

          description = (
              "今日を頑張るあなたへ。\n"
              "心が少し軽くなる言葉を届けます。\n\n"
              "#Shorts #激励 #応援 #前向き #モチベーション"
          )

          tags = [
              "Shorts",
              "激励",
              "応援",
              "前向き",
              "モチベーション",
              "励まし",
              "人生",
              "言葉",
              "自己成長"
          ]

          credentials = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": description,
                  "tags": tags,
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = request.execute()

          video_id = response["id"]

          print("==========================================")
          print("YOUTUBE UPLOAD SUCCESS")
          print("==========================================")
          print(f"Video ID: {video_id}")
          print(f"https://www.youtube.com/watch?v={video_id}")
          print("==========================================")
          PY

      # ============================================================
      # 13. Upload to YouTube
      # ============================================================
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -e

          python upload.py

      # ============================================================
      # 14. Save Pexels history
      # ============================================================
      - name: Save Pexels history
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_pexels.txt

          if git diff --cached --quiet; then
            echo "No Pexels history changes."
          else
            git commit -m "Update Pexels video history"
            git push
          fi

      # ============================================================
      # 15. Upload artifacts
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: |
            short.mp4
            source.mp4
            voice.mp3
            script.txt
            captions.ass
            hook.txt
            category.txt
            content_title.txt
            video_title.txt
            pexels_query.txt
            used_pexels.txt
          retention-days: 3
